    ctx.fillStyle='#FFD75E';
    ctx.font=`700 ${18*dpr*us}px 'SF Mono',monospace`;
    ctx.fillText(`${Utils.fmtNum(sd.credits)} C`,px+pw-pad,y);
    ctx.textAlign='left';
    y+=30*dpr;

    if(activeTab.id==='upgrades'){
      const keys=['hp','scan','speed','bag','san'];
      const listH=64*dpr*us;
      for(let i=0;i<keys.length;i++){
        const k=keys[i];
        const cfg=CONFIG.gameplay.upgrades[k];
        const lvl=sd.upgrades[k]||0;
        const selected=i===game.basementUpgradeSelectedIndex;
        const maxed=lvl>=cfg.max;
        const cost=maxed?0:Math.round(cfg.baseCost*Math.pow(1.5,lvl));
        const canAfford=!maxed&&sd.credits>=cost;
        const rowY=y+i*listH;
        if(selected){
          const bg=ctx.createLinearGradient(px+pad,0,px+pw-pad,0);
          bg.addColorStop(0,'rgba(217,83,79,0.16)');
          bg.addColorStop(1,'rgba(217,83,79,0)');
          ctx.fillStyle=bg;ctx.fillRect(px+pad,rowY,pw-pad*2,listH-6*dpr);
          ctx.fillStyle='#D9534F';ctx.fillRect(px+pad,rowY,3*dpr,listH-6*dpr);
        }
        ctx.fillStyle=selected?'#F0E8C8':'rgba(212,206,176,0.85)';
        ctx.font=`600 ${14*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.textAlign='left';
        ctx.fillText(t(cfg.name),px+pad+16*dpr,rowY+22*dpr*us);
        ctx.fillStyle='rgba(212,206,176,0.5)';
        ctx.font=`400 ${11*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillText(t(cfg.desc),px+pad+16*dpr,rowY+40*dpr*us);
        const dx=px+pad+16*dpr;
        const dy=rowY+52*dpr*us;
        for(let d=0;d<cfg.max;d++){
          ctx.fillStyle=d<lvl?(selected?'#D9534F':'rgba(217,83,79,0.8)'):'rgba(212,206,176,0.15)';
          ctx.beginPath();ctx.arc(dx+d*10*dpr,dy,3*dpr,0,Math.PI*2);ctx.fill();
        }
        ctx.textAlign='right';
        if(maxed){
          ctx.fillStyle='#6FCF97';
          ctx.font=`600 ${13*dpr*us}px 'Noto Sans SC',sans-serif`;
          ctx.fillText(t('up.max'),px+pw-pad,rowY+30*dpr*us);
        }else{
          ctx.fillStyle=canAfford?'#FFD75E':'#D9534F';
          ctx.font=`700 ${15*dpr*us}px 'SF Mono',monospace`;
          ctx.fillText(`${Utils.fmtNum(cost)} C`,px+pw-pad,rowY+24*dpr*us);
          ctx.fillStyle='rgba(212,206,176,0.4)';
          ctx.font=`400 ${10*dpr*us}px 'Noto Sans SC',sans-serif`;
          ctx.fillText(t('up.buy'),px+pw-pad,rowY+42*dpr*us);
        }
        ctx.textAlign='left';
      }
    } else {
      /* 补给 */
      const keys=['ammo','medkit','adrenaline','sedative'];
      const listH=64*dpr*us;
      for(let i=0;i<keys.length;i++){
        const k=keys[i];
        const cfg=CONFIG.gameplay.supplies[k];
        const selected=i===game.wagnerSupplySelectedIndex;
        const canAfford=sd.credits>=cfg.cost;
        const rowY=y+i*listH;
        if(selected){
          const bg=ctx.createLinearGradient(px+pad,0,px+pw-pad,0);
          bg.addColorStop(0,'rgba(217,83,79,0.16)');
          bg.addColorStop(1,'rgba(217,83,79,0)');
          ctx.fillStyle=bg;ctx.fillRect(px+pad,rowY,pw-pad*2,listH-6*dpr);
          ctx.fillStyle='#D9534F';ctx.fillRect(px+pad,rowY,3*dpr,listH-6*dpr);
        }
        ctx.fillStyle=selected?'#F0E8C8':'rgba(212,206,176,0.85)';
        ctx.font=`600 ${14*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.textAlign='left';
        ctx.fillText(t(cfg.name),px+pad+16*dpr,rowY+22*dpr*us);
        ctx.fillStyle='rgba(212,206,176,0.5)';
        ctx.font=`400 ${11*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillText(t(cfg.desc),px+pad+16*dpr,rowY+40*dpr*us);
        /* 当前拥有数量 */
        let owned='';
        if(k==='ammo')owned=`×${sd.inventory.ammo||0}`;
        else if(k==='medkit')owned=`×${sd.inventory.medkit||0}`;
        else if(k==='adrenaline')owned=`×${sd.inventory.adrenaline||0}`;
        else if(k==='sedative')owned=`×${sd.inventory.sedative||0}`;
        ctx.textAlign='right';
        ctx.fillStyle='rgba(0,188,212,0.8)';
        ctx.font=`500 ${12*dpr*us}px 'SF Mono',monospace`;
        ctx.fillText(owned,px+pw-pad,rowY+20*dpr*us);
        /* 价格 */
        ctx.fillStyle=canAfford?'#FFD75E':'#D9534F';
        ctx.font=`700 ${15*dpr*us}px 'SF Mono',monospace`;
        ctx.fillText(`${Utils.fmtNum(cfg.cost)} C`,px+pw-pad,rowY+42*dpr*us);
        ctx.fillStyle='rgba(212,206,176,0.4)';
        ctx.font=`400 ${10*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillText(t('sup.buy'),px+pw-pad,rowY+56*dpr*us);
        ctx.textAlign='left';
      }
    }
    ctx.textAlign='center';
    ctx.fillStyle='rgba(212,206,176,0.4)';
    ctx.font=`400 ${10*dpr*us}px 'Noto Sans SC',sans-serif`;
    ctx.fillText(t('wagner.tab.hint'),px+pw*0.5,cY+cH+50*dpr);
  }
}

/* ==================== §17 主游戏 ==================== */
class Game{
  constructor(){
    Settings.init();
    this.canvas=document.getElementById('game');
    this.renderer=new Renderer(this.canvas);
    this.camera=new Camera();
    this.input=new Input(this.canvas);
    this.audio=new AudioEngine();
    this.toolSystem=new ToolSystem();

    this.state=STATE.TITLE;
    this._stateTime=0;
    this._lastDt=1/60;

    this.saveData=Save.read();
    this.currentLayerId=1;
    this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set()};

    this.titleScreen={
      selectedIndex:0,
      menu:[
        {key:'menu.start',action:'start'},
        {key:'menu.continue',action:'continue',disabled:!Save.has()},
        {key:'menu.settings',action:'settings'}
      ]
    };
    this.pauseMenu={
      selectedIndex:0,
      items:[
        {key:'pause.resume',action:'resume'},
        {key:'pause.settings',action:'settings'},
        {key:'pause.mainmenu',action:'title'}
      ]
    };
    this.settingsMenu={items:SETTINGS_ITEMS,selectedIndex:0,returnState:STATE.TITLE};
    this.elevatorMenu={selectedIndex:0,items:[]};
    this.floorSelectMenu={selectedIndex:0,items:[],returnState:null};
    this.deathState={t:0,lost:{rescue:0,map:0,logs:0}};

    this.basement=null;
    this.basementUpgradeSelectedIndex=0;
    this.wagnerTabIndex=0;
    this.wagnerSupplySelectedIndex=0;
    this.archiveTabIndex=0;
    this.archiveLogIndex=0;
    this._activeNPCId=null;

    this.world=null;
    this.player=null;
    this.fog=null;
    this.bullets=[];
    this.enemyBullets=[];

    const radarEl=document.getElementById('radar');
    this.radar=radarEl?new Radar(radarEl):null;

    const $=(id)=>document.getElementById(id);
    const $q=(s)=>document.querySelector(s);
    this.hud={
      root:$('hud'),
      hp:$q('#bar-hp .bar-fill'),
      san:$q('#bar-san .bar-fill'),
      sta:$q('#bar-sta .bar-fill'),
      sanBar:$('bar-san'),
      sanVig:$('san-vignette'),
      objTitle:$('obj-title-text'),objMain:$('obj-main-text'),
      progress:$('obj-progress'),rescue:$('obj-rescue'),logs:$('obj-logs'),
      fps:$('dbg-fps'),pos:$('dbg-pos'),
      crosshair:$('crosshair'),hint:$('hint'),
      wname:$('wname-text'),wammo:$('wammo-text'),
      countMedkit:$('count-medkit'),countAdren:$('count-adren'),countSed:$('count-sed'),
      layerTag:$('layer-tag')
    };

    this._lastVisX=Infinity;this._lastVisY=Infinity;
    this._firstUpdate=true;
    this._fpsFrames=0;this._fpsTimer=0;
    this._hintTimer=0;
    this._toastTimer=0;this._toastText='';
    this._nearVisitor=null;this._nearLog=null;
    this._autosaveTimer=0;

    this._bindEvents();
    this._resize();
    this._applySettings();
    Settings.onChange((p)=>this._applySettings(p));
    this._refreshTitleMenu();
    this._refreshHUDText();

    EventBus.on('visitor:revealed',(v)=>{
      this.pending.revealedIds.add(v.id);
      const lyr=Save.layer(this.saveData,this.currentLayerId);
      if(!lyr.discoveredEnemies)lyr.discoveredEnemies=[];
      if(!lyr.discoveredAnomalies)lyr.discoveredAnomalies=[];
      if(!lyr.discoveredEnemies.includes('doppelganger'))lyr.discoveredEnemies.push('doppelganger');
      if(!lyr.discoveredAnomalies.includes('doppelganger'))lyr.discoveredAnomalies.push('doppelganger');
      if(v.type==='fake'){this._showToast(t('toast.fake'));this.audio.beep(220,0.5,'sawtooth',0.15);}
      else{this._showToast(t('toast.safe'));this.audio.beep(660,0.12,'sine',0.1);}
    });
    EventBus.on('player:step',(e)=>this.audio.footstep(e.alt,e.sprint));
    EventBus.on('player:dead',()=>{if(this.state===STATE.PLAYING)this._onPlayerDeath();});
    EventBus.on('player:san',(e)=>{if(e.amount>5&&Math.random()<0.5)this.audio.sanWarn();});
  }
  _bindEvents(){
    window.addEventListener('resize',()=>this._resize());
    const startAudio=()=>{this.audio.start();window.removeEventListener('pointerdown',startAudio);window.removeEventListener('keydown',startAudio);};
    window.addEventListener('pointerdown',startAudio);
    window.addEventListener('keydown',startAudio);
    window.addEventListener('mousemove',(e)=>{
      const show=(this.state===STATE.PLAYING);
      if(this.hud.crosshair){
        this.hud.crosshair.style.display=show?'block':'none';
        if(show){this.hud.crosshair.style.left=e.clientX+'px';this.hud.crosshair.style.top=e.clientY+'px';}
      }
    });
    EventBus.on('input:keydown',(c)=>this._onKeyDown(c));
    EventBus.on('input:mousedown',()=>this._onMouseDown());
  }
  _onKeyDown(code){
    switch(this.state){
      case STATE.TITLE:
        if(code==='ArrowUp'||code==='KeyW')this._navMenu('title',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('title',1);
        else if(code==='Enter'||code==='Space'||code==='KeyE')this._activateTitleMenu();
        break;
      case STATE.SETTINGS:this._handleSettingsKey(code);break;
      case STATE.PAUSED:
        if(code==='Escape')this._resume();
        else if(code==='ArrowUp'||code==='KeyW')this._navMenu('pause',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('pause',1);
        else if(code==='Enter'||code==='Space')this._activatePauseMenu();
        break;
      case STATE.PLAYING:
        if(code==='Escape')this._pause();
        else if(code==='KeyE')this._tryInteract();
        else if(code==='Digit1')this.toolSystem.switchTo(0);
        else if(code==='Digit2')this.toolSystem.switchTo(1);
        else if(code==='KeyR')this._reload();
        else if(code==='Digit3')this._useItem('medkit');
        else if(code==='Digit4')this._useItem('adrenaline');
        else if(code==='Digit5')this._useItem('sedative');
        break;
      case STATE.ELEVATOR:
        if(code==='Escape')this._closeElevator();
        else if(code==='ArrowUp'||code==='KeyW')this._navMenu('elevator',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('elevator',1);
        else if(code==='Enter'||code==='Space'||code==='KeyE')this._activateElevator();
        break;
      case STATE.BASEMENT:
        if(code==='Escape')this._leaveBasementToL1();
        else if(code==='KeyE')this._tryBasementInteract();
        break;
      case STATE.BASEMENT_NPC:
        if(code==='Escape')this._leaveBasementNPC();
        else if(this._activeNPCId==='wagner'){
          /* 页签切换 */
          if(code==='ArrowLeft'||code==='KeyA'){
            this.wagnerTabIndex=(this.wagnerTabIndex-1+2)%2;
            this.wagnerSupplySelectedIndex=0;
          } else if(code==='ArrowRight'||code==='KeyD'){
            this.wagnerTabIndex=(this.wagnerTabIndex+1)%2;
            this.wagnerSupplySelectedIndex=0;
          } else if(this.wagnerTabIndex===0){
            if(code==='ArrowUp'||code==='KeyW')this._wagnerNav(-1);
            else if(code==='ArrowDown'||code==='KeyS')this._wagnerNav(1);
            else if(code==='Enter'||code==='Space'||code==='KeyE')this._buyUpgrade();
          } else {
            if(code==='ArrowUp'||code==='KeyW')this._wagnerSupplyNav(-1);
            else if(code==='ArrowDown'||code==='KeyS')this._wagnerSupplyNav(1);
            else if(code==='Enter'||code==='Space'||code==='KeyE')this._buySupply();
          }
        } else if(this._activeNPCId==='lena'){
          if(code==='ArrowLeft'||code==='KeyA')this.archiveTabIndex=(this.archiveTabIndex-1+4)%4;
          else if(code==='ArrowRight'||code==='KeyD')this.archiveTabIndex=(this.archiveTabIndex+1)%4;
          else if(this.archiveTabIndex===3){
            const all=new Set();
            for(const k in this.saveData.layers)for(const l of (this.saveData.layers[k].uploadedLogs||[]))all.add(l);
            const list=[...all].sort();
            if(list.length>0){
              if(code==='ArrowUp'||code==='KeyW')this.archiveLogIndex=(this.archiveLogIndex-1+list.length)%list.length;
              else if(code==='ArrowDown'||code==='KeyS')this.archiveLogIndex=(this.archiveLogIndex+1)%list.length;
            }
          }
        }
        break;
      case STATE.FLOOR_SELECT:
        if(code==='Escape')this._closeFloorSelect();
        else if(code==='ArrowUp'||code==='KeyW')this._navMenu('floor',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('floor',1);
        else if(code==='Enter'||code==='Space'||code==='KeyE')this._activateFloorSelect();
        break;
      case STATE.DEATH:
        if(this.deathState.t>2.4&&(code==='Enter'||code==='Space'||code==='KeyE'))this._onDeathContinue();
        break;
      case STATE.TBC:
        if(code==='Escape'||code==='Enter'||code==='Space')this._closeElevator();
        break;
    }
  }
  _onMouseDown(){
    if(this.state===STATE.TITLE)this._activateTitleMenu();
    else if(this.state===STATE.PAUSED)this._activatePauseMenu();
  }
  _navMenu(ctx,dir){
    let items,cur;
    if(ctx==='title'){items=this.titleScreen.menu;cur=this.titleScreen.selectedIndex;}
    else if(ctx==='pause'){items=this.pauseMenu.items;cur=this.pauseMenu.selectedIndex;}
    else if(ctx==='elevator'){items=this.elevatorMenu.items;cur=this.elevatorMenu.selectedIndex;}
    else if(ctx==='floor'){items=this.floorSelectMenu.items;cur=this.floorSelectMenu.selectedIndex;}
    else return;
    const n=items.length;
    let idx=cur;
    for(let s=0;s<n;s++){idx=(idx+dir+n)%n;if(!items[idx].disabled)break;}
    if(ctx==='title')this.titleScreen.selectedIndex=idx;
    else if(ctx==='pause')this.pauseMenu.selectedIndex=idx;
    else if(ctx==='elevator')this.elevatorMenu.selectedIndex=idx;
    else if(ctx==='floor')this.floorSelectMenu.selectedIndex=idx;
  }
  _activateTitleMenu(){
    const item=this.titleScreen.menu[this.titleScreen.selectedIndex];
    if(!item||item.disabled)return;
    switch(item.action){
      case 'start':this._startCutscene(true);break;
      case 'continue':this._startCutscene(false);break;
      case 'settings':this._openSettings(STATE.TITLE);break;
    }
  }
  _activatePauseMenu(){
    const item=this.pauseMenu.items[this.pauseMenu.selectedIndex];
    if(!item)return;
    switch(item.action){
      case 'resume':this._resume();break;
      case 'settings':this._openSettings(STATE.PAUSED);break;
      case 'title':this._returnToTitle();break;
    }
  }
  _refreshTitleMenu(){this.titleScreen.menu[1].disabled=!Save.has();}
  _startCutscene(isNew){
    this._isNewGame=isNew;
    this.state=STATE.CUTSCENE;
    this._stateTime=0;
    if(this.hud.root)this.hud.root.classList.remove('active');
    const lines=[
      {text:t('cutscene.1'),dur:2.2,color:'rgba(212,206,176,0.7)',y:0.5},
      {text:t('cutscene.2'),dur:3.6,color:'#E8E0C0',bold:true,y:0.5},
      {text:t('cutscene.3'),dur:4.0,color:'#E8E0C0',y:0.5},
      {text:t('cutscene.4'),dur:4.0,color:'#D9534F',bold:true,y:0.5},
      {text:t('cutscene.5'),dur:3.6,color:'#E8E0C0',y:0.5},
      {text:'',dur:0.6,y:0.5}
    ];
    this.cutscene=new Cutscene(lines,()=>this._enterGame());
  }
  _enterGame(){
    const isNew=this._isNewGame;
    const save=this.saveData;
    const seed=isNew?((Date.now()&0x7FFFFFFF)>>>0):(save.seed||((Date.now()&0x7FFFFFFF)>>>0));
    if(isNew){
      save.seed=seed;
      save.credits=0;
      save.unlockedBasement=false;
      save.unlockedL2=false;
      save.highestLayer=1;
      save.upgrades={hp:0,scan:0,speed:0,bag:0,san:0};
      save.inventory={medkit:2,adrenaline:1,sedative:1,ammo:48};
      save.layers={};
      save.completedMissions=[];
      Save.write(save);
    }
    this.currentLayerId=1;
    this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set()};
    this._spawnWorld();
    this.state=STATE.PLAYING;
    this._stateTime=0;
  }
  _spawnWorld(){
    const save=this.saveData;
    const seed=save.seed||((Date.now()&0x7FFFFFFF)>>>0);
    const cfg=CONFIG.art.layers[this.currentLayerId];
    this.world=new World(cfg,seed,save,this.pending,this.currentLayerId);
    const startX=this.world.size*0.5;
    const startY=this.world.size*0.82;
    this.player=new Player(startX,startY,save.upgrades);
    this.fog=new FogRenderer(this.world);
    this.renderer.refreshColors(this.world.cfg);
    this.toolSystem.applyUpgrades(save.upgrades);
    this.camera.x=this.player.x;
    this.camera.y=this.player.y;
    this.camera.setViewport(this.renderer.W,this.renderer.H,this.renderer.dpr);
    this.world.computeVisibility(this.player.x,this.player.y);
    this.fog.markDirty();
    this._firstUpdate=true;
    this.bullets=[];this.enemyBullets=[];
    if(this.audio.started)this.audio.switchLayer(this.currentLayerId);
    if(this.hud.root)this.hud.root.classList.add('active');
    this._showHint(t('hint.move'),6);
    this._refreshHUDText();
  }
  _onPlayerDeath(){
    this.state=STATE.DEATH;
    const layer=Save.layer(this.saveData,this.currentLayerId);
    const pendingRescue=this.currentLayerId===1&&this.world?this.world.rescuedCount-(layer.rescue||0):0;
    const pendingMap=this.world?this.world.exploredRatio*100-(layer.map||0):0;
    const pendingLogs=this.pending.collectedLogs.size;
    this.deathState={t:0,lost:{rescue:Math.max(0,pendingRescue),map:Math.max(0,pendingMap),logs:pendingLogs}};
    this.audio.deathStinger();
    this.camera.addShake(15,1.0);
    this.audio.stopScanLoop();
    this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set()};
    this.world=null;this.player=null;this.fog=null;this.bullets=[];this.enemyBullets=[];
    if(this.hud.root)this.hud.root.classList.remove('active');
    if(this.hud.crosshair)this.hud.crosshair.style.display='none';
    if(this.hud.sanVig)this.hud.sanVig.style.opacity='0';
  }
  _onDeathContinue(){
    if(this.saveData.unlockedBasement)this._goToBasement();
    else this._returnToTitle();
  }
  _goToBasement(){
    this.basement=new BasementScene();
    this.basementUpgradeSelectedIndex=0;
    this.wagnerTabIndex=0;
    this.wagnerSupplySelectedIndex=0;
    this.archiveTabIndex=0;
    this.archiveLogIndex=0;
    this.state=STATE.BASEMENT;
    if(this.hud.root)this.hud.root.classList.remove('active');
    if(this.hud.crosshair)this.hud.crosshair.style.display='none';
    if(this.hud.sanVig)this.hud.sanVig.style.opacity='0';
    this.audio.stopScanLoop();
    this.camera.x=this.basement.player.x;
    this.camera.y=this.basement.player.y;
    this.camera.setZoom(Math.min(this.renderer.W,this.renderer.H)/22);
  }
  _leaveBasementToL1(){this._openFloorSelect();}
  _openFloorSelect(){
    const save=this.saveData;
    const items=[];
    items.push({label:'floor.l1',subtitle:'floor.l1.sub',action:'go',layer:1,disabled:false});
    items.push({label:'floor.l2',subtitle:'floor.l2.sub',action:'go',layer:2,disabled:!save.unlockedL2});
    this.floorSelectMenu.items=items;
    this.floorSelectMenu.selectedIndex=0;
    this.floorSelectMenu.returnState=STATE.BASEMENT;
    this.state=STATE.FLOOR_SELECT;
    if(this.hud.root)this.hud.root.classList.remove('active');
    if(this.hud.crosshair)this.hud.crosshair.style.display='none';
  }
  _closeFloorSelect(){this.state=STATE.BASEMENT;}
  _activateFloorSelect(){
    const item=this.floorSelectMenu.items[this.floorSelectMenu.selectedIndex];
    if(!item||item.disabled)return;
    this.currentLayerId=item.layer;
    this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set()};
    this._spawnWorld();
    this.state=STATE.PLAYING;
    this._stateTime=0;
  }
  _tryBasementInteract(){
    const b=this.basement;
    if(!b)return;
    if(b.nearNPC){this._enterBasementNPC(b.nearNPC.id);return;}
    if(b.nearElevator){this._leaveBasementToL1();}
  }
  _enterBasementNPC(id){
    this.state=STATE.BASEMENT_NPC;
    this._activeNPCId=id;
    this.basementUpgradeSelectedIndex=0;
    this.wagnerTabIndex=0;
    this.wagnerSupplySelectedIndex=0;
    this.archiveTabIndex=0;
    this.archiveLogIndex=0;
  }
  _leaveBasementNPC(){this.state=STATE.BASEMENT;this._activeNPCId=null;}
  _currentNPCId(){return this._activeNPCId;}
  _wagnerNav(dir){

    this.basementUpgradeSelectedIndex=(this.basementUpgradeSelectedIndex+dir+keys.length)%keys.length;
  }
  _wagnerSupplyNav(dir){
    const keys=['ammo','medkit','adrenaline','sedative'];
    this.wagnerSupplySelectedIndex=(this.wagnerSupplySelectedIndex+dir+keys.length)%keys.length;
  }
  _buyUpgrade(){
    const keys=['hp','scan','speed','bag','san'];
    const k=keys[this.basementUpgradeSelectedIndex];
    const cfg=CONFIG.gameplay.upgrades[k];
    const lvl=this.saveData.upgrades[k]||0;
    if(lvl>=cfg.max)return;
    const cost=Math.round(cfg.baseCost*Math.pow(1.5,lvl));
    if(this.saveData.credits<cost){this._showToast(t('up.insufficient'),1.4);this.audio.beep(220,0.2,'sawtooth',0.12);return;}
    this.saveData.credits-=cost;
    this.saveData.upgrades[k]=lvl+1;
    if(k==='bag')this.saveData.inventory.ammo+=12;
    Save.write(this.saveData);
    this.audio.purchase();
    this._showToast(t('up.bought'),1.4);
  }
  /* 新增：购买补给 */
  _buySupply(){
    const keys=['ammo','medkit','adrenaline','sedative'];
    const k=keys[this.wagnerSupplySelectedIndex];
    const cfg=CONFIG.gameplay.supplies[k];
    if(this.saveData.credits<cfg.cost){this._showToast(t('up.insufficient'),1.4);this.audio.beep(220,0.2,'sawtooth',0.12);return;}
    this.saveData.credits-=cfg.cost;
    if(k==='ammo')this.saveData.inventory.ammo=(this.saveData.inventory.ammo||0)+cfg.amount;
    else if(k==='medkit')this.saveData.inventory.medkit=(this.saveData.inventory.medkit||0)+cfg.amount;
    else if(k==='adrenaline')this.saveData.inventory.adrenaline=(this.saveData.inventory.adrenaline||0)+cfg.amount;
    else if(k==='sedative')this.saveData.inventory.sedative=(this.saveData.inventory.sedative||0)+cfg.amount;
    Save.write(this.saveData);
    this.audio.purchase();
    const toastKey='toast.buy.'+(k==='adrenaline'?'adren':k==='medkit'?'medkit':k==='sedative'?'sed':'ammo');
    this._showToast(t(toastKey),1.4);
  }

  _handleSettingsKey(code){
    const items=this.settingsMenu.items;
    const idx=this.settingsMenu.selectedIndex;
    const item=items[idx];
    if(!item)return;
    if(code==='Escape'){this._closeSettings();return;}
    if(code==='ArrowUp'||code==='KeyW'){this.settingsMenu.selectedIndex=(idx-1+items.length)%items.length;return;}
    if(code==='ArrowDown'||code==='KeyS'){this.settingsMenu.selectedIndex=(idx+1)%items.length;return;}
    const left=code==='ArrowLeft'||code==='KeyA';
    const right=code==='ArrowRight'||code==='KeyD';
    if(item.type==='slider'){
      if(left||right){
        const delta=(right?1:-1)*item.step;
        const cur=Settings.get(item.path)??item.min;
        const v=Utils.clamp(cur+delta,item.min,item.max);
        Settings.set(item.path,Math.round(v*1000)/1000);
      }
    } else if(item.type==='toggle'){
      if(left||right||code==='Enter'||code==='Space')Settings.set(item.path,Settings.get(item.path)?0:1);
    } else if(item.type==='option'){
      const cur=Settings.get(item.path);
      const ci=item.options.indexOf(cur);
      if(left)Settings.set(item.path,item.options[(ci-1+item.options.length)%item.options.length]);
      else if(right)Settings.set(item.path,item.options[(ci+1)%item.options.length]);
      else if(code==='Enter'||code==='Space')Settings.set(item.path,item.options[((ci>=0?ci:-1)+1)%item.options.length]);
    }
  }
  _applySettings(p){
    const size=Settings.get('a11y.fontSize');
    const scale=size==='small'?0.85:size==='large'?1.2:1.0;
    this.renderer.setUiScale(scale);
    if(this.radar)this.radar._resize();
    if(this.world)this.renderer.refreshColors(this.world.cfg);
    if(this.audio.started)this.audio.applySettings();
    if(p==='gameplay.language'||p==='*')this._refreshHUDText();
  }
  _refreshHUDText(){

        :`${this.toolSystem.pistolAmmo} / ${this.saveData.inventory.ammo} <span style="opacity:0.4">· ${t('hud.pistol.reload.hint')}</span>`;

    if(h.countAdren)h.countAdren.textContent='×'+(this.saveData.inventory.adrenaline||0);

  _useItem(type){

  _tryInteract(){
    if(!this.player||!this.world)return;
    const e=this.world.elevator;
    if(e){
      const d=Utils.dist(this.player.x,this.player.y,e.x,e.y);
      if(d<e.r+1.5){
        if(!e.unlocked){this._showToast(t('toast.elev.locked'),2);return;}
        this._openElevator();
        return;
      }
    }
    if(this._nearLog){
      const l=this._nearLog;
      if(!l.picked){
        l.picked=true;
        this.pending.collectedLogs.add(l.id);
        this.audio.pickupChime();
        this._showToast(t('toast.log.picked'),1.6);
        this._showHint(t(l.id+'.title'),3.5);
      }
      return;
    }
    if(this.currentLayerId===1){
      const v=this._nearVisitor;
      if(v&&v.type==='real'&&v.state==='idle'&&v.revealed){
        v.state='rescued';
        this.pending.rescuedIds.add(v.id);
        this._showToast(t('toast.rescued'),1.6);
        this.audio.beep(660,0.1,'sine',0.1);
        this.audio.beep(880,0.15,'sine',0.08);
        if(this.world.rescuedCount+this.pending.rescuedIds.size>=CONFIG.gameplay.visitors.total){
          this._showToast(t('toast.allrescued'),3);
        }
      }
    }
  }

  _closeElevator(){this.state=STATE.PLAYING;if(this.hud.crosshair)this.hud.crosshair.style.display='block';}
  /* 修复：多次上传 */
  _buildElevatorMenu(){
    const e=this.world.elevator;
    const items=[];
    const layer=Save.layer(this.saveData,this.currentLayerId);
    /* 判断是否有新数据 */
    const curRescue=this.currentLayerId===1?this.world.rescuedCount:this.world.enemies.filter(en=>en.hp<=0).length;
    const curMap=this.world.exploredRatio*100;
    const curLogs=this.pending.collectedLogs.size;
    const curReveal=this.currentLayerId===1?this.world.revealedCount:this.world.enemies.filter(en=>en.aggro).length;
    const hasNewData=
      curRescue>(layer.rescue||0)||
      curMap-(layer.map||0)>0.5||
      curLogs>0||
      curReveal>(layer.anomalies||0);
    if(hasNewData){
      items.push({key:'elev.upload',action:'upload',disabled:false,state:null});
    } else if(layer.uploaded){
      items.push({key:'elev.noNewData',action:'none',disabled:true,state:null});
    } else {
      items.push({key:'elev.upload',action:'upload',disabled:false,state:null});
    }
    let canDescend=true,reason=null,reasonColor=null;
    if(this.currentLayerId===1){
      const total=CONFIG.gameplay.visitors.total;
      canDescend=this.world.rescuedCount>=total;
      if(!canDescend){reason='elev.need.rescue';reasonColor='rgba(217,83,79,0.7)';}
    } else {
      canDescend=this.world.aliveEnemies===0;
      if(!canDescend){reason='elev.need.clear';reasonColor='rgba(217,83,79,0.7)';}
    }
    if(this.currentLayerId===1){
      items.push({key:'elev.descend',action:'descend',disabled:!canDescend,state:reason,stateColor:reasonColor});
    } else {
      items.push({key:'elev.tbc',action:'none',disabled:true,state:null});
    }
    items.push({key:'elev.evacuate',action:'evacuate',disabled:false,state:null});
    this.elevatorMenu.items=items;
    this.elevatorMenu.selectedIndex=0;
    let i=0;
    while(i<items.length&&items[i].disabled)i++;
    if(i<items.length)this.elevatorMenu.selectedIndex=i;
  }
  _activateElevator(){
    const item=this.elevatorMenu.items[this.elevatorMenu.selectedIndex];
    if(!item||item.disabled)return;
    const e=this.world.elevator;
    const layer=Save.layer(this.saveData,this.currentLayerId);
    switch(item.action){
      case 'upload':{
        e.uploaded=true;
        layer.uploaded=true;
        layer.map=Math.max(layer.map||0,this.world.exploredRatio*100);
        if(this.currentLayerId===1){
          layer.rescue=Math.max(layer.rescue||0,this.world.rescuedCount);
          layer.rescuedIds=Array.from(new Set([...(layer.rescuedIds||[]),...this.pending.rescuedIds]));
          layer.revealedIds=Array.from(new Set([...(layer.revealedIds||[]),...this.pending.revealedIds]));
          layer.anomalies=Math.max(layer.anomalies||0,this.world.revealedCount);
        } else {
          layer.rescue=Math.max(layer.rescue||0,this.world.enemies.filter(en=>en.hp<=0).length);
          layer.anomalies=Math.max(layer.anomalies||0,this.world.enemies.filter(en=>en.aggro).length);
        }
        layer.exploredBitmap=Array.from(this.world.explored);
        for(const id of this.pending.collectedLogs){
          if(!layer.uploadedLogs.includes(id))layer.uploadedLogs.push(id);
        }
        this.pending.collectedLogs.clear();
        this.pending.rescuedIds.clear();
        this.pending.revealedIds.clear();
        this.saveData.credits+=Math.round(
          (this.world.exploredRatio*100)*20+
          (layer.rescue||0)*15+
          (layer.anomalies||0)*8
        );
        if(!this.saveData.unlockedBasement)this.saveData.unlockedBasement=true;
        if(this.currentLayerId===1){
          if((layer.rescue||0)>=CONFIG.gameplay.visitors.total&&!this.saveData.unlockedL2){
            this.saveData.unlockedL2=true;
          }
        }
        Save.write(this.saveData);
        this.audio.beep(880,0.25,'sine',0.15);
        this.audio.beep(1320,0.4,'sine',0.12);
        this._showToast(t('toast.saved'),2);
        this._buildElevatorMenu();
        break;
      }
      case 'descend':
        if(this.currentLayerId===1){
          if(this.world.rescuedCount<CONFIG.gameplay.visitors.total){this._showToast(t('toast.descend.locked'),1.5);return;}
          /* 自动上传所有数据 */
          layer.uploaded=true;
          layer.map=Math.max(layer.map||0,this.world.exploredRatio*100);
          layer.rescue=Math.max(layer.rescue||0,this.world.rescuedCount);
          layer.rescuedIds=Array.from(new Set([...(layer.rescuedIds||[]),...this.pending.rescuedIds]));
          layer.revealedIds=Array.from(new Set([...(layer.revealedIds||[]),...this.pending.revealedIds]));
          layer.anomalies=Math.max(layer.anomalies||0,this.world.revealedCount);
          layer.exploredBitmap=Array.from(this.world.explored);
          for(const id of this.pending.collectedLogs)if(!layer.uploadedLogs.includes(id))layer.uploadedLogs.push(id);
          this.pending.collectedLogs.clear();
          this.pending.rescuedIds.clear();
          this.pending.revealedIds.clear();
          this.saveData.credits+=Math.round((this.world.exploredRatio*100)*20+(layer.rescue||0)*15+(layer.anomalies||0)*8);
          if(!this.saveData.unlockedBasement)this.saveData.unlockedBasement=true;
          this.saveData.unlockedL2=true;
          this.saveData.highestLayer=2;
          Save.write(this.saveData);
          this.currentLayerId=2;
          this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set()};
          this._spawnWorld();
          this.state=STATE.PLAYING;
          this._showToast('进入 L2 · 色欲层',3);
        }
        break;
      case 'evacuate':
        this._goToBasement();
        break;
    }
  }
  getInteractPrompt(){
    if(this.state!==STATE.PLAYING)return null;
    const p=this.player,w=this.world;
    if(!p||!w)return null;
    if(w.elevator){
      const d=Utils.dist(p.x,p.y,w.elevator.x,w.elevator.y);
      if(d<w.elevator.r+4){
        if(!w.elevator.unlocked){
          const pct=(w.exploredRatio*100).toFixed(0);
          return{x:w.elevator.x,y:w.elevator.y-w.elevator.r-1,text:`${t('toast.elev.locked')} (${pct}%)`,color:'rgba(217,83,79,0.9)'};
        }
        return{x:w.elevator.x,y:w.elevator.y-w.elevator.r-1,text:t('toast.elev.ready'),color:'#00BCD4'};
      }
    }
    if(this._nearLog&&!this._nearLog.picked){
      const l=this._nearLog;
      return{x:l.x,y:l.y-0.8,text:'E · '+t(l.id+'.title'),color:'#00BCD4'};
    }
    const v=this._nearVisitor;
    if(v&&v.state==='idle'){
      const lang=Settings.get('gameplay.language');
      if(v.revealed&&v.type==='real')return{x:v.x,y:v.y-1.6,text:'E · '+(lang==='en'?'RESCUE':'营救'),color:'#6FCF97'};
      if(v.revealed&&v.type==='fake')return{x:v.x,y:v.y-1.6,text:lang==='en'?'DANGER':'危险',color:'#D9534F'};
      return{x:v.x,y:v.y-1.6,text:lang==='en'?'RMB to SCAN':'右键扫描确认',color:'rgba(255,215,94,0.9)'};
    }
    return null;
  }
  update(dt){
    this._stateTime+=dt;
    if(this._hintTimer>0){this._hintTimer-=dt;if(this._hintTimer<=0&&this.hud.hint)this.hud.hint.classList.remove('show');}
    if(this._toastTimer>0)this._toastTimer=Math.max(0,this._toastTimer-dt);
    switch(this.state){
      case STATE.CUTSCENE:if(this.cutscene)this.cutscene.update(dt,this.input);break;
      case STATE.PLAYING:this._updatePlaying(dt);break;
      case STATE.BASEMENT:
        this.basement.update(dt,this.input,this.camera,this.renderer.W,this.renderer.H);
        this.basement.updateCamera(this.camera,dt);
        break;
      case STATE.DEATH:this.deathState.t+=dt;this.camera.update(dt);break;
    }
  }
  _updatePlaying(dt){
    const {world,player,camera,input,toolSystem}=this;
    if(!world||!player)return;
    player.update(dt,input,world,camera,this.renderer.W,this.renderer.H);
    camera.follow(player.x,player.y,dt);
    camera.update(dt);
    const dx=player.x-this._lastVisX,dy=player.y-this._lastVisY;
    if(this._firstUpdate||dx*dx+dy*dy>0.36){
      world.computeVisibility(player.x,player.y);
      this.fog.markDirty();
      this._lastVisX=player.x;this._lastVisY=player.y;
      this._firstUpdate=false;
    }
    toolSystem.update(dt,player,input,world,this);
    this.audio.updateScanLoop(toolSystem.active&&toolSystem.id==='scanner'&&world.layerId===1,toolSystem.intensity);
    this._refreshWeaponHUD();
    for(let i=this.bullets.length-1;i>=0;i--){
      const b=this.bullets[i];
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      if(b.life<=0||world.isSolidAt(b.x,b.y)){this.bullets.splice(i,1);continue;}
      let hit=false;
      for(const e of world.enemies){
        if(e.hp<=0)continue;
        if(Utils.dist2(b.x,b.y,e.x,e.y)<0.4*0.4){
          e.hp-=CONFIG.gameplay.pistol.damage;
          if(e.hp<=0){
            this._showToast(t('toast.killed'),1.2);
            const lyr=Save.layer(this.saveData,world.layerId);
            const key=e.type==='patrol'?'patrol':'storm';
            if(!lyr.discoveredEnemies.includes(key))lyr.discoveredEnemies.push(key);
            if(!lyr.discoveredAnomalies.includes(key))lyr.discoveredAnomalies.push(key);
          }
          hit=true;break;
        }
      }
      if(hit)this.bullets.splice(i,1);
    }
    for(let i=this.enemyBullets.length-1;i>=0;i--){
      const b=this.enemyBullets[i];
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      if(b.life<=0||world.isSolidAt(b.x,b.y)){this.enemyBullets.splice(i,1);continue;}
      if(Utils.dist2(b.x,b.y,player.x,player.y)<0.5*0.5){
        player.takeDamage(b.dmg);
        this.camera.addShake(4,0.15);
        this.audio.noise(0.15,0.15,600);
        this.enemyBullets.splice(i,1);
      }
    }
    this._updateEnemies(dt);
    if(world.layerId===1)this._updateVisitors(dt);
    this._updateNearby();
    this._updateSanity(dt);
    if(world.elevator&&!world.elevator.unlocked&&world.exploredRatio>=CONFIG.gameplay.elevator.unlockMapRatio){
      world.elevator.unlocked=true;
      this._showToast(t('toast.elev.ready'),3);
      this.audio.beep(880,0.2,'sine',0.14);
      this.audio.beep(1100,0.3,'sine',0.12);
    }
    if(this.radar)this.radar.update(dt);
    this._autosaveTimer+=dt;
    if(this._autosaveTimer>20){this._autosaveTimer=0;Save.write(this.saveData);}
  }
  _updateEnemies(dt){
    const {world,player}=this;
    const t=performance.now()/1000;
    for(const e of world.enemies){
      if(e.hp<=0)continue;
      const dx=player.x-e.x,dy=player.y-e.y;
      const d=Math.hypot(dx,dy);
      const cfg=e.type==='patrol'?CONFIG.gameplay.enemies.patrol:CONFIG.gameplay.enemies.storm;
      if(e.state_t>0)e.state_t=Math.max(0,e.state_t-dt);
      const canSee=d<cfg.senseR&&world.hasLineOfSight(e.x,e.y,player.x,player.y,cfg.senseR);
      if(canSee){e.aggro=true;e.lastSeen={x:player.x,y:player.y};}
      let targetX,targetY;
      if(canSee){targetX=player.x;targetY=player.y;}
      else if(e.aggro){targetX=e.lastSeen.x;targetY=e.lastSeen.y;}
      else{
        if(!e._patrolTarget||Utils.dist(e.x,e.y,e._patrolTarget.x,e._patrolTarget.y)<1.5){
          const a=t*0.2+e.id*1.7;
          e._patrolTarget={x:e.x+Math.cos(a)*8,y:e.y+Math.sin(a)*8};
        }
        targetX=e._patrolTarget.x;targetY=e._patrolTarget.y;
      }
      const tdx=targetX-e.x,tdy=targetY-e.y;
      const td=Math.hypot(tdx,tdy)||1;
      const desiredAngle=Math.atan2(tdy,tdx);
      e.aimAngle=Utils.lerpAngle(e.aimAngle,desiredAngle,1-Math.exp(-8*dt));
      if(e.type==='patrol'){
        if(canSee&&d<cfg.senseR){
          const keep=9;
          if(d>keep+1){
            const mx=Math.cos(e.aimAngle)*e.speed*dt;
            const my=Math.sin(e.aimAngle)*e.speed*dt;
            const s=world.resolveCollision(e.x+mx,e.y+my,0.55);
            e.x=s.x;e.y=s.y;
          } else if(d<keep-1){
            const mx=-Math.cos(e.aimAngle)*e.speed*0.6*dt;
            const my=-Math.sin(e.aimAngle)*e.speed*0.6*dt;
            const s=world.resolveCollision(e.x+mx,e.y+my,0.55);
            e.x=s.x;e.y=s.y;
          }
          if(e.fireCooldown>0)e.fireCooldown-=dt;
          if(e.burstLeft>0){
            e.burstTimer-=dt;
            if(e.burstTimer<=0){e.burstTimer=0.12;e.burstLeft--;this._enemyShoot(e,player);}
          } else if(e.fireCooldown<=0){
            e.burstLeft=cfg.burst;e.burstTimer=0;
            e.fireCooldown=cfg.fireRate+0.8;
            e.state='firing';
          }
        } else {
          const mx=Math.cos(e.aimAngle)*e.speed*0.5*dt;
          const my=Math.sin(e.aimAngle)*e.speed*0.5*dt;
          const s=world.resolveCollision(e.x+mx,e.y+my,0.55);
          e.x=s.x;e.y=s.y;
        }
      } else if(e.type==='storm'){
        if(canSee&&d<cfg.chargeSpeed*1.2&&e.chargeDur<=0&&d>2){
          e.chargeDur=cfg.chargeDur;
          const a=Math.atan2(dy,dx);
          e.chargeVx=Math.cos(a)*cfg.chargeSpeed;
          e.chargeVy=Math.sin(a)*cfg.chargeSpeed;
          e.state='charging';
        }
        if(e.chargeDur>0){
          e.chargeDur-=dt;
          const mx=e.chargeVx*dt,my=e.chargeVy*dt;
          const s=world.resolveCollision(e.x+mx,e.y+my,0.7);
          if(Math.abs(s.x-(e.x+mx))>0.05){e.chargeDur=0;this.camera.addShake(3,0.2);}
          e.x=s.x;e.y=s.y;
          if(Utils.dist2(e.x,e.y,player.x,player.y)<0.9*0.9){
            player.takeDamage(cfg.dmg);
            this.camera.addShake(8,0.3);
            const ka=Math.atan2(player.y-e.y,player.x-e.x);
            player.vx+=Math.cos(ka)*10;player.vy+=Math.sin(ka)*10;
            e.chargeDur=0;
            this.audio.noise(0.3,0.2,500);
          }
        } else {
          if(e.aggro){
            const mx=Math.cos(e.aimAngle)*e.speed*dt;
            const my=Math.sin(e.aimAngle)*e.speed*dt;
            const s=world.resolveCollision(e.x+mx,e.y+my,0.7);
            e.x=s.x;e.y=s.y;
            if(d<1.2){
              if(player.invulnT<=0){
                player.takeDamage(cfg.dmg*0.5);
                this.camera.addShake(6,0.2);
              }
            }
          }
        }
      }
    }
  }
  _enemyShoot(e,player){
    const cfg=CONFIG.gameplay.enemies.patrol;
    const aim=Math.atan2(player.y-e.y,player.x-e.x)+(Math.random()-0.5)*0.12;
    this.enemyBullets.push({
      x:e.x+Math.cos(aim)*0.6,y:e.y+Math.sin(aim)*0.6,
      vx:Math.cos(aim)*cfg.bulletSpeed,vy:Math.sin(aim)*cfg.bulletSpeed,
      life:0.8,dmg:cfg.bulletDmg
    });
    this.audio.enemyShot();
  }
  _updateVisitors(dt){
    const {world,player}=this;
    const cfg=CONFIG.gameplay.visitors;
    for(const v of world.visitors){
      if(v.state==='exploded'){
        if(v.explodeFlash>0)v.explodeFlash=Math.max(0,v.explodeFlash-dt);
        continue;
      }
      if(v.state==='rescued')continue;
      const d=Utils.dist(v.x,v.y,player.x,player.y);
      v.voiceTimer-=dt;
      if(v.voiceTimer<0&&!v.revealed&&d<22&&d>5){
        this.audio.sosCry();
        v.voiceTimer=6+Math.random()*4;
      }
      if(v.type==='fake'&&v.state==='idle'){
        if(!v.revealed&&d<cfg.revealPulseRange&&d>cfg.fakeExplodeRadius){
          v.state='sizzling';v.sizzleT=0;
          this.audio.beep(180,0.4,'sawtooth',0.12);
        }
        if(v.revealed&&d<cfg.fakeChargeRadius&&d>1.4){
          v.state='charging';
          const a=Math.atan2(player.y-v.y,player.x-v.x);
          v.chargeVx=Math.cos(a)*cfg.fakeChargeSpeed;
          v.chargeVy=Math.sin(a)*cfg.fakeChargeSpeed;
        }
      }
      if(v.state==='sizzling'){
        v.sizzleT+=dt;
        if(d>cfg.revealPulseRange+1){v.state='idle';v.sizzleT=0;}
        if(d<cfg.fakeExplodeRadius||v.sizzleT>cfg.fakeSizzleDelay)this._explodeFake(v,world,player);
      } else if(v.state==='charging'){
        const a=Math.atan2(player.y-v.y,player.x-v.x);
        v.chargeVx=Math.cos(a)*cfg.fakeChargeSpeed;
        v.chargeVy=Math.sin(a)*cfg.fakeChargeSpeed;
        const nx=v.x+v.chargeVx*dt,ny=v.y+v.chargeVy*dt;
        const s=world.resolveCollision(nx,ny,0.4);
        v.x=s.x;v.y=s.y;
        if(d<1.0)this._explodeFake(v,world,player);
      }
    }
  }
  _explodeFake(v,world,player){
    v.state='exploded';v.explodeFlash=0.5;
    const cfg=CONFIG.gameplay.visitors;
    const d=Utils.dist(v.x,v.y,player.x,player.y);
    if(d<cfg.fakeExplodeRadius+1.2){
      const dealt=player.takeDamage(cfg.fakeExplodeDamage);
      if(dealt){
        this.camera.addShake(8,0.35);
        this.audio.noise(0.4,0.35,400);
        const a=Math.atan2(player.y-v.y,player.x-v.x);
        player.vx+=Math.cos(a)*8;player.vy+=Math.sin(a)*8;
        player.drainSan(12,'explosion');
      }
    }
  }
  _updateNearby(){
    const {world,player}=this;
    if(!world||!player)return;
    if(world.layerId===1){
      const cfg=CONFIG.gameplay.visitors;
      let nearest=null,nd=Infinity;
      for(const v of world.visitors){
        if(v.state!=='idle')continue;
        const d=Utils.dist(v.x,v.y,player.x,player.y);
        if(d<nd){nd=d;nearest=v;}
      }
      this._nearVisitor=(nd<cfg.interactRadius+0.5)?nearest:null;
    } else this._nearVisitor=null;
    const lcfg=CONFIG.gameplay.logs;
    let nl=null,nld=Infinity;
    for(const l of world.logs){
      if(l.picked)continue;
      const d=Utils.dist(l.x,l.y,player.x,player.y);
      if(d<nld){nld=d;nl=l;}
    }
    this._nearLog=(nld<lcfg.interactRadius+0.6)?nl:null;
  }
  _updateSanity(dt){
    const {world,player}=this;
    if(!world||!player)return;
    if(player.sedativeImmuneT>0)return;
    if(world.layerId===1){
      const cfg=CONFIG.gameplay.visitors;
      let maxDrain=0;
      for(const v of world.visitors){
        if(v.state==='exploded'||v.state==='rescued')continue;
        if(v.revealed&&v.type==='real')continue;
        const d=Utils.dist(v.x,v.y,player.x,player.y);
        if(d<cfg.revealPulseRange){
          const k=1-d/cfg.revealPulseRange;
          maxDrain=Math.max(maxDrain,k*cfg.sanDrainNear);
        }
      }
      if(maxDrain>0)player.drainSan(maxDrain*dt,'near');
      if(player.san<player.sanMax*0.5){
        const k=1-player.san/(player.sanMax*0.5);
        if(this.hud.sanVig)this.hud.sanVig.style.opacity=String(0.4+k*0.5);
      } else if(this.hud.sanVig)this.hud.sanVig.style.opacity='0';
    } else if(world.layerId===2){
      let drain=0.3;
      for(const e of world.enemies){
        if(e.hp<=0)continue;
        const d=Utils.dist(e.x,e.y,player.x,player.y);
        const cfg=e.type==='patrol'?CONFIG.gameplay.enemies.patrol:CONFIG.gameplay.enemies.storm;
        if(d<cfg.senseR){
          const k=1-d/cfg.senseR;
          drain+=k*cfg.sanDrainSighted*0.5;
        } else if(d<30)drain+=cfg.sanDrain*0.15;
      }
      player.drainSan(drain*dt,'env');
      if(player.san<player.sanMax*0.5){
        const k=1-player.san/(player.sanMax*0.5);
        if(this.hud.sanVig)this.hud.sanVig.style.opacity=String(0.4+k*0.5);
      } else if(this.hud.sanVig)this.hud.sanVig.style.opacity='0';
    }
  }
  render(){
    try{
      const tm=performance.now()/1000;
      switch(this.state){
        case STATE.TITLE:this.renderer.drawTitle(this.titleScreen,tm);break;
        case STATE.SETTINGS:
          if(this.settingsMenu.returnState===STATE.PAUSED&&this.world){
            this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
            if(this.radar)this.radar.draw(this.world,this.player);
          } else this.renderer.drawTitle(this.titleScreen,tm);
          this.renderer.drawSettings(this.settingsMenu,tm);
          break;
        case STATE.CUTSCENE:
          if(this.cutscene)this.renderer.drawCutscene(this.cutscene);
          break;
        case STATE.PLAYING:
          this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          if(this.radar)this.radar.draw(this.world,this.player);
          this._updateHUD();
          if(this._toastTimer>0)this.renderer.drawToast(this._toastText);
          break;
        case STATE.PAUSED:
          this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          if(this.radar)this.radar.draw(this.world,this.player);
          this.renderer.drawPause(this.pauseMenu,tm);
          break;
        case STATE.ELEVATOR:
          this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          if(this.radar)this.radar.draw(this.world,this.player);
          this.renderer.drawElevatorPanel(this.world,this.player,this.camera,this,this.elevatorMenu);
          break;
        case STATE.BASEMENT:
        case STATE.BASEMENT_NPC:
          this.renderer.drawBasement(this.basement,this.camera,tm,this);
          if(this.state===STATE.BASEMENT_NPC)this.renderer.drawBasementNPC(this,tm);
          if(this._toastTimer>0)this.renderer.drawToast(this._toastText);
          break;
        case STATE.FLOOR_SELECT:
          if(this.basement)this.renderer.drawBasement(this.basement,this.camera,tm,this);
          this.renderer.drawFloorSelect(this.floorSelectMenu,tm,this);
          break;
        case STATE.DEATH:this.renderer.drawDeath(this.deathState,tm,this.saveData);break;
        case STATE.TBC:
          if(this.world)this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          this.renderer.drawTBC(tm);break;
      }
    }catch(e){console.error('[Render]',e);}
  }
  _updateHUD(){
    const {player,world,hud}=this;
    if(!player||!world)return;
    if(hud.hp)hud.hp.style.width=(player.hp/player.hpMax*100)+'%';
    if(hud.san)hud.san.style.width=(player.san/player.sanMax*100)+'%';
    if(hud.sta)hud.sta.style.width=(player.stamina/player.staminaMax*100)+'%';
    if(hud.sanBar)hud.sanBar.classList.toggle('low',player.san<player.sanMax*0.3);
    if(hud.progress)hud.progress.textContent=`${t('hud.progress.map')} ${(world.exploredRatio*100).toFixed(1)}%`;
    if(world.layerId===1){
      /* 总营救 = 已上传 + pending */
      const layer=Save.layer(this.saveData,1);
      const totalRescued=(layer.rescuedIds||[]).length+this.pending.rescuedIds.size;
      const total=CONFIG.gameplay.visitors.total;
      if(hud.rescue)hud.rescue.textContent=`${t('hud.progress.rescue')} ${totalRescued} / ${total}`;
    } else {
      const alive=world.enemies.filter(e=>e.hp>0).length;
      const total=world.enemies.length;
      if(hud.rescue)hud.rescue.textContent=`敌人 ${total-alive} / ${total}`;
    }
    if(hud.logs){
      const layer=Save.layer(this.saveData,this.currentLayerId);
      const uploaded=(layer.uploadedLogs||[]).length;
      const pending=this.pending.collectedLogs.size;
      const layerTotal=8;
      hud.logs.textContent=`${t('hud.progress.logs')} ${uploaded+pending} / ${layerTotal}`;
    }
    if(hud.pos)hud.pos.textContent=`POS ${player.x.toFixed(1)}, ${player.y.toFixed(1)}`;
    this._fpsFrames++;
    this._fpsTimer+=this._lastDt||0.016;
    if(this._fpsTimer>=0.5){
      if(hud.fps)hud.fps.textContent=`FPS ${Math.round(this._fpsFrames/this._fpsTimer)}`;
      this._fpsFrames=0;this._fpsTimer=0;
    }
  }
  start(){
    this._last=performance.now();
    const loop=(now)=>{
      try{
        const dt=Math.min((now-this._last)/1000,1/30);
        this._last=now;
        this._lastDt=dt;
        this.update(dt);
        this.render();
      }catch(e){console.error('[Loop]',e);}
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

function bootstrap(){
  try{
    const game=new Game();
    game.start();
    window.KTF={game,CONFIG,Settings,Save,EventBus,Utils,I18N};
    console.log('%c[KTF] v0.8.0 · 修复 + 15 人质 + 多次上传 + 补给','color:#D9534F;font-weight:bold;font-size:14px');
    console.log('  修复：过场文本 / 多次上传 / 已营救不重生 / 15 人质');
    console.log('  新增：瓦格纳补给页签（弹药/急救/肾上腺素/镇静剂）');
  }catch(e){
    console.error('[KTF] 启动失败:',e);
    document.body.innerHTML=
      '<div style="color:#D9534F;font-family:monospace;padding:40px;font-size:16px;background:#08070A;height:100vh;">'+
      '<div style="font-size:20px;font-weight:bold;margin-bottom:16px;">启动失败</div>'+
      '<div style="margin-bottom:16px;">'+(e.message||String(e))+'</div>'+
      '<pre style="opacity:0.7;white-space:pre-wrap;font-size:12px;">'+(e.stack||'')+'</pre></div>';
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootstrap);
else bootstrap();
</script>
