<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kill the Fuhrer</title>
<style>
  :root{--ui-scale:1.0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#08070A;font-family:'Noto Sans SC','Microsoft YaHei',-apple-system,sans-serif;color:#D4CEB0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:crosshair}
  #game{display:block;position:fixed;inset:0}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .6s}
  #hud.active{opacity:1}
  #stats{position:absolute;left:20px;top:20px;display:flex;flex-direction:column;gap:6px}
  .bar-wrap{display:flex;align-items:center;gap:8px}
  .bar-label{width:44px;opacity:.65;font-size:calc(10px * var(--ui-scale));letter-spacing:2px}
  .bar{width:calc(180px * var(--ui-scale));height:5px;background:rgba(0,0,0,.7);border:1px solid rgba(212,206,176,.22);position:relative;overflow:hidden}
  .bar-fill{position:absolute;inset:0;width:100%;transition:width .12s}
  #bar-hp .bar-fill{background:linear-gradient(90deg,#8C1F1F,#D9534F)}
  #bar-san .bar-fill{background:linear-gradient(90deg,#3B6EA5,#7FB8E8)}
  #bar-sta .bar-fill{background:linear-gradient(90deg,#6B6656,#D4CEB0)}
  #bar-san.low .bar-fill{background:linear-gradient(90deg,#8C1F1F,#D9534F)}
  #objective{position:absolute;top:22px;left:50%;transform:translateX(-50%);text-align:center;font-size:calc(11px * var(--ui-scale));letter-spacing:2px;opacity:.9;text-shadow:0 0 10px rgba(0,0,0,.9)}
  #objective .obj-title{font-size:calc(9px * var(--ui-scale));opacity:.5;margin-bottom:5px;letter-spacing:4px}
  #objective .obj-main{margin-bottom:4px}
  #objective .obj-progress{color:#D9534F;margin-top:3px;font-size:calc(10px * var(--ui-scale));font-variant-numeric:tabular-nums}
  #objective .obj-progress.rescue{color:#6FCF97}
  #objective .obj-progress.logs{color:#00BCD4}
  #radar-wrap{position:absolute;right:20px;top:20px;width:calc(140px * var(--ui-scale));height:calc(140px * var(--ui-scale));border-radius:50%;overflow:hidden;border:1px solid rgba(212,206,176,.22);box-shadow:0 0 24px rgba(0,0,0,.9),inset 0 0 20px rgba(0,0,0,.9)}
  #radar{display:block;width:100%;height:100%}
  #weapon-hud{position:absolute;left:20px;bottom:22px;font-size:calc(12px * var(--ui-scale));letter-spacing:1px}
  #weapon-hud .wname{opacity:.7;font-size:calc(10px * var(--ui-scale));letter-spacing:2px}
  #weapon-hud .wname .tool-slot{color:#D9534F;margin-right:6px}
  #weapon-hud .wammo{font-size:calc(20px * var(--ui-scale));margin-top:4px;opacity:.55;font-variant-numeric:tabular-nums}
  #weapon-hud .wammo .reload{color:#D9534F;opacity:1}
  #items-hud{position:absolute;right:20px;bottom:22px;text-align:right;font-size:calc(11px * var(--ui-scale));letter-spacing:1px;display:flex;flex-direction:column;gap:4px}
  .item-slot{opacity:.6}
  .item-slot .key{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border:1px solid rgba(212,206,176,.4);border-radius:3px;margin-right:6px;font-size:10px}
  .item-slot .count{opacity:.7;margin-left:6px}
  #debug{position:absolute;right:20px;top:175px;text-align:right;font-size:calc(10px * var(--ui-scale));letter-spacing:1px;opacity:.35;font-family:'SF Mono',Menlo,monospace}
  #layer-tag{position:absolute;left:22px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:calc(10px * var(--ui-scale));letter-spacing:5px;opacity:.32}
  #crosshair{position:fixed;width:20px;height:20px;pointer-events:none;z-index:11;transform:translate(-50%,-50%);display:none}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(212,206,176,.75)}
  #crosshair::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
  #crosshair::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}
  #hint{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);font-size:calc(11px * var(--ui-scale));letter-spacing:2px;opacity:0;transition:opacity .5s;text-shadow:0 0 10px #000;pointer-events:none}
  #hint.show{opacity:.85}
  #san-vignette{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,transparent 40%,rgba(80,20,100,.35) 100%)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="san-vignette"></div>

  <div id="stats">
    <div class="bar-wrap"><div class="bar-label">HP</div><div class="bar" id="bar-hp"><div class="bar-fill"></div></div></div>
    <div class="bar-wrap"><div class="bar-label">SAN</div><div class="bar" id="bar-san"><div class="bar-fill"></div></div></div>
    <div class="bar-wrap"><div class="bar-label">STA</div><div class="bar" id="bar-sta"><div class="bar-fill"></div></div></div>
  </div>
  <div id="objective">
    <div class="obj-title" id="obj-title-text">PRIMARY OBJECTIVE</div>
    <div class="obj-main" id="obj-main-text">搜救失踪游客 · 建立测绘体系</div>
    <div class="obj-progress" id="obj-progress">测绘 0.0%</div>
    <div class="obj-progress rescue" id="obj-rescue">营救 0 / 15</div>
    <div class="obj-progress logs" id="obj-logs">碎片 0 / 8</div>
  </div>
  <div id="radar-wrap"><canvas id="radar" width="280" height="280"></canvas></div>
  <div id="weapon-hud">
    <div class="wname" id="wname-text"><span class="tool-slot">[1]</span>拓扑扫描仪</div>
    <div class="wammo" id="wammo-text">持续扫描 · 右键激活</div>
  </div>
  <div id="items-hud">
    <div class="item-slot" id="item-medkit"><span class="key">3</span>急救包<span class="count" id="count-medkit">×2</span></div>
    <div class="item-slot" id="item-adren"><span class="key">4</span>肾上腺素<span class="count" id="count-adren">×1</span></div>
    <div class="item-slot" id="item-sed"><span class="key">5</span>镇静剂<span class="count" id="count-sed">×1</span></div>
  </div>
  <div id="debug"><div id="dbg-fps">FPS --</div><div id="dbg-pos">POS --, --</div></div>
  <div id="layer-tag">LAYER 01 · LIMBO</div>
</div>
<div id="crosshair"></div>
<div id="hint"></div>

/* ==================== §3 工具 ==================== */
const Utils={
  clamp(v,a,b){return v<a?a:v>b?b:v;},
  lerp(a,b,t){return a+(b-a)*t;},
  dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;},
  dist(ax,ay,bx,by){return Math.sqrt(Utils.dist2(ax,ay,bx,by));},
  lerpAngle(a,b,t){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*t;},
  angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;},
  mulberry32(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};},
  hash2(x,y,seed){let h=(seed>>>0)+Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;},
  noise2D(x,y,seed){const xi=Math.floor(x),yi=Math.floor(y);const xf=x-xi,yf=y-yi;const a=Utils.hash2(xi,yi,seed),b=Utils.hash2(xi+1,yi,seed),c=Utils.hash2(xi,yi+1,seed),d=Utils.hash2(xi+1,yi+1,seed);const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;},
  resolveCircleRect(cx,cy,r,rect){const nx=Math.max(rect.x,Math.min(cx,rect.x+rect.w));const ny=Math.max(rect.y,Math.min(cy,rect.y+rect.h));let dx=cx-nx,dy=cy-ny;const d2=dx*dx+dy*dy;if(d2>r*r)return null;if(d2<1e-8){const l=cx-rect.x,ri=rect.x+rect.w-cx,tp=cy-rect.y,bt=rect.y+rect.h-cy;const m=Math.min(l,ri,tp,bt);if(m===l)return{x:-(l+r),y:0};if(m===ri)return{x:ri+r,y:0};if(m===tp)return{x:0,y:-(tp+r)};return{x:0,y:bt+r};}const d=Math.sqrt(d2);const p=(r-d)/d;return{x:dx*p,y:dy*p};},
  resolveCircleCircle(cx,cy,r,px,py,pr){const dx=cx-px,dy=cy-py;const rr=r+pr;const d2=dx*dx+dy*dy;if(d2>rr*rr)return null;const d=Math.sqrt(d2)||1e-4;const p=(rr-d)/d;return{x:dx*p,y:dy*p};},
  wrapText(ctx,text,maxWidth){const lines=[];let cur='';for(const ch of [...text]){if(ch==='\n'){lines.push(cur);cur='';continue;}const test=cur+ch;if(ctx.measureText(test).width>maxWidth&&cur.length>0){lines.push(cur);cur=ch;}else cur=test;}if(cur)lines.push(cur);return lines;},
  fmtNum(n){return Math.round(n).toLocaleString('en-US');}
};
const EventBus={
  _m:new Map(),
  on(e,fn){if(!this._m.has(e))this._m.set(e,new Set());this._m.get(e).add(fn);return()=>this.off(e,fn);},
  off(e,fn){const s=this._m.get(e);if(s)s.delete(fn);},
  emit(e,p){const s=this._m.get(e);if(!s)return;for(const fn of s){try{fn(p);}catch(err){console.error(e,err);}}}
};

/* ==================== §5 输入 ==================== */
class Input{
  constructor(canvas){
    this.canvas=canvas;this.keys=new Set();this.mouse={x:0,y:0,down:false,rightDown:false};
    this._bind();
  }
  _bind(){
    const pv=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab'];
    window.addEventListener('keydown',e=>{
      if(pv.includes(e.key))e.preventDefault();
      if(!this.keys.has(e.code))EventBus.emit('input:keydown',e.code);
      this.keys.add(e.code);
    });
    window.addEventListener('keyup',e=>{this.keys.delete(e.code);EventBus.emit('input:keyup',e.code);});
    window.addEventListener('blur',()=>{this.keys.clear();this.mouse.down=false;this.mouse.rightDown=false;});
    const um=(cx,cy)=>{const r=this.canvas.getBoundingClientRect();this.mouse.x=(cx-r.left)*(this.canvas.width/r.width);this.mouse.y=(cy-r.top)*(this.canvas.height/r.height);};
    this.canvas.addEventListener('mousemove',e=>um(e.clientX,e.clientY));
    this.canvas.addEventListener('mousedown',e=>{
      if(e.button===2)this.mouse.rightDown=true;else this.mouse.down=true;
      EventBus.emit('input:mousedown',e.button);
    });
    window.addEventListener('mouseup',e=>{
      if(e.button===2)this.mouse.rightDown=false;else this.mouse.down=false;
      EventBus.emit('input:mouseup',e.button);
    });
    this.canvas.addEventListener('contextmenu',e=>e.preventDefault());
  }
  isDown(c){return this.keys.has(c);}
  get axis(){
    const k=this.keys;let x=0,y=0;
    if(k.has('KeyA')||k.has('ArrowLeft'))x-=1;
    if(k.has('KeyD')||k.has('ArrowRight'))x+=1;
    if(k.has('KeyW')||k.has('ArrowUp'))y-=1;
    if(k.has('KeyS')||k.has('ArrowDown'))y+=1;
    if(x!==0&&y!==0){const inv=Math.SQRT1_2;x*=inv;y*=inv;}
    return{x,y};
  }
  get sprint(){return this.keys.has('ShiftLeft')||this.keys.has('ShiftRight');}
}

class Camera{
  constructor(){this.x=0;this.y=0;this.zoom=24;this.dpr=1;this.lerpSpeed=9;this.shake={t:0,mag:0,ox:0,oy:0};}
  setViewport(w,h,dpr){this.dpr=dpr;this.zoom=Math.min(w,h)/CONFIG.ui.viewMinDimMeters;}
  setZoom(z){this.zoom=z;}
  follow(x,y,dt){const t=1-Math.exp(-this.lerpSpeed*dt);this.x=Utils.lerp(this.x,x,t);this.y=Utils.lerp(this.y,y,t);}
  addShake(m,d){const s=Settings.get('video.shake');if(!s)return;this.shake.mag=Math.max(this.shake.mag,m*s);this.shake.t=Math.max(this.shake.t,d);}
  update(dt){
    if(this.shake.t>0){
      this.shake.t-=dt;const k=Math.max(0,this.shake.t);
      this.shake.ox=(Math.random()-0.5)*this.shake.mag*k;
      this.shake.oy=(Math.random()-0.5)*this.shake.mag*k;
      if(this.shake.t<=0){this.shake.mag=0;this.shake.ox=0;this.shake.oy=0;}
    }
  }
  worldToScreen(wx,wy,W,H){return{x:(wx-this.x)*this.zoom+W*0.5+this.shake.ox,y:(wy-this.y)*this.zoom+H*0.5+this.shake.oy};}
  screenToWorld(sx,sy,W,H){return{x:(sx-W*0.5-this.shake.ox)/this.zoom+this.x,y:(sy-H*0.5-this.shake.oy)/this.zoom+this.y};}
}

/* ==================== §7 世界 ==================== */
class World{
  constructor(layerCfg,seed,saveData,pending,layerId){
    this.cfg=layerCfg;this.layerId=layerId||1;
    this.size=layerCfg.size;
    this.seed=seed>>>0;
    this.rng=Utils.mulberry32(this.seed);
    this.walls=[];this.pillars=[];this.landmarks=[];
    this.visitors=[];this.logs=[];this.enemies=[];this.elevator=null;
    const cell=CONFIG.gameplay.world.gridCell;
    this.cell=cell;
    this.gw=Math.ceil(this.size/cell);
    this.gh=Math.ceil(this.size/cell);
    this.solid=new Uint8Array(this.gw*this.gh);
    this.fogGw=Math.ceil(this.size);
    this.fogGh=Math.ceil(this.size);
    this.explored=new Uint8Array(this.fogGw*this.fogGh);
    this.visible=new Uint8Array(this.fogGw*this.fogGh);

    const layer=Save.layer(saveData,this.layerId);
    if(layer.exploredBitmap){
      for(let i=0;i<layer.exploredBitmap.length&&i<this.explored.length;i++){
        this.explored[i]=layer.exploredBitmap[i];
      }
    }

    this.wind=(this.layerId===2)?{angle:Math.PI*0.25,strength:1.6}:null;

    this.generate();
    this.bakeSolid();
    if(this.layerId===1)this.generateVisitors(saveData,pending);
    if(this.layerId===2)this.generateEnemies();
    this.generateLogs(saveData,pending);
    this.generateElevator();
    if(layer.uploaded)this.elevator.uploaded=true;
  }
  generate(){
    const S=this.size,rng=this.rng,W=CONFIG.gameplay.world;
    this.landmarks.push({x:S*0.5,y:S*0.5,r:this.layerId===2?7:5.5,type:this.layerId===2?'storm_altar':'lamp_tower'});
    const secondaryR=S*0.34;
    const angles=[Math.PI*0.25,Math.PI*0.75,Math.PI*1.25,Math.PI*1.75];
    for(const a of angles)this.landmarks.push({x:S*0.5+Math.cos(a)*secondaryR,y:S*0.5+Math.sin(a)*secondaryR,r:3.5,type:'node'});
    const spacing=this.layerId===2?14:W.pillarSpacing;
    for(let gx=spacing*0.5;gx<S;gx+=spacing){
      for(let gy=spacing*0.5;gy<S;gy+=spacing){
        const jx=gx+(rng()-0.5)*4.5,jy=gy+(rng()-0.5)*4.5;
        if(Utils.dist(jx,jy,S*0.5,S*0.5)<W.keepClearRadius)continue;
        if(jx<4||jy<4||jx>S-4||jy>S-4)continue;
        const n=Utils.noise2D(jx*0.035,jy*0.035,this.seed);
        if(n<0.35)continue;
        if(rng()<W.pillarSkipChance)continue;
        this.pillars.push({x:jx,y:jy,r:this.layerId===2?0.9:W.pillarRadius});
      }
    }
    let placed=0,guard=0;
    const wallCount=this.layerId===2?120:W.innerWallCount;
    while(placed<wallCount&&guard++<wallCount*8){
      const x=6+rng()*(S-12),y=6+rng()*(S-12);
      if(Utils.dist(x,y,S*0.5,S*0.5)<W.keepClearRadius)continue;
      const n=Utils.noise2D(x*0.04,y*0.04,this.seed^0x9E37);
      if(n<0.42)continue;
      const h=rng()<0.5;
      const len=this.layerId===2?(2+rng()*4):(3+rng()*5.5);
      const th=W.innerWallThickness;
      const w=h?len:th,hh=h?th:len;
      this.walls.push({x:x-w*0.5,y:y-hh*0.5,w,h:hh});
      placed++;
    }
    const T=2.5;
    this.walls.push({x:0,y:0,w:S,h:T});
    this.walls.push({x:0,y:S-T,w:S,h:T});
    this.walls.push({x:0,y:0,w:T,h:S});
    this.walls.push({x:S-T,y:0,w:T,h:S});
  }
  bakeSolid(){
    const cell=this.cell,gw=this.gw,gh=this.gh;
    for(const w of this.walls){
      const x0=Math.max(0,Math.floor(w.x/cell)),y0=Math.max(0,Math.floor(w.y/cell));
      const x1=Math.min(gw-1,Math.floor((w.x+w.w)/cell)),y1=Math.min(gh-1,Math.floor((w.y+w.h)/cell));
      for(let gy=y0;gy<=y1;gy++){const row=gy*gw;for(let gx=x0;gx<=x1;gx++)this.solid[row+gx]=1;}
    }
    for(const p of this.pillars){
      const x0=Math.max(0,Math.floor((p.x-p.r)/cell)),y0=Math.max(0,Math.floor((p.y-p.r)/cell));
      const x1=Math.min(gw-1,Math.floor((p.x+p.r)/cell)),y1=Math.min(gh-1,Math.floor((p.y+p.r)/cell));
      const r2=p.r*p.r;
      for(let gy=y0;gy<=y1;gy++){
        const row=gy*gw,cy=(gy+0.5)*cell;
        for(let gx=x0;gx<=x1;gx++){
          const cx=(gx+0.5)*cell;
          if(Utils.dist2(cx,cy,p.x,p.y)<=r2)this.solid[row+gx]=1;
        }
      }
    }
  }
  /* 修复：只生成未上传营救的游客 + 位置确定性 + 保证生成全部 15 个 */
  generateVisitors(saveData,pending){
    const layer=Save.layer(saveData,1);
    const uploadedRescued=new Set(layer.rescuedIds||[]);
    const pendingRescued=pending?pending.rescuedIds:new Set();
    const allRescued=new Set([...uploadedRescued,...pendingRescued]);

    const uploadedRevealed=new Set(layer.revealedIds||[]);
    const pendingRevealed=pending?pending.revealedIds:new Set();
    const allRevealed=new Set([...uploadedRevealed,...pendingRevealed]);

    const cfg=CONFIG.gameplay.visitors;
    const total=cfg.total;
    const S=this.size;

    /* 需要生成的：未营救的 id */
    const toPlace=[];
    for(let id=0;id<total;id++)if(!allRescued.has(id))toPlace.push(id);

    for(const id of toPlace){
      /* 每个 id 用独立种子，保证位置确定 */
      const rng=Utils.mulberry32((this.seed^(id*0x9E3779B1))>>>0);
      let placed=false;
      let guard=0;
      while(!placed&&guard++<800){
        const x=8+rng()*(S-16);
        const y=8+rng()*(S-16);
        if(Utils.dist(x,y,S*0.5,S*0.5)<18)continue;
        if(this.isSolidAt(x,y))continue;
        let tc=false;
        for(const v of this.visitors)if(Utils.dist2(x,y,v.x,v.y)<25){tc=true;break;}
        if(tc)continue;
        for(const l of this.logs)if(Utils.dist2(x,y,l.x,l.y)<30){tc=true;break;}
        if(tc)continue;
        const fakeRng=Utils.mulberry32((this.seed^(id*0x517CC1B7))>>>0);
        const isFake=fakeRng()<cfg.fakeRatio;
        this.visitors.push({
          id,x,y,type:isFake?'fake':'real',
          state:'idle',
          revealed:allRevealed.has(id),
          scanProgress:allRevealed.has(id)?1:0,
          wobble:rng()*Math.PI*2,sizzleT:0,chargeVx:0,chargeVy:0,explodeFlash:0,
          sosPhase:rng()*Math.PI*2,voiceTimer:rng()*5
        });
        placed=true;
      }
    }
  }
  generateEnemies(){
    const S=this.size,cfg=CONFIG.gameplay.enemies,rng=this.rng;
    const patrolCount=8,stormCount=5;
    for(let i=0;i<patrolCount+stormCount;i++){
      const x=15+rng()*(S-30),y=15+rng()*(S-30);
      if(this.isSolidAt(x,y)){continue;}
      if(Utils.dist(x,y,S*0.5,S*0.5)<18)continue;
      let tc=false;
      for(const e of this.enemies)if(Utils.dist2(x,y,e.x,e.y)<20){tc=true;break;}
      if(tc)continue;
      const isPatrol=i<patrolCount;
      const base=isPatrol?cfg.patrol:cfg.storm;
      this.enemies.push({
        id:i,type:isPatrol?'patrol':'storm',
        x,y,hp:base.hp,hpMax:base.hp,
        dmg:base.dmg,speed:base.speed,
        aimAngle:rng()*Math.PI*2,
        state:'patrol',state_t:0,aggro:false,
        lastSeen:{x:0,y:0},fireCooldown:0,
        burstLeft:0,burstTimer:0,
        chargeVx:0,chargeVy:0,chargeDur:0,
        wobble:rng()*Math.PI*2
      });
    }
  }
  generateLogs(saveData,pending){
    const layer=Save.layer(saveData,this.layerId);
    const uploaded=new Set(layer.uploadedLogs||[]);
    const pend=pending?pending.collectedLogs:new Set();
    const ids=LAYER_LOGS[this.layerId]||LOG_IDS;
    const S=this.size,rng=this.rng;
    let guard=0;
    const used=new Set();
    for(const id of ids){
      if(uploaded.has(id)||pend.has(id)){used.add(id);continue;}
      let placed=false;
      while(!placed&&guard++<800){
        const x=8+rng()*(S-16),y=8+rng()*(S-16);
        if(Utils.dist(x,y,S*0.5,S*0.5)<12)continue;
        if(this.isSolidAt(x,y))continue;
        let tc=false;
        for(const l of this.logs)if(Utils.dist2(x,y,l.x,l.y)<30){tc=true;break;}
        for(const v of this.visitors)if(Utils.dist2(x,y,v.x,v.y)<16){tc=true;break;}
        for(const e of this.enemies)if(Utils.dist2(x,y,e.x,e.y)<8){tc=true;break;}
        if(tc)continue;
        this.logs.push({id,x,y,picked:false,wobble:rng()*Math.PI*2});
        used.add(id);
        placed=true;
      }
    }
  }
  generateElevator(){
    const S=this.size;
    const angles=[Math.PI*0.25,Math.PI*0.75,Math.PI*1.25,Math.PI*1.75];
    const idx=Math.floor(this.rng()*4)%4;
    const a=angles[idx],r=S*0.34;
    this.elevator={x:S*0.5+Math.cos(a)*r,y:S*0.5+Math.sin(a)*r,r:CONFIG.gameplay.elevator.radius,unlocked:false,uploaded:false};
  }
  isSolidAt(wx,wy){
    const gx=Math.floor(wx/this.cell),gy=Math.floor(wy/this.cell);
    if(gx<0||gy<0||gx>=this.gw||gy>=this.gh)return true;
    return this.solid[gy*this.gw+gx]===1;
  }
  resolveCollision(cx,cy,r){
    let x=cx,y=cy;
    for(let iter=0;iter<2;iter++){
      let moved=false;
      for(const w of this.walls){
        if(x+r<w.x||x-r>w.x+w.w||y+r<w.y||y-r>w.y+w.h)continue;
        const p=Utils.resolveCircleRect(x,y,r,w);
        if(p){x+=p.x;y+=p.y;moved=true;}
      }
      for(const p of this.pillars){
        const dx=x-p.x,dy=y-p.y,rr=r+p.r;
        if(dx*dx+dy*dy>rr*rr)continue;
        const res=Utils.resolveCircleCircle(x,y,r,p.x,p.y,p.r);
        if(res){x+=res.x;y+=res.y;moved=true;}
      }
      if(!moved)break;
    }
    return{x:Utils.clamp(x,r+2.6,this.size-r-2.6),y:Utils.clamp(y,r+2.6,this.size-r-2.6)};
  }
  computeVisibility(px,py){
    const fog=CONFIG.gameplay.fog;
    const rays=fog.rayCount,maxD=fog.maxDist,step=fog.step,steps=Math.ceil(maxD/step);
    this.visible.fill(0);
    this._markV(px,py);
    for(let i=0;i<rays;i++){
      const ang=(i/rays)*Math.PI*2;
      const dx=Math.cos(ang)*step,dy=Math.sin(ang)*step;
      let x=px,y=py;
      for(let s=0;s<steps;s++){
        x+=dx;y+=dy;
        if(this.isSolidAt(x,y)){this._markV(x,y);break;}
        this._markV(x,y);
      }
    }
  }
  _markV(wx,wy){
    const gx=Math.floor(wx),gy=Math.floor(wy);
    if(gx<0||gy<0||gx>=this.fogGw||gy>=this.fogGh)return;
    const idx=gy*this.fogGw+gx;
    this.visible[idx]=1;this.explored[idx]=1;
  }
  isVisible(wx,wy){
    const gx=Math.floor(wx),gy=Math.floor(wy);
    if(gx<0||gy<0||gx>=this.fogGw||gy>=this.fogGh)return false;
    return this.visible[gy*this.fogGw+gx]===1;
  }
  hasLineOfSight(ax,ay,bx,by,maxDist){
    const dx=bx-ax,dy=by-ay;
    const d=Math.hypot(dx,dy);
    if(d>maxDist)return false;
    const steps=Math.ceil(d/0.5);
    const sx=dx/steps,sy=dy/steps;
    let x=ax,y=ay;
    for(let i=1;i<steps;i++){
      x+=sx;y+=sy;
      if(this.isSolidAt(x,y))return false;
    }
    return true;
  }
  get exploredRatio(){let n=0;const T=this.fogGw*this.fogGh;for(let i=0;i<T;i++)if(this.explored[i])n++;return n/T;}
  get rescuedCount(){let n=0;for(const v of this.visitors)if(v.state==='rescued')n++;return n;}
  get revealedCount(){let n=0;for(const v of this.visitors)if(v.revealed)n++;return n;}
  get aliveEnemies(){let n=0;for(const e of this.enemies)if(e.hp>0)n++;return n;}
}

/* ==================== §8 玩家 ==================== */
class Player{
  constructor(x,y,upgrades){
    const P=CONFIG.gameplay.player;
    const ups=upgrades||{hp:0,scan:0,speed:0,bag:0,san:0};
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.radius=P.radius;
    this.aimAngle=-Math.PI/2;
    this.baseHpMax=P.hpMax+(ups.hp||0)*20;
    this.hpMax=this.baseHpMax;this.hp=this.hpMax;
    this.baseSanMax=P.sanMax+(ups.san||0)*20;
    this.sanMax=this.baseSanMax;this.san=this.sanMax;
    this.stamina=P.staminaMax;this.staminaMax=P.staminaMax;
    this.baseMoveSpeed=P.moveSpeed*(1+(ups.speed||0)*0.04);
    this.speed=0;this.sprinting=false;
    this._stepAccum=0;this.hurtFlash=0;this.invulnT=0;
    this.adrenTimer=0;this.sedativeImmuneT=0;this._sanDelayT=0;
    this.dead=false;
  }
  takeDamage(amount){
    if(this.invulnT>0)return false;
    this.hp=Math.max(0,this.hp-amount);
    this.hurtFlash=0.35;this.invulnT=0.5;
    EventBus.emit('player:hurt',{amount});
    if(this.hp<=0&&!this.dead){this.dead=true;EventBus.emit('player:dead',{});}
    return true;
  }
  drainSan(amount,reason){
    if(this.sedativeImmuneT>0)return;
    this.san=Math.max(0,this.san-amount);
    this._sanDelayT=CONFIG.gameplay.player.sanRegenDelay;
    if(amount>0.5)EventBus.emit('player:san',{amount,reason,san:this.san});
    if(this.san<=0&&!this.dead){this.dead=true;EventBus.emit('player:dead',{reason:'san'});}
  }
  heal(a){this.hp=Math.min(this.hpMax,this.hp+a);}
  healSan(a){this.san=Math.min(this.sanMax,this.san+a);}
  update(dt,input,world,camera,W,H){
    if(this.dead)return;
    const P=CONFIG.gameplay.player;
    if(this.hurtFlash>0)this.hurtFlash=Math.max(0,this.hurtFlash-dt);
    if(this.invulnT>0)this.invulnT=Math.max(0,this.invulnT-dt);
    if(this.adrenTimer>0)this.adrenTimer=Math.max(0,this.adrenTimer-dt);
    if(this.sedativeImmuneT>0)this.sedativeImmuneT=Math.max(0,this.sedativeImmuneT-dt);
    if(this._sanDelayT>0)this._sanDelayT=Math.max(0,this._sanDelayT-dt);
    if(this._sanDelayT<=0&&this.san<this.sanMax){
      this.san=Math.min(this.sanMax,this.san+P.sanRegen*dt);
    }
    const ax=input.axis;
    const wantSprint=input.sprint&&(ax.x!==0||ax.y!==0)&&this.stamina>1;
    this.sprinting=wantSprint;
    let targetSpeed=this.baseMoveSpeed*(wantSprint?P.sprintMult:1);
    if(this.adrenTimer>0)targetSpeed*=1+CONFIG.gameplay.items.adrenalineBoost;
    if(this.san<this.sanMax*0.3){
      const k=this.san/(this.sanMax*0.3);
      targetSpeed*=0.6+0.4*k;
    }
    let tvx=ax.x*targetSpeed,tvy=ax.y*targetSpeed;
    if(world.wind){
      const w=world.wind;
      const tt=performance.now()/1000;
      const gust=0.7+0.3*Math.sin(tt*0.7);
      tvx+=Math.cos(w.angle)*w.strength*gust;
      tvy+=Math.sin(w.angle)*w.strength*gust;
    }
    if(ax.x===0&&ax.y===0&&!world.wind){
      const sp=Math.hypot(this.vx,this.vy);
      if(sp>0){
        const k=Math.max(0,1-P.friction*dt);
        this.vx*=k;this.vy*=k;
        if(Math.hypot(this.vx,this.vy)<0.05){this.vx=0;this.vy=0;}
      }
    } else {
      const k=Math.min(1,P.acceleration*dt/Math.max(targetSpeed,0.1));
      this.vx+=(tvx-this.vx)*k;this.vy+=(tvy-this.vy)*k;
    }
    if(wantSprint)this.stamina=Math.max(0,this.stamina-P.staminaDrain*dt);
    else this.stamina=Math.min(this.staminaMax,this.stamina+P.staminaRegen*dt);
    const nx=this.x+this.vx*dt,ny=this.y+this.vy*dt;
    const s=world.resolveCollision(nx,ny,this.radius);
    if(Math.abs(s.x-nx)>1e-4)this.vx*=0.2;
    if(Math.abs(s.y-ny)>1e-4)this.vy*=0.2;
    this.x=s.x;this.y=s.y;
    this.speed=Math.hypot(this.vx,this.vy);
    const w=camera.screenToWorld(input.mouse.x,input.mouse.y,W,H);
    this.aimAngle=Utils.lerpAngle(this.aimAngle,Math.atan2(w.y-this.y,w.x-this.x),1-Math.exp(-P.turnLerp*dt));
    this._stepAccum+=this.speed*dt;
    const si=this.sprinting?1.8:2.6;
    if(this._stepAccum>si&&this.speed>0.5){
      this._stepAccum=0;
      EventBus.emit('player:step',{alt:Math.random()>0.5,sprint:this.sprinting});
    }
  }
}

/* ==================== §9 迷雾 ==================== */
class FogRenderer{
  constructor(world){
    this.world=world;
    this.canvas=document.createElement('canvas');
    this.canvas.width=world.fogGw;
    this.canvas.height=world.fogGh;
    this.ctx=this.canvas.getContext('2d');
    this.imageData=this.ctx.createImageData(world.fogGw,world.fogGh);
    this._dirty=true;
  }
  markDirty(){this._dirty=true;}
  bake(){
    if(!this._dirty)return;
    this._dirty=false;
    const W=this.world.fogGw,H=this.world.fogGh;
    const ex=this.world.explored,vi=this.world.visible;
    const data=this.imageData.data;
    const total=W*H;
    for(let i=0;i<total;i++){
      const o=i*4;
      if(vi[i]){data[o]=0;data[o+1]=0;data[o+2]=0;data[o+3]=0;}
      else if(ex[i]){data[o]=6;data[o+1]=6;data[o+2]=8;data[o+3]=165;}
      else{data[o]=6;data[o+1]=6;data[o+2]=8;data[o+3]=255;}
    }
    this.ctx.putImageData(this.imageData,0,0);
  }
  draw(ctx,camera,W,H){
    this.bake();
    const tl=camera.worldToScreen(0,0,W,H);
    ctx.drawImage(this.canvas,tl.x,tl.y,this.world.size*camera.zoom,this.world.size*camera.zoom);
  }
}

/* ==================== §10 雷达 ==================== */
class Radar{
  constructor(canvasEl){this.canvas=canvasEl;this.ctx=canvasEl.getContext('2d');this.dpr=1;this.size=0;this.pingT=0;this._resize();}
  _resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    this.dpr=dpr;
    const scale=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui-scale'))||1;
    const px=Math.max(1,CONFIG.ui.radar.cssSize*scale*dpr);
    this.canvas.width=px;this.canvas.height=px;this.size=px;
  }
  update(dt){this.pingT+=dt;if(this.pingT>CONFIG.ui.radar.pingInterval)this.pingT=0;}
  draw(world,player){
    if(!world||!player)return;
    const ctx=this.ctx,S=this.size,R=S*0.5;
    const rr=CONFIG.ui.radar.worldRadius;
    const scale=(R-8*this.dpr)/rr;
    const dpr=this.dpr;
    ctx.clearRect(0,0,S,S);
    ctx.fillStyle='rgba(8,7,10,0.94)';
    ctx.beginPath();ctx.arc(R,R,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(212,206,176,0.10)';ctx.lineWidth=dpr;
    for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(R,R,(R-6*dpr)*(i/3),0,Math.PI*2);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(R,6*dpr);ctx.lineTo(R,S-6*dpr);ctx.moveTo(6*dpr,R);ctx.lineTo(S-6*dpr,R);ctx.stroke();
    ctx.save();
    ctx.beginPath();ctx.arc(R,R,R-4*dpr,0,Math.PI*2);ctx.clip();
    const px=player.x,py=player.y;
    const wr2=rr*rr,clipR2=(R-6*dpr)**2;
    for(const lm of world.landmarks){
      const ddx=lm.x-px,ddy=lm.y-py;
      const isM=lm.type==='lamp_tower'||lm.type==='storm_altar';
      const rx0=ddx*scale,ry0=ddy*scale;
      const col=lm.type==='lamp_tower'?'#FFD75E':lm.type==='storm_altar'?'#E8A8BF':'rgba(217,83,79,0.55)';
      ctx.fillStyle=col;
      if(rx0*rx0+ry0*ry0>clipR2){
        const ang=Math.atan2(ry0,rx0);
        ctx.beginPath();ctx.arc(R+Math.cos(ang)*(R-6*dpr),R+Math.sin(ang)*(R-6*dpr),3*dpr,0,Math.PI*2);ctx.fill();
      }else{
        ctx.beginPath();ctx.arc(R+rx0,R+ry0,(isM?4:2)*dpr,0,Math.PI*2);ctx.fill();
      }
    }
    if(world.elevator){
      const h=world.elevator;
      const ddx=h.x-px,ddy=h.y-py;
      const rx0=ddx*scale,ry0=ddy*scale;
      ctx.fillStyle=h.unlocked?'#00BCD4':'rgba(0,188,212,0.4)';
      if(rx0*rx0+ry0*ry0>clipR2){
        const ang=Math.atan2(ry0,rx0);
        const ex=R+Math.cos(ang)*(R-6*dpr),ey=R+Math.sin(ang)*(R-6*dpr);
        ctx.save();ctx.translate(ex,ey);ctx.rotate(Math.PI/4);
        ctx.fillRect(-3.5*dpr,-3.5*dpr,7*dpr,7*dpr);ctx.restore();
      }else{
        ctx.save();ctx.translate(R+rx0,R+ry0);ctx.rotate(Math.PI/4);
        ctx.fillRect(-4*dpr,-4*dpr,8*dpr,8*dpr);ctx.restore();
      }
    }
    ctx.fillStyle='rgba(212,206,176,0.55)';
    for(const w of world.walls){
      const wx=w.x+w.w*0.5,wy=w.y+w.h*0.5;
      const ddx=wx-px,ddy=wy-py;
      if(ddx*ddx+ddy*ddy>wr2)continue;
      const gx=Math.floor(wx),gy=Math.floor(wy);
      if(gx<0||gy<0||gx>=world.fogGw||gy>=world.fogGh)continue;
      if(!world.explored[gy*world.fogGw+gx])continue;
      const rx=R+ddx*scale,ry=R+ddy*scale;
      ctx.fillRect(rx-w.w*scale*0.5,ry-w.h*scale*0.5,Math.max(1,w.w*scale),Math.max(1,w.h*scale));
    }
    for(const p of world.pillars){
      const ddx=p.x-px,ddy=p.y-py;
      if(ddx*ddx+ddy*ddy>wr2)continue;
      const gx=Math.floor(p.x),gy=Math.floor(p.y);
      if(gx<0||gy<0||gx>=world.fogGw||gy>=world.fogGh)continue;
      if(!world.explored[gy*world.fogGw+gx])continue;
      ctx.beginPath();ctx.arc(R+ddx*scale,R+ddy*scale,Math.max(1,p.r*scale),0,Math.PI*2);ctx.fill();
    }
    for(const v of world.visitors){
      if(v.state==='rescued'||v.state==='exploded')continue;
      const ddx=v.x-px,ddy=v.y-py;
      if(ddx*ddx+ddy*ddy>wr2)continue;
      let color='#FFD75E';
      if(v.revealed)color=v.type==='real'?'#6FCF97':'#D9534F';
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(R+ddx*scale,R+ddy*scale,3*dpr,0,Math.PI*2);ctx.fill();
    }
    for(const e of world.enemies){
      if(e.hp<=0)continue;
      const ddx=e.x-px,ddy=e.y-py;
      if(ddx*ddx+ddy*ddy>wr2)continue;
      ctx.fillStyle=e.type==='patrol'?'#D9534F':'#E8A8BF';
      ctx.beginPath();ctx.arc(R+ddx*scale,R+ddy*scale,3.5*dpr,0,Math.PI*2);ctx.fill();
      if(e.aggro){
        ctx.strokeStyle='rgba(217,83,79,0.7)';ctx.lineWidth=1.5*dpr;
        ctx.beginPath();ctx.arc(R+ddx*scale,R+ddy*scale,6*dpr,0,Math.PI*2);ctx.stroke();
      }
    }
    for(const l of world.logs){
      if(l.picked)continue;
      const ddx=l.x-px,ddy=l.y-py;
      if(ddx*ddx+ddy*ddy>wr2)continue;
      ctx.fillStyle='rgba(0,188,212,0.7)';
      ctx.beginPath();ctx.arc(R+ddx*scale,R+ddy*scale,2*dpr,0,Math.PI*2);ctx.fill();
    }
    const pp=this.pingT/CONFIG.ui.radar.pingDuration;
    if(pp<1){
      ctx.strokeStyle=`rgba(255,248,220,${0.5*(1-pp)})`;
      ctx.lineWidth=2*dpr;
      ctx.beginPath();ctx.arc(R,R,(R-6*dpr)*pp,0,Math.PI*2);ctx.stroke();
    }
    ctx.fillStyle='#FFF8DC';
    ctx.beginPath();ctx.arc(R,R,3.5*dpr,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#FFF8DC';ctx.lineWidth=2*dpr;
    ctx.beginPath();ctx.moveTo(R,R);
    ctx.lineTo(R+Math.cos(player.aimAngle)*9*dpr,R+Math.sin(player.aimAngle)*9*dpr);ctx.stroke();
    ctx.restore();
    ctx.strokeStyle='rgba(212,206,176,0.4)';ctx.lineWidth=1.5*dpr;
    ctx.beginPath();ctx.arc(R,R,R-1,0,Math.PI*2);ctx.stroke();
  }
}

/* ==================== §11 音频 ==================== */
class AudioEngine{
  constructor(){
    this.ctx=null;this.master=null;this.musicBus=null;this.sfxBus=null;this.uiBus=null;
    this.enabled=CONFIG.audio.enabled;this.started=false;
    this._scanOsc=null;this._scanGain=null;
    this._droneOsc=null;this._droneGain=null;this._chordOscs=[];this._chordGain=null;
    this._hum=null;
    this.currentLayer=1;
  }
  start(){
    if(this.started||!this.enabled)return;
    this.started=true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=0;
      this.master.connect(this.ctx.destination);
      this.musicBus=this.ctx.createGain();this.sfxBus=this.ctx.createGain();this.uiBus=this.ctx.createGain();
      this.musicBus.connect(this.master);this.sfxBus.connect(this.master);this.uiBus.connect(this.master);
      this.applySettings();
      const now=this.ctx.currentTime;
      this.master.gain.linearRampToValueAtTime(Settings.get('audio.master')||0.6,now+2.5);
      this._startLayer(1);
    }catch(e){console.warn(e);this.enabled=false;}
  }
  applySettings(){
    if(!this.ctx)return;
    const now=this.ctx.currentTime;
    const m=Settings.get('audio.master')??0.6;
    const mu=Settings.get('audio.music')??0.7;
    const sf=Settings.get('audio.sfx')??0.85;
    const ui=Settings.get('audio.ui')??0.7;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.linearRampToValueAtTime(m,now+0.15);
    this.musicBus.gain.setValueAtTime(mu,now);
    this.sfxBus.gain.setValueAtTime(sf,now);
    this.uiBus.gain.setValueAtTime(ui,now);
  }
  _startLayer(layerId){
    if(!this.ctx)return;
    const cfg=CONFIG.audio.layers[layerId];
    if(!cfg)return;
    this.currentLayer=layerId;
    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();
    const filt=this.ctx.createBiquadFilter();
    osc.type=cfg.drone.type;
    osc.frequency.value=cfg.drone.root;
    filt.type='lowpass';filt.frequency.value=380;
    gain.gain.value=0;
    osc.connect(filt);filt.connect(gain);gain.connect(this.musicBus);
    osc.start();
    const now=this.ctx.currentTime;
    gain.gain.linearRampToValueAtTime(cfg.drone.gain,now+4);
    this._droneOsc=osc;this._droneGain=gain;
    const cg=this.ctx.createGain();cg.gain.value=0;cg.connect(this.musicBus);
    const chordOscs=[];
    for(const f of cfg.chord){
      const o=this.ctx.createOscillator();
      o.type='triangle';o.frequency.value=f;
      const og=this.ctx.createGain();og.gain.value=0.33;
      o.connect(og);og.connect(cg);
      o.start();
      chordOscs.push(o);
    }
    cg.gain.linearRampToValueAtTime(cfg.chordGain,now+5);
    this._chordGain=cg;this._chordOscs=chordOscs;
    if(layerId===1){
      const o1=this.ctx.createOscillator();
      const o2=this.ctx.createOscillator();
      const f=this.ctx.createBiquadFilter();
      const g=this.ctx.createGain();
      o1.type='sawtooth';o1.frequency.value=120;
      o2.type='sine';o2.frequency.value=60;
      f.type='bandpass';f.frequency.value=720;f.Q.value=4;
      g.gain.value=0;
      o1.connect(f);o2.connect(f);f.connect(g);g.connect(this.musicBus);
      o1.start();o2.start();
      g.gain.linearRampToValueAtTime(0.008,now+3);
      this._hum={o1,o2,g};
    } else {
      const sr=this.ctx.sampleRate;
      const len=sr*4;
      const buf=this.ctx.createBuffer(1,len,sr);
      const data=buf.getChannelData(0);
      for(let i=0;i<len;i++)data[i]=(Math.random()*2-1);
      const src=this.ctx.createBufferSource();
      src.buffer=buf;src.loop=true;
      const bf=this.ctx.createBiquadFilter();
      bf.type='bandpass';bf.frequency.value=200;bf.Q.value=0.7;
      const g=this.ctx.createGain();g.gain.value=0;
      src.connect(bf);bf.connect(g);g.connect(this.musicBus);
      src.start();
      g.gain.linearRampToValueAtTime(0.06,now+3);
      this._hum={src,g};
    }
  }
  stopLayer(){
    if(this._droneOsc){try{this._droneOsc.stop();}catch(e){}this._droneOsc=null;}
    if(this._chordOscs){for(const o of this._chordOscs){try{o.stop();}catch(e){}}this._chordOscs=[];}
    if(this._hum){try{this._hum.o1?.stop();}catch(e){}try{this._hum.o2?.stop();}catch(e){}try{this._hum.src?.stop();}catch(e){}this._hum=null;}
  }
  switchLayer(layerId){
    if(!this.ctx||this.currentLayer===layerId)return;
    const now=this.ctx.currentTime;
    if(this._droneGain)this._droneGain.gain.linearRampToValueAtTime(0,now+1.5);
    if(this._chordGain)this._chordGain.gain.linearRampToValueAtTime(0,now+1.5);
    if(this._hum&&this._hum.g)this._hum.g.gain.linearRampToValueAtTime(0,now+1.5);
    setTimeout(()=>{this.stopLayer();this._startLayer(layerId);},1700);
  }
  beep(freq,dur,type='sine',vol=0.18,bus){
    if(!this.ctx||!this.started)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=0;
    o.connect(g);g.connect(bus||this.uiBus);
    const now=this.ctx.currentTime;
    g.gain.linearRampToValueAtTime(vol,now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    o.start(now);o.stop(now+dur+0.05);
  }
  noise(dur,vol,freq,type='lowpass'){
    if(!this.ctx||!this.started)return;
    const sr=this.ctx.sampleRate;
    const len=Math.floor(sr*dur);
    const buf=this.ctx.createBuffer(1,len,sr);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type=type;f.frequency.value=freq||800;
    const g=this.ctx.createGain();g.gain.value=vol||0.2;
    src.connect(f);f.connect(g);g.connect(this.sfxBus);
    src.start();
  }
  footstep(alt,sprint){
    if(!this.ctx||!this.started)return;
    const base=sprint?680:520;
    const jitter=alt?1.07:0.94;
    const sr=this.ctx.sampleRate,dur=0.12,len=Math.floor(sr*dur);
    const buf=this.ctx.createBuffer(1,len,sr);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++){const env=Math.pow(1-i/len,3);data[i]=(Math.random()*2-1)*env;}
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=base*jitter;f.Q.value=1.2;
    const g=this.ctx.createGain();g.gain.value=sprint?0.14:0.09;
    src.connect(f);f.connect(g);g.connect(this.sfxBus);
    src.start();
  }
  gunshot(){
    if(!this.ctx||!this.started)return;
    const sr=this.ctx.sampleRate,dur=0.15,len=Math.floor(sr*dur);
    const buf=this.ctx.createBuffer(1,len,sr);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++){const env=Math.pow(1-i/len,5);data[i]=(Math.random()*2-1)*env;}
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;
    const g=this.ctx.createGain();g.gain.value=0.22;
    src.connect(f);f.connect(g);g.connect(this.sfxBus);
    src.start();
    const o=this.ctx.createOscillator(),og=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(120,this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50,this.ctx.currentTime+0.08);
    og.gain.setValueAtTime(0.12,this.ctx.currentTime);
    og.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+0.1);
    o.connect(og);og.connect(this.sfxBus);
    o.start();o.stop(this.ctx.currentTime+0.15);
  }
  enemyShot(){
    if(!this.ctx||!this.started)return;
    const sr=this.ctx.sampleRate,dur=0.1,len=Math.floor(sr*dur);
    const buf=this.ctx.createBuffer(1,len,sr);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++){const env=Math.pow(1-i/len,4);data[i]=(Math.random()*2-1)*env;}
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1000;
    const g=this.ctx.createGain();g.gain.value=0.15;
    src.connect(f);f.connect(g);g.connect(this.sfxBus);
    src.start();
  }
  reload(){
    if(!this.ctx||!this.started)return;
    this.beep(600,0.06,'square',0.08,this.sfxBus);
    setTimeout(()=>this.beep(480,0.06,'square',0.08,this.sfxBus),250);
    setTimeout(()=>this.beep(720,0.1,'square',0.1,this.sfxBus),700);
  }
  sosCry(){
    if(!this.ctx||!this.started)return;
    const now=this.ctx.currentTime;
    for(let i=0;i<3;i++){
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(400,now+i*0.18);
      o.frequency.exponentialRampToValueAtTime(560,now+i*0.18+0.14);
      g.gain.setValueAtTime(0,now+i*0.18);
      g.gain.linearRampToValueAtTime(0.04,now+i*0.18+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.18+0.15);
      o.connect(g);g.connect(this.sfxBus);
      o.start(now+i*0.18);o.stop(now+i*0.18+0.2);
    }
  }
  deathStinger(){
    if(!this.ctx||!this.started)return;
    const now=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(220,now);
    o.frequency.exponentialRampToValueAtTime(40,now+1.8);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.linearRampToValueAtTime(0.2,now+0.1);
    g.gain.exponentialRampToValueAtTime(0.0001,now+2);
    o.connect(g);g.connect(this.sfxBus);
    o.start(now);o.stop(now+2.1);
  }
  pickupChime(){
    if(!this.ctx||!this.started)return;
    const now=this.ctx.currentTime;
    for(let i=0;i<3;i++){
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine';o.frequency.value=660+i*220;
      g.gain.setValueAtTime(0,now+i*0.06);
      g.gain.linearRampToValueAtTime(0.06,now+i*0.06+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.06+0.2);
      o.connect(g);g.connect(this.uiBus);
      o.start(now+i*0.06);o.stop(now+i*0.06+0.25);
    }
  }
  sanWarn(){
    if(!this.ctx||!this.started)return;
    this.beep(80,0.6,'sawtooth',0.06,this.sfxBus);
    this.beep(110,0.5,'sawtooth',0.05,this.sfxBus);
  }
  purchase(){
    if(!this.ctx||!this.started)return;
    this.beep(880,0.1,'sine',0.1);
    this.beep(1320,0.15,'sine',0.08);
  }
  startScanLoop(){
    if(!this.ctx||!this.started||this._scanOsc)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='triangle';o.frequency.value=600;g.gain.value=0;
    o.connect(g);g.connect(this.sfxBus);o.start();
    g.gain.linearRampToValueAtTime(0.05,this.ctx.currentTime+0.1);
    this._scanOsc=o;this._scanGain=g;
  }
  updateScanLoop(active,intensity){
    if(!this.ctx)return;
    if(active&&!this._scanOsc)this.startScanLoop();
    if(this._scanOsc&&this._scanGain){
      const now=this.ctx.currentTime;
      this._scanOsc.frequency.setTargetAtTime(480+intensity*260,now,0.1);
      this._scanGain.gain.setTargetAtTime(active?0.045+intensity*0.03:0,now,0.15);
    }
  }
  stopScanLoop(){if(this._scanOsc){try{this._scanOsc.stop();}catch(e){}this._scanOsc=null;this._scanGain=null;}}
}

/* ==================== §12 过场 ==================== */
class Cutscene{
  constructor(lines,onDone){
    this.lines=lines;this.onDone=onDone;this.index=0;this.t=0;
    this.fadeAlpha=0;this.phase='fadeIn';this.fadeDur=0.6;
    this.typing=false;this.cursorVisible=false;this._cursorT=0;this._typeProgress=0;
  }
  get currentLine(){
    if(this.index>=this.lines.length)return null;
    const l=this.lines[this.index];
    if(this.typing){const s=Math.floor(this._typeProgress);return{...l,text:l.text.slice(0,s)};}
    return l;
  }
  update(dt,input){
    if(this.phase==='done')return;
    this._cursorT+=dt;this.cursorVisible=(this._cursorT%0.8)<0.4;
    if(this.phase==='fadeIn'){
      this.t+=dt;this.fadeAlpha=Math.min(1,this.t/this.fadeDur);
      if(this.t>=this.fadeDur){this.t=0;this.phase='play';this._startLine();}
    }else if(this.phase==='play'){
      const l=this.lines[this.index];
      if(!l){this.phase='fadeOut';this.t=0;return;}
      if(this.typing){this._typeProgress+=dt*42;if(this._typeProgress>=l.text.length){this.typing=false;this._typeProgress=l.text.length;}}
      this.t+=dt;
      const k=input&&(input.isDown('Space')||input.isDown('Enter')||input.isDown('KeyE')||input.isDown('Escape'));
      if(this.t>=(l.dur||3.5)||(!this.typing&&k)){
        this.index++;this.t=0;
        if(this.index>=this.lines.length){this.phase='fadeOut';this.t=0;}
        else this._startLine();
      }
    }else if(this.phase==='fadeOut'){
      this.t+=dt;this.fadeAlpha=Math.max(0,1-this.t/this.fadeDur);
      if(this.t>=this.fadeDur){this.phase='done';if(this.onDone)this.onDone();}
    }
  }
  _startLine(){const l=this.lines[this.index];if(!l)return;this.typing=true;this._typeProgress=0;}
}

/* ==================== §13 工具 ==================== */
class ToolSystem{
  constructor(){
    this.tools=[
      {id:'scanner',nameKey:'hud.weapon.scanner',slot:1},
      {id:'pistol',nameKey:'hud.weapon.pistol',slot:2}
    ];
    this.currentIndex=0;
    this.active=false;this.intensity=0;
    this.focusTarget=null;this.focusProgress=0;this._focusHold=0;
    this.radius=CONFIG.gameplay.visitors.scanRadius;
    this.duration=CONFIG.gameplay.visitors.scanDuration;
    this.pistolAmmo=12;this.pistolMag=12;this.reloadT=0;this.fireCooldown=0;
  }
  get id(){return this.tools[this.currentIndex].id;}
  get nameKey(){return this.tools[this.currentIndex].nameKey;}
  switchTo(i){if(i>=0&&i<this.tools.length)this.currentIndex=i;}
  applyUpgrades(u){
    const l=u.scan||0;
    this.radius=CONFIG.gameplay.visitors.scanRadius+l*2;
    this.duration=CONFIG.gameplay.visitors.scanDuration/(1+l*0.25);
    this.pistolMag=12+(u.bag||0)*12;
    if(this.pistolAmmo>this.pistolMag)this.pistolAmmo=this.pistolMag;
  }
  update(dt,player,input,world,game){
    this.active=!!input.mouse.rightDown&&this.id==='scanner';
    this.intensity=0;
    if(this.id==='scanner'&&world.layerId===1){
      const cfg=CONFIG.gameplay.visitors;
      if(!this.active){
        for(const v of world.visitors){
          if(v.state!=='idle'||v.revealed)continue;
          v.scanProgress=Math.max(0,v.scanProgress-dt*cfg.scanDecay);
        }
        this.focusTarget=null;this.focusProgress=0;this._focusHold=0;
      }else{
        let best=null,bestP=0,bestD=Infinity;
        for(const v of world.visitors){
          if(v.state!=='idle')continue;
          if(v.revealed){v.scanProgress=1;continue;}
          const dx=v.x-player.x,dy=v.y-player.y;
          const d=Math.hypot(dx,dy);
          if(d>this.radius){v.scanProgress=Math.max(0,v.scanProgress-dt*cfg.scanDecay);continue;}
          const diff=Math.abs(Utils.angleDiff(player.aimAngle,Math.atan2(dy,dx)));
          if(diff>cfg.scanHalfAngle){v.scanProgress=Math.max(0,v.scanProgress-dt*cfg.scanDecay);continue;}
          v.scanProgress=Math.min(1,v.scanProgress+dt/this.duration);
          if(v.scanProgress>bestP||(v.scanProgress>0.05&&d<bestD)){best=v;bestP=v.scanProgress;bestD=d;}
          if(v.scanProgress>=1&&!v.revealed){v.revealed=true;EventBus.emit('visitor:revealed',v);}
        }
        if(best!==this.focusTarget){this.focusTarget=best;this._focusHold=0;this.focusProgress=best?best.scanProgress:0;}
        else if(best){this._focusHold+=dt;this.focusProgress=best.scanProgress;}
        else this.focusProgress=Math.max(0,this.focusProgress-dt*0.5);
        this.intensity=bestP;
      }
    } else {
      for(const v of world.visitors){
        if(v.state!=='idle'||v.revealed)continue;
        v.scanProgress=Math.max(0,v.scanProgress-dt*1.8);
      }
      this.focusTarget=null;this.focusProgress=0;
    }
    if(this.reloadT>0)this.reloadT=Math.max(0,this.reloadT-dt);
    if(this.fireCooldown>0)this.fireCooldown=Math.max(0,this.fireCooldown-dt);
    if(this.id==='pistol'&&input.mouse.down&&this.fireCooldown<=0&&this.reloadT<=0){
      if(this.pistolAmmo>0)this._fire(player,world,game);
      else{if(game)game._showToast(t('toast.no.ammo'),1.2);this.fireCooldown=0.3;}
    }
  }
  _fire(player,world,game){
    const cfg=CONFIG.gameplay.pistol;
    this.pistolAmmo--;
    this.fireCooldown=1/cfg.fireRate;
    if(!game)return;
    game.audio.gunshot();
    game.camera.addShake(2,0.08);
    const range=14;
    let hit=null,hitD=Infinity;
    for(const v of world.visitors){
      if(v.state==='rescued'||v.state==='exploded')continue;
      const dx=v.x-player.x,dy=v.y-player.y;
      const d=Math.hypot(dx,dy);
      if(d>range)continue;
      const diff=Math.abs(Utils.angleDiff(player.aimAngle,Math.atan2(dy,dx)));
      if(diff>0.15)continue;
      if(d<hitD){hit=v;hitD=d;}
    }
    for(const e of world.enemies){
      if(e.hp<=0)continue;
      const dx=e.x-player.x,dy=e.y-player.y;
      const d=Math.hypot(dx,dy);
      if(d>range)continue;
      const diff=Math.abs(Utils.angleDiff(player.aimAngle,Math.atan2(dy,dx)));
      if(diff>0.15)continue;
      if(d<hitD){hit=e;hitD=d;}
    }
    if(hit){
      if('hp' in hit){
        hit.hp-=cfg.damage;
        if(hit.hp<=0){
          game._showToast(t('toast.killed'),1.2);
          const lyr=Save.layer(game.saveData,world.layerId);
          const key=hit.type==='patrol'?'patrol':hit.type==='storm'?'storm':'doppelganger';
          if(!lyr.discoveredEnemies.includes(key))lyr.discoveredEnemies.push(key);
          if(!lyr.discoveredAnomalies.includes(key))lyr.discoveredAnomalies.push(key);
        }
        hit.state_t=0.15;
        hit.aggro=true;
      } else {
        hit.state='exploded';hit.explodeFlash=0.4;
        if(hit.type==='real'&&!hit.revealed){
          player.drainSan(15,'murder');
          game._showToast('误伤平民',1.5);
        }
      }
    }
    game.bullets.push({
      x:player.x+Math.cos(player.aimAngle)*0.8,
      y:player.y+Math.sin(player.aimAngle)*0.8,
      vx:Math.cos(player.aimAngle)*CONFIG.gameplay.pistol.bulletSpeed,
      vy:Math.sin(player.aimAngle)*CONFIG.gameplay.pistol.bulletSpeed,
      life:CONFIG.gameplay.pistol.bulletLife
    });
  }
  reload(inv){
    if(this.reloadT>0)return false;
    if(this.pistolAmmo>=this.pistolMag)return false;
    const need=this.pistolMag-this.pistolAmmo;
    if(inv.ammo<=0)return false;
    const take=Math.min(need,inv.ammo);
    this.reloadT=CONFIG.gameplay.pistol.reloadTime;
    setTimeout(()=>{this.pistolAmmo+=take;inv.ammo-=take;},CONFIG.gameplay.pistol.reloadTime*1000);
    return true;
  }
}

class BasementScene{
  constructor(){
    const cfg=CONFIG.gameplay.basement;
    this.width=cfg.width;this.height=cfg.height;this.cfg=cfg;
    this.walls=[
      {x:0,y:0,w:this.width,h:cfg.wallThickness},
      {x:0,y:this.height-cfg.wallThickness,w:this.width,h:cfg.wallThickness},
      {x:0,y:0,w:cfg.wallThickness,h:this.height},
      {x:this.width-cfg.wallThickness,y:0,w:cfg.wallThickness,h:this.height},
      {x:8.5,y:2,w:0.4,h:6},
      {x:17.1,y:2,w:0.4,h:6}
    ];
    this.furniture=[
      {x:3,y:3,w:2.4,h:1.0,type:'table'},
      {x:4,y:6.4,w:1.6,h:1.0,type:'crate'},
      {x:20.6,y:3,w:2.4,h:1.0,type:'table'},
      {x:20.8,y:6.4,w:1.6,h:1.0,type:'crate'},
      {x:11.6,y:8,w:2.8,h:1.0,type:'table'}
    ];
    this.npcs=[
      {id:'herwig',x:5.2,y:4.5,r:0.6,nameKey:'npc.herwig.title',icon:'H',color:'#8C6B4A'},
      {id:'lena',x:13,y:4,r:0.6,nameKey:'npc.lena.title',icon:'L',color:'#4A6B8C'},
      {id:'wagner',x:20.8,y:4.5,r:0.6,nameKey:'npc.wagner.title',icon:'W',color:'#6B4A4A'}
    ];
    this.elevator={x:13,y:15.5,r:1.4};
    this.player={x:cfg.playerStart.x,y:cfg.playerStart.y,vx:0,vy:0,radius:0.42,aimAngle:-Math.PI/2};
    this.nearNPC=null;this.nearElevator=false;
  }
  update(dt,input,camera,W,H){
    const p=this.player;
    const ax=input.axis;
    const speed=4.6,acc=34,fric=24;
    const tvx=ax.x*speed,tvy=ax.y*speed;
    if(ax.x===0&&ax.y===0){
      const sp=Math.hypot(p.vx,p.vy);
      if(sp>0){const k=Math.max(0,1-fric*dt);p.vx*=k;p.vy*=k;if(Math.hypot(p.vx,p.vy)<0.05){p.vx=0;p.vy=0;}}
    }else{
      const k=Math.min(1,acc*dt/speed);
      p.vx+=(tvx-p.vx)*k;p.vy+=(tvy-p.vy)*k;
    }
    const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;
    const s=this._resolve(nx,ny,p.radius);
    if(Math.abs(s.x-nx)>1e-4)p.vx*=0.2;
    if(Math.abs(s.y-ny)>1e-4)p.vy*=0.2;
    p.x=s.x;p.y=s.y;
    const w=camera.screenToWorld(input.mouse.x,input.mouse.y,W,H);
    p.aimAngle=Math.atan2(w.y-p.y,w.x-p.x);
    this.nearNPC=null;
    let bd=Infinity;
    for(const npc of this.npcs){
      const d=Utils.dist(p.x,p.y,npc.x,npc.y);
      if(d<2.5&&d<bd){bd=d;this.nearNPC=npc;}
    }
    this.nearElevator=Utils.dist(p.x,p.y,this.elevator.x,this.elevator.y)<this.elevator.r+1.2;
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>0.5){
      this._stepAccum=(this._stepAccum||0)+sp*dt;
      if(this._stepAccum>2.4){this._stepAccum=0;EventBus.emit('player:step',{alt:Math.random()>0.5,sprint:false});}
    }
  }
  _resolve(cx,cy,r){
    let x=cx,y=cy;
    for(let it=0;it<2;it++){
      let moved=false;
      const all=this.walls.concat(this.furniture);
      for(const rect of all){
        const p=Utils.resolveCircleRect(x,y,r,rect);
        if(p){x+=p.x;y+=p.y;moved=true;}
      }
      for(const npc of this.npcs){
        const res=Utils.resolveCircleCircle(x,y,r+0.1,npc.x,npc.y,npc.r);
        if(res){x+=res.x;y+=res.y;moved=true;}
      }
      if(!moved)break;
    }
    return{x:Utils.clamp(x,r+this.cfg.wallThickness,this.width-r-this.cfg.wallThickness),y:Utils.clamp(y,r+this.cfg.wallThickness,this.height-r-this.cfg.wallThickness)};
  }
  updateCamera(camera,dt){camera.follow(this.player.x,this.player.y,dt);camera.update(dt);}
}

const STATE={
  TITLE:'title',SETTINGS:'settings',CUTSCENE:'cutscene',
  PLAYING:'playing',PAUSED:'paused',ELEVATOR:'elevator',
  BASEMENT:'basement',BASEMENT_NPC:'basement_npc',
  FLOOR_SELECT:'floor_select',DEATH:'death',TBC:'tbc'

/* ==================== §16 渲染器 ==================== */
const COLORBLIND_MAP={'#D9534F':'#FF8C42','#FFD75E':'#FFE082','#8C1F1F':'#B85A1A','#6FCF97':'#7BDFF2','#00BCD4':'#FFE082','#E8A8BF':'#B0E0E6'};

class Renderer{
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.dpr=1;this.W=0;this.H=0;this.uiScale=1;
    this.colors=null;this._titleParticles=null;
  }
  resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    this.dpr=dpr;
    const w=Math.floor(window.innerWidth*dpr),h=Math.floor(window.innerHeight*dpr);
    this.canvas.width=w;this.canvas.height=h;
    this.canvas.style.width=window.innerWidth+'px';
    this.canvas.style.height=window.innerHeight+'px';
    this.W=w;this.H=h;
    return{w,h,dpr};
  }
  refreshColors(cfg){
    const cb=Settings.get('a11y.colorblind');
    this.colors={...cfg.colors};
    if(cb)for(const k in this.colors){const v=this.colors[k];if(typeof v==='string'&&COLORBLIND_MAP[v])this.colors[k]=COLORBLIND_MAP[v];}
  }
  setUiScale(s){this.uiScale=s||1;document.documentElement.style.setProperty('--ui-scale',String(s||1));}

  drawWorld(world,player,camera,fog,game){
    if(!world||!player||!camera||!fog)return;
    if(!this.colors)this.refreshColors(world.cfg);
    const ctx=this.ctx,W=this.W,H=this.H;
    const C=this.colors||world.cfg.colors;
    ctx.fillStyle=C.fog;ctx.fillRect(0,0,W,H);
    this._drawGround(ctx,world,camera,W,H,C);
    this._drawWalls(ctx,world,camera,W,H,C);
    this._drawPillars(ctx,world,camera,W,H,C);
    this._drawElevator(ctx,world,camera,W,H,C);
    this._drawLandmarks(ctx,world,camera,W,H,C);
    this._drawLogs(ctx,world,player,camera,W,H,C);
    this._drawVisitors(ctx,world,player,camera,W,H,C);
    this._drawEnemies(ctx,world,player,camera,W,H,C);
    this._drawEnemyBullets(ctx,game,camera,W,H);
    this._drawBullets(ctx,game,camera,W,H);
    this._drawPlayer(ctx,player,camera,W,H,C);
    fog.draw(ctx,camera,W,H);
    this._drawLampGlow(ctx,world,camera,W,H,C);
    if(world.layerId===2)this._drawWindParticles(ctx,camera,W,H);
    if(game&&game.toolSystem.id==='scanner'&&game.toolSystem.active&&world.layerId===1){
      this._drawScanCone(ctx,player,camera,W,H,game.toolSystem);
      this._drawFocusOverlay(ctx,player,camera,W,H,game.toolSystem);
    }
    if(game)this._drawInteractPrompt(ctx,world,player,camera,W,H,game);
    if(player.hurtFlash>0){
      ctx.fillStyle=`rgba(217,83,79,${player.hurtFlash*0.5})`;
      ctx.fillRect(0,0,W,H);
    }
    if(player.san<player.sanMax*0.5){
      const k=1-player.san/(player.sanMax*0.5);
      ctx.fillStyle=`rgba(120,30,140,${0.06*k})`;
      ctx.fillRect(0,0,W,H);
      if(Math.random()<0.5){
        ctx.fillStyle=`rgba(255,255,255,${0.04*k})`;
        for(let i=0;i<3;i++)ctx.fillRect(Math.random()*W,Math.random()*H,2,2);
      }
    }
    if(Settings.get('video.vignette'))this._drawVignette(ctx,W,H);
  }
  _drawGround(ctx,world,camera,W,H,C){
    const z=camera.zoom,s=world.size;
    const tl=camera.worldToScreen(0,0,W,H);
    ctx.fillStyle=C.floor;ctx.fillRect(tl.x,tl.y,s*z,s*z);
    const g=3;
    const hw=W/z/2+4,hh=H/z/2+4;
    const gx0=Math.max(0,Math.floor((camera.x-hw)/g)),gy0=Math.max(0,Math.floor((camera.y-hh)/g));
    const gx1=Math.min(Math.ceil(s/g),Math.ceil((camera.x+hw)/g)),gy1=Math.min(Math.ceil(s/g),Math.ceil((camera.y+hh)/g));
    for(let gy=gy0;gy<gy1;gy++){
      for(let gx=gx0;gx<gx1;gx++){
        const n=Utils.hash2(gx,gy,world.seed^0x51ED);
        if(n<0.5)continue;
        const p=camera.worldToScreen(gx*g,gy*g,W,H);
        ctx.fillStyle=n<0.68?C.floorAlt:C.floorDeep;
        ctx.fillRect(p.x,p.y,g*z+1,g*z+1);
      }
    }
    ctx.fillStyle=world.cfg.ambient||'rgba(255,248,220,0.10)';
    const ls=24;
    const ly0=Math.max(0,Math.floor((camera.y-hh)/ls)),ly1=Math.min(Math.ceil(s/ls),Math.ceil((camera.y+hh)/ls));
    for(let ly=ly0;ly<=ly1;ly++){
      const wy=ly*ls;
      if(wy>s)continue;
      const p0=camera.worldToScreen(0,wy,W,H),p1=camera.worldToScreen(s,wy,W,H);
      ctx.fillRect(p0.x,p0.y-1,p1.x-p0.x,Math.max(2,z*0.08));
    }
  }
  _drawWalls(ctx,world,camera,W,H,C){
    const z=camera.zoom;
    const hw=W/(2*z)+4,hh=H/(2*z)+4;
    const cx=camera.x,cy=camera.y;
    ctx.lineWidth=Math.max(1,z*0.05);
    for(const w of world.walls){
      if(w.x+w.w<cx-hw||w.x>cx+hw||w.y+w.h<cy-hh||w.y>cy+hh)continue;
      const p=camera.worldToScreen(w.x,w.y,W,H);
      const pw=w.w*z,ph=w.h*z;
      ctx.fillStyle=C.wall;ctx.fillRect(p.x,p.y,pw,ph);
      ctx.fillStyle=C.wallTop;ctx.fillRect(p.x,p.y,pw,Math.max(1,ph*0.22));
      ctx.strokeStyle=C.wallEdge;ctx.strokeRect(p.x+0.5,p.y+0.5,pw-1,ph-1);
    }
  }
  _drawPillars(ctx,world,camera,W,H,C){
    const z=camera.zoom;
    const hw=W/(2*z)+3,hh=H/(2*z)+3;
    const cx=camera.x,cy=camera.y;
    const lw=Math.max(1,z*0.05);
    for(const p of world.pillars){
      if(p.x+p.r<cx-hw||p.x-p.r>cx+hw||p.y+p.r<cy-hh||p.y-p.r>cy+hh)continue;
      const s=camera.worldToScreen(p.x,p.y,W,H);
      const R=p.r*z;
      ctx.fillStyle='rgba(0,0,0,0.42)';
      ctx.beginPath();ctx.ellipse(s.x+R*0.18,s.y+R*0.25,R*1.02,R*0.88,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=C.pillar;
      ctx.beginPath();ctx.arc(s.x,s.y,R,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.10)';
      ctx.beginPath();ctx.arc(s.x-R*0.28,s.y-R*0.32,R*0.55,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=C.pillarEdge;ctx.lineWidth=lw;
      ctx.beginPath();ctx.arc(s.x,s.y,R,0,Math.PI*2);ctx.stroke();
    }
  }
  _drawElevator(ctx,world,camera,W,H,C){
    const e=world.elevator;if(!e)return;
    const z=camera.zoom;
    const s=camera.worldToScreen(e.x,e.y,W,H);
    const R=e.r*z;
    const tm=performance.now()/1000;
    const rm=Settings.get('a11y.reduceMotion');
    if(e.unlocked){
      const pulse=rm?1:0.85+0.15*Math.sin(tm*2.4);
      const g=ctx.createRadialGradient(s.x,s.y,R*0.4,s.x,s.y,R*4.5*pulse);
      g.addColorStop(0,'rgba(0,188,212,0.35)');g.addColorStop(1,'rgba(0,188,212,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,R*4.5*pulse,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#242A30';ctx.beginPath();ctx.arc(s.x,s.y,R,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(s.x,s.y);
    ctx.strokeStyle=e.unlocked?'#00BCD4':'rgba(0,188,212,0.35)';
    ctx.lineWidth=Math.max(2,z*0.1);
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2-Math.PI/2;
      const px=Math.cos(a)*R*0.85,py=Math.sin(a)*R*0.85;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.stroke();
    ctx.fillStyle='#3A4048';ctx.fillRect(-R*0.5,-R*0.55,R*1.0,R*1.1);
    const dOpen=rm?0.2:0.15+0.15*(0.5+0.5*Math.sin(tm*0.8));
    ctx.fillStyle='#0A0C0E';
    ctx.fillRect(-R*0.5,-R*0.55,R*dOpen,R*1.1);
    ctx.fillRect(R*0.5-R*dOpen,-R*0.55,R*dOpen,R*1.1);
    ctx.fillStyle=e.unlocked?'#00BCD4':'rgba(0,188,212,0.35)';
    ctx.beginPath();ctx.arc(0,0,R*0.12,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  _drawLandmarks(ctx,world,camera,W,H,C){
    const z=camera.zoom;
    const tm=performance.now()/1000;
    const rm=Settings.get('a11y.reduceMotion');
    const amp=rm?0:0.1;
    for(const lm of world.landmarks){
      const s=camera.worldToScreen(lm.x,lm.y,W,H);
      const R=lm.r*z;
      if(lm.type==='lamp_tower'){
        const pulse=0.9+amp*Math.sin(tm*2.1);
        const grad=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R*4.2*pulse);
        grad.addColorStop(0,'rgba(255,248,220,0.55)');
        grad.addColorStop(0.4,'rgba(255,248,220,0.16)');
        grad.addColorStop(1,'rgba(255,248,220,0)');
        ctx.fillStyle=grad;ctx.beginPath();ctx.arc(s.x,s.y,R*4.2*pulse,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#F0E8C8';ctx.beginPath();ctx.arc(s.x,s.y,R,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=C.accent;ctx.lineWidth=Math.max(1.5,z*0.08);
        ctx.beginPath();ctx.arc(s.x,s.y,R*1.45,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle=C.accent;ctx.beginPath();ctx.arc(s.x,s.y,R*0.32,0,Math.PI*2);ctx.fill();
      } else if(lm.type==='storm_altar'){
        const pulse=0.9+amp*Math.sin(tm*1.5);
        for(let i=3;i>=1;i--){
          const gg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R*2.5*i*pulse);
          gg.addColorStop(0,`rgba(232,168,191,${0.10*i})`);
          gg.addColorStop(1,'rgba(232,168,191,0)');
          ctx.fillStyle=gg;
          ctx.beginPath();ctx.arc(s.x,s.y,R*2.5*i*pulse,0,Math.PI*2);ctx.fill();
        }
        ctx.strokeStyle='rgba(232,168,191,0.85)';
        ctx.lineWidth=Math.max(2,z*0.1);
        for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(s.x,s.y,R*(0.6+i*0.5),0,Math.PI*2);ctx.stroke();}
        ctx.fillStyle='#E8A8BF';
        ctx.beginPath();ctx.arc(s.x,s.y,R*0.4,0,Math.PI*2);ctx.fill();
        if(!rm){
          ctx.save();
          ctx.translate(s.x,s.y);ctx.rotate(tm*1.2);
          ctx.strokeStyle='rgba(232,168,191,0.5)';ctx.lineWidth=Math.max(2,z*0.08);
          for(let i=0;i<4;i++){
            ctx.beginPath();ctx.moveTo(0,0);
            ctx.lineTo(Math.cos(i*Math.PI/2)*R*2.2,Math.sin(i*Math.PI/2)*R*2.2);
            ctx.stroke();
          }
          ctx.restore();
        }
      } else if(lm.type==='node'){
        ctx.strokeStyle='rgba(217,83,79,0.35)';
        ctx.lineWidth=Math.max(1,z*0.05);
        ctx.setLineDash([z*0.4,z*0.3]);
        ctx.beginPath();ctx.arc(s.x,s.y,R,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  _drawLampGlow(ctx,world,camera,W,H,C){
    const lm=world.landmarks.find(l=>l.type==='lamp_tower'||l.type==='storm_altar');
    if(!lm)return;
    const s=camera.worldToScreen(lm.x,lm.y,W,H);
    const R=lm.r*camera.zoom;
    const tm=performance.now()/1000;
    const rm=Settings.get('a11y.reduceMotion');
    const pulse=rm?1:0.9+0.1*Math.sin(tm*1.7);
    const col=lm.type==='storm_altar'?'rgba(232,168,191,':'rgba(255,248,220,';
    const grad=ctx.createRadialGradient(s.x,s.y,R*0.6,s.x,s.y,R*9*pulse);
    grad.addColorStop(0,col+'0.20)');
    grad.addColorStop(0.5,col+'0.06)');
    grad.addColorStop(1,col+'0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(s.x,s.y,R*9*pulse,0,Math.PI*2);ctx.fill();
  }
  _drawWindParticles(ctx,camera,W,H){
    const rm=Settings.get('a11y.reduceMotion');
    if(rm)return;
    const t=performance.now()/1000;
    ctx.strokeStyle='rgba(232,168,191,0.18)';
    ctx.lineWidth=Math.max(1,this.dpr);
    for(let i=0;i<40;i++){
      const seed=i*137.5;
      const phase=(t*0.5+seed*0.013)%1;
      const offsetX=(seed*11)%1;
      const offsetY=(seed*17)%1;
      const x=(offsetX+phase*0.6)%1*W;
      const y=(offsetY+phase*0.15)%1*H;
      const len=30+Math.sin(seed)*20;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-len,y+len*0.3);ctx.stroke();
    }
  }
  _drawLogs(ctx,world,player,camera,W,H,C){
    const z=camera.zoom;
    const tm=performance.now()/1000;
    const rm=Settings.get('a11y.reduceMotion');
    for(const l of world.logs){
      if(l.picked)continue;
      const d=Utils.dist(l.x,l.y,player.x,player.y);
      if(d>40)continue;
      if(!world.isVisible(l.x,l.y)&&d>8)continue;
      const s=camera.worldToScreen(l.x,l.y,W,H);
      const R=0.35*z;
      const pulse=rm?1:0.85+0.15*Math.sin(tm*2.2+l.wobble);
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R*6*pulse);
      g.addColorStop(0,'rgba(0,188,212,0.35)');

      g.addColorStop(1,'rgba(0,188,212,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,R*6*pulse,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#E8E0C0';
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.sin(tm*0.6+l.wobble)*0.15);
      ctx.fillRect(-R,-R*1.3,R*2,R*2.6);
      ctx.strokeStyle='#0A0906';ctx.lineWidth=Math.max(1,z*0.04);
      ctx.strokeRect(-R,-R*1.3,R*2,R*2.6);
      ctx.restore();
      if(d<15){
        const wave=rm?0:Math.sin(tm*3+l.wobble)*R*0.2;
        ctx.fillStyle='rgba(0,188,212,0.9)';
        ctx.beginPath();
        ctx.moveTo(s.x,s.y-R*2.6+wave);
        ctx.lineTo(s.x-R*0.4,s.y-R*3.3+wave);
        ctx.lineTo(s.x+R*0.4,s.y-R*3.3+wave);

  _drawVisitors(ctx,world,player,camera,W,H,C){
    const z=camera.zoom;
    const tm=performance.now()/1000;
    const rm=Settings.get('a11y.reduceMotion');
    for(const v of world.visitors){
      if(v.state==='rescued')continue;
      const d=Utils.dist(v.x,v.y,player.x,player.y);
      if(d>CONFIG.gameplay.visitors.scanRadius+6)continue;
      if(!world.isVisible(v.x,v.y)&&d>4)continue;
      const s=camera.worldToScreen(v.x,v.y,W,H);
      const R=0.5*z;
      if(v.state==='exploded'){
        if(v.explodeFlash>0){
          const a=v.explodeFlash/0.5;
          const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R*8*a);
          g.addColorStop(0,`rgba(255,180,80,${a*0.8})`);
          g.addColorStop(0.4,`rgba(217,83,79,${a*0.5})`);
          g.addColorStop(1,'rgba(217,83,79,0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,R*8*a,0,Math.PI*2);ctx.fill();
        }
        continue;
      }
      let body='#B8B098';
      if(v.revealed)body=v.type==='real'?'#6FCF97':'#D9534F';
      if(v.state==='sizzling'){const f=0.5+0.5*Math.sin(tm*20);body=`rgba(217,83,79,${0.5+0.5*f})`;}
      else if(v.state==='charging')body='#D9534F';
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.beginPath();ctx.ellipse(s.x+R*0.2,s.y+R*0.35,R*0.95,R*0.7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=body;
      ctx.beginPath();ctx.arc(s.x,s.y,R,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#1A1810';ctx.lineWidth=Math.max(1,z*0.05);
      ctx.beginPath();ctx.arc(s.x,s.y,R,0,Math.PI*2);ctx.stroke();
      if(!v.revealed){
        const wave=rm?0:Math.sin(tm*3+v.sosPhase)*R*0.15;
        ctx.strokeStyle='rgba(255,215,94,0.55)';ctx.lineWidth=Math.max(1,z*0.04);
        const rr=R*1.5+wave;
        ctx.beginPath();ctx.arc(s.x,s.y-R*2.2,rr*0.5,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.arc(s.x,s.y-R*2.2,rr*0.75,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='rgba(255,215,94,0.9)';
        ctx.beginPath();
        ctx.moveTo(s.x,s.y-R*2.7+wave);
        ctx.lineTo(s.x-R*0.32,s.y-R*3.15+wave);
        ctx.lineTo(s.x+R*0.32,s.y-R*3.15+wave);
        ctx.closePath();ctx.fill();
      }
      if(v.revealed){
        const sym=v.type==='real'?'✓':'!';
        const col=v.type==='real'?'#6FCF97':'#D9534F';
        const sz=Math.max(9,z*0.42);
        const yo=R*2.0;
        ctx.font=`700 ${sz}px 'Noto Sans SC',sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='rgba(10,9,6,0.7)';
        ctx.beginPath();ctx.arc(s.x,s.y-yo,sz*0.68,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,z*0.04);
        ctx.beginPath();ctx.arc(s.x,s.y-yo,sz*0.68,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle=col;
        ctx.fillText(sym,s.x,s.y-yo+1);
      }
      if(v.scanProgress>0&&v.scanProgress<1){
        const rr=R*1.8;
        ctx.strokeStyle='rgba(212,206,176,0.25)';ctx.lineWidth=Math.max(2,z*0.06);
        ctx.beginPath();ctx.arc(s.x,s.y,rr,0,Math.PI*2);ctx.stroke();
        ctx.strokeStyle='#FFD75E';ctx.lineWidth=Math.max(2,z*0.08);
        ctx.beginPath();ctx.arc(s.x,s.y,rr,-Math.PI/2,-Math.PI/2+Math.PI*2*v.scanProgress);ctx.stroke();
      }
    }
  }
  _drawEnemies(ctx,world,player,camera,W,H,C){

      ctx.fillStyle=e.type==='patrol'?'#B84A52':'#7A3A48';

      if(e.hp<e.hpMax){

  _drawScanCone(ctx,player,camera,W,H,scanner){
    const z=camera.zoom;

    ctx.strokeStyle='rgba(255,215,94,0.5)';ctx.lineWidth=Math.max(1,z*0.04);

    ctx.moveTo(0,0);ctx.lineTo(Math.cos(half)*maxR,Math.sin(half)*maxR);

  _drawFocusOverlay(ctx,player,camera,W,H,scanner){
    if(!scanner.focusTarget||scanner.focusProgress<0.3)return;
    const dpr=this.dpr;
    const s=camera.worldToScreen(scanner.focusTarget.x,scanner.focusTarget.y,W,H);
    const k=Utils.clamp((scanner.focusProgress-0.3)/0.7,0,1);
    ctx.save();
    ctx.strokeStyle=`rgba(255,215,94,${0.4+0.3*k})`;
    ctx.lineWidth=1.5*dpr;
    const rr=(22+10*k)*dpr;
    ctx.beginPath();ctx.arc(s.x,s.y,rr,0,Math.PI*2);ctx.stroke();
    const cLen=(10+6*k)*dpr;
    const gap=rr+4*dpr;
    const corners=[
      [s.x-gap-cLen,s.y-gap,s.x-gap,s.y-gap,s.x-gap,s.y-gap-cLen],
      [s.x+gap,s.y-gap,s.x+gap+cLen,s.y-gap,s.x+gap,s.y-gap-cLen],
      [s.x-gap-cLen,s.y+gap,s.x-gap,s.y+gap,s.x-gap,s.y+gap+cLen],
      [s.x+gap,s.y+gap,s.x+gap+cLen,s.y+gap,s.x+gap,s.y+gap+cLen]
    ];
    for(const c of corners){
      ctx.beginPath();
      ctx.moveTo(c[0],c[1]);ctx.lineTo(c[2],c[3]);
      ctx.moveTo(c[2],c[3]);ctx.lineTo(c[4],c[5]);
      ctx.stroke();
    }
    ctx.font=`500 ${10*dpr*this.uiScale}px 'SF Mono',monospace`;
    ctx.fillStyle=`rgba(255,215,94,${0.6+0.4*k})`;
    ctx.textAlign='left';ctx.textBaseline='top';
    const lines=[
      `FOCUS ${(scanner.focusProgress*100).toFixed(0)}%`,
      scanner.focusTarget.revealed?(scanner.focusTarget.type==='real'?'ID CONFIRMED':'ID HOSTILE'):'ID ANALYZING...'
    ];
    for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],s.x+rr+12*dpr,s.y-10*dpr+i*14*dpr);
    ctx.restore();
  }

  drawTitle(ts,tm){

  _drawTitleParticles(ctx,W,H,dpr){
    const tm=performance.now()/1000;
    const rm=Settings.get('a11y.reduceMotion');
    if(!this._titleParticles){
      this._titleParticles=[];
      for(let i=0;i<90;i++)this._titleParticles.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.008,vy:-0.008-Math.random()*0.02,r:0.4+Math.random()*1.6,a:0.15+Math.random()*0.5,ph:Math.random()*Math.PI*2});
    }
    for(const p of this._titleParticles){
      const sp=rm?0.15:0.5;
      const px=((p.x+p.vx*tm*sp)%1+1)%1*W;
      const py=((p.y+p.vy*tm*sp)%1+1)%1*H;
      const f=rm?0.7:0.6+0.4*Math.sin(tm*2+p.ph);
      ctx.fillStyle=`rgba(217,83,79,${p.a*f*0.55})`;
      ctx.beginPath();ctx.arc(px,py,p.r*dpr,0,Math.PI*2);ctx.fill();
    }
  }
  drawCutscene(c){
    if(!c)return;
    const ctx=this.ctx,W=this.W,H=this.H,dpr=this.dpr,us=this.uiScale;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    const a=c.fadeAlpha;
    if(a<=0.001)return;
    ctx.globalAlpha=a;
    const line=c.currentLine;
    if(!line){ctx.globalAlpha=1;return;}
    const ts=Math.min(W,H)*0.022*us;
    ctx.font=`${line.bold?'600':'400'} ${ts}px 'Noto Sans SC',sans-serif`;
    ctx.textAlign=line.align==='left'?'left':'center';ctx.textBaseline='middle';
    const mw=Math.min(W*0.72,900*dpr);
    const lines=Utils.wrapText(ctx,line.text,mw);
    const lh=ts*1.6;
    const sy=H*(line.y||0.5)-(lines.length-1)*lh*0.5;
    const sx=line.align==='left'?W*0.14:W*0.5;
    ctx.fillStyle=line.color||'#E8E0C0';
    for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],sx,sy+i*lh);
    if(c.typing&&c.cursorVisible){
      const last=lines[lines.length-1]||'';
      const lw=ctx.measureText(last).width;
      const cx=line.align==='left'?sx+lw:W*0.5+lw*0.5;
      const cy=sy+(lines.length-1)*lh;
      ctx.fillRect(cx+4*dpr,cy-ts*0.35,ts*0.5,ts*0.7);
    }
    ctx.globalAlpha=1;ctx.textAlign='center';
  }

  drawSettings(state,tm){
    const ctx=this.ctx,W=this.W,H=this.H,dpr=this.dpr,us=this.uiScale;
    ctx.fillStyle='rgba(5,4,3,0.94)';ctx.fillRect(0,0,W,H);

    ctx.fillStyle='rgba(10,9,6,0.9)';ctx.fillRect(px,py,pw,ph);
    ctx.strokeStyle='rgba(212,206,176,0.16)';ctx.lineWidth=1.5*dpr;
    ctx.strokeRect(px+0.5,py+0.5,pw-1,ph-1);
    ctx.fillStyle='#D9534F';ctx.fillRect(px,py,4*dpr,ph);
    ctx.textAlign='left';ctx.textBaseline='middle';
    const pad=32*dpr;
    ctx.font=`600 ${28*dpr*us}px 'Noto Sans SC',sans-serif`;
    ctx.fillStyle='#F0E8C8';
    ctx.fillText(t('settings.title'),px+pad,py+44*dpr);
    ctx.font=`400 ${11*dpr*us}px 'Noto Sans SC',sans-serif`;
    ctx.fillStyle='rgba(212,206,176,0.4)';ctx.letterSpacing='6px';
    ctx.fillText(t('settings.subtitle'),px+pad,py+68*dpr);
    ctx.letterSpacing='0px';
    const listTop=py+108*dpr;
    const rowH=38*dpr*us;
    const items=state.items;
    const sel=state.selectedIndex;
    const maxRows=Math.floor((py+ph-80*dpr-listTop)/rowH);
    const scrollRow=Math.max(0,Math.min(sel-Math.floor(maxRows/2),Math.max(0,items.length-maxRows)));
    ctx.save();
    ctx.beginPath();ctx.rect(px,listTop,pw,maxRows*rowH+20*dpr);ctx.clip();
    for(let i=0;i<items.length;i++){
      const it=items[i];
      const y=listTop+(i-scrollRow)*rowH+rowH*0.5;
      if(y<listTop-rowH||y>listTop+maxRows*rowH+rowH)continue;
      const isSel=i===sel;
      if(isSel){
        ctx.fillStyle='rgba(217,83,79,0.14)';
        ctx.fillRect(px+pad*0.5,y-rowH*0.45,pw-pad,rowH*0.9);
        ctx.fillStyle='#D9534F';

      }

      ctx.textAlign='left';
      ctx.fillText(t('settings.'+it.path),px+pad,y);
      ctx.textAlign='right';
      const rX=px+pw-40*dpr;
      if(it.type==='slider'){
        const v=Settings.get(it.path)??0;
        const pct=(v-it.min)/(it.max-it.min);
        const bw=200*dpr;
        const bx=rX-bw-50*dpr;
        ctx.fillStyle='rgba(212,206,176,0.15)';ctx.fillRect(bx,y-3*dpr,bw,6*dpr);
        ctx.fillStyle=isSel?'#D9534F':'rgba(217,83,79,0.6)';ctx.fillRect(bx,y-3*dpr,bw*pct,6*dpr);
        ctx.fillStyle=isSel?'#F0E8C8':'#B8B098';
        ctx.beginPath();ctx.arc(bx+bw*pct,y,5*dpr,0,Math.PI*2);ctx.fill();
        ctx.font=`400 ${12*dpr*us}px 'SF Mono',monospace`;
        ctx.fillStyle=isSel?'#F0E8C8':'rgba(212,206,176,0.6)';
        ctx.fillText(`${Math.round(pct*100)}%`,rX,y);
      } else if(it.type==='toggle'){
        const v=Settings.get(it.path);
        ctx.font=`500 ${13*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillStyle=v?(isSel?'#F0E8C8':'#D4CEB0'):'rgba(212,206,176,0.4)';

        ctx.strokeRect(bx-1,y-9*dpr,18*dpr,18*dpr);
        if(v){ctx.fillStyle='#D9534F';ctx.fillRect(bx+3*dpr,y-5*dpr,11*dpr,11*dpr);}
        ctx.textAlign='left';
        ctx.fillText(v?t('common.on'):t('common.off'),bx+26*dpr,y);
      } else if(it.type==='option'){
        const cur=Settings.get(it.path);
        const lk=(it.optionLabels&&it.optionLabels[cur])||cur;
        ctx.font=`500 ${13*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillStyle=isSel?'#F0E8C8':'rgba(212,206,176,0.75)';
        ctx.fillText('◀ '+t(lk)+' ▶',rX,y);
      }

    ctx.restore();
    ctx.textAlign='center';
    ctx.font=`400 ${Math.min(W,H)*0.012*us}px 'Noto Sans SC',sans-serif`;
    ctx.fillStyle='rgba(212,206,176,0.5)';

  drawDeath(ds,tm,saveData){

    const ts=Math.min(W,H)*0.075*us;
    ctx.font=`900 ${ts}px 'Noto Sans SC',sans-serif`;
    ctx.fillStyle=`rgba(217,83,79,${sub})`;
    ctx.shadowColor='#D9534F';ctx.shadowBlur=50*dpr*sub;

        {text:t('death.lost.map')+`  −${lost.map.toFixed(1)}%`,color:'#D9534F'},
        {text:t('death.lost.logs')+`  −${lost.logs}`,color:'#D9534F'},
        {text:t('death.saved')+`  ${saveData.credits} C`,color:'#6FCF97'}

      const sy=H*0.56;

  drawBasement(basement,camera,tm,game){
    const ctx=this.ctx,W=this.W,H=this.H,dpr=this.dpr;
    ctx.fillStyle='#050403';ctx.fillRect(0,0,W,H);
    const z=camera.zoom;
    const tl=camera.worldToScreen(0,0,W,H);
    const rw=basement.width*z,rh=basement.height*z;
    ctx.fillStyle='#26241C';ctx.fillRect(tl.x,tl.y,rw,rh);
    ctx.strokeStyle='rgba(60,55,42,0.5)';ctx.lineWidth=Math.max(0.5,z*0.02);
    for(let gx=0;gx<=basement.width;gx+=1.5){
      const p=camera.worldToScreen(gx,0,W,H);
      ctx.beginPath();ctx.moveTo(p.x,tl.y);ctx.lineTo(p.x,tl.y+rh);ctx.stroke();
    }
    for(let gy=0;gy<=basement.height;gy+=1.5){
      const p=camera.worldToScreen(0,gy,W,H);
      ctx.beginPath();ctx.moveTo(tl.x,p.y);ctx.lineTo(tl.x+rw,p.y);ctx.stroke();
    }
    for(const lx of [4,9,13,17,22]){
      const s=camera.worldToScreen(lx,0.5,W,H);
      const fl=0.9+0.1*Math.sin(tm*3+lx);
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,z*6*fl);
      g.addColorStop(0,`rgba(255,220,150,${0.12*fl})`);
      g.addColorStop(1,'rgba(255,220,150,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,z*6*fl,0,Math.PI*2);ctx.fill();
    }
    for(const f of basement.furniture){
      const p=camera.worldToScreen(f.x,f.y,W,H);
      const pw=f.w*z,ph=f.h*z;
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(p.x+4*dpr,p.y+4*dpr,pw,ph);
      if(f.type==='table'){

    const p=basement.player;

    ctx.strokeStyle='#D4CEB0';ctx.lineWidth=Math.max(2,z*0.1);
    ctx.beginPath();ctx.moveTo(ps.x,ps.y);
    ctx.lineTo(ps.x+Math.cos(p.aimAngle)*pR*1.7,ps.y+Math.sin(p.aimAngle)*pR*1.7);
    ctx.stroke();
    ctx.fillStyle='#E8E0C0';
    ctx.beginPath();ctx.arc(ps.x,ps.y,pR*0.55,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#0A0906';ctx.lineWidth=Math.max(1.5,z*0.05);
    ctx.beginPath();ctx.arc(ps.x,ps.y,pR,0,Math.PI*2);ctx.stroke();
    if(basement.nearNPC){

      const text='E · '+t(npc.nameKey);
