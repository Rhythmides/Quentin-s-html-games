        ctx.fillStyle=selected?'#F0E8C8':'rgba(212,206,176,0.85)';ctx.font=`600 ${14*dpr*us}px 'Noto Sans SC',sans-serif`;ctx.textAlign='left';
        ctx.fillText(t(cfg.name),px+pad+16*dpr,rowY+22*dpr*us);
        ctx.fillStyle='rgba(212,206,176,0.5)';ctx.font=`400 ${11*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillText(t(cfg.desc),px+pad+16*dpr,rowY+40*dpr*us);
        const dx=px+pad+16*dpr,dy=rowY+52*dpr*us;
        for(let d=0;d<cfg.max;d++){ctx.fillStyle=d<lvl?(selected?'#D9534F':'rgba(217,83,79,0.8)'):'rgba(212,206,176,0.15)';ctx.beginPath();ctx.arc(dx+d*10*dpr,dy,3*dpr,0,Math.PI*2);ctx.fill();}
        ctx.textAlign='right';
        if(maxed){ctx.fillStyle='#6FCF97';ctx.font=`600 ${13*dpr*us}px 'Noto Sans SC',sans-serif`;ctx.fillText(t('up.max'),px+pw-pad,rowY+30*dpr*us);}
        else{ctx.fillStyle=can?'#FFD75E':'#D9534F';ctx.font=`700 ${15*dpr*us}px 'SF Mono',monospace`;ctx.fillText(`${Utils.fmtNum(cost)} C`,px+pw-pad,rowY+24*dpr*us);ctx.fillStyle='rgba(212,206,176,0.4)';ctx.font=`400 ${10*dpr*us}px 'Noto Sans SC',sans-serif`;ctx.fillText(t('up.buy'),px+pw-pad,rowY+42*dpr*us);}
        ctx.textAlign='left';
      }
    } else {
      const keys=['ammo','medkit','adrenaline','sedative'],listH=64*dpr*us;
      const ammoMax=getAmmoMax(sd.upgrades);
      for(let i=0;i<keys.length;i++){
        const k=keys[i],cfg=CONFIG.gameplay.supplies[k],selected=i===game.wagnerSupplySelectedIndex;
        const can=sd.credits>=cfg.cost,rowY=y+i*listH;
        if(selected){const bg=ctx.createLinearGradient(px+pad,0,px+pw-pad,0);bg.addColorStop(0,'rgba(217,83,79,0.16)');bg.addColorStop(1,'rgba(217,83,79,0)');ctx.fillStyle=bg;ctx.fillRect(px+pad,rowY,pw-pad*2,listH-6*dpr);ctx.fillStyle='#D9534F';ctx.fillRect(px+pad,rowY,3*dpr,listH-6*dpr);}
        ctx.fillStyle=selected?'#F0E8C8':'rgba(212,206,176,0.85)';ctx.font=`600 ${14*dpr*us}px 'Noto Sans SC',sans-serif`;ctx.textAlign='left';
        ctx.fillText(t(cfg.name),px+pad+16*dpr,rowY+22*dpr*us);
        ctx.fillStyle='rgba(212,206,176,0.5)';ctx.font=`400 ${11*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillText(t(cfg.desc),px+pad+16*dpr,rowY+40*dpr*us);
        let owned='';
        if(k==='ammo')owned=`${sd.inventory.ammo||0} / ${ammoMax}`;
        else owned=`×${sd.inventory[k]||0}`;
        ctx.textAlign='right';ctx.fillStyle='rgba(0,188,212,0.8)';ctx.font=`500 ${12*dpr*us}px 'SF Mono',monospace`;
        ctx.fillText(owned,px+pw-pad,rowY+20*dpr*us);
        ctx.fillStyle=can?'#FFD75E':'#D9534F';ctx.font=`700 ${15*dpr*us}px 'SF Mono',monospace`;
        ctx.fillText(`${Utils.fmtNum(cfg.cost)} C`,px+pw-pad,rowY+42*dpr*us);
        ctx.fillStyle='rgba(212,206,176,0.4)';ctx.font=`400 ${10*dpr*us}px 'Noto Sans SC',sans-serif`;
        ctx.fillText(t('sup.buy'),px+pw-pad,rowY+56*dpr*us);ctx.textAlign='left';
      }
    }
    ctx.textAlign='center';ctx.fillStyle='rgba(212,206,176,0.4)';ctx.font=`400 ${10*dpr*us}px 'Noto Sans SC',sans-serif`;
    ctx.fillText(t('wagner.tab.hint'),px+pw*0.5,cY+cH+30*dpr);
  }
}

/* ==================== §17 主游戏 ==================== */
class Game{
  constructor(){
    Settings.init();
    this.canvas=document.getElementById('game');
    this.renderer=new Renderer(this.canvas);
    this.camera=new Camera();
    this.input=new Input(this.canvas);
    this.audio=new AudioEngine();
    this.toolSystem=new ToolSystem();

    this.state=STATE.TITLE;
    this._stateTime=0;
    this._lastDt=1/60;

    this.saveData=Save.read();
    this.currentLayerId=1;
    this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set(),killedCount:0,scannedPoints:new Set()};

    this.titleScreen={selectedIndex:0,menu:[{key:'menu.start',action:'start'},{key:'menu.continue',action:'continue',disabled:!Save.has()},{key:'menu.settings',action:'settings'}]};
    this.pauseMenu={selectedIndex:0,items:[{key:'pause.resume',action:'resume'},{key:'pause.settings',action:'settings'},{key:'pause.mainmenu',action:'title'}]};
    this.settingsMenu={items:SETTINGS_ITEMS,selectedIndex:0,returnState:STATE.TITLE};
    this.elevatorMenu={selectedIndex:0,items:[]};
    this.floorSelectMenu={selectedIndex:0,items:[],returnState:null};
    this.deathState={t:0,lost:{rescue:0,map:0,logs:0,kill:0}};

    this.basement=null;
    this.basementUpgradeSelectedIndex=0;
    this.wagnerTabIndex=0;
    this.wagnerSupplySelectedIndex=0;
    this.archiveTabIndex=0;
    this.archiveLogIndex=0;
    this._activeNPCId=null;

    this.world=null;this.player=null;this.fog=null;
    this.bullets=[];this.enemyBullets=[];
    this.boss=null;this.phase2Triggered=false;

    const radarEl=document.getElementById('radar');
    this.radar=radarEl?new Radar(radarEl):null;

    const $=(id)=>document.getElementById(id);
    const $q=(s)=>document.querySelector(s);
    this.hud={
      root:$('hud'),hp:$q('#bar-hp .bar-fill'),san:$q('#bar-san .bar-fill'),sta:$q('#bar-sta .bar-fill'),
      sanBar:$('bar-san'),sanVig:$('san-vignette'),
      objTitle:$('obj-title-text'),objMain:$('obj-main-text'),
      progress:$('obj-progress'),rescue:$('obj-rescue'),logs:$('obj-logs'),scan:$('obj-scan'),
      fps:$('dbg-fps'),pos:$('dbg-pos'),crosshair:$('crosshair'),hint:$('hint'),
      wname:$('wname-text'),wammo:$('wammo-text'),
      countMedkit:$('count-medkit'),countAdren:$('count-adren'),countSed:$('count-sed'),
      layerTag:$('layer-tag')
    };

    this._lastVisX=Infinity;this._lastVisY=Infinity;
    this._firstUpdate=true;
    this._fpsFrames=0;this._fpsTimer=0;
    this._hintTimer=0;this._toastTimer=0;this._toastText='';
    this._nearVisitor=null;this._nearLog=null;
    this._autosaveTimer=0;

    this._bindEvents();
    this._resize();
    this._applySettings();
    Settings.onChange((p)=>this._applySettings(p));
    this._refreshTitleMenu();
    this._refreshHUDText();

    EventBus.on('visitor:revealed',(v)=>{
      this.pending.revealedIds.add(v.id);
      const lyr=Save.layer(this.saveData,this.currentLayerId);
      if(!lyr.discoveredEnemies)lyr.discoveredEnemies=[];
      if(!lyr.discoveredAnomalies)lyr.discoveredAnomalies=[];
      if(!lyr.discoveredEnemies.includes('doppelganger'))lyr.discoveredEnemies.push('doppelganger');
      if(!lyr.discoveredAnomalies.includes('doppelganger'))lyr.discoveredAnomalies.push('doppelganger');
      if(v.type==='fake'){this._showToast(t('toast.fake'));this.audio.beep(220,0.5,'sawtooth',0.15);}
      else{this._showToast(t('toast.safe'));this.audio.beep(660,0.12,'sine',0.1);}
    });
    EventBus.on('player:step',(e)=>this.audio.footstep(e.alt,e.sprint));
    EventBus.on('player:dead',()=>{if(this.state===STATE.PLAYING)this._onPlayerDeath();});
    EventBus.on('player:san',(e)=>{if(e.amount>5&&Math.random()<0.5)this.audio.sanWarn();});
  }
  _bindEvents(){
    window.addEventListener('resize',()=>this._resize());
    const startAudio=()=>{this.audio.start();window.removeEventListener('pointerdown',startAudio);window.removeEventListener('keydown',startAudio);};
    window.addEventListener('pointerdown',startAudio);
    window.addEventListener('keydown',startAudio);
    window.addEventListener('mousemove',(e)=>{
      const show=(this.state===STATE.PLAYING);
      if(this.hud.crosshair){
        this.hud.crosshair.style.display=show?'block':'none';
        if(show){this.hud.crosshair.style.left=e.clientX+'px';this.hud.crosshair.style.top=e.clientY+'px';}
      }
    });
    EventBus.on('input:keydown',(c)=>this._onKeyDown(c));
    EventBus.on('input:mousedown',()=>this._onMouseDown());
  }
  _onKeyDown(code){
    switch(this.state){
      case STATE.TITLE:
        if(code==='ArrowUp'||code==='KeyW')this._navMenu('title',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('title',1);
        else if(code==='Enter'||code==='Space'||code==='KeyE')this._activateTitleMenu();
        break;
      case STATE.SETTINGS:this._handleSettingsKey(code);break;
      case STATE.PAUSED:
        if(code==='Escape')this._resume();
        else if(code==='ArrowUp'||code==='KeyW')this._navMenu('pause',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('pause',1);
        else if(code==='Enter'||code==='Space')this._activatePauseMenu();
        break;
      case STATE.PLAYING:
        if(code==='Escape')this._pause();
        else if(code==='KeyE')this._tryInteract();
        else if(code==='Digit1')this.toolSystem.switchTo(0);
        else if(code==='Digit2')this.toolSystem.switchTo(1);
        else if(code==='KeyR')this._reload();
        else if(code==='Digit3')this._useItem('medkit');
        else if(code==='Digit4')this._useItem('adrenaline');
        else if(code==='Digit5')this._useItem('sedative');
        break;
      case STATE.ELEVATOR:
        if(code==='Escape')this._closeElevator();
        else if(code==='ArrowUp'||code==='KeyW')this._navMenu('elevator',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('elevator',1);
        else if(code==='Enter'||code==='Space'||code==='KeyE')this._activateElevator();
        break;
      case STATE.BASEMENT:
        if(code==='Escape')this._openFloorSelect();
        else if(code==='KeyE')this._tryBasementInteract();
        break;
      case STATE.BASEMENT_NPC:
        if(code==='Escape')this._leaveBasementNPC();
        else if(this._activeNPCId==='wagner'){
          if(code==='ArrowLeft'||code==='KeyA'){this.wagnerTabIndex=(this.wagnerTabIndex-1+2)%2;this.wagnerSupplySelectedIndex=0;}
          else if(code==='ArrowRight'||code==='KeyD'){this.wagnerTabIndex=(this.wagnerTabIndex+1)%2;this.wagnerSupplySelectedIndex=0;}
          else if(this.wagnerTabIndex===0){
            if(code==='ArrowUp'||code==='KeyW')this._wagnerNav(-1);
            else if(code==='ArrowDown'||code==='KeyS')this._wagnerNav(1);
            else if(code==='Enter'||code==='Space'||code==='KeyE')this._buyUpgrade();
          }else{
            if(code==='ArrowUp'||code==='KeyW')this._wagnerSupplyNav(-1);
            else if(code==='ArrowDown'||code==='KeyS')this._wagnerSupplyNav(1);
            else if(code==='Enter'||code==='Space'||code==='KeyE')this._buySupply();
          }
        } else if(this._activeNPCId==='lena'){
          if(code==='ArrowLeft'||code==='KeyA')this.archiveTabIndex=(this.archiveTabIndex-1+4)%4;
          else if(code==='ArrowRight'||code==='KeyD')this.archiveTabIndex=(this.archiveTabIndex+1)%4;
          else if(this.archiveTabIndex===3){
            const all=new Set();
            for(const k in this.saveData.layers)for(const l of (this.saveData.layers[k].uploadedLogs||[]))all.add(l);
            const list=[...all].sort();
            if(list.length>0){
              if(code==='ArrowUp'||code==='KeyW')this.archiveLogIndex=(this.archiveLogIndex-1+list.length)%list.length;
              else if(code==='ArrowDown'||code==='KeyS')this.archiveLogIndex=(this.archiveLogIndex+1)%list.length;
            }
          }
        }
        break;
      case STATE.FLOOR_SELECT:
        if(code==='Escape')this._closeFloorSelect();
        else if(code==='ArrowUp'||code==='KeyW')this._navMenu('floor',-1);
        else if(code==='ArrowDown'||code==='KeyS')this._navMenu('floor',1);
        else if(code==='Enter'||code==='Space'||code==='KeyE')this._activateFloorSelect();
        break;
      case STATE.DEATH:
        if(this.deathState.t>2.4&&(code==='Enter'||code==='Space'||code==='KeyE'))this._onDeathContinue();
        break;
      case STATE.TBC:
        if(code==='Escape'||code==='Enter'||code==='Space')this._closeElevator();
        break;
    }
  }
  _onMouseDown(){
    if(this.state===STATE.TITLE)this._activateTitleMenu();
    else if(this.state===STATE.PAUSED)this._activatePauseMenu();
  }
  _navMenu(ctx,dir){
    let items,cur;
    if(ctx==='title'){items=this.titleScreen.menu;cur=this.titleScreen.selectedIndex;}
    else if(ctx==='pause'){items=this.pauseMenu.items;cur=this.pauseMenu.selectedIndex;}
    else if(ctx==='elevator'){items=this.elevatorMenu.items;cur=this.elevatorMenu.selectedIndex;}
    else if(ctx==='floor'){items=this.floorSelectMenu.items;cur=this.floorSelectMenu.selectedIndex;}
    else return;
    const n=items.length;let idx=cur;
    for(let s=0;s<n;s++){idx=(idx+dir+n)%n;if(!items[idx].disabled)break;}
    if(ctx==='title')this.titleScreen.selectedIndex=idx;
    else if(ctx==='pause')this.pauseMenu.selectedIndex=idx;
    else if(ctx==='elevator')this.elevatorMenu.selectedIndex=idx;
    else if(ctx==='floor')this.floorSelectMenu.selectedIndex=idx;
  }
  _activateTitleMenu(){
    const item=this.titleScreen.menu[this.titleScreen.selectedIndex];
    if(!item||item.disabled)return;
    switch(item.action){
      case 'start':this._startCutscene(true);break;
      case 'continue':this._startCutscene(false);break;
      case 'settings':this._openSettings(STATE.TITLE);break;
    }
  }
  _activatePauseMenu(){
    const item=this.pauseMenu.items[this.pauseMenu.selectedIndex];
    if(!item)return;
    switch(item.action){
      case 'resume':this._resume();break;
      case 'settings':this._openSettings(STATE.PAUSED);break;
      case 'title':this._returnToTitle();break;
    }
  }
  _refreshTitleMenu(){this.titleScreen.menu[1].disabled=!Save.has();}
  _startCutscene(isNew){
    this._isNewGame=isNew;
    this.state=STATE.CUTSCENE;
    this._stateTime=0;
    if(this.hud.root)this.hud.root.classList.remove('active');
    const lines=[
      {text:t('cutscene.1'),dur:2.2,color:'rgba(212,206,176,0.7)',y:0.5},
      {text:t('cutscene.2'),dur:3.6,color:'#E8E0C0',bold:true,y:0.5},
      {text:t('cutscene.3'),dur:4.0,color:'#E8E0C0',y:0.5},
      {text:t('cutscene.4'),dur:4.0,color:'#D9534F',bold:true,y:0.5},
      {text:t('cutscene.5'),dur:3.6,color:'#E8E0C0',y:0.5}
    ];
    this.cutscene=new Cutscene(lines,()=>this._enterGame());
  }
  _enterGame(){
    const isNew=this._isNewGame;
    const save=this.saveData;
    const seed=isNew?((Date.now()&0x7FFFFFFF)>>>0):(save.seed||((Date.now()&0x7FFFFFFF)>>>0));
    if(isNew){
      save.seed=seed;save.credits=0;
      save.unlockedBasement=false;save.unlockedL2=false;
      save.currentLayer=1;save.highestLayer=1;save.keyFragments=[];
      save.upgrades={hp:0,scan:0,speed:0,bag:0,san:0};
      save.inventory={medkit:2,adrenaline:1,sedative:1,ammo:CONFIG.gameplay.ammoBaseMax};
      save.layers={};save.completedMissions=[];
      Save.write(save);
    }
    this.currentLayerId=save.currentLayer||1;
    this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set(),killedCount:0,scannedPoints:new Set()};
    this._spawnWorld();
    this.state=STATE.PLAYING;
    this._stateTime=0;
  }
  _spawnWorld(){
    const save=this.saveData;
    const seed=save.seed||((Date.now()&0x7FFFFFFF)>>>0);
    const cfg=CONFIG.art.layers[this.currentLayerId];
    if(!cfg){console.error('[Spawn] No cfg for layer',this.currentLayerId);return;}
    this.world=new World(cfg,seed,save,this.pending,this.currentLayerId);
    const startX=this.world.size*0.5,startY=this.world.size*0.82;
    this.player=new Player(startX,startY,save.upgrades);
    this.fog=new FogRenderer(this.world);
    this.renderer.refreshColors(this.world.cfg);
    this.toolSystem.applyUpgrades(save.upgrades);
    this.camera.x=this.player.x;this.camera.y=this.player.y;
    this.camera.setViewport(this.renderer.W,this.renderer.H,this.renderer.dpr);
    this.world.computeVisibility(this.player.x,this.player.y);
    this.fog.markDirty();
    this._firstUpdate=true;
    this.bullets=[];this.enemyBullets=[];
    this.boss=null;this.phase2Triggered=false;
    if(this.currentLayerId===9)this._setupBoss();
    if(this.audio.started)this.audio.switchLayer(this.currentLayerId);
    if(this.hud.root)this.hud.root.classList.add('active');
    this._showHint(t('hint.move'),6);
    this._refreshHUDText();
  }
  _setupBoss(){
    this.boss={type:'bostin',x:this.world.size*0.5,y:this.world.size*0.5,hp:3000,hpMax:3000,phase:1,armor:50,speed:4.8};
  }
  _onScanComplete(sp){
    this.pending.scannedPoints.add(sp.id);
    this.audio.scanChime();
    this._showToast(t('toast.scan.done'),2);
    const lyr=Save.layer(this.saveData,this.currentLayerId);
    if(!lyr.discoveredAnomalies)lyr.discoveredAnomalies=[];
    const key='scanned_'+sp.name;
    if(!lyr.discoveredAnomalies.includes(key))lyr.discoveredAnomalies.push(key);
  }
  _onBossDefeated(b){
    if(b.type==='bostin'&&this.saveData.keyFragments.length>=8&&b.phase===1&&!this.phase2Triggered){
      this.phase2Triggered=true;
      this.boss={type:'satan',x:this.world.size*0.5,y:this.world.size*0.5,hp:10000,hpMax:10000,phase:2};
      this._showToast('撒旦三面实体显现！',3);
      return;
    }
    if(b.type==='satan'){this._showEnding(true);return;}
    this._showEnding(false);
  }
  _showEnding(sealed){
    this.state=STATE.TBC;this._stateTime=0;
    if(sealed)this._showToast('你使用了降临之锁。撒旦被封印，你留在了L9。',6);
    else this._showToast('Bostin Woob 倒下了。但撒旦并未消失……',6);
    setTimeout(()=>{this._returnToTitle();},6000);
  }
  _onPlayerDeath(){
    this.state=STATE.DEATH;
    const layer=Save.layer(this.saveData,this.currentLayerId);
    const pRescue=this.pending.rescuedIds.size,pKill=this.pending.killedCount;
    const pMap=this.world?this.world.exploredRatio*100-(layer.map||0):0;
    const pLogs=this.pending.collectedLogs.size;
    this.deathState={t:0,lost:{rescue:pRescue,map:Math.max(0,pMap),logs:pLogs,kill:pKill}};
    this.audio.deathStinger();this.camera.addShake(15,1.0);this.audio.stopScanLoop();
    this.pending={rescuedIds:new Set(),revealedIds:new Set(),collectedLogs:new Set(),killedCount:0,scannedPoints:new Set()};
    const ammoMax=getAmmoMax(this.saveData.upgrades);
    this.saveData.inventory.ammo=Math.min(ammoMax,Math.max(CONFIG.gameplay.deathAmmoGrant,this.saveData.inventory.ammo||0));
    Save.write(this.saveData);
    this.world=null;this.player=null;this.fog=null;this.bullets=[];this.enemyBullets=[];this.boss=null;
    if(this.hud.root)this.hud.root.classList.remove('active');
    if(this.hud.crosshair)this.hud.crosshair.style.display='none';
    if(this.hud.sanVig)this.hud.sanVig.style.opacity='0';
  }
  _onDeathContinue(){
    if(this.saveData.unlockedBasement)this._goToBasement();
    else this._returnToTitle();
  }
  _goToBasement(){
    this.basement=new BasementScene();
    this.basementUpgradeSelectedIndex=0;this.wagnerTabIndex=0;this.wagnerSupplySelectedIndex=0;
    this.archiveTabIndex=0;this.archiveLogIndex=0;
    this.state=STATE.BASEMENT;
    if(this.hud.root)this.hud.root.classList.remove('active');
    if(this.hud.crosshair)this.hud.crosshair.style.display='none';
    if(this.hud.sanVig)this.hud.sanVig.style.opacity='0';
    this.audio.stopScanLoop();
    this.camera.x=this.basement.player.x;this.camera.y=this.basement.player.y;
    this.camera.setZoom(Math.min(this.renderer.W,this.renderer.H)/22);
  }
  _openFloorSelect(){
    const save=this.saveData;
    const items=[];
    const maxLayer=save.highestLayer||1;

  _handleSettingsKey(code){
    const items=this.settingsMenu.items,idx=this.settingsMenu.selectedIndex,item=items[idx];
    if(!item)return;
    if(code==='Escape'){this._closeSettings();return;}
    if(code==='ArrowUp'||code==='KeyW'){this.settingsMenu.selectedIndex=(idx-1+items.length)%items.length;return;}
    if(code==='ArrowDown'||code==='KeyS'){this.settingsMenu.selectedIndex=(idx+1)%items.length;return;}
    const left=code==='ArrowLeft'||code==='KeyA',right=code==='ArrowRight'||code==='KeyD';
    if(item.type==='slider'){if(left||right){const delta=(right?1:-1)*item.step;const cur=Settings.get(item.path)??item.min;const v=Utils.clamp(cur+delta,item.min,item.max);Settings.set(item.path,Math.round(v*1000)/1000);}}
    else if(item.type==='toggle'){if(left||right||code==='Enter'||code==='Space')Settings.set(item.path,Settings.get(item.path)?0:1);}
    else if(item.type==='option'){const cur=Settings.get(item.path);const ci=item.options.indexOf(cur);if(left)Settings.set(item.path,item.options[(ci-1+item.options.length)%item.options.length]);else if(right)Settings.set(item.path,item.options[(ci+1)%item.options.length]);else if(code==='Enter'||code==='Space')Settings.set(item.path,item.options[((ci>=0?ci:-1)+1)%item.options.length]);}
  }

  _onEnemyKilled(enemy,world){
    this.pending.killedCount++;

  _tryInteract(){
    if(!this.player||!this.world)return;
    const e=this.world.elevator;
    if(e){
      const d=Utils.dist(this.player.x,this.player.y,e.x,e.y);
      if(d<e.r+1.5){
        if(!e.unlocked){this._showToast(t('toast.elev.locked'),2);return;}
        this._openElevator();return;
      }
    }
    if(this._nearLog){
      const l=this._nearLog;

        l.picked=true;this.pending.collectedLogs.add(l.id);

        else this._showToast(t('toast.log.picked'),1.6);

      if(v&&v.type==='real'&&v.state==='idle'&&v.revealed){

        const layer=Save.layer(this.saveData,1);
        const total=(layer.rescuedIds||[]).length+this.pending.rescuedIds.size;

  _openElevator(){this.state=STATE.ELEVATOR;if(this.hud.crosshair)this.hud.crosshair.style.display='none';this.audio.stopScanLoop();this._buildElevatorMenu();}
  _closeElevator(){this.state=STATE.PLAYING;if(this.hud.crosshair)this.hud.crosshair.style.display='block';}
  _buildElevatorMenu(){
    const e=this.world.elevator,items=[];
    const layer=Save.layer(this.saveData,this.currentLayerId);
    const mapPct=this.world.exploredRatio*100;
    const task=CONFIG.gameplay.layerTasks[this.currentLayerId]||{};
    const scanned=this.world.scannedPointsCount,scanTotal=this.world.scanPoints.length;
    const hasNew=mapPct-(layer.map||0)>0.5||this.pending.collectedLogs.size>0||this.pending.killedCount>0||this.pending.rescuedIds.size>0||this.pending.scannedPoints.size>0||!layer.uploaded;
    items.push(hasNew?{key:'elev.upload',action:'upload',disabled:false,state:null}:{key:'elev.noNewData',action:'none',disabled:true,state:null});
    let canDescend=true,reason=null;
    if(this.currentLayerId<9){
      if(task.map&&mapPct<task.map){canDescend=false;reason='elev.locked';}
      if(task.kill&&(layer.killedTotal||0)+this.pending.killedCount<task.kill){canDescend=false;reason='elev.need.clear';}
      if(task.rescue&&(layer.rescuedIds||[]).length+this.pending.rescuedIds.size<task.rescue){canDescend=false;reason='elev.need.rescue';}
      if(scanTotal>0&&scanned<scanTotal){canDescend=false;reason='elev.need.scan';}
    } else canDescend=false;
    if(this.currentLayerId<9)items.push({key:'elev.descend',action:'descend',disabled:!canDescend,state:reason,stateColor:'rgba(217,83,79,0.7)'});
    else items.push({key:'elev.tbc',action:'none',disabled:true,state:null});
    items.push({key:'elev.evacuate',action:'evacuate',disabled:false,state:null});
    this.elevatorMenu.items=items;
    this.elevatorMenu.selectedIndex=0;
    let i=0;while(i<items.length&&items[i].disabled)i++;
    if(i<items.length)this.elevatorMenu.selectedIndex=i;
  }
  _activateElevator(){
    const item=this.elevatorMenu.items[this.elevatorMenu.selectedIndex];
    if(!item||item.disabled)return;
    const e=this.world.elevator;
    const layer=Save.layer(this.saveData,this.currentLayerId);
    if(item.action==='upload'){
      layer.uploaded=true;
      layer.map=Math.max(layer.map||0,this.world.exploredRatio*100);
      if(this.currentLayerId===1){
        layer.rescuedIds=Array.from(new Set([...(layer.rescuedIds||[]),...this.pending.rescuedIds]));
        layer.revealedIds=Array.from(new Set([...(layer.revealedIds||[]),...this.pending.revealedIds]));
        layer.rescue=layer.rescuedIds.length;
      } else {
        layer.killedTotal=(layer.killedTotal||0)+this.pending.killedCount;
        layer.scanPointsDone=Array.from(new Set([...(layer.scanPointsDone||[]),...this.pending.scannedPoints]));
      }
      layer.exploredBitmap=Array.from(this.world.explored);
      for(const id of this.pending.collectedLogs){
        if(!layer.uploadedLogs.includes(id))layer.uploadedLogs.push(id);
        if(id.includes('key')&&!this.saveData.keyFragments.includes(id))this.saveData.keyFragments.push(id);
      }
      this.pending.collectedLogs.clear();this.pending.rescuedIds.clear();
      this.pending.revealedIds.clear();this.pending.killedCount=0;this.pending.scannedPoints.clear();
      this.saveData.credits+=Math.round((this.world.exploredRatio*100)*20+(layer.rescue||layer.killedTotal||0)*15+(layer.anomalies||0)*8+(layer.scanPointsDone||[]).length*12);
      if(!this.saveData.unlockedBasement)this.saveData.unlockedBasement=true;
      if(this.currentLayerId===1&&(layer.rescuedIds||[]).length>=CONFIG.gameplay.visitors.total&&!this.saveData.unlockedL2){
        this.saveData.unlockedL2=true;this.saveData.highestLayer=Math.max(this.saveData.highestLayer,2);

      this._showToast(t('toast.saved'),2);this._buildElevatorMenu();
    } else if(item.action==='descend'){
      if(this.currentLayerId<9){
        layer.uploaded=true;
        layer.map=Math.max(layer.map||0,this.world.exploredRatio*100);
        if(this.currentLayerId===1){
          layer.rescuedIds=Array.from(new Set([...(layer.rescuedIds||[]),...this.pending.rescuedIds]));
          layer.revealedIds=Array.from(new Set([...(layer.revealedIds||[]),...this.pending.revealedIds]));
          layer.rescue=layer.rescuedIds.length;
        } else {
          layer.killedTotal=(layer.killedTotal||0)+this.pending.killedCount;
          layer.scanPointsDone=Array.from(new Set([...(layer.scanPointsDone||[]),...this.pending.scannedPoints]));
        }
        layer.exploredBitmap=Array.from(this.world.explored);
        for(const id of this.pending.collectedLogs){
          if(!layer.uploadedLogs.includes(id))layer.uploadedLogs.push(id);
          if(id.includes('key')&&!this.saveData.keyFragments.includes(id))this.saveData.keyFragments.push(id);
        }
        this.pending.collectedLogs.clear();this.pending.rescuedIds.clear();
        this.pending.revealedIds.clear();this.pending.killedCount=0;this.pending.scannedPoints.clear();
        if(!this.saveData.unlockedBasement)this.saveData.unlockedBasement=true;
        const next=this.currentLayerId+1;
        this.saveData.highestLayer=Math.max(this.saveData.highestLayer,next);
        this.saveData.currentLayer=next;
        Save.write(this.saveData);
        this._showLayerTransition(next);
      }
    } else if(item.action==='evacuate'){
      this._goToBasement();

  _showLayerTransition(nextLayer){

      }
      const titleKey='cs.l'+prevLayer+'.to.l'+nextLayer+'.title';
      if(I18N.zh[titleKey])lines.push({text:t(titleKey),dur:3.0,color:'#FFD75E',bold:true,y:0.5});

      lines.push({text:t('cs.l8.to.l9.title'),dur:3.0,color:'#38BDF8',bold:true,y:0.5});

        lines.push({text:t('cs.l8.to.l9.a'),dur:3.6,color:'#E0C0FF',y:0.5});
        if(I18N.zh['cs.l8.to.l9.b'])lines.push({text:t('cs.l8.to.l9.b'),dur:4.0,color:'#E8E0C0',y:0.5});
        if(I18N.zh['cs.l8.to.l9.c'])lines.push({text:t('cs.l8.to.l9.c'),dur:3.0,color:'#D9534F',y:0.5});
        lines.push({text:t('cs.l8.to.l9.bodyB'),dur:4.0,color:'#38BDF8',bold:true,y:0.5});

        lines.push({text:t('cs.l8.to.l9.bodyA'),dur:4.0,color:'#D9534F',bold:true,y:0.5});
      }
    }
    this.currentLayerId=nextLayer;

      this._showHint(t('hint.move'),5);

  }
  getInteractPrompt(){
    if(this.state!==STATE.PLAYING)return null;
    const p=this.player,w=this.world;if(!p||!w)return null;
    if(w.elevator){
      const d=Utils.dist(p.x,p.y,w.elevator.x,w.elevator.y);
      if(d<w.elevator.r+4){
        if(!w.elevator.unlocked){const pct=(w.exploredRatio*100).toFixed(0);return{x:w.elevator.x,y:w.elevator.y-w.elevator.r-1,text:`${t('toast.elev.locked')} (${pct}%)`,color:'rgba(217,83,79,0.9)'};}
        return{x:w.elevator.x,y:w.elevator.y-w.elevator.r-1,text:t('toast.elev.ready'),color:'#00BCD4'};
      }
    }
    if(this._nearLog&&!this._nearLog.picked){

      return{x:l.x,y:l.y-0.8,text:'E · '+t(l.id+'.title'),color:l.isKey?'#E0C0FF':'#00BCD4'};

      if(v.revealed&&v.type==='fake')return{x:v.x,y:v.y-1.6,text:lang==='en'?'DANGER':'危险',color:'#D9534F'};
      return{x:v.x,y:v.y-1.6,text:lang==='en'?'RMB to SCAN':'右键扫描确认',color:'rgba(255,215,94,0.9)'};

  update(dt){
    this._stateTime+=dt;
    if(this._hintTimer>0){this._hintTimer-=dt;if(this._hintTimer<=0&&this.hud.hint)this.hud.hint.classList.remove('show');}
    if(this._toastTimer>0)this._toastTimer=Math.max(0,this._toastTimer-dt);
    switch(this.state){
      case STATE.CUTSCENE:if(this.cutscene)this.cutscene.update(dt,this.input);break;
      case STATE.PLAYING:this._updatePlaying(dt);break;
      case STATE.BASEMENT:
        this.basement.update(dt,this.input,this.camera,this.renderer.W,this.renderer.H);
        this.basement.updateCamera(this.camera,dt);
        break;
      case STATE.DEATH:this.deathState.t+=dt;this.camera.update(dt);break;
      case STATE.TBC:break;
    }
  }
  _updatePlaying(dt){
    const {world,player,camera,input,toolSystem}=this;
    if(!world||!player)return;
    player.update(dt,input,world,camera,this.renderer.W,this.renderer.H);
    camera.follow(player.x,player.y,dt);camera.update(dt);
    const dx=player.x-this._lastVisX,dy=player.y-this._lastVisY;
    if(this._firstUpdate||dx*dx+dy*dy>0.36){
      world.computeVisibility(player.x,player.y);this.fog.markDirty();
      this._lastVisX=player.x;this._lastVisY=player.y;this._firstUpdate=false;
    }
    toolSystem.update(dt,player,input,world,this);
    this.audio.updateScanLoop(toolSystem.active&&toolSystem.id==='scanner',toolSystem.intensity);
    this._refreshWeaponHUD();
    for(let i=this.bullets.length-1;i>=0;i--){
      const b=this.bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      if(b.life<=0||world.isSolidAt(b.x,b.y)){this.bullets.splice(i,1);continue;}
      let hit=false;
      for(const e of world.enemies){
        if(e.hp<=0)continue;
        if(Utils.dist2(b.x,b.y,e.x,e.y)<0.4*0.4){e.hp-=CONFIG.gameplay.pistol.damage;if(e.hp<=0)this._onEnemyKilled(e,world);hit=true;break;}
      }
      if(hit)this.bullets.splice(i,1);
    }
    for(let i=this.enemyBullets.length-1;i>=0;i--){
      const b=this.enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      if(b.life<=0||world.isSolidAt(b.x,b.y)){this.enemyBullets.splice(i,1);continue;}
      if(Utils.dist2(b.x,b.y,player.x,player.y)<0.5*0.5){player.takeDamage(b.dmg);this.camera.addShake(4,0.15);this.enemyBullets.splice(i,1);}
    }
    this._updateEnemies(dt);
    if(world.layerId===1)this._updateVisitors(dt);
    this._updateNearby();
    this._updateSanity(dt);
    if(world.elevator&&!world.elevator.unlocked&&world.exploredRatio>=CONFIG.gameplay.elevator.unlockMapRatio){
      world.elevator.unlocked=true;this._showToast(t('toast.elev.ready'),3);
    }
    if(this.radar)this.radar.update(dt);
    this._autosaveTimer+=dt;
    if(this._autosaveTimer>20){this._autosaveTimer=0;Save.write(this.saveData);}
  }
  _updateEnemies(dt){
    const {world,player}=this;
    const t=performance.now()/1000;
    for(const e of world.enemies){
      if(e.hp<=0)continue;
      const dx=player.x-e.x,dy=player.y-e.y;const d=Math.hypot(dx,dy);
      const senseR=e.group==='special'?25:20;
      if(e.state_t>0)e.state_t=Math.max(0,e.state_t-dt);
      const canSee=d<senseR&&world.hasLineOfSight(e.x,e.y,player.x,player.y,senseR);
      if(canSee){e.aggro=true;e.lastSeen={x:player.x,y:player.y};}
      let targetX,targetY;
      if(canSee){targetX=player.x;targetY=player.y;}
      else if(e.aggro){targetX=e.lastSeen.x;targetY=e.lastSeen.y;}
      else{
        if(!e._patrolTarget||Utils.dist(e.x,e.y,e._patrolTarget.x,e._patrolTarget.y)<1.5){const a=t*0.2+e.id*1.7;e._patrolTarget={x:e.x+Math.cos(a)*8,y:e.y+Math.sin(a)*8};}
        targetX=e._patrolTarget.x;targetY=e._patrolTarget.y;
      }
      const tdx=targetX-e.x,tdy=targetY-e.y;
      e.aimAngle=Utils.lerpAngle(e.aimAngle,Math.atan2(tdy,tdx),1-Math.exp(-8*dt));
      if(e.group==='patrol'){
        if(canSee&&d<senseR){
          const keep=9;
          if(d>keep+1){const mx=Math.cos(e.aimAngle)*e.speed*dt,my=Math.sin(e.aimAngle)*e.speed*dt;const s=world.resolveCollision(e.x+mx,e.y+my,0.55);e.x=s.x;e.y=s.y;}
          else if(d<keep-1){const mx=-Math.cos(e.aimAngle)*e.speed*0.6*dt,my=-Math.sin(e.aimAngle)*e.speed*0.6*dt;const s=world.resolveCollision(e.x+mx,e.y+my,0.55);e.x=s.x;e.y=s.y;}
          if(e.fireCooldown>0)e.fireCooldown-=dt;
          if(e.burstLeft>0){e.burstTimer-=dt;if(e.burstTimer<=0){e.burstTimer=0.12;e.burstLeft--;this._enemyShoot(e,player);}}
          else if(e.fireCooldown<=0){e.burstLeft=3;e.burstTimer=0;e.fireCooldown=3.0;e.state='firing';}
        } else {
          const mx=Math.cos(e.aimAngle)*e.speed*0.5*dt,my=Math.sin(e.aimAngle)*e.speed*0.5*dt;const s=world.resolveCollision(e.x+mx,e.y+my,0.55);e.x=s.x;e.y=s.y;
        }
      } else if(e.group==='storm'){
        if(canSee&&d<15&&e.chargeDur<=0&&d>2){e.chargeDur=1.2;const a=Math.atan2(dy,dx);e.chargeVx=Math.cos(a)*6;e.chargeVy=Math.sin(a)*6;e.state='charging';}
        if(e.chargeDur>0){
          e.chargeDur-=dt;
          const mx=e.chargeVx*dt,my=e.chargeVy*dt;
          const s=world.resolveCollision(e.x+mx,e.y+my,0.7);
          if(Math.abs(s.x-(e.x+mx))>0.05){e.chargeDur=0;this.camera.addShake(3,0.2);}
          e.x=s.x;e.y=s.y;
          if(Utils.dist2(e.x,e.y,player.x,player.y)<0.9*0.9){player.takeDamage(e.dmg);this.camera.addShake(8,0.3);const ka=Math.atan2(player.y-e.y,player.x-e.x);player.vx+=Math.cos(ka)*10;player.vy+=Math.sin(ka)*10;e.chargeDur=0;}
        } else if(e.aggro){
          const mx=Math.cos(e.aimAngle)*e.speed*dt,my=Math.sin(e.aimAngle)*e.speed*dt;const s=world.resolveCollision(e.x+mx,e.y+my,0.7);e.x=s.x;e.y=s.y;
          if(d<1.2&&player.invulnT<=0){player.takeDamage(e.dmg*0.5);this.camera.addShake(6,0.2);}
        }
      } else {
        if(canSee){
          if(e.fireCooldown>0)e.fireCooldown-=dt;
          if(e.fireCooldown<=0){e.fireCooldown=2.0;this._enemyShoot(e,player);}
          if(d>12){const mx=Math.cos(e.aimAngle)*e.speed*dt,my=Math.sin(e.aimAngle)*e.speed*dt;const s=world.resolveCollision(e.x+mx,e.y+my,0.6);e.x=s.x;e.y=s.y;}
        }
      }
    }
  }
  _enemyShoot(e,player){
    const aim=Math.atan2(player.y-e.y,player.x-e.x)+(Math.random()-0.5)*0.12;
    this.enemyBullets.push({x:e.x+Math.cos(aim)*0.6,y:e.y+Math.sin(aim)*0.6,vx:Math.cos(aim)*22,vy:Math.sin(aim)*22,life:0.8,dmg:Math.max(10,e.dmg*0.5)});
    this.audio.enemyShot();
  }
  _updateVisitors(dt){
    const {world,player}=this;
    const cfg=CONFIG.gameplay.visitors;
    for(const v of world.visitors){
      if(v.state==='exploded'){if(v.explodeFlash>0)v.explodeFlash=Math.max(0,v.explodeFlash-dt);continue;}
      if(v.state==='rescued')continue;
      const d=Utils.dist(v.x,v.y,player.x,player.y);
      v.voiceTimer-=dt;
      if(v.voiceTimer<0&&!v.revealed&&d<22&&d>5){this.audio.sosCry();v.voiceTimer=6+Math.random()*4;}
      if(v.type==='fake'&&v.state==='idle'){
        if(!v.revealed&&d<cfg.revealPulseRange&&d>cfg.fakeExplodeRadius){v.state='sizzling';v.sizzleT=0;}
        if(v.revealed&&d<cfg.fakeChargeRadius&&d>1.4){v.state='charging';const a=Math.atan2(player.y-v.y,player.x-v.x);v.chargeVx=Math.cos(a)*cfg.fakeChargeSpeed;v.chargeVy=Math.sin(a)*cfg.fakeChargeSpeed;}
      }
      if(v.state==='sizzling'){
        v.sizzleT+=dt;
        if(d>cfg.revealPulseRange+1){v.state='idle';v.sizzleT=0;}
        if(d<cfg.fakeExplodeRadius||v.sizzleT>cfg.fakeSizzleDelay)this._explodeFake(v,world,player);
      } else if(v.state==='charging'){
        const a=Math.atan2(player.y-v.y,player.x-v.x);
        v.chargeVx=Math.cos(a)*cfg.fakeChargeSpeed;v.chargeVy=Math.sin(a)*cfg.fakeChargeSpeed;
        const nx=v.x+v.chargeVx*dt,ny=v.y+v.chargeVy*dt;
        const s=world.resolveCollision(nx,ny,0.4);
        v.x=s.x;v.y=s.y;
        if(d<1.0)this._explodeFake(v,world,player);
      }
    }
  }
  _explodeFake(v,world,player){
    v.state='exploded';v.explodeFlash=0.5;
    const cfg=CONFIG.gameplay.visitors;
    const d=Utils.dist(v.x,v.y,player.x,player.y);
    if(d<cfg.fakeExplodeRadius+1.2){
      const dealt=player.takeDamage(cfg.fakeExplodeDamage);
      if(dealt){this.camera.addShake(8,0.35);const a=Math.atan2(player.y-v.y,player.x-v.x);player.vx+=Math.cos(a)*8;player.vy+=Math.sin(a)*8;player.drainSan(12,'explosion');}
    }
  }
  _updateNearby(){
    const {world,player}=this;
    if(!world||!player)return;
    if(world.layerId===1){
      const cfg=CONFIG.gameplay.visitors;
      let nearest=null,nd=Infinity;
      for(const v of world.visitors){if(v.state!=='idle')continue;const d=Utils.dist(v.x,v.y,player.x,player.y);if(d<nd){nd=d;nearest=v;}}
      this._nearVisitor=(nd<cfg.interactRadius+0.5)?nearest:null;
    } else this._nearVisitor=null;
    const lcfg=CONFIG.gameplay.logs;
    let nl=null,nld=Infinity;
    for(const l of world.logs){if(l.picked)continue;const d=Utils.dist(l.x,l.y,player.x,player.y);if(d<nld){nld=d;nl=l;}}
    this._nearLog=(nld<lcfg.interactRadius+0.6)?nl:null;
  }
  _updateSanity(dt){
    const {world,player}=this;
    if(!world||!player)return;
    if(player.sedativeImmuneT>0)return;
    if(world.layerId===1){
      const cfg=CONFIG.gameplay.visitors;
      let maxDrain=0;
      for(const v of world.visitors){
        if(v.state==='exploded'||v.state==='rescued')continue;
        if(v.revealed&&v.type==='real')continue;
        const d=Utils.dist(v.x,v.y,player.x,player.y);
        if(d<cfg.revealPulseRange){const k=1-d/cfg.revealPulseRange;maxDrain=Math.max(maxDrain,k*cfg.sanDrainNear);}
      }
      if(maxDrain>0)player.drainSan(maxDrain*dt,'near');
    } else {
      let drain=0.3;
      for(const e of world.enemies){
        if(e.hp<=0)continue;
        const d=Utils.dist(e.x,e.y,player.x,player.y);
        const senseR=e.group==='special'?25:20;
        if(d<senseR){const k=1-d/senseR;drain+=k*5;}
        else if(d<30)drain+=0.5;
      }
      player.drainSan(drain*dt,'env');
    }
    if(player.san<player.sanMax*0.5){const k=1-player.san/(player.sanMax*0.5);if(this.hud.sanVig)this.hud.sanVig.style.opacity=String(0.4+k*0.5);}
    else if(this.hud.sanVig)this.hud.sanVig.style.opacity='0';
  }
  render(){
    try{
      const tm=performance.now()/1000;
      switch(this.state){
        case STATE.TITLE:this.renderer.drawTitle(this.titleScreen,tm);break;
        case STATE.SETTINGS:
          if(this.settingsMenu.returnState===STATE.PAUSED&&this.world){this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);if(this.radar)this.radar.draw(this.world,this.player);}
          else this.renderer.drawTitle(this.titleScreen,tm);
          this.renderer.drawSettings(this.settingsMenu,tm);break;
        case STATE.CUTSCENE:
          if(this.world)this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          if(this.cutscene)this.renderer.drawCutscene(this.cutscene);break;
        case STATE.PLAYING:
          this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          if(this.radar)this.radar.draw(this.world,this.player);
          this._updateHUD();
          if(this._toastTimer>0)this.renderer.drawToast(this._toastText);break;
        case STATE.PAUSED:
          this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          if(this.radar)this.radar.draw(this.world,this.player);
          this.renderer.drawPause(this.pauseMenu,tm);break;
        case STATE.ELEVATOR:
          this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          if(this.radar)this.radar.draw(this.world,this.player);
          this.renderer.drawElevatorPanel(this.world,this.player,this.camera,this,this.elevatorMenu);break;
        case STATE.BASEMENT:
        case STATE.BASEMENT_NPC:
          this.renderer.drawBasement(this.basement,this.camera,tm,this);
          if(this.state===STATE.BASEMENT_NPC)this.renderer.drawBasementNPC(this,tm);
          if(this._toastTimer>0)this.renderer.drawToast(this._toastText);break;
        case STATE.FLOOR_SELECT:
          if(this.basement)this.renderer.drawBasement(this.basement,this.camera,tm,this);
          this.renderer.drawFloorSelect(this.floorSelectMenu,tm,this);break;
        case STATE.DEATH:this.renderer.drawDeath(this.deathState,tm,this.saveData);break;
        case STATE.TBC:
          if(this.world)this.renderer.drawWorld(this.world,this.player,this.camera,this.fog,this);
          this.renderer.drawTBC(tm);break;
      }
    }catch(e){console.error('[Render]',e);}
  }
  _updateHUD(){
    const {player,world,hud}=this;
    if(!player||!world)return;
    if(hud.hp)hud.hp.style.width=(player.hp/player.hpMax*100)+'%';
    if(hud.san)hud.san.style.width=(player.san/player.sanMax*100)+'%';
    if(hud.sta)hud.sta.style.width=(player.stamina/player.staminaMax*100)+'%';
    if(hud.sanBar)hud.sanBar.classList.toggle('low',player.san<player.sanMax*0.3);
    if(hud.progress)hud.progress.textContent=`${t('hud.progress.map')} ${(world.exploredRatio*100).toFixed(1)}%`;
    const task=CONFIG.gameplay.layerTasks[this.currentLayerId]||{};
    if(world.layerId===1){
      const layer=Save.layer(this.saveData,1);
      const totalRescued=(layer.rescuedIds||[]).length+this.pending.rescuedIds.size;
      if(hud.rescue)hud.rescue.textContent=`${t('hud.progress.rescue')} ${totalRescued} / ${CONFIG.gameplay.visitors.total}`;
      if(hud.scan)hud.scan.style.display='none';
    } else {
      const layer=Save.layer(this.saveData,world.layerId);
      const totalKilled=(layer.killedTotal||0)+this.pending.killedCount;
      if(task.kill){
        if(hud.rescue)hud.rescue.textContent=`${t('hud.progress.kill')} ${totalKilled} / ${task.kill}`;
      } else if(hud.rescue)hud.rescue.textContent='';
      if(world.scanPoints.length>0){
        if(hud.scan){hud.scan.style.display='block';hud.scan.textContent=`${t('hud.progress.scan')} ${world.scannedPointsCount} / ${world.scanPoints.length}`;}
      } else if(hud.scan)hud.scan.style.display='none';
    }
    if(hud.logs){
      const layer=Save.layer(this.saveData,this.currentLayerId);
      const uploaded=(layer.uploadedLogs||[]).length;
      const pending=this.pending.collectedLogs.size;
      const layerTotal=(LAYER_LOGS[this.currentLayerId]||[]).length;
      hud.logs.textContent=`${t('hud.progress.logs')} ${uploaded+pending} / ${layerTotal}`;
    }
    if(hud.pos)hud.pos.textContent=`POS ${player.x.toFixed(1)}, ${player.y.toFixed(1)}`;
    this._fpsFrames++;this._fpsTimer+=this._lastDt||0.016;
    if(this._fpsTimer>=0.5){if(hud.fps)hud.fps.textContent=`FPS ${Math.round(this._fpsFrames/this._fpsTimer)}`;this._fpsFrames=0;this._fpsTimer=0;}
  }
  start(){
    this._last=performance.now();
    const loop=(now)=>{
      try{
        const dt=Math.min((now-this._last)/1000,1/30);
        this._last=now;this._lastDt=dt;
        this.update(dt);this.render();
      }catch(e){console.error('[Loop]',e);}
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

/* ==================== §18 启动 ==================== */
window.addEventListener('error',function(e){
  console.error('[GLOBAL]',e.error||e.message);
});

function bootstrap(){
  try{
    const game=new Game();
    game.start();
    window.BS={game,CONFIG,Settings,Save,EventBus,Utils,I18N};
    console.log('%c[BABEL SPACE] v1.1.1 · 黑屏修复 + 性能优化','color:#38BDF8;font-weight:bold;font-size:14px');
    console.log('  I18N: zh 完整, en 自动 fallback');
    console.log('  渐变: 缓存复用, 扫描点/地标性能优化');
  }catch(e){
    console.error('[BABEL SPACE] 启动失败:',e);
    const err=document.getElementById('boot-err');
    if(err){
      err.style.display='block';
      err.innerHTML='<div style="font-size:20px;font-weight:bold;margin-bottom:16px;">启动失败</div>'+
        '<div style="margin-bottom:16px;">'+(e.message||String(e))+'</div>'+
        '<pre style="opacity:0.7;white-space:pre-wrap;font-size:12px;">'+(e.stack||'')+'</pre>';
    }
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootstrap);
else bootstrap();
