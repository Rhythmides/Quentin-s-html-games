<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComputerAAA - AAA OS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #1D1D1F;
            user-select: none;
            overflow: hidden;
        }

        .os-desktop {
            background-color: #F4F4F6;
            background-image: radial-gradient(#C8C8CE 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .aaa-window {
            background: #FFFFFF;
            border: 1.5px solid #1D1D1F;
            box-shadow: 4px 4px 0px #1D1D1F;
            transition: box-shadow 0.15s ease;
        }

        .aaa-window-header {
            background: #FFFFFF;
            border-bottom: 1.5px solid #1D1D1F;
        }

        .aaa-btn {
            background: #FFFFFF;
            border: 1.5px solid #1D1D1F;
            transition: all 0.1s ease;
        }

        .aaa-btn:hover {
            background: #1D1D1F;
            color: #FFFFFF;
        }

        .aaa-btn:active {
            transform: translate(1px, 1px);
        }

        .ad-banner-vibrant {
            background: linear-gradient(135deg, #FF2D55 0%, #FF9500 50%, #FFCC00 100%);
            color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            border: 2px solid #FF0033;
            animation: pulseAd 2s infinite alternate;
        }

        .ad-popup-frame {
            background: #FFFDF0;
            border: 3px solid #FF0033;
            box-shadow: 8px 8px 0px #FF0033, 0 10px 25px rgba(255,0,51,0.25);
            animation: shakeAd 0.5s ease-in-out infinite alternate;
        }

        .ad-badge-neon {
            background: #007AFF;
            color: #FFFFFF;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }

        @keyframes pulseAd {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(40deg); }
        }

        @keyframes shakeAd {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-1px, 1px); }
            100% { transform: translate(1px, -1px); }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F4F4F6;
        }
        ::-webkit-scrollbar-thumb {
            background: #1D1D1F;
        }

        .metro-node {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .metro-node:hover circle {
            r: 9;
            stroke-width: 4;
        }

        .evasive-x {
            transition: transform 0.12s ease-out;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between">

    <!-- START SCREEN -->
    <div id="start-screen" class="fixed inset-0 z-[9999] bg-white flex flex-col items-center justify-center p-6 select-text">

                <div class="w-10 h-10 bg-black text-white flex items-center justify-center font-bold text-2xl">A</div>

    <!-- START MENU -->

        <div class="space-y-1">
            <button onclick="openApp('sticky'); toggleStartMenu();" class="w-full text-left px-3 py-2 hover:bg-black hover:text-white flex items-center gap-2 text-xs">

            <button onclick="openApp('browser'); toggleStartMenu();" class="w-full text-left px-3 py-2 hover:bg-black hover:text-white flex items-center gap-2 text-xs">

                <i data-lucide="power" class="w-4 h-4"></i> 强制重置 AAA OS
            </button>

    <script>
        /* Web Audio API Sound Synthesizer Engine */
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            beep(freq, duration, type = 'sine', vol = 0.08) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            playClick() { this.beep(650, 0.04, 'sine', 0.08); },
            playOpen() {
                this.beep(480, 0.05, 'sine', 0.08);
                setTimeout(() => this.beep(800, 0.08, 'sine', 0.08), 50);
            },
            playClose() {
                this.beep(800, 0.05, 'sine', 0.08);
                setTimeout(() => this.beep(400, 0.08, 'sine', 0.08), 50);
            },
            playAd() {
                this.beep(1100, 0.06, 'square', 0.05);
                setTimeout(() => this.beep(1500, 0.08, 'square', 0.05), 60);
            },
            playError() {
                this.beep(220, 0.18, 'sawtooth', 0.12);
            },
            playWin() {
                this.beep(523, 0.08, 'triangle', 0.1);
                setTimeout(() => this.beep(659, 0.08, 'triangle', 0.1), 80);
                setTimeout(() => this.beep(783, 0.12, 'triangle', 0.1), 160);
            }
        };

        /* Helper: HTML escape */
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        /* CENTRAL OS STATE */
        let gameState = {
            started: false,
            intensity: 'medium',
            systemLoad: 2,
            loadRate: 0.02,
            windows: {},
            topZIndex: 100,

            stickyNotes: [
                { id: 1, text: "【工作待办】\n1. 查看上海地铁路线\n2. 校验计算器算法\n3. 保持系统流畅", x: 120, y: 80, bg: '#FFFDE7' }
            ],

            browserHistory: ['https://aaa-search.internal'],
            historyIndex: 0,

            minesweeper: {
                board: [], revealed: [], flagged: [],
                rows: 9, cols: 9, mines: 10,
                gameOver: false, gameWon: false, timer: 0, timerInterval: null
            },

            weather: { city: '上海', temp: '21°C', condition: '多云' },

            stopwatch: { time: 0, interval: null, laps: [] }
        };

        function startGame(intensity) {
            AudioEngine.init();
            AudioEngine.playOpen();
            gameState.started = true;
            gameState.intensity = intensity;

            if (intensity === 'low') gameState.loadRate = 0.007;
            if (intensity === 'medium') gameState.loadRate = 0.022;
            if (intensity === 'high') gameState.loadRate = 0.06;

            document.getElementById('start-screen').style.display = 'none';

            setInterval(updateClock, 1000);
            setInterval(gameLoop, 1000);

            renderDesktopStickyNotes();
            openApp('browser');
        }

        function gameLoop() {
            if (!gameState.started) return;

            gameState.systemLoad = Math.min(100, gameState.systemLoad + gameState.loadRate);
            updateSystemLoadUI();

            if (gameState.systemLoad > 12 && Math.random() < (gameState.systemLoad / 280)) {
                triggerRandomAd();
            }

            if (gameState.systemLoad >= 100) {
                triggerSystemCollapseBSOD();
            }
        }

        function updateSystemLoadUI() {
            const statusEl = document.getElementById('defense-status-txt');
            const barEl = document.getElementById('system-load-bar');

            if (gameState.systemLoad > 80) {
                statusEl.innerText = "瘫痪边缘";
                statusEl.className = "font-bold text-red-600 animate-pulse";
                barEl.className = "h-full bg-red-600 transition-all duration-300";
            } else if (gameState.systemLoad > 50) {
                statusEl.innerText = "濒危";
                statusEl.className = "font-bold text-orange-600";
                barEl.className = "h-full bg-orange-500 transition-all duration-300";
            } else if (gameState.systemLoad > 25) {
                statusEl.innerText = "受损";
                statusEl.className = "font-bold text-yellow-600";
                barEl.className = "h-full bg-yellow-500 transition-all duration-300";
            } else {
                statusEl.innerText = "稳固";
                statusEl.className = "font-bold text-black";
                barEl.className = "h-full bg-black transition-all duration-300";
            }
            barEl.style.width = `${gameState.systemLoad}%`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('system-clock').innerText = now.toTimeString().split(' ')[0];
        }

        function handleDesktopClick(e) {
            if (e.target.id === 'desktop') {
                document.getElementById('start-menu').classList.add('hidden');
            }
        }

        function toggleStartMenu() {
            AudioEngine.playClick();
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('hidden');
        }

        /* APPLICATIONS */
        const APP_DEFS = {
            sticky: { title: "便签管理", width: 440, height: 420, icon: "sticky-note" },
            browser: { title: "AAA 极简浏览器", width: 720, height: 540, icon: "globe" },
            metro: { title: "上海地铁网络 (核心区)", width: 750, height: 540, icon: "train" },
            minesweeper: { title: "经典扫雷", width: 360, height: 460, icon: "bomb" },
            calc: { title: "计算器", width: 320, height: 410, icon: "calculator" },
            cleaner: { title: "系统整理大师", width: 480, height: 380, icon: "sparkles" },
            weather: { title: "实时天气", width: 460, height: 400, icon: "cloud-sun" },
            stopwatch: { title: "精密秒表", width: 380, height: 400, icon: "timer" }
        };

        function openApp(appId) {
            AudioEngine.playClick();
            
            if (gameState.systemLoad > 18 && Math.random() < 0.45) {
                triggerAppSplashAd(appId, () => spawnAppWindow(appId));
            } else {
                spawnAppWindow(appId);
            }
        }

        function spawnAppWindow(appId) {
            if (gameState.windows[appId]) {
                focusWindow(appId);
                return;
            }

            AudioEngine.playOpen();
            gameState.topZIndex++;

            const def = APP_DEFS[appId];
            const winEl = document.createElement('div');
            winEl.id = `win-${appId}`;
            winEl.className = `aaa-window absolute flex flex-col pointer-events-auto rounded-none`;
            winEl.style.width = `${def.width}px`;
            winEl.style.height = `${def.height}px`;
            winEl.style.left = `${80 + (Object.keys(gameState.windows).length * 25)}px`;
            winEl.style.top = `${50 + (Object.keys(gameState.windows).length * 25)}px`;
            winEl.style.zIndex = gameState.topZIndex;

            winEl.onclick = () => focusWindow(appId);

            winEl.innerHTML = `
                <div class="aaa-window-header flex items-center justify-between px-3 py-2 cursor-move font-mono select-none" onmousedown="dragWindow(event, '${appId}')">
                    <div class="flex items-center gap-2 text-xs font-bold">
                        <i data-lucide="${def.icon}" class="w-4 h-4"></i>
                        <span>${def.title}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="closeApp('${appId}')" class="w-5 h-5 flex items-center justify-center border border-black hover:bg-black hover:text-white font-bold text-xs">×</button>
                    </div>
                </div>
                <div id="win-body-${appId}" class="flex-1 overflow-auto bg-white flex flex-col relative select-text">
                    ${getAppHTML(appId)}
                </div>
            `;

            document.getElementById('window-container').appendChild(winEl);
            gameState.windows[appId] = { id: appId, zIndex: gameState.topZIndex };

            lucide.createIcons();
            renderTaskbarTabs();
            initAppLogic(appId);
        }

        function focusWindow(appId) {
            if (!gameState.windows[appId]) return;
            gameState.topZIndex++;
            const winEl = document.getElementById(`win-${appId}`);
            if (winEl) {
                winEl.style.zIndex = gameState.topZIndex;
                gameState.windows[appId].zIndex = gameState.topZIndex;
            }
            renderTaskbarTabs();
        }

        function closeApp(appId) {
            AudioEngine.playClose();
            const winEl = document.getElementById(`win-${appId}`);
            if (winEl) winEl.remove();
            delete gameState.windows[appId];
            renderTaskbarTabs();
        }

        function renderTaskbarTabs() {
            const tabsContainer = document.getElementById('taskbar-tabs');
            tabsContainer.innerHTML = '';

            Object.keys(gameState.windows).forEach(appId => {
                const def = APP_DEFS[appId];
                const btn = document.createElement('button');
                btn.className = `aaa-btn px-2 py-1 text-xs flex items-center gap-1.5 font-bold ${gameState.windows[appId].zIndex === gameState.topZIndex ? 'bg-black text-white' : ''}`;
                btn.onclick = () => focusWindow(appId);

            let startY = e.clientY - win.offsetTop;

                win.style.left = `${Math.max(0, moveEvent.clientX - startX)}px`;
                win.style.top = `${Math.max(0, moveEvent.clientY - startY)}px`;

                document.removeEventListener('mousemove', onMouseMove);

        function browserNavigate(url) {
            AudioEngine.playClick();
            let target = (url || '').trim();
            if (!target) return;

            // 判断输入是否像 URL；不像就当搜索词
            const isUrlLike = /^https?:\/\//i.test(target)
                || target.includes('.internal')
                || /\.(com|cn|org|net|io|dev|app)(\/|$|\?)/i.test(target)
                || target.startsWith('aaa-')
                || target.startsWith('cyber-')
                || target.startsWith('shanghai-');

            if (!isUrlLike) {
                target = `https://aaa-search.internal/search-query?q=${encodeURIComponent(target)}`;
            } else if (!/^https?:\/\//i.test(target)) {
                target = 'https://' + target;
            }

            if (gameState.browserHistory[gameState.historyIndex] !== target) {
                gameState.browserHistory = gameState.browserHistory.slice(0, gameState.historyIndex + 1);
                gameState.browserHistory.push(target);
                gameState.historyIndex = gameState.browserHistory.length - 1;
            }
            renderBrowserPage();
        }

        function browserBack() {
            if (gameState.historyIndex > 0) {
                AudioEngine.playClick();
                gameState.historyIndex--;
                renderBrowserPage();
            }
        }

        function browserForward() {
            if (gameState.historyIndex < gameState.browserHistory.length - 1) {
                AudioEngine.playClick();
                gameState.historyIndex++;
                renderBrowserPage();
            }
        }

            AudioEngine.playClick();

            // 关键：search-query 必须在 aaa-search 之前判断
            if (currentUrl.includes('search-query')) {

                const query = decodeURIComponent(qPart.split('&')[0]);
                contentArea.innerHTML = getDumbSearchResultsHTML(query);
            } else if (currentUrl.includes('aaa-search.internal')) {
                contentArea.innerHTML = getBrowserHomeHTML();
            } else if (currentUrl.includes('aaa-news.internal')) {
                contentArea.innerHTML = getBrowserNewsHTML();
            } else if (currentUrl.includes('shanghai-metro.internal')) {
                contentArea.innerHTML = getBrowserMetroArticleHTML();
            } else if (currentUrl.includes('cyber-warning.internal')) {

        /* 3. MINESWEEPER */
        function initMinesweeper() {
            const ms = gameState.minesweeper;
            ms.board = Array(81).fill(0);
            ms.revealed = Array(81).fill(false);
            ms.flagged = Array(81).fill(false);
            ms.gameOver = false;
            ms.gameWon = false;
            ms.timer = 0;

            if (ms.timerInterval) clearInterval(ms.timerInterval);
            ms.timerInterval = setInterval(() => {
                if (!ms.gameOver && !ms.gameWon && ms.revealed.some(r => r)) {
                    ms.timer++;
                    const timerEl = document.getElementById('ms-timer');
                    if (timerEl) timerEl.innerText = String(ms.timer).padStart(3, '0');
                }
            }, 1000);

            let planted = 0;
            while (planted < 10) {
                let idx = Math.floor(Math.random() * 81);
                if (ms.board[idx] !== 'M') {
                    ms.board[idx] = 'M';
                    planted++;
                }
            }

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    let idx = r * 9 + c;
                    if (ms.board[idx] === 'M') continue;

                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9) {
                                if (ms.board[nr * 9 + nc] === 'M') count++;
                            }
                        }
                    }
                    ms.board[idx] = count;
                }
            }

            renderMinesweeperGrid();
        }

        function renderMinesweeperGrid() {
            const gridContainer = document.getElementById('minesweeper-grid');
            const counterEl = document.getElementById('ms-counter');
            const smileyEl = document.getElementById('ms-smiley');
            if (!gridContainer) return;

            gridContainer.innerHTML = '';
            const ms = gameState.minesweeper;

            let flagCount = ms.flagged.filter(f => f).length;
            if (counterEl) counterEl.innerText = String(10 - flagCount).padStart(3, '0');

            if (smileyEl) {
                if (ms.gameOver) smileyEl.innerText = '😵';
                else if (ms.gameWon) smileyEl.innerText = '😎';
                else smileyEl.innerText = '😄';
            }

            for (let i = 0; i < 81; i++) {
                const cellBtn = document.createElement('button');
                cellBtn.className = 'w-7 h-7 font-mono font-black text-xs flex items-center justify-center border select-none transition-all';

                if (ms.revealed[i]) {
                    cellBtn.classList.add('bg-gray-100', 'border-gray-300');
                    if (ms.board[i] === 'M') {
                        cellBtn.innerText = '💣';
                        cellBtn.classList.add('bg-red-600', 'text-white');
                    } else if (ms.board[i] > 0) {
                        cellBtn.innerText = ms.board[i];
                        const colors = ['', 'text-blue-600', 'text-green-600', 'text-red-600', 'text-purple-700', 'text-yellow-700'];
                        cellBtn.classList.add(colors[ms.board[i]] || 'text-black');
                    }
                } else if (ms.flagged[i]) {
                    cellBtn.classList.add('bg-gray-200', 'border-black');
                    cellBtn.innerText = '🚩';
                } else {
                    cellBtn.classList.add('bg-gray-300', 'border-gray-400', 'hover:bg-gray-200', 'shadow-inner');
                }

                cellBtn.onclick = () => revealMineCell(i);
                cellBtn.oncontextmenu = (e) => {
                    e.preventDefault();
                    toggleMineFlag(i);
                };

                gridContainer.appendChild(cellBtn);
            }
        }

        function revealMineCell(idx) {
            const ms = gameState.minesweeper;
            if (ms.gameOver || ms.gameWon || ms.flagged[idx] || ms.revealed[idx]) return;

            AudioEngine.playClick();
            ms.revealed[idx] = true;

            if (ms.board[idx] === 'M') {
                ms.gameOver = true;
                for (let i = 0; i < 81; i++) {
                    if (ms.board[i] === 'M') ms.revealed[i] = true;
                }
                AudioEngine.playError();
                renderMinesweeperGrid();
                setTimeout(() => triggerRandomAd(), 300);
                return;
            }

            if (ms.board[idx] === 0) {
                let queue = [idx];
                while (queue.length > 0) {
                    let current = queue.shift();
                    let r = Math.floor(current / 9), c = current % 9;

                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9) {
                                let nIdx = nr * 9 + nc;
                                if (!ms.revealed[nIdx] && !ms.flagged[nIdx]) {
                                    ms.revealed[nIdx] = true;
                                    if (ms.board[nIdx] === 0) queue.push(nIdx);
                                }
                            }
                        }
                    }
                }
            }

            checkMinesweeperWin();
            renderMinesweeperGrid();
        }

        function toggleMineFlag(idx) {
            const ms = gameState.minesweeper;
            if (ms.gameOver || ms.gameWon || ms.revealed[idx]) return;

            AudioEngine.playClick();
            ms.flagged[idx] = !ms.flagged[idx];
            checkMinesweeperWin();
            renderMinesweeperGrid();
        }

        function checkMinesweeperWin() {
            const ms = gameState.minesweeper;
            let unrevealedCount = ms.revealed.filter(r => !r).length;
            if (unrevealedCount === 10 && !ms.gameOver) {
                ms.gameWon = true;
                AudioEngine.playWin();
            }
        }

            AudioEngine.playAd();
            const overlay = document.getElementById('overlay-container');
            const splashEl = document.createElement('div');
            splashEl.className = "pointer-events-auto bg-white border-4 border-black p-6 shadow-[12px_12px_0px_#000] max-w-sm w-full font-mono text-center select-none relative";

            let timer = 3;

            overlay.appendChild(splashEl);

            const iv = setInterval(() => {
                timer--;
                const btn = document.getElementById('splash-skip-btn');
                if (btn) {
                    if (timer > 0) {
                        btn.innerText = `跳过广告 (${timer}s)`;

                        btn.innerText = "直接进入应用 »";

            }, 1000);
