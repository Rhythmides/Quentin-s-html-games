<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骰与烛 · 暮色编年史</title>
<style>
  :root{--ink:#141414;--paper:#fff;--soft:#f4f2ee;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC","SimSun",serif;font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .art{filter:url(#rough);display:block;}
  .btn{border:2.5px solid var(--ink);background:#fff;color:var(--ink);padding:9px 22px;font-family:inherit;font-size:16px;cursor:pointer;border-radius:5px 8px 6px 7px;transition:all .12s;letter-spacing:2px;}
  .btn:hover{background:var(--ink);color:#fff;transform:translateY(-2px);}
  .btn:disabled{opacity:.28;cursor:not-allowed;}
  .btn:disabled:hover{background:#fff;color:var(--ink);transform:none;}
  .btn.small{padding:5px 14px;font-size:14px;letter-spacing:1px;}
  .screen{height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .topbar{border-bottom:2.5px solid var(--ink);padding:10px 22px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;}
  .topbar .title{font-size:20px;letter-spacing:4px;}
  .topbar .sub{font-size:14px;opacity:.65;letter-spacing:2px;}
  .fade-overlay{position:fixed;inset:0;background:#fff;z-index:900;pointer-events:none;transition:opacity .28s ease;}
  .title-screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
  .title-screen h1{font-size:58px;letter-spacing:14px;font-weight:normal;border-bottom:3px double var(--ink);padding-bottom:14px;}
  .title-screen .sub{font-size:16px;letter-spacing:6px;opacity:.6;}
  .title-screen .dice{width:120px;height:120px;animation:spin 14s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;overflow:auto;}
  .count-row{display:flex;gap:18px;}
  .count-btn{width:92px;height:112px;border:2.5px solid var(--ink);border-radius:6px 9px 7px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#fff;transition:all .12s;}
  .count-btn:hover{transform:translateY(-4px);box-shadow:0 6px 0 rgba(20,20,20,.2);}
  .count-btn .num{font-size:38px;}
  .count-btn .lbl{font-size:13px;letter-spacing:2px;}
  .class-grid{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .class-card{width:176px;border:2.5px solid var(--ink);border-radius:6px 9px 7px 8px;padding:14px;cursor:pointer;background:#fff;transition:all .12s;text-align:center;}
  .class-card:hover{transform:translateY(-5px);box-shadow:0 6px 0 rgba(20,20,20,.18);}
  .class-card.taken{opacity:.3;pointer-events:none;}
  .class-card .art{width:64px;height:64px;margin:0 auto 8px;}
  .class-card h3{font-size:19px;letter-spacing:3px;margin-bottom:6px;font-weight:normal;}
  .class-card .hp{font-size:13px;opacity:.7;margin-bottom:6px;}
  .class-card p{font-size:12px;line-height:1.5;opacity:.8;}
  .map-main{flex:1;display:flex;overflow:hidden;min-height:0;}
  .map-left{flex:1;border-right:2.5px solid var(--ink);display:flex;flex-direction:column;overflow:hidden;}
  .map-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--soft);}
  .map-panel-title{border-bottom:1.5px solid var(--ink);padding:7px 20px;font-size:14px;letter-spacing:6px;opacity:.75;flex-shrink:0;text-align:center;}
  .map-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 20px;display:flex;flex-direction:column;align-items:center;}
  .camp-scene{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;}
  .camp-svg{width:100%;height:auto;max-height:100%;filter:url(#rough);}
  .map-bottom{border-top:2.5px solid var(--ink);padding:12px 24px;display:flex;justify-content:flex-end;align-items:center;background:#fff;flex-shrink:0;min-height:66px;}
  .continue-btn{font-size:17px;padding:10px 30px;letter-spacing:4px;animation:arrowPulse 1.8s ease-in-out infinite;}
  @keyframes arrowPulse{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}
  .map-hint{font-size:14px;letter-spacing:4px;opacity:.6;margin-right:auto;}
  .level-intro-screen{background:#141414;color:#fff;display:flex;align-items:center;justify-content:center;height:100%;}
  .intro-content{text-align:center;max-width:560px;padding:20px;animation:introIn .8s ease-out;}
  @keyframes introIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .intro-flavor{font-size:14px;letter-spacing:3px;opacity:.62;margin-bottom:30px;line-height:2.1;font-style:italic;}
  .intro-title{font-size:42px;letter-spacing:14px;border-top:1.5px solid rgba(255,255,255,.3);border-bottom:1.5px solid rgba(255,255,255,.3);padding:20px 0;}
  .intro-rule{width:60px;height:1px;background:rgba(255,255,255,.35);margin:22px auto 0;}
  .interlude-screen{background:#141414;color:#fff;display:flex;align-items:center;justify-content:center;height:100%;}
  .interlude-content{text-align:center;max-width:620px;padding:20px;animation:introIn .8s ease-out;}
  .interlude-pre{font-size:13px;letter-spacing:5px;opacity:.5;margin-bottom:24px;}
  .interlude-title{font-size:34px;letter-spacing:14px;border-top:1.5px solid rgba(255,255,255,.3);border-bottom:1.5px solid rgba(255,255,255,.3);padding:18px 0;}
  .interlude-line{width:60px;height:1px;background:rgba(255,255,255,.4);margin:22px auto;}
  .interlude-text{font-size:15px;letter-spacing:2px;line-height:2;opacity:.85;}
  .interlude-revive{margin-top:20px;border:1.5px dashed rgba(255,255,255,.4);border-radius:6px;padding:14px 20px;font-size:14px;letter-spacing:2px;line-height:1.9;opacity:.9;}
  .interlude-revive b{letter-spacing:3px;color:#fff;font-weight:normal;font-size:15px;}
  .battle-top{display:flex;flex-wrap:wrap;gap:10px;padding:10px 18px;border-bottom:2px solid var(--ink);flex-shrink:0;background:#fff;}
  .relic-bar{display:flex;justify-content:flex-end;gap:8px;padding:5px 18px;border-bottom:2px solid var(--ink);background:#fafaf6;flex-shrink:0;min-height:44px;align-items:center;}
  .relic-bar .label{font-size:10px;letter-spacing:3px;opacity:.5;margin-right:6px;}
  .relic{width:36px;height:36px;border:2px solid var(--ink);border-radius:5px;position:relative;background:#fff;display:grid;place-items:center;cursor:pointer;transition:all .12s;}
  .relic.ready:hover{transform:translateY(-3px);box-shadow:0 4px 0 rgba(20,20,20,.2);}
  .relic.cooling{opacity:.4;cursor:not-allowed;}
  .relic .art{width:26px;height:26px;}
  .relic .cd{position:absolute;bottom:-4px;right:-4px;background:var(--ink);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-family:"Courier New",monospace;}
  .pchip{border:2px solid var(--ink);border-radius:6px 8px 7px 7px;padding:7px 11px;min-width:200px;display:flex;flex-direction:column;gap:4px;background:#fff;transition:all .18s cubic-bezier(.2,1.3,.5,1);}
  .pchip.active{background:var(--ink);color:#fff;transform:translateY(-3px);box-shadow:0 5px 0 rgba(20,20,20,.2);}
  .pchip.dead{opacity:.35;filter:grayscale(1);text-decoration:line-through;}
  .pchip-header{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1px;}
  .pchip-name{font-weight:bold;}
  .pchip-hp{font-family:"Courier New",monospace;font-weight:bold;}
  .bar{height:9px;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;background:#fff;position:relative;}
  .bar>i{display:block;height:100%;background:var(--ink);transition:width .35s cubic-bezier(.3,1,.4,1);}
  .pchip.active .bar{border-color:#fff;background:#000;}
  .pchip.active .bar>i{background:#fff;}
  .pchip-stats{display:flex;gap:9px;font-size:11.5px;letter-spacing:1px;padding-top:3px;border-top:1px dashed currentColor;opacity:.82;}
  .pchip-stats span{white-space:nowrap;}
  .pchip-res{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1px;padding-top:2px;}
  .pchip-res .res-bar{flex:1;height:6px;border:1.5px solid currentColor;border-radius:2px;overflow:hidden;background:transparent;}
  .pchip-res .res-bar>i{display:block;height:100%;background:currentColor;transition:width .3s;}
  .pchip-footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.85;gap:6px;flex-wrap:wrap;}
  .potion-count{display:inline-flex;align-items:center;gap:3px;letter-spacing:1px;}
  .battle-mid{flex:1;display:flex;overflow:hidden;min-height:0;}
  .enemy-area{flex:1;display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;padding:16px;overflow:auto;}
  .enemy{width:148px;border:2.5px solid var(--ink);border-radius:6px 9px 7px 8px;padding:10px;text-align:center;background:#fff;position:relative;transition:all .18s cubic-bezier(.2,1.3,.5,1);}
  .enemy.targetable{cursor:crosshair;animation:targetPulse 1.1s ease-in-out infinite;}
  .enemy.targetable:hover{transform:scale(1.06);}
  .enemy.dead{opacity:.18;filter:grayscale(1);}
  .enemy.hit{animation:hitShake .3s;}
  .enemy .art{width:66px;height:66px;margin:0 auto 4px;}
  .enemy .ename{font-size:13px;letter-spacing:1px;margin-bottom:5px;}
  .enemy .intent{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;border-top:1.5px dashed var(--ink);margin-top:6px;padding-top:5px;}
  .enemy .intent .art{width:20px;height:20px;margin:0;}
  .enemy .statuses{font-size:11px;opacity:.75;margin-top:3px;letter-spacing:1px;}
  @keyframes targetPulse{0%,100%{box-shadow:0 0 0 3px var(--ink) inset;}50%{box-shadow:0 0 0 6px var(--ink) inset;}}
  @keyframes hitShake{0%,100%{transform:translate(0,0);}25%{transform:translate(-4px,3px);}50%{transform:translate(4px,-3px);}75%{transform:translate(-3px,-2px);}}
  .log-area{width:272px;border-left:2.5px solid var(--ink);padding:12px;overflow-y:auto;flex-shrink:0;font-size:13px;line-height:1.7;background:#fff;}
  .log-area .l{border-bottom:1px dotted rgba(20,20,20,.2);padding:3px 0;}
  .log-area .l.big{font-weight:bold;font-size:14px;border-bottom:1.5px solid var(--ink);}
  .hand-area{border-top:2.5px solid var(--ink);padding:16px 18px 12px;flex-shrink:0;display:flex;gap:12px;align-items:flex-end;justify-content:center;min-height:210px;flex-wrap:wrap;position:relative;background:#fff;}
  .hand-empty{font-size:14px;opacity:.4;letter-spacing:3px;padding:60px 0;}
  .deck-info{position:absolute;bottom:6px;right:14px;font-size:12px;opacity:.55;letter-spacing:1px;}
  .deck-info span{margin-left:14px;}
  .potion-dock{position:absolute;left:16px;bottom:10px;display:flex;gap:8px;align-items:center;padding:6px 10px;border:1.5px dashed var(--ink);border-radius:6px;background:#fafaf6;opacity:0;pointer-events:none;transition:opacity .2s;}
  .potion-dock.show{opacity:1;pointer-events:auto;}
  .potion-dock .label{font-size:10px;letter-spacing:2px;opacity:.6;margin-right:4px;}
  .potion-dock .potion{width:38px;height:38px;border:2px solid var(--ink);border-radius:5px;cursor:pointer;display:grid;place-items:center;background:#fff;transition:all .12s;}
  .potion-dock .potion:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 4px 0 rgba(20,20,20,.2);}
  .potion-dock .potion .art{width:26px;height:26px;}
  .card{width:122px;height:172px;border:2.5px solid var(--ink);border-radius:6px 9px 7px 8px;background:#fff;position:relative;cursor:pointer;padding:7px;display:flex;flex-direction:column;transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s;flex-shrink:0;user-select:none;transform-origin:bottom center;}
  .card:hover{transform:translateY(-14px) scale(1.04);box-shadow:0 8px 0 rgba(20,20,20,.22);}
  .card.sel{transform:translateY(-18px) scale(1.06);box-shadow:0 0 0 3.5px var(--ink),0 10px 0 rgba(20,20,20,.28);}
  .card.afford{border-width:3px;}
  .card.cant{opacity:.4;cursor:not-allowed;}
  .card.upgraded{box-shadow:0 0 0 2px var(--ink) inset,0 0 0 5px rgba(20,20,20,.12);}
  .card.upgraded::after{content:'+';position:absolute;bottom:4px;right:6px;font-size:18px;font-weight:bold;}
  .card .cost{position:absolute;top:-11px;left:-11px;width:28px;height:28px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:bold;}
  .card .cname{font-size:13px;text-align:center;margin-top:2px;letter-spacing:1px;}
  .card .art{width:58px;height:58px;margin:2px auto;}
  .card .ctxt{font-size:10.5px;line-height:1.35;text-align:center;opacity:.85;flex:1;}
  .card .ctype{font-size:10px;text-align:center;letter-spacing:2px;opacity:.6;border-top:1px dashed var(--ink);padding-top:2px;}
  .card.shake{animation:cardShake .4s;}
  @keyframes cardShake{0%,100%{transform:translateX(0) translateY(-14px) scale(1.04);}20%{transform:translateX(-7px) translateY(-14px) scale(1.04);}40%{transform:translateX(7px) translateY(-14px) scale(1.04);}60%{transform:translateX(-4px) translateY(-14px) scale(1.04);}80%{transform:translateX(4px) translateY(-14px) scale(1.04);}}
  .battle-bottom{border-top:2px solid var(--ink);padding:8px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;font-size:15px;letter-spacing:2px;background:#fff;}
  .energy-pips{display:flex;gap:5px;}
  .pip{width:15px;height:15px;border:2px solid var(--ink);border-radius:50%;transition:all .15s;}
  .pip.on{background:var(--ink);transform:scale(1.05);}
  .pip.carry{background:var(--soft);border-style:dashed;}
  .event-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:22px;overflow:auto;}
  .event-box{max-width:720px;border:2.5px solid var(--ink);border-radius:8px 11px 9px 10px;padding:28px 34px;line-height:2;font-size:17px;letter-spacing:1px;background:#fff;animation:fadeUp .35s ease-out;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .event-box h2{font-size:22px;letter-spacing:6px;font-weight:normal;margin-bottom:14px;border-bottom:2px solid var(--ink);padding-bottom:10px;}
  .event-box .ambiance{font-size:13px;opacity:.6;font-style:italic;letter-spacing:1px;margin-bottom:14px;line-height:1.9;padding-left:10px;border-left:2px solid var(--ink);}
  .choice-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:720px;}
  .choice{border:2.5px solid var(--ink);border-radius:6px 9px 7px 8px;padding:13px 20px;cursor:pointer;background:#fff;transition:all .15s;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .choice:hover{background:var(--ink);color:#fff;transform:translateX(6px);}
  .choice:hover .dc{background:#fff;color:var(--ink);}
  .choice-main{display:flex;flex-direction:column;gap:4px;flex:1;}
  .choice-hint{font-size:11px;opacity:.65;font-style:italic;letter-spacing:1px;}
  .choice-right{display:flex;gap:6px;align-items:center;}
  .dc{border:2px solid var(--ink);border-radius:4px;padding:2px 9px;font-size:13px;white-space:nowrap;transition:all .15s;}
  .reward-grid{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-items:flex-start;}
  .reward-item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .reward-item .who{font-size:12px;letter-spacing:2px;opacity:.7;padding:3px 10px;border:1.5px dashed var(--ink);border-radius:4px;background:#fafaf6;}
  .reward-item .card{transform:none;cursor:pointer;}
  .reward-item .card:hover{transform:translateY(-6px);box-shadow:0 8px 0 rgba(20,20,20,.22);}
  .dice-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);border:3px solid var(--ink);background:#fff;padding:20px 34px 18px;border-radius:10px 12px 11px 13px;z-index:800;pointer-events:none;box-shadow:0 12px 0 rgba(20,20,20,.18);animation:diceIn .38s cubic-bezier(.2,1.4,.4,1);text-align:center;min-width:280px;}
  .dice-pop.crit{border-width:5px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink),0 14px 0 rgba(20,20,20,.25);}
  .dice-pop.fumble{border-style:double;border-width:6px;}
  .dice-pop .dice-title{font-size:13px;letter-spacing:4px;opacity:.7;}
  .dice-pop .dice-body{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 8px;}
  .dice-pop .d20svg{width:66px;height:66px;animation:spin 1.2s linear infinite;}
  .dice-pop.settled .d20svg{animation:none;}
  .dice-pop .d20val{font-size:52px;font-weight:bold;letter-spacing:2px;min-width:78px;font-family:"Courier New",monospace;}
  .dice-pop.crit .d20val{text-shadow:0 0 12px rgba(20,20,20,.35);}
  .dice-pop .dice-detail{font-size:13px;opacity:.85;line-height:1.7;letter-spacing:1px;}
  .dice-pop .dice-pair-big{display:flex;gap:18px;justify-content:center;align-items:center;margin:6px 0;padding:4px;}
  .dice-pop .dice-slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border:2.5px solid var(--ink);border-radius:6px;background:#fff;transition:all .35s;min-width:90px;}
  .dice-pop .dice-slot .d20svg{width:48px;height:48px;animation:spin 1.2s linear infinite;}
  .dice-pop .dice-slot .dice-num{font-size:26px;font-weight:bold;font-family:"Courier New",monospace;min-height:32px;line-height:32px;}
  .dice-pop .dice-slot.winner{box-shadow:0 0 0 3px var(--ink),0 0 0 7px rgba(20,20,20,.18);transform:scale(1.08);}
  .dice-pop .dice-slot.loser{opacity:.3;filter:grayscale(.7);}
  .dice-pop.settled .dice-slot .d20svg{animation:none;}
  @keyframes diceIn{from{transform:translate(-50%,-50%) scale(.5) rotate(-8deg);opacity:0;}to{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1;}}
  .float-text{position:fixed;transform:translate(-50%,-50%);font-size:24px;font-weight:bold;letter-spacing:1px;color:var(--ink);pointer-events:none;z-index:700;text-shadow:0 0 8px #fff,0 0 4px #fff,0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:floatUp 1s ease-out forwards;}
  .float-text.dmg{color:#7a1d1d;}
  .float-text.heal{color:#1e6b31;}
  .float-text.block{color:#233a7a;}
  .float-text.crit{font-size:32px;}
  @keyframes floatUp{from{transform:translate(-50%,-50%) scale(.5);opacity:0;}25%{transform:translate(-50%,-60%) scale(1.25);opacity:1;}60%{transform:translate(-50%,-90%) scale(1);opacity:1;}to{transform:translate(-50%,-150%) scale(.9);opacity:0;}}
  .dmg-preview{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:3px 10px;border-radius:4px;white-space:nowrap;letter-spacing:1px;pointer-events:none;animation:fadeIn .15s;z-index:50;line-height:1.4;text-align:center;}
  .dmg-preview::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid var(--ink);}
  @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(4px);}to{opacity:1;transform:translateX(-50%);}}
  .deck-viewer{flex:1;overflow-y:auto;padding:20px 30px;}
  .deck-player{margin-bottom:26px;border:2px solid var(--ink);border-radius:6px;padding:14px 18px;background:#fff;}
  .deck-player h3{font-size:17px;letter-spacing:3px;margin-bottom:12px;font-weight:normal;border-bottom:1.5px dashed var(--ink);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .deck-player h3 .hint{font-size:12px;opacity:.6;letter-spacing:1px;font-weight:normal;}
  .deck-cards{display:flex;flex-wrap:wrap;gap:10px;}
  .deck-cards .card{width:104px;height:148px;padding:6px;}
  .deck-cards .card .cname{font-size:11.5px;}
  .deck-cards .card .art{width:48px;height:48px;}
  .deck-cards .card .ctxt{font-size:9.5px;line-height:1.25;}
  .deck-cards .card .cost{width:24px;height:24px;font-size:13px;top:-9px;left:-9px;}
  .upgrade-compare{display:flex;align-items:center;gap:28px;justify-content:center;}
  .upgrade-side{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .upgrade-label{font-size:13px;letter-spacing:4px;opacity:.6;}
  .upgrade-arrow{font-size:44px;opacity:.5;}
  .upgrade-changes{border:2px solid var(--ink);border-radius:6px;padding:14px 24px;background:#fafaf6;min-width:360px;}
  .upgrade-row{display:grid;grid-template-columns:80px 1fr 30px 1fr;gap:10px;padding:5px 0;font-size:14px;letter-spacing:1px;align-items:center;border-bottom:1px dotted rgba(20,20,20,.2);}
  .upgrade-row:last-child{border-bottom:none;}
  .upgrade-row .upgrade-field{font-size:12px;opacity:.7;}
  .upgrade-row .upgrade-old{opacity:.5;text-decoration:line-through;text-align:right;}

/* ============ 基础 ============ */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const d=s=>1+rnd(s);
const d20=()=>d(20);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rollExpr(expr){
  const m=/(\d+)d(\d+)([+-]\d+)?/.exec(expr);
  if(!m)return{total:parseInt(expr,10)||0,rolls:[]};
  const n=+m[1],s=+m[2],mod=m[3]?+m[3]:0;
  const rolls=[];for(let i=0;i<n;i++)rolls.push(d(s));
  return{total:rolls.reduce((a,b)=>a+b,0)+mod,rolls};
}
function dmgRange(expr){
  const m=/(\d+)d(\d+)([+-]\d+)?/.exec(expr);
  if(!m)return{min:0,max:0};
  const n=+m[1],s=+m[2],mod=m[3]?+m[3]:0;
  return{min:n+mod,max:n*s+mod};
}

const DESC_FIELDS=['dmg','block','heal','bless','vuln','weak','poison','draw','energyGain','hpCost','times','hits','weakAll','poisonBurst','resCost','resGain','resBonus'];
function descFor(cid){
  const c=CARD_DEFS[cid];if(!c)return '';
  let t=c.t;
  DESC_FIELDS.forEach(f=>{
    if(c[f]!==undefined){
      t=t.replace(new RegExp('\\{'+f+'\\}','g'),c[f]);
    }
  });
  return t;
}

/* ============ 升级 ============ */
function makeUpgrade(base){
  const up=Object.assign({},base);delete up._upgraded;
  if(base.dmg){
    up.dmg=base.dmg.replace(/d(\d+)/g,(m,n)=>'d'+Math.min(+n+2,12));
    up.dmg=up.dmg.replace(/([+-]\d+)(?![^+-]*[+-])/,(m,mod)=>{const num=parseInt(mod,10);return(num>=0?'+':'')+(num+1);});
  }
  if(base.heal&&typeof base.heal==='string'){
    up.heal=base.heal.replace(/d(\d+)/g,(m,n)=>'d'+Math.min(+n+2,12));
  }
  if(base.block)up.block=base.block+3;
  if(base.heal&&typeof base.heal==='number')up.heal=base.heal+2;
  if(base.bless)up.bless=base.bless+2;
  if(base.vuln)up.vuln=base.vuln+1;
  if(base.weak)up.weak=base.weak+1;
  if(base.poison)up.poison=base.poison+2;
  if(base.poisonBurst)up.poisonBurst=base.poisonBurst+1;
  if(base.draw)up.draw=base.draw+1;
  if(base.energyGain)up.energyGain=base.energyGain+1;
  if(base.hpCost)up.hpCost=Math.max(1,base.hpCost-3);
  if(base.weakAll)up.weakAll=base.weakAll+1;
  if(base.hits)up.hits=base.hits+1;
  if(base.times)up.times=base.times+1;
  up._upgraded=true;
  return up;
}
Object.keys(CARD_DEFS).forEach(id=>{
  const base=CARD_DEFS[id];
  if(id.endsWith('_up'))return;
  const up=makeUpgrade(base);
  up.n=base.n+'+';
  CARD_DEFS[id+'_up']=up;
});
function isUpgraded(cid){return typeof cid==='string'&&cid.endsWith('_up');}

const UPGRADE_FIELDS=['dmg','block','heal','bless','vuln','weak','poison','draw','energyGain','hpCost','times','hits','weakAll','poisonBurst'];
function compareCardFields(oldC,newC){
  return UPGRADE_FIELDS.filter(f=>(oldC[f]!==undefined||newC[f]!==undefined))
    .map(f=>({field:f,old:oldC[f],new:newC[f],changed:oldC[f]!==newC[f]}))
    .filter(r=>r.changed);
}

function drawCards(p,n){
  for(let i=0;i<n;i++){
    if(!p.deck.length){p.deck=shuffle(p.discard);p.discard=[];}
    if(!p.deck.length)break;
    p.hand.push(p.deck.pop());
  }
}
function effectiveStat(p,stat){return(p.stats[stat]||0)+(p.tempStats[stat]||0);}

/* ============ 地图生成 ============ */
function weightedType(li,actNum){
  const pool=[];
  pool.push('battle','battle','battle','battle');
  pool.push('event','event');
  if(li>=3)pool.push('elite');
  if(actNum<=2)pool.push('treasure');
  return pick(pool);
}
function genActRaw(actNum){
  const layers=[];
  layers.push([{type:'battle',id:`${actNum}-0-0`}]);
  const midCount=6+actNum;
  for(let li=1;li<=midCount;li++){
    const r=Math.random();
    let n=1;
    if(r<0.35)n=1;else if(r<0.8)n=2;else n=3;
    const nodes=[];
    for(let j=0;j<n;j++)nodes.push({type:weightedType(li,actNum),id:`${actNum}-${li}-${j}`});
    layers.push(nodes);
  }
  layers.push([{type:'camp',id:`${actNum}-${midCount+1}-0`}]);
  layers.push([{type:'boss',id:`${actNum}-${midCount+2}-0`}]);
  return layers;
}
function validateMap(layers){
  for(let li=1;li<layers.length-2;li++){
    const row=layers[li];
    if(row.length>=2&&!row.some(n=>n.type==='battle'||n.type==='elite'))return false;
  }
  for(let li=1;li<layers.length-3;li++){
    const cur=layers[li],next=layers[li+1];
    const curChance=cur.every(n=>n.type==='event'||n.type==='treasure');
    const nextChance=next.every(n=>n.type==='event'||n.type==='treasure');
    if(curChance&&nextChance)return false;
  }
  for(let li=1;li<layers.length-2;li++){
    const cur=layers[li];
    if(cur.some(n=>n.type==='treasure'||n.type==='event')){
      let hasElite=false;
      for(let k=li+1;k<=Math.min(layers.length-2,li+2);k++){
        if(layers[k].some(n=>n.type==='elite'||n.type==='boss')){hasElite=true;break;}
      }
      if(!hasElite)return false;
    }
  }
  return true;
}
function genAct(actNum){
  let layers;
  for(let attempt=0;attempt<50;attempt++){
    layers=genActRaw(actNum);
    if(validateMap(layers))return layers;
  }
  layers=genActRaw(actNum);
  for(let li=1;li<layers.length-2;li++){
    const row=layers[li];
    if(row.length>=2&&!row.some(n=>n.type==='battle'||n.type==='elite')){
      row[0].type='battle';
    }
  }
  return layers;
}
function startNewAct(actNum){
  S.act=actNum;
  S.map={layers:genAct(actNum),actName:ACT_NAMES[actNum-1],path:[],currentLayer:-1};
  S.showPathChoice=false;
}

/* ============ 战斗初始化 ============ */
function genEncounter(isElite,isBoss){
  const act=S.act;
  if(isBoss){
    if(act===1)return['goblinKing'];
    if(act===2)return['wraith'];
    return['dragon'];
  }
  const pools={1:['goblin','goblin','wolf','spider','bandit','rat'],2:['skeleton','penitent','gargoyle','chanter','bandit'],3:['dragonkin','flameWisp','boneLord','skeleton','dragonkin']};
  const normalPool=pools[act]||pools[1];
  if(isElite){
    const elites={1:['ogre'],2:['darkknight'],3:['ashknight']};
    const big=pick(elites[act]||elites[1]);
    return[big,pick(normalPool)];
  }
  const n=2+rnd(2);
  const out=[];
  for(let i=0;i<n;i++)out.push(pick(normalPool));
  return out;
}
function spawnEnemy(key){
  const def=ENEMY_DEFS[key];
  const mult=1+0.45*(S.players.length-1)+(S.act-1)*0.3;
  const hp=Math.round(def.hp*mult);
  const e={key,name:def.n,art:def.art,ac:def.ac,hp,maxHp:hp,block:0,vuln:0,weak:0,poison:0,acts:def.acts,intent:null,elite:!!def.elite,boss:!!def.boss};
  e.intent=pickIntent(e);
  return e;
}
function pickIntent(e){
  if(e.hp/e.maxHp<0.35){
    const blk=e.acts.find(a=>a.k==='blk');
    if(blk&&Math.random()<0.6)return blk;
  }
  return pick(e.acts);
}
function setupCombat(enemyKeys){
  S.battle={enemies:enemyKeys.map(spawnEnemy),turnIdx:0,round:1,log:[],phase:'pending',over:false};
  S.energyCarry=0;
  S.relicTickRound=0;
  S.players.forEach(p=>{
    p.block=0;p.hand=[];p.discard=[];
    p.deck=shuffle(p.masterDeck);
    p.energy=0;p.bless=0;p.vuln=0;p.weak=0;
    p.tempStats={str:0,dex:0,int:0,wis:0};
    if(p.hp<=0&&!p.dead)p.hp=1;
  });
}
function startBattle(){
  const b=S.battle;
  if(!b)return;
  b.phase='player';b.log=[];
  blog('—— 遭遇开始 ——',true);
  S.selCard=-1;
  beginTurn();
}
function blog(text,big){
  if(!S.battle)return;
  S.battle.log.push({text,big:!!big});
  if(S.battle.log.length>60)S.battle.log.shift();
}

/* ============ 回合流程 ============ */
function beginTurn(){
  const b=S.battle;
  if(!b||b.over)return;

  // 遗物冷却：每完整一轮（b.round 变化）递减一次
  if(b.round!==S.relicTickRound){
    S.relicTickRound=b.round;
    S.relics.forEach(r=>{ if(r.cd>0) r.cd--; });
  }

  while(b.turnIdx<S.players.length){
    const p=S.players[b.turnIdx];
    if(p.dead){b.turnIdx++;continue;}
    break;
  }
  if(b.turnIdx>=S.players.length){enemyPhase();return;}
  const p=S.players[b.turnIdx];

  if(p.clsKey==='knight'&&p.resource>=5){
    p.resource-=5;p.block+=4;
    blog(`${p.name} 将决心转化为 4 点格挡。`);
  }
  if(p.clsKey==='mage'&&p.resource>=2){
    drawCards(p,1);
    blog(`${p.name} 的过载令他抽了 1 张牌。`);
  }
  if(p.clsKey==='rogue')p.resource=0;

  p.block=0;
  p.energy=p.maxEnergy+S.energyCarry;
  const carry=S.energyCarry;
  S.energyCarry=0;
  p.hand=[];
  drawCards(p,5);
  b.phase='player';
  S.selCard=-1;
  blog(`${p.name}（${p.clsName}）的回合${carry>0?`（+${carry} 传承能量）`:''}。`);
  render();
}
function enemyPhase(){
  const b=S.battle;
  if(!b||b.over)return;
  b.phase='enemy';b.turnIdx=0;
  render();
  (async()=>{
    for(const e of b.enemies){
      if(e.hp<=0)continue;
      if(b.over)return;
      await sleep(300);
      enemyAct(e);
      render();
      if(checkBattleEnd())return;
    }
    await sleep(300);
    b.enemies.forEach(e=>{
      if(e.hp>0){
        if(e.poison>0){
          e.hp-=e.poison;
          blog(`${e.name} 受到 ${e.poison} 点毒素伤害。`);
        }
        e.block=0;
        e.vuln=Math.max(0,e.vuln-1);
        e.weak=Math.max(0,e.weak-1);
        e.intent=pickIntent(e);
      }
    });
    if(checkBattleEnd())return;
    b.round++;
    blog(`— 第 ${b.round} 轮 —`,true);
    beginTurn();
  })();
}
function enemyAct(e){
  const it=e.intent;
  if(!it)return;
  const alive=S.players.filter(p=>p.hp>0&&!p.dead);
  if(!alive.length)return;
  const target=pick(alive);
  if(it.k==='atk'){
    const times=it.times||1;
    let total=0;
    for(let i=0;i<times;i++){
      let dmg=rollExpr(it.dmg).total;
      if(e.weak>0)dmg=Math.floor(dmg*0.75);
      if(target.vuln>0)dmg=Math.floor(dmg*1.5);
      const res=hitPlayer(target,dmg);
      total+=res.rest;
    }
    if(it.selfDmg)e.hp=Math.max(1,e.hp-it.selfDmg);
    blog(`${e.name} 使用「${it.n}」攻击 ${target.name}，造成 ${total} 点伤害。`);
    shakeChip(target);
    if(target.hp<=0&&!target.dead){
      target.hp=0;
      target.dead=true;
      blog(`${target.name} 倒下了！`,true);
      S.chronicle.push({type:'death',name:target.name,act:S.act});
    }
  }else if(it.k==='blk'){
    e.block+=it.amt;
    blog(`${e.name} 使用「${it.n}」，获得 ${it.amt} 点格挡。`);
  }else if(it.k==='deb'){
    if(it.weak)alive.forEach(p=>p.weak=(p.weak||0)+it.weak);
    if(it.vuln)alive.forEach(p=>p.vuln=(p.vuln||0)+it.vuln);
    blog(`${e.name} 使用「${it.n}」，全队陷入不利。`);
  }
}
function shakeChip(p){
  requestAnimationFrame(()=>{
    const el=document.querySelector(`.pchip[data-pidx="${p.id}"]`);
    if(el){el.classList.add('hit-shake');setTimeout(()=>el.classList.remove('hit-shake'),320);}
  });
}
function hitPlayer(p,dmg){
  const absorbed=Math.min(p.block,dmg);
  p.block-=absorbed;
  const rest=dmg-absorbed;
  p.hp=Math.max(0,p.hp-rest);
  if(p.clsKey==='knight'&&rest>0){
    p.resource=Math.min(p.resourceMax,p.resource+1);
  }
  return{absorbed,rest};
}
function hitEnemy(e,dmg){
  const absorbed=Math.min(e.block,dmg);
  e.block-=absorbed;
  const rest=dmg-absorbed;
  e.hp=Math.max(0,e.hp-rest);
  return{absorbed,rest};
}
function checkBattleEnd(){
  const b=S.battle;
  if(b.over)return true;
  if(!b.enemies.filter(e=>e.hp>0).length){
    b.over=true;
    blog('—— 战斗胜利 ——',true);
    render();
    const wasBoss=b.enemies.some(e=>e.boss);
    setTimeout(()=>endCombat(wasBoss),700);
    return true;
  }
  if(!S.players.filter(p=>p.hp>0&&!p.dead).length){
    b.over=true;render();
    setTimeout(()=>changeScreen('defeat'),800);
    return true;
  }
  return false;
}
async function endCombat(wasBoss){
  S.battle=null;
  if(wasBoss){
    const bossRelics=Object.keys(RELIC_DEFS).filter(k=>RELIC_DEFS[k].boss===S.act);
    if(bossRelics.length){
      const key=bossRelics[0];
      if(!S.relics.find(r=>r.key===key)){
        S.relics.push({key,cd:0});
      }
    }
  }
  const alive=S.players.filter(p=>!p.dead);
  if(!alive.length){await changeScreen('map');return;}
  const cards=alive.map(p=>{
    const pool=getAdvancedPool(p.clsKey);
    const filtered=pool.filter(c=>!p.masterDeck.includes(c));
    const finalPool=filtered.length?filtered:pool;
    return{playerId:p.id,cardId:pick(finalPool)};
  });
  S.reward={cards,mode:'pick'};
  await changeScreen('reward');
}

/* ============ 骰子 ============ */
function rollD20WithMode(adv,dis){
  const r1=d20();
  if(adv){const r2=d20();return{roll:Math.max(r1,r2),r1,r2,mode:'adv'};}
  if(dis){const r2=d20();return{roll:Math.min(r1,r2),r1,r2,mode:'dis'};}
  return{roll:r1,r1,r2:null,mode:'normal'};
}
function getCritThreshold(p){
  if(p.clsKey==='ranger'){
    if(p.resource>=5)return 18;
    if(p.resource>=3)return 19;
  }
  return 20;
}
function showDiceAsync(rollResult,title,detail,opts={},onSettle){
  return new Promise(resolve=>{
    const crit=!!opts.crit;
    const fumble=!!opts.fumble;
    document.querySelectorAll('.dice-pop').forEach(el=>el.remove());
    const el=document.createElement('div');
    el.className='dice-pop'+(crit?' crit':'')+(fumble?' fumble':'');
    let bodyHtml='';
    if(rollResult.mode==='adv'||rollResult.mode==='dis'){
      bodyHtml=`
        <div class="dice-pair-big">
          <div class="dice-slot r1">${D20_SVG}<div class="dice-num rolling">?</div></div>
          <div class="dice-slot r2">${D20_SVG}<div class="dice-num rolling">?</div></div>
        </div>`;
    }else{
      bodyHtml=`<div class="dice-body">${D20_SVG}<div class="d20val"><span class="rolling">?</span></div></div>`;
    }
    el.innerHTML=`
      <div class="dice-title">${title||'检定'}${rollResult.mode==='adv'?' · 优势':rollResult.mode==='dis'?' · 劣势':''}</div>
      ${bodyHtml}
      <div class="dice-detail">${detail||''}</div>`;
    document.body.appendChild(el);

    const rollers=el.querySelectorAll('.rolling');
    let ticks=0;
    const iv=setInterval(()=>{
      rollers.forEach(r=>{ r.textContent=1+Math.floor(Math.random()*20); });
      ticks++;
      if(ticks>=12){
        clearInterval(iv);
        if(rollResult.mode==='adv'||rollResult.mode==='dis'){
          const slots=el.querySelectorAll('.dice-slot');
          const r1El=slots[0].querySelector('.dice-num');
          const r2El=slots[1].querySelector('.dice-num');
          r1El.textContent=rollResult.r1;
          r2El.textContent=rollResult.r2;
          r1El.classList.remove('rolling');
          r2El.classList.remove('rolling');
          const winnerIsR1=rollResult.roll===rollResult.r1;
          slots[0].classList.add(winnerIsR1?'winner':'loser');
          slots[1].classList.add(winnerIsR1?'loser':'winner');
        }else{
          const r=el.querySelector('.rolling');
          if(r)r.textContent=rollResult.roll;
        }
        el.classList.add('settled');
        if(onSettle)onSettle();
        setTimeout(()=>{
          el.style.transition='opacity .35s';
          el.style.opacity='0';
          setTimeout(()=>{el.remove();resolve();},380);
        },1100);
      }
    },60);
  });
}

/* ============ 出牌 ============ */
async function playCard(handIdx,targetEnemyIdx){
  if(S.busy)return;
  const b=S.battle;
  if(!b||b.over||b.phase!=='player')return;
  const p=S.players[b.turnIdx];
  if(!p||p.dead||p.hp<=0)return;
  const cardId=p.hand[handIdx];
  if(!cardId)return;
  const c=CARD_DEFS[cardId];
  if(p.energy<c.cost)return;
  if(c.resCost&&p.resource<c.resCost)return;
  if(c.target==='enemy'&&targetEnemyIdx===undefined){
    const alive=b.enemies.filter(e=>e.hp>0);
    if(alive.length===1){targetEnemyIdx=b.enemies.indexOf(alive[0]);}
    else{S.selCard=handIdx;render();return;}
  }
  S.busy=true;
  try{
    p.energy-=c.cost;
    if(c.hpCost){
      p.hp=Math.max(1,p.hp-c.hpCost);
      blog(`${p.name} 献祭了 ${c.hpCost} 点生命。`);
    }
    if(c.resCost){
      p.resource-=c.resCost;
      blog(`${p.name} 消耗 ${c.resCost} ${p.resourceName}。`);
    }
    if(c.resGain){
      p.resource=Math.min(p.resourceMax,p.resource+c.resGain);
      blog(`${p.name} 获得 ${c.resGain} ${p.resourceName}。`);
    }
    p.hand.splice(handIdx,1);
    p.discard.push(cardId);
    S.selCard=-1;
    render();

    const enemy=(targetEnemyIdx!==undefined&&targetEnemyIdx>=0)?b.enemies[targetEnemyIdx]:null;
    const statMod=c.stat?effectiveStat(p,c.stat):0;
    const floats=[];

    if(c.type==='attack'){
      await resolveAttackAsync(p,enemy,c,statMod,false,floats);
      if(c.combo&&p.hand.length>=c.combo.threshold&&enemy&&enemy.hp>0){
        blog(`${p.name} 的「${c.n}」触发连击！`);
        await resolveAttackAsync(p,enemy,c,statMod,true,floats,true);
      }
    }
    else if(c.type==='aoe_attack'){
      await resolveAoeAttackAsync(p,c,statMod,floats);
    }
    else if(c.type==='auto_aoe'){
      b.enemies.forEach((e,ei)=>{
        if(e.hp<=0)return;
        let dmg=rollExpr(c.dmg).total;
        if(e.vuln>0)dmg=Math.floor(dmg*1.5);
        const res=hitEnemy(e,dmg);
        blog(`${p.name} 的「${c.n}」命中 ${e.name}，造成 ${res.rest} 点伤害。`);
        floats.push({kind:'enemy',idx:ei,text:'-'+res.rest,cls:'dmg'});
      });
    }
    else if(c.type==='random_hits'){
      const hits=c.hits||3;
      for(let i=0;i<hits;i++){
        const alive=b.enemies.filter(e=>e.hp>0);
        if(!alive.length)break;
        const e=pick(alive);
        let dmg=rollExpr(c.dmg).total;
        if(e.vuln>0)dmg=Math.floor(dmg*1.5);
        const res=hitEnemy(e,dmg);
        floats.push({kind:'enemy',idx:b.enemies.indexOf(e),text:'-'+res.rest,cls:'dmg'});
      }
      blog(`${p.name} 的「${c.n}」射出 ${hits} 箭。`);
    }
    else if(c.type==='auto'){
      if(enemy&&enemy.hp>0){
        let dmg=rollExpr(c.dmg).total;
        if(c.poisonBurst&&enemy.poison>0){
          dmg+=enemy.poison*c.poisonBurst;
          blog(`${enemy.name} 的 ${enemy.poison} 层中毒爆发！`);
          enemy.poison=0;
        }
        if(enemy.vuln>0)dmg=Math.floor(dmg*1.5);
        const res=hitEnemy(enemy,dmg);
        blog(`${p.name} 施放「${c.n}」，${enemy.name} 受到 ${res.rest} 点伤害。`);
        floats.push({kind:'enemy',idx:targetEnemyIdx,text:'-'+res.rest,cls:'dmg'});
        if(c.weak)enemy.weak+=c.weak;
      }
    }
    else if(c.type==='multi'){
      if(enemy&&enemy.hp>0){
        for(let i=0;i<c.times;i++){
          if(enemy.hp<=0)break;
          await resolveAttackAsync(p,enemy,c,statMod,true,floats,false);
        }
      }
    }
    else if(c.type==='aoe'){
      b.enemies.forEach((e,ei)=>{
        if(e.hp<=0)return;
        let dmg=rollExpr(c.dmg).total;
        if(e.vuln>0)dmg=Math.floor(dmg*1.5);
        const res=hitEnemy(e,dmg);
        if(c.weakAll)e.weak+=c.weakAll;
        blog(`${p.name} 的「${c.n}」命中 ${e.name}，造成 ${res.rest} 点伤害。`);
        floats.push({kind:'enemy',idx:ei,text:'-'+res.rest,cls:'dmg'});
      });
    }
    else if(c.type==='skill'){
      if(c.block)p.block+=c.block;
      if(c.heal)p.hp=Math.min(p.maxHp,p.hp+c.heal);
      if(c.bless)p.bless=(p.bless||0)+c.bless;
      if(c.draw)drawCards(p,c.draw);
      if(c.energyGain)p.energy+=c.energyGain;
      blog(`${p.name} 使用「${c.n}」。`);
      if(c.block)floats.push({kind:'player',idx:b.turnIdx,text:'+'+c.block+' 盾',cls:'block'});
    }
    else if(c.type==='heal'){
      const aliveList=S.players.filter(x=>!x.dead&&x.hp>0);
      aliveList.sort((a,b2)=>(a.hp/a.maxHp)-(b2.hp/b2.maxHp));
      const tgt=aliveList[0]||p;
      let amt=rollExpr(c.heal).total;
      if(p.clsKey==='cleric'&&p.resource>0)amt+=Math.floor(p.resource/2);
      tgt.hp=Math.min(tgt.maxHp,tgt.hp+amt);
      if(c.cleanse){tgt.weak=0;tgt.vuln=0;}
      if(c.draw)drawCards(p,c.draw);
      if(p.clsKey==='cleric')p.resource=Math.min(p.resourceMax,p.resource+2);
      blog(`${p.name} 的「${c.n}」为 ${tgt.name} 恢复 ${amt} 点生命。`);
      floats.push({kind:'player',idx:tgt.id,text:'+'+amt,cls:'heal'});
    }
    else if(c.type==='team_heal'){
      S.players.forEach((pl,i)=>{
        if(pl.dead||pl.hp<=0)return;
        let amt=rollExpr(c.heal).total;
        if(p.clsKey==='cleric'&&p.resource>0)amt+=Math.floor(p.resource/2);
        pl.hp=Math.min(pl.maxHp,pl.hp+amt);
        floats.push({kind:'player',idx:i,text:'+'+amt,cls:'heal'});
      });
      if(p.clsKey==='cleric')p.resource=Math.min(p.resourceMax,p.resource+2);
      blog(`${p.name} 使用「${c.n}」，全队恢复生命。`);
    }
    else if(c.type==='team_block'){
      S.players.forEach((pl,i)=>{
        if(pl.dead||pl.hp<=0)return;
        pl.block+=c.block;
        floats.push({kind:'player',idx:i,text:'+'+c.block+' 盾',cls:'block'});
      });
      blog(`${p.name} 使用「${c.n}」，全队获得 ${c.block} 点格挡。`);
    }
    else if(c.type==='ally_block'){
      const list=S.players.filter(x=>!x.dead&&x.hp>0);
      list.sort((a,b2)=>(a.hp/a.maxHp)-(b2.hp/b2.maxHp));
      const tgt=list[0]||p;
      tgt.block+=c.block;
      blog(`${p.name} 为 ${tgt.name} 提供 ${c.block} 点格挡。`);
      floats.push({kind:'player',idx:tgt.id,text:'+'+c.block+' 盾',cls:'block'});
    }
    else if(c.type==='bless'){
      p.bless=(p.bless||0)+c.bless;
      blog(`${p.name} 使用「${c.n}」，下次检定 +${c.bless}。`);
      floats.push({kind:'player',idx:b.turnIdx,text:'祝福 +'+c.bless,cls:'block'});
    }
    else if(c.type==='debuff'){
      if(enemy&&enemy.hp>0){
        if(c.vuln)enemy.vuln+=c.vuln;
        blog(`${p.name} 对 ${enemy.name} 施加「${c.n}」。`);
        floats.push({kind:'enemy',idx:targetEnemyIdx,text:'易伤 +'+c.vuln,cls:'block'});
      }
    }

    if(p.clsKey==='rogue'&&['attack','multi','auto','aoe','aoe_attack','random_hits'].includes(c.type)){
      p.resource=Math.min(p.resourceMax,p.resource+1);
    }

    render();
    requestAnimationFrame(()=>floats.forEach(showFloat));
    checkBattleEnd();
  } finally {
    S.busy=false;
  }
}

/* 攻击结算 —— 只在骰子定格瞬间应用一次并显示一次 */
async function resolveAttackAsync(p,enemy,c,statMod,silent,floats,delayAfter){
  if(!enemy||enemy.hp<=0)return;
  const b=S.battle;
  const rollResult=rollD20WithMode(c.adv,c.dis);
  let bonus=statMod+(p.bless||0);
  if(p.bless>0)p.bless=0;
  if(p.weak>0)bonus-=2;
  if(p.clsKey==='rogue'&&p.resource>=4)bonus+=Math.floor(p.resource/4);
  const total=rollResult.roll+bonus;
  const critThreshold=getCritThreshold(p);
  const crit=rollResult.roll>=critThreshold||rollResult.roll===20;
  const fumble=rollResult.roll===1;
  const hit=crit||(!fumble&&total>=enemy.ac);

  if(p.clsKey==='ranger'){
    if(hit)p.resource=Math.min(p.resourceMax,p.resource+1);
    else p.resource=0;
  }

  if(!silent){
    let dmgCalc=null;
    if(hit){
      dmgCalc=rollExpr(c.dmg).total;
      if(crit)dmgCalc*=2;
      if(c.blockDmg)dmgCalc+=Math.floor(p.block*c.blockDmg);
      if(c.bonusVsVuln&&enemy.vuln>0)dmgCalc*=c.bonusVsVuln;
      if(c.bonusVsWeak&&enemy.weak>0)dmgCalc=Math.floor(dmgCalc*c.bonusVsWeak);
      if(c.execute&&enemy.hp/enemy.maxHp<c.execute)dmgCalc*=2;
      if(c.resBonus)dmgCalc+=p.resource*c.resBonus;
      if(enemy.vuln>0)dmgCalc=Math.floor(dmgCalc*1.5);
      if(p.weak>0)dmgCalc=Math.floor(dmgCalc*0.75);
    }
    await showDiceAsync(rollResult,
      `${p.name} 的检定`,
      `${rollResult.roll}${rollResult.mode!=='normal'?'（优势/劣势）':''} + ${bonus} = ${total} vs AC ${enemy.ac} · ${hit?(crit?'暴击!':'命中'):'失手'}`,
      {crit,fumble},
      ()=>{
        // 仅在定格瞬间应用一次伤害 + 显示一次浮动
        if(hit&&enemy.hp>0){
          const res=hitEnemy(enemy,dmgCalc);
          blog(`${p.name} 的「${c.n}」${crit?'暴击':''}命中 ${enemy.name}，造成 ${res.rest} 点伤害。`);
          if(c.weak)enemy.weak+=c.weak;
          if(c.poison)enemy.poison+=c.poison;
          if(c.vuln)enemy.vuln+=c.vuln;
          if(enemy.hp<=0)blog(`${enemy.name} 被击倒了！`);
          floats.push({kind:'enemy',idx:b.enemies.indexOf(enemy),text:'-'+res.rest,cls:crit?'dmg crit':'dmg'});
          render();
          requestAnimationFrame(()=>{ floats.forEach(showFloat); floats.length=0; });
        } else if(!hit){
          blog(`${p.name} 的「${c.n}」${fumble?'大失败':'失手'}了。`);
        }
      });
    if(delayAfter)await sleep(80);
  } else {
    if(!hit){blog(`${p.name} 的「${c.n}」${fumble?'大失败':'失手'}了。`);return;}
    let dmg=rollExpr(c.dmg).total;
    if(crit)dmg*=2;
    if(c.blockDmg)dmg+=Math.floor(p.block*c.blockDmg);
    if(c.bonusVsVuln&&enemy.vuln>0)dmg*=c.bonusVsVuln;
    if(c.bonusVsWeak&&enemy.weak>0)dmg=Math.floor(dmg*c.bonusVsWeak);
    if(c.execute&&enemy.hp/enemy.maxHp<c.execute)dmg*=2;
    if(c.resBonus)dmg+=p.resource*c.resBonus;
    if(enemy.vuln>0)dmg=Math.floor(dmg*1.5);
    if(p.weak>0)dmg=Math.floor(dmg*0.75);
    const res=hitEnemy(enemy,dmg);
    blog(`${p.name} 的「${c.n}」${crit?'暴击':''}命中 ${enemy.name}，造成 ${res.rest} 点伤害。`);
    if(c.weak)enemy.weak+=c.weak;
    if(c.poison)enemy.poison+=c.poison;
    if(c.vuln)enemy.vuln+=c.vuln;
    if(enemy.hp<=0)blog(`${enemy.name} 被击倒了！`);
    if(floats)floats.push({kind:'enemy',idx:b.enemies.indexOf(enemy),text:'-'+res.rest,cls:crit?'dmg crit':'dmg'});
  }
}
async function resolveAoeAttackAsync(p,c,statMod,floats){
  const b=S.battle;
  const rollResult=rollD20WithMode(c.adv,c.dis);
  let bonus=statMod+(p.bless||0);
  if(p.bless>0)p.bless=0;
  if(p.weak>0)bonus-=2;
  const total=rollResult.roll+bonus;
  const critThreshold=getCritThreshold(p);
  const crit=rollResult.roll>=critThreshold||rollResult.roll===20;
  const fumble=rollResult.roll===1;
  await showDiceAsync(rollResult,
    `${p.name} 的${statName(c.stat)}检定（群体）`,
    `${rollResult.roll} + ${bonus} = ${total} · ${crit?'暴击!':(fumble?'大失败':'结算')}`,
    {crit,fumble},
    ()=>{
      if(fumble){blog(`${p.name} 的「${c.n}」大失败，无人生还。`);return;}
      b.enemies.forEach((e,ei)=>{
        if(e.hp<=0)return;
        if(!crit&&total<e.ac)return;
        let dmg=rollExpr(c.dmg).total;
        if(crit)dmg*=2;
        if(e.vuln>0)dmg=Math.floor(dmg*1.5);
        if(p.weak>0)dmg=Math.floor(dmg*0.75);
        const res=hitEnemy(e,dmg);
        blog(`${p.name} 的「${c.n}」命中 ${e.name}，造成 ${res.rest} 点伤害。`);
        floats.push({kind:'enemy',idx:ei,text:'-'+res.rest,cls:crit?'dmg crit':'dmg'});
      });
      render();
      requestAnimationFrame(()=>{ floats.forEach(showFloat); floats.length=0; });
    });
}

/* ============ 结束回合 ============ */
function endTurn(){
  const b=S.battle;
  if(!b||b.over||b.phase!=='player'||S.busy)return;
  const p=S.players[b.turnIdx];
  if(p){
    S.energyCarry=Math.min(p.energy,2);
    p.discard.push(...p.hand);
    p.hand=[];
    p.weak=Math.max(0,(p.weak||0)-1);
    p.vuln=Math.max(0,(p.vuln||0)-1);
    if(p.clsKey==='mage')p.resource=Math.max(0,p.resource-1);
  }
  S.selCard=-1;
  b.turnIdx++;
  beginTurn();
  render();
}

/* ============ 使用道具 ============ */
function usePotion(pi){
  const b=S.battle;
  if(!b||b.phase!=='player')return;
  const p=S.players[b.turnIdx];
  if(!p||!p.potions[pi]||p.dead)return;
  const key=p.potions[pi];
  p.potions.splice(pi,1);
  const floats=[];
  if(key==='heal'){
    const amt=rollExpr('2d4+4').total;
    p.hp=Math.min(p.maxHp,p.hp+amt);
    blog(`${p.name} 饮下治疗药水，恢复 ${amt} 点生命。`);
    floats.push({kind:'player',idx:b.turnIdx,text:'+'+amt,cls:'heal'});
  }else if(key==='energy'){p.energy+=2;blog(`${p.name} 饮下精力药剂，获得 2 点能量。`);floats.push({kind:'player',idx:b.turnIdx,text:'+2 能量',cls:'block'});}
  else if(key==='iron'){p.block+=12;blog(`${p.name} 饮下铁皮药水，获得 12 点格挡。`);floats.push({kind:'player',idx:b.turnIdx,text:'+12 盾',cls:'block'});}
  else if(key==='luck'){p.bless=(p.bless||0)+10;blog(`${p.name} 使用幸运币，下次检定 +10。`);floats.push({kind:'player',idx:b.turnIdx,text:'幸运 +10',cls:'block'});}
  else if(key==='strength'){p.tempStats.str+=3;blog(`${p.name} 饮下力量药剂。`);floats.push({kind:'player',idx:b.turnIdx,text:'力量 +3',cls:'block'});}
  else if(key==='dexterity'){p.tempStats.dex+=3;blog(`${p.name} 饮下敏捷药剂。`);floats.push({kind:'player',idx:b.turnIdx,text:'敏捷 +3',cls:'block'});}
  else if(key==='focus'){drawCards(p,3);blog(`${p.name} 饮下专注药水，抽 3 张牌。`);floats.push({kind:'player',idx:b.turnIdx,text:'+3 手牌',cls:'block'});}
  else if(key==='purge'){p.weak=0;p.vuln=0;blog(`${p.name} 净化负面状态。`);floats.push({kind:'player',idx:b.turnIdx,text:'净化',cls:'heal'});}
  else if(key==='fire_bomb'){
    b.enemies.forEach((e,ei)=>{
      if(e.hp<=0)return;
      let dmg=rollExpr('2d6').total;
      if(e.vuln>0)dmg=Math.floor(dmg*1.5);
      const res=hitEnemy(e,dmg);
      floats.push({kind:'enemy',idx:ei,text:'-'+res.rest,cls:'dmg'});
    });
    blog(`${p.name} 投出火焰瓶。`);
  }
  render();
  requestAnimationFrame(()=>floats.forEach(showFloat));
  checkBattleEnd();
}

/* ============ 遗物使用 ============ */
function useRelic(idx){
  if(S.busy)return;
  const b=S.battle;
  if(!b||b.phase!=='player')return;
  const p=S.players[b.turnIdx];
  if(!p||p.dead)return;
  const r=S.relics[idx];
  if(!r||r.cd>0)return;
  const def=RELIC_DEFS[r.key];
  if(!def)return;
  def.effect(p);
  r.cd=def.cooldown;
  blog(`${p.name} 使用遗物「${def.n}」（冷却 ${def.cooldown} 回合）。`,true);
  render();
}

/* ============ 浮动文字 ============ */
function showFloat(f){
  if(f.kind==='enemy'){
    const el=document.querySelector(`.enemy[data-eidx="${f.idx}"]`);
    if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),320);floatingText(f.text,el,f.cls);}
  }else{
    const el=document.querySelector(`.pchip[data-pidx="${f.idx}"]`);
    if(el)floatingText(f.text,el,f.cls);
  }
}
function floatingText(text,el,cls){
  const rect=el.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='float-text '+(cls||'');
  pop.textContent=text;
  pop.style.left=(rect.left+rect.width/2)+'px';
  pop.style.top=(rect.top+rect.height/2)+'px';
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),1100);
}

/* ============ 转场 ============ */
async function changeScreen(newScreen,fn){
  if(S.transitionLock){S.screen=newScreen;if(fn)fn();render();return;}
  S.transitionLock=true;
  const fade=document.createElement('div');
  fade.className='fade-overlay';fade.style.opacity='0';
  document.body.appendChild(fade);
  await sleep(20);fade.style.opacity='1';await sleep(280);
  S.screen=newScreen;if(fn)fn();render();
  await sleep(30);fade.style.opacity='0';await sleep(280);
  fade.remove();S.transitionLock=false;
}
async function fadeTransition(){
  const fade=document.createElement('div');
  fade.className='fade-overlay';fade.style.opacity='0';
  document.body.appendChild(fade);
  await sleep(20);fade.style.opacity='1';await sleep(280);
  render();
  await sleep(30);fade.style.opacity='0';await sleep(280);
  fade.remove();
}

function getNodeIntro(type){
  const pools={
    battle:[{flavor:'林子深处传来踩断枯枝的声音，不止一只。',title:'遭 遇'},{flavor:'雪地上有一串脚印，它们刚刚停下。',title:'遭 遇'},{flavor:'空气变冷了，某种东西正在靠近。',title:'遭 遇'}],
    elite:[{flavor:'它比传说中更庞大。你听见自己的心跳。',title:'精 英'},{flavor:'脚下的泥土在震颤，这不是普通的敌人。',title:'精 英'}],
    boss:[{flavor:'雾散了。它就在那里，等了很久。',title:'首 领'},{flavor:'远处有什么在动，不是风，不是树影。',title:'首 领'}],
    event:[{flavor:'你们走到了一个不该停留的地方。',title:'事 件'},{flavor:'路边有什么在等着，也许是机会。',title:'事 件'}],
    camp:[{flavor:'天色暗了下来。该歇一歇了。',title:'营 地'}],

}
async function showLevelIntro(intro){
  return new Promise(resolve=>{
    S.intro=intro;S.screen='levelIntro';render();
    setTimeout(resolve,2400);
  });
}
async function enterNode(node){
  const intro=getNodeIntro(node.type);
  await showLevelIntro(intro);
  if(node.type==='battle'||node.type==='elite'||node.type==='boss'){
    setupCombat(genEncounter(node.type==='elite',node.type==='boss'));
    S.screen='battle';
    await fadeTransition();
    startBattle();
  }else if(node.type==='event'){
    S.event=genEvent();
    await changeScreen('event');
  }else if(node.type==='camp'){
    await changeScreen('camp');
  }else if(node.type==='treasure'){
    await changeScreen('treasure');
  }
}
function enterLayer(layerIdx,nodeIdx){
  const node=S.map.layers[layerIdx][nodeIdx];
  S.map.currentLayer=layerIdx;
  S.map.path.push(node.id);
  S.showPathChoice=false;
  enterNode(node);
}
async function advanceMap(){
  const nextLayer=S.map.currentLayer+1;
  if(nextLayer>=S.map.layers.length){
    if(S.act>=3){await changeScreen('victory');return;}
    const revives=[],healers=[];
    S.players.forEach(p=>{
      p.block=0;p.weak=0;p.vuln=0;p.resource=0;
      if(p.dead){
        p.dead=false;
        p.hp=Math.ceil(p.maxHp*0.3);
        revives.push(p.name);
      }else if(p.hp>0){
        const before=p.hp;
        p.hp=Math.min(p.maxHp,p.hp+Math.ceil(p.maxHp*0.4));
        if(p.hp>before)healers.push(p.name);
      }
    });
    S.relics.forEach(r=>{r.cd=0;});
    const prevAct=S.act;
    startNewAct(S.act+1);
    await showInterlude({prevAct,nextAct:S.act,nextName:S.map.actName,revives,healers});
    await changeScreen('map');
    return;
  }
  const options=S.map.layers[nextLayer];
  if(options.length===1){enterLayer(nextLayer,0);}
  else{S.showPathChoice=true;render();}
}
async function showInterlude(info){
  return new Promise(resolve=>{
    S.interlude=info;S.screen='interlude';render();
    setTimeout(resolve,3200);
  });
}

function mapSVG(){
  const m=S.map;const layers=m.layers;const curLayer=m.currentLayer;const path=m.path;
  const showChoice=S.showPathChoice;
  const maxLayer=showChoice?Math.min(curLayer+1,layers.length-1):curLayer;
  const W=320,rowH=78,nodeR=22,padTop=36;
  const H=padTop+(maxLayer+1)*rowH+30;
  const positions={};
  layers.forEach((row,li)=>{
    if(li>maxLayer)return;
    const n=row.length;
    row.forEach((node,idx)=>{
      const y=padTop+li*rowH;
      let x;
      if(n===1)x=W/2;
      else if(n===2)x=idx===0?96:224;
      else x=64+idx*96;
      positions[node.id]={x,y,node,li,idx};
    });
  });
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="map-svg" style="width:100%;height:${H}px;">`;
  for(let i=0;i<path.length-1;i++){
    const a=positions[path[i]],b=positions[path[i+1]];
    if(a&&b)svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  if(showChoice&&path.length){
    const cur=positions[path[path.length-1]];
    if(cur){
      layers[curLayer+1].forEach(n=>{
        const p=positions[n.id];
        if(p)svg+=`<line x1="${cur.x}" y1="${cur.y}" x2="${p.x}" y2="${p.y}" stroke="#141414" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.55"/>`;
      });
    }
  }
  layers.forEach((row,li)=>{
    if(li>maxLayer)return;
    row.forEach((node,idx)=>{
      const p=positions[node.id];
      if(!p)return;
      const visited=path.includes(node.id);
      const isCurrent=(li===curLayer&&visited);
      const isChoice=(showChoice&&li===curLayer+1);
      const meta=NODE_META[node.type];
      const clickable=isChoice;
      const attrs=clickable?`data-act="choosePath" data-id="${node.id}" style="cursor:pointer"`:'';
      let fill='#fff',stroke='#141414',strokeW=2.2,opacity=1;
      if(!visited&&!isChoice)opacity=0.28;
      if(isCurrent)strokeW=3.6;
      if(isChoice){fill='#f4f2ee';strokeW=2.8;}
      svg+=`<g ${attrs} opacity="${opacity}">`;
      if(isChoice)svg+=`<circle cx="${p.x}" cy="${p.y}" r="${nodeR+7}" fill="none" stroke="#141414" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>`;
      svg+=`<circle cx="${p.x}" cy="${p.y}" r="${nodeR}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"/>`;
      svg+=`<g transform="translate(${p.x-16}, ${p.y-16}) scale(${32/60})">${ART[meta.art]||ART.sword}</g></g>`;
      svg+=`<text x="${p.x}" y="${p.y+nodeR+14}" text-anchor="middle" font-size="11.5" fill="#141414" font-family="serif" opacity="${opacity}">${meta.label}</text>`;
    });
  });
  svg+=`</svg>`;
  return svg;
}
function campSceneSVG(players){
  const W=380,H=300;const cx=W/2,cy=H*0.58;
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="camp-svg">`;
  svg+=`<defs><radialGradient id="fireGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f8ecd0" stop-opacity="0.85"/><stop offset="100%" stop-color="#f8ecd0" stop-opacity="0"/></radialGradient></defs>`;
  svg+=`<path d="M0 ${cy+55} Q ${cx} ${cy+25} ${W} ${cy+55} L ${W} ${H} L 0 ${H} Z" fill="#f8f6f0"/>`;
  svg+=`<path d="M0 ${cy+55} Q ${cx} ${cy+25} ${W} ${cy+55}" fill="none" stroke="#141414" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.4"/>`;
  svg+=`<circle cx="${cx}" cy="${cy+12}" r="120" fill="url(#fireGlow)"/>`;
  svg+=`<g stroke="#141414" stroke-width="3" stroke-linecap="round"><line x1="${cx-26}" y1="${cy+34}" x2="${cx+26}" y2="${cy+26}"/><line x1="${cx-22}" y1="${cy+40}" x2="${cx+24}" y2="${cy+42}"/><line x1="${cx-16}" y1="${cy+30}" x2="${cx+18}" y2="${cy+34}"/></g>`;
  svg+=`<g transform="translate(${cx-18},${cy-30})"><path d="M18 42 C4 24 26 16 18 0 C34 14 42 26 34 38 C30 47 21 49 18 42 Z" fill="#fff" stroke="#141414" stroke-width="2.2" stroke-linejoin="round"/><path d="M18 34 C14 24 24 20 18 12 C26 20 28 26 24 34" fill="none" stroke="#141414" stroke-width="1.2"/></g>`;
  const alivePlayers=players.filter(p=>!p.dead);
  const n=alivePlayers.length;
  if(n>0){
    const radius=n===1?78:(n===2?94:(n===3?100:108));
    const startAngle=-Math.PI/2+0.55;
    alivePlayers.forEach((p,i)=>{
      const angle=startAngle+(i/n)*Math.PI*2;
      const px=cx+Math.cos(angle)*radius;
      const py=cy+18+Math.sin(angle)*radius*0.52;
      svg+=`<ellipse cx="${px}" cy="${py+20}" rx="18" ry="6" fill="#f0ebe0" stroke="#141414" stroke-width="1.2" opacity="0.7"/>`;
      svg+=`<circle cx="${px}" cy="${py}" r="18" fill="#fff" stroke="#141414" stroke-width="1.8"/>`;
      svg+=`<g transform="translate(${px-14}, ${py-14}) scale(${28/60})">${ART[p.art]||ART.shield}</g>`;
      svg+=`<text x="${px}" y="${py+34}" text-anchor="middle" font-size="10.5" fill="#141414" font-family="serif" letter-spacing="1">${p.clsName}</text>`;
    });
  } else {
    svg+=`<text x="${cx}" y="${cy+80}" text-anchor="middle" font-size="14" fill="#141414" font-family="serif" opacity="0.5" letter-spacing="3">无人幸存</text>`;
  }
  svg+=`</svg>`;
  return svg;
}

function viewBattle(){
  const b=S.battle;if(!b)return '';
  const curIdx=b.turnIdx;
  const curPlayer=S.players[curIdx];
  const cur=(b.phase==='player'&&curPlayer&&!curPlayer.dead&&curPlayer.hp>0)?curPlayer:null;

  let chips=S.players.map((pl,i)=>{
    const active=(i===curIdx&&b.phase==='player'&&!pl.dead&&pl.hp>0);
    const hpPct=Math.max(0,Math.min(100,pl.hp/pl.maxHp*100));
    const resPct=Math.max(0,Math.min(100,pl.resource/pl.resourceMax*100));
    const st=[];
    if(pl.bless)st.push(`祝+${pl.bless}`);
    if(pl.tempStats.str)st.push(`力+${pl.tempStats.str}`);
    if(pl.tempStats.dex)st.push(`敏+${pl.tempStats.dex}`);
    if(pl.weak)st.push(`弱${pl.weak}`);
    if(pl.vuln)st.push(`易${pl.vuln}`);
    return `<div class="pchip ${active?'active':''} ${pl.dead?'dead':''}" data-pidx="${i}">
      <div class="pchip-header"><span class="pchip-name">${pl.name} · ${pl.clsName}</span><span class="pchip-hp">${Math.max(0,pl.hp)}/${pl.maxHp}</span></div>
      <div class="bar"><i style="width:${hpPct}%"></i></div>
      <div class="pchip-stats"><span>力${pl.stats.str}</span><span>敏${pl.stats.dex}</span><span>智${pl.stats.int}</span><span>感${pl.stats.wis}</span></div>
      <div class="pchip-res"><span>${pl.resourceName}</span><div class="res-bar"><i style="width:${resPct}%"></i></div><span>${pl.resource}/${pl.resourceMax}</span></div>
      <div class="pchip-footer"><span>盾 ${pl.block}${st.length?' · '+st.join('·'):''}</span><span class="potion-count">道具 × ${pl.potions.length}</span></div>
    </div>`;
  }).join('');

  const relicBar=S.relics.length
    ? `<div class="relic-bar"><span class="label">遗物</span>${S.relics.map((r,ri)=>{
        const def=RELIC_DEFS[r.key];
        const canUse=cur&&r.cd<=0;
        return `<div class="relic ${r.cd>0?'cooling':'ready'}" ${canUse?`data-act="useRelic" data-i="${ri}"`:''} data-tooltip="relic:${r.key}">
          ${artSVG(def.art)}
          ${r.cd>0?`<span class="cd">${r.cd}</span>`:''}
        </div>`;
      }).join('')}</div>`
    : `<div class="relic-bar"><span class="label">遗物 · 无</span></div>`;

  const targeting=S.selCard>=0;
  const enemies=b.enemies.map((e,i)=>{
    const hpPct=Math.max(0,e.hp/e.maxHp*100);
    const it=e.intent||{};
    let icon='sword',num='';
    if(it.k==='atk'){icon='sword';num=it.dmg+(it.times?` ×${it.times}`:'');}
    else if(it.k==='blk'){icon='shield';num='格挡 '+it.amt;}
    else{icon='skull';num=it.n||'诅咒';}
    const st=[];
    if(e.vuln)st.push('易伤'+e.vuln);
    if(e.weak)st.push('虚弱'+e.weak);
    if(e.poison)st.push('中毒'+e.poison);
    return `<div class="enemy ${e.hp<=0?'dead':''} ${targeting&&e.hp>0?'targetable':''}" data-eidx="${i}" ${targeting&&e.hp>0?`data-act="pickEnemy" data-i="${i}"`:''}>
      ${artSVG(e.art)}
      <div class="ename">${e.name}</div>
      <div class="bar"><i style="width:${hpPct}%"></i></div>
      <div style="font-size:11px;margin-top:3px;">${Math.max(0,e.hp)} / ${e.maxHp}${e.block?` · 盾${e.block}`:''}</div>
      ${e.hp>0?`<div class="intent">${artSVG(icon)}<span>${num}</span></div>`:''}
      ${st.length?`<div class="statuses">${st.join(' · ')}</div>`:''}
    </div>`;
  }).join('');

  const logs=b.log.slice(-14).map(l=>`<div class="l ${l.big?'big':''}">${l.text}</div>`).join('');
  let handHtml='';
  if(cur){
    handHtml=cur.hand.map((cid,i)=>{
      const c=CARD_DEFS[cid];
      const afford=cur.energy>=c.cost&&(!c.resCost||cur.resource>=c.resCost);
      const sel=S.selCard===i;
      const up=isUpgraded(cid);
      return `<div class="card ${afford?'afford':'cant'} ${sel?'sel':''} ${up?'upgraded':''}" data-i="${i}" ${afford?`data-act="playCard"`:''} title="${descFor(cid).replace(/"/g,'&quot;')}">
        <div class="cost">${c.cost}</div><div class="cname">${c.n}</div>
        ${artSVG(c.art)}<div class="ctxt">${descFor(cid)}</div>
        <div class="ctype">${cardTypeLabel(c)}</div>
      </div>`;
    }).join('')||'<div class="hand-empty">— 手 牌 已 空 —</div>';
  }else if(b.phase==='enemy'){handHtml='<div class="hand-empty">敌 人 行 动 中 …</div>';}

  const deckInfo=cur?`<div class="deck-info"><span>牌库 ${cur.deck.length}</span><span>弃牌 ${cur.discard.length}</span></div>`:'';
  const totalEnergy=cur?(cur.maxEnergy+(S.energyCarry||0)):0;
  const pips=cur?Array.from({length:Math.max(totalEnergy,cur.energy)},(_,i)=>{
    const isCarry=i>=cur.maxEnergy&&i<cur.maxEnergy+S.energyCarry;
    return `<div class="pip ${i<cur.energy?'on':''} ${isCarry&&i>=cur.energy?'carry':''}"></div>`;
  }).join(''):'';

  const potionDock=cur&&cur.potions.length
    ? `<div class="potion-dock show"><span class="label">道具</span>${cur.potions.map((k,pi)=>{
        const pd=POTION_DEFS[k];
        return `<div class="potion" data-act="usePotion" data-i="${pi}" data-tooltip="potion:${k}">${artSVG(pd.art)}</div>`;
      }).join('')}</div>`
    :'<div class="potion-dock"></div>';

  return `<div class="screen">
    <div class="battle-top">${chips}</div>
    ${relicBar}
    <div class="battle-mid">
      <div class="enemy-area">${enemies}</div>
      <div class="log-area" id="logArea">${logs}</div>
    </div>
    <div class="hand-area">${potionDock}${handHtml}${deckInfo}</div>
    <div class="battle-bottom">
      <div style="display:flex;align-items:center;gap:14px;">
        <span>${cur?`${cur.name} 的能量`:'—'}</span>
        <div class="energy-pips">${pips}</div>
        ${cur?`<span style="opacity:.6;font-size:13px;">格挡 ${cur.block}${S.energyCarry>0?` · 传承 +${S.energyCarry}`:''}</span>`:''}
      </div>
      <button class="btn" data-act="endTurn" ${(!cur||b.phase!=='player')?'disabled':''}>结 束 回 合</button>
    </div>
  </div>`;
}
function cardTypeLabel(c){
  if(['attack','auto','multi','aoe','aoe_attack','auto_aoe','random_hits'].includes(c.type))return '攻 击';
  if(['skill','team_block','ally_block','bless'].includes(c.type))return '技 能';
  if(['heal','team_heal','debuff'].includes(c.type))return '法 术';
  return '技 能';
}

const EVENT_RELIC_MAP={
  '路 边 的 求 助':['blood_stone'],
  '古 老 的 祭 坛':['shrine_charm','rosary'],
  '雾 中 的 声 音':['blind_eye','saint_bone'],
  '废 弃 的 商 队':['broken_harp'],
  '岔 路':['traveller_guide'],
  '井 边 的 交 易':['well_coin'],
  '铁 栅 栏 之 后':['rusted_key','broken_badge'],
};
function applyEventFx(fx,evTitle){
  const msgs=[];
  if(fx==='damage'){
    S.players.forEach(p=>{
      if(p.dead)return;
      const dmg=rollExpr('1d8').total;
      p.hp=Math.max(0,p.hp-dmg);
      if(p.hp<=0){p.dead=true;S.chronicle.push({type:'death',name:p.name,act:S.act});}
    });
    msgs.push('全队各受到 1d8 点伤害。');
  }else if(fx==='card'){
    const alive=S.players.filter(p=>!p.dead);
    if(!alive.length)return msgs;
    const who=pick(alive);
    const pool=getAdvancedPool(who.clsKey);
    if(!pool.length){msgs.push('但没有一张牌愿意加入你们。');return msgs;}
    const cid=pick(pool);const c=CARD_DEFS[cid];
    who.masterDeck.push(cid);
    msgs.push(`${who.name} 获得了「${c.n}」。`);
  }else if(fx==='potion'){
    const k=pick(Object.keys(POTION_DEFS));
    const alive=S.players.filter(p=>!p.dead);
    if(!alive.length)return msgs;
    const who=pick(alive);
    if(who.potions.length<5){who.potions.push(k);msgs.push(`${who.name} 获得了「${POTION_DEFS[k].n}」。`);}
    else msgs.push(`${who.name} 的道具栏已经满了。`);
  }else if(fx==='bless'){
    S.players.forEach(p=>{if(!p.dead)p.bless=(p.bless||0)+3;});
    msgs.push('全队下次检定 +3。');
  }
  if(evTitle&&EVENT_RELIC_MAP[evTitle]&&Math.random()<0.35){
    const pool=EVENT_RELIC_MAP[evTitle];
    const avail=pool.filter(k=>!S.relics.find(r=>r.key===k));
    if(avail.length){
      const key=pick(avail);
      S.relics.push({key,cd:0});
      msgs.push(`获得遗物「${RELIC_DEFS[key].n}」。`);
    }
  }
  return msgs;
}

/* ============ 交互 ============ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  switch(act){
    case 'toCount':await changeScreen('count');break;
    case 'setCount':S.count=+el.dataset.n;S.picks=[];await changeScreen('class');break;
    case 'pickClass':{
      const k=el.dataset.k;
      if(S.picks.includes(k))return;
      S.picks.push(k);
      if(S.picks.length>=S.count){
        S.players=S.picks.map((key,i)=>createPlayer(key,i));
        S.relics=[];S.energyCarry=0;S.relicTickRound=0;
        startNewAct(1);
        await changeScreen('map');
      }else{render();}
      break;
    }
    case 'advance':await advanceMap();break;
    case 'choosePath':{
      const nodeId=el.dataset.id;
      const nextLayer=S.map.currentLayer+1;
      const idx=S.map.layers[nextLayer].findIndex(n=>n.id===nodeId);
      if(idx<0)break;
      enterLayer(nextLayer,idx);
      break;
    }
    case 'playCard':{
      if(S.busy)break;
      const i=+el.dataset.i;
      const b=S.battle;if(!b)break;
      const p=S.players[b.turnIdx];
      const cid=p.hand[i];const c=CARD_DEFS[cid];
      if(p.energy<c.cost||(c.resCost&&p.resource<c.resCost)){
        el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),420);break;
      }
      if(c.target==='enemy'){
        const alive=b.enemies.filter(x=>x.hp>0);
        if(alive.length===1){playCard(i,b.enemies.indexOf(alive[0]));}
        else{S.selCard=(S.selCard===i?-1:i);render();}
      }else{playCard(i);}
      break;
    }
    case 'pickEnemy':{
      if(S.selCard<0||S.busy)break;
      playCard(S.selCard,+el.dataset.i);
      break;
    }
    case 'endTurn':endTurn();break;
    case 'usePotion':usePotion(+el.dataset.i);break;
    case 'useRelic':useRelic(+el.dataset.i);break;

    case 'chooseEvent':{
      const i=+el.dataset.i;
      const ev=S.event;
      const ch=ev.choices[i];
      let head='',text='',fx='none',epilogue='';
      if(!ch.stat){
        head='继 续';text=ch.ok;fx=ch.okFx||'none';epilogue=ch.okEpilogue||'';
      }else{
        const roller=pick(S.players.filter(p=>!p.dead&&p.hp>0))||S.players[0];
        const mod=roller.stats[ch.stat]||0;
        const r=d20();const total=r+mod;
        const crit=r===20;const fumble=r===1;
        const success=crit||(!fumble&&total>=ch.dc);
        await showDiceAsync({roll:r,r1:r,mode:'normal'},`${roller.name} 的${statName(ch.stat)}检定`,
          `${r} + ${mod} = ${total} vs DC ${ch.dc} · ${success?'成功':'失败'}`,
          {crit,fumble});
        if(success){head='成 功';text=ch.ok;fx=ch.okFx;epilogue=ch.okEpilogue||'';}
        else{head='失 败';text=ch.bad;fx=ch.badFx;epilogue=ch.badEpilogue||'';}
      }
      const fxMsgs=applyEventFx(fx,ev.title);
      S.eventResult={head,text:text+(epilogue?`<br><br><span style="opacity:.65;font-style:italic;">${epilogue}</span>`:'')+(fxMsgs.length?'<br><br><span style="opacity:.75;font-size:15px;">'+fxMsgs.join('<br>')+'</span>':'')};
      S.chronicle.push({type:'event',title:ev.title,head,choice:ch.label});
      await changeScreen('eventResult');
      break;
    }
    case 'eventDone':{
      if(S.players.every(p=>p.dead||p.hp<=0)){await changeScreen('defeat');break;}
      await changeScreen('map');
      break;
    }
    case 'takeCard':{
      const rc=S.reward.cards[+el.dataset.i];
      const p=S.players.find(x=>x.id===rc.playerId);
      if(p&&!p.dead)p.masterDeck.push(rc.cardId);
      await changeScreen('map');
      break;
    }
    case 'healReward':{
      S.players.forEach(p=>{
        if(p.dead)return;
        const amt=rollExpr('2d6+4').total;
        p.hp=Math.min(p.maxHp,p.hp+amt);
      });
      await changeScreen('map');
      break;
    }
    case 'campRest':{
      S.players.forEach(p=>{
        if(p.dead)return;
        const amt=Math.ceil(p.maxHp*0.35);
        p.hp=Math.min(p.maxHp,p.hp+amt);
      });
      await changeScreen('map');
      break;
    }
    case 'campTrain':{
      const alive=S.players.filter(p=>!p.dead);
      if(!alive.length){await changeScreen('map');break;}
      S.campPick={rows:alive.map(p=>{
        const pool=getAdvancedPool(p.clsKey);
        return{player:p,cards:shuffle(pool).slice(0,3),chosen:null};
      })};
      await changeScreen('campPick');
      break;
    }
    case 'pickCampCard':{
      const ri=+el.dataset.row;const ci=+el.dataset.i;
      if(!S.campPick)break;
      const row=S.campPick.rows[ri];
      if(!row||row.chosen!==null)break;
      row.chosen=row.cards[ci];
      render();
      break;
    }
    case 'campPickDone':{
      if(!S.campPick)break;
      const allChosen=S.campPick.rows.every(r=>r.chosen!==null);
      if(!allChosen)break;
      S.campPick.rows.forEach(r=>{if(r.chosen)r.player.masterDeck.push(r.chosen);});
      S.campPick=null;
      await changeScreen('map');
      break;
    }
    case 'campUpgrade':await changeScreen('upgrade');break;
    case 'cancelUpgrade':await changeScreen('map');break;
    case 'doUpgrade':{
      const pi=+el.dataset.p;const ci=+el.dataset.i;
      const p=S.players[pi];
      if(!p||p.dead)break;
      const cid=p.masterDeck[ci];
      if(!cid||isUpgraded(cid))break;
      S.pendingUpgrade={pi,ci};
      await changeScreen('upgradeConfirm');
      break;
    }
    case 'confirmUpgrade':{
      const pu=S.pendingUpgrade;
      if(!pu){await changeScreen('map');break;}
      const p=S.players[pu.pi];
      const cid=p.masterDeck[pu.ci];
      const newId=cid+'_up';
      if(p&&CARD_DEFS[newId]){
        p.masterDeck[pu.ci]=newId;
        for(let i=0;i<p.deck.length;i++)if(p.deck[i]===cid)p.deck[i]=newId;
        for(let i=0;i<p.hand.length;i++)if(p.hand[i]===cid)p.hand[i]=newId;
        for(let i=0;i<p.discard.length;i++)if(p.discard[i]===cid)p.discard[i]=newId;
      }
      S.pendingUpgrade=null;
      await changeScreen('map');
      break;
    }
    case 'cancelUpgradeConfirm':S.pendingUpgrade=null;await changeScreen('upgrade');break;
    case 'treasureOpen':{
      const keys=Object.keys(POTION_DEFS);
      const msgs=[];
      S.players.forEach(p=>{
        if(p.dead)return;
        if(p.potions.length<5){
          const k=pick(keys);
          p.potions.push(k);
          msgs.push(`${p.name} 获得「${POTION_DEFS[k].n}」`);
        }
      });
      const relicPool=Object.keys(RELIC_DEFS).filter(k=>!RELIC_DEFS[k].boss&&!S.relics.find(r=>r.key===k));
      if(relicPool.length&&Math.random()<0.4){
        const key=pick(relicPool);
        S.relics.push({key,cd:0});
        msgs.push(`获得遗物「${RELIC_DEFS[key].n}」`);
      }
      const alive=S.players.filter(p=>!p.dead);
      if(alive.length){
        const who=pick(alive);
        const pool=getAdvancedPool(who.clsKey);
        if(pool.length){
          const cid=pick(pool);
          who.masterDeck.push(cid);
          msgs.push(`${who.name} 获得卡牌「${CARD_DEFS[cid].n}」`);
        }
      }
      S.eventResult={head:'满 载 而 归',text:msgs.join('。<br>')+'。'};
      S.event={title:'宝 箱'};
      await changeScreen('eventResult');
      break;
    }
    case 'treasureLeave':await changeScreen('map');break;
    case 'restart':
      S.screen='title';S.count=1;S.picks=[];S.players=[];
      S.act=1;S.map=null;S.chronicle=[];S.relics=[];S.energyCarry=0;S.relicTickRound=0;
      S.battle=null;S.event=null;S.reward=null;S.eventResult=null;S.interlude=null;
      S.campPick=null;S.pendingUpgrade=null;
      document.querySelectorAll('.dice-pop, .float-text, .fade-overlay').forEach(el=>el.remove());
      render();break;
  }
});

/* 悬停伤害预览 */
document.addEventListener('mouseover',e=>{
  const card=e.target.closest('.card[data-act="playCard"]');
  if(!card)return;
  if(!S.battle||S.battle.phase!=='player'||S.busy)return;
  const b=S.battle;const p=S.players[b.turnIdx];if(!p)return;
  const i=+card.dataset.i;const cid=p.hand[i];if(!cid)return;
  const c=CARD_DEFS[cid];
  if(!c.dmg)return;
  if(c.target!=='enemy'&&!['aoe','aoe_attack','auto_aoe'].includes(c.type))return;
  document.querySelectorAll('.dmg-preview').forEach(x=>x.remove());
  const range=dmgRange(c.dmg);
  const statMod=c.stat?effectiveStat(p,c.stat):0;
  let bonus=statMod+(p.bless||0)-(p.weak>0?2:0);
  if(p.clsKey==='rogue'&&p.resource>=4)bonus+=Math.floor(p.resource/4);
  b.enemies.forEach((en,idx)=>{
    if(en.hp<=0)return;
    const el=document.querySelector(`.enemy[data-eidx="${idx}"]`);
    if(!el)return;
    const threshold=en.ac-bonus;
    let hitChance;
    if(c.adv){
      hitChance=Math.max(0.05,Math.min(0.95,(21-threshold)/20));
      hitChance=1-Math.pow(1-hitChance,2);
    }else if(c.dis){
      hitChance=Math.max(0.05,Math.min(0.95,(21-threshold)/20));
      hitChance=Math.pow(hitChance,2);
    }else if(c.type==='auto'){
      hitChance=1;
    }else{
      hitChance=Math.max(0.05,Math.min(0.95,(21-threshold)/20));
    }
    const avgDmg=(range.min+range.max)/2;
    let exp=hitChance*avgDmg;
    if(c.times)exp*=c.times;
    if(c.hits)exp*=c.hits;
    if(c.blockDmg)exp+=Math.floor(p.block*c.blockDmg);
    if(c.bonusVsVuln&&en.vuln>0)exp*=c.bonusVsVuln;
    if(c.bonusVsWeak&&en.weak>0)exp*=c.bonusVsWeak;
    if(c.execute&&en.hp/en.maxHp<c.execute)exp*=2;
    if(en.vuln>0)exp*=1.5;
    if(p.weak>0)exp*=0.75;
    const preview=document.createElement('div');
    preview.className='dmg-preview';
    preview.innerHTML=`命中 ${Math.round(hitChance*100)}% · 期望 ${Math.round(exp*10)/10}`;
    el.style.position='relative';
    el.appendChild(preview);
  });
});
document.addEventListener('mouseout',e=>{
  const card=e.target.closest('.card[data-act="playCard"]');
  if(!card)return;
  document.querySelectorAll('.dmg-preview').forEach(x=>x.remove());
});

const tooltipEl=document.getElementById('tooltip');
document.addEventListener('mouseover',e=>{
  const relEl=e.target.closest('[data-tooltip]');
  if(!relEl)return;
  const key=relEl.getAttribute('data-tooltip');
  let html='';
  if(key.startsWith('relic:')){
    const rkey=key.slice(6);
    const def=RELIC_DEFS[rkey];
    if(!def)return;
    const relic=S.relics.find(r=>r.key===rkey);
    const cd=relic?relic.cd:0;
    html=`<b>${def.n}</b>${def.t}<br><span style="opacity:.6;font-size:11px;">冷却 ${def.cooldown} 回合${cd>0?` · 剩余 ${cd}`:''}</span>`;
  } else if(key.startsWith('potion:')){
    const pkey=key.slice(7);
    const def=POTION_DEFS[pkey];
    if(!def)return;
    html=`<b>${def.n}</b>${def.t}`;
  }
  if(!html)return;
  tooltipEl.innerHTML=html;
  tooltipEl.style.left='-9999px';
  tooltipEl.style.top='-9999px';
  tooltipEl.classList.add('show');
  const rect=relEl.getBoundingClientRect();
  const tipRect=tooltipEl.getBoundingClientRect();
  const margin=8;
  let left=rect.left+rect.width/2-tipRect.width/2;
  let top=rect.top-tipRect.height-8;
  if(left<margin)left=margin;
  if(left+tipRect.width>window.innerWidth-margin)left=window.innerWidth-tipRect.width-margin;
  if(top<margin)top=rect.bottom+8;
  if(top+tipRect.height>window.innerHeight-margin)top=window.innerHeight-tipRect.height-margin;
  tooltipEl.style.left=left+'px';
  tooltipEl.style.top=top+'px';
});
document.addEventListener('mouseout',e=>{
  const relEl=e.target.closest('[data-tooltip]');
  if(!relEl)return;
  tooltipEl.classList.remove('show');
});
window.addEventListener('scroll',()=>tooltipEl.classList.remove('show'),true);

render();
</script>
</body>
</html>
