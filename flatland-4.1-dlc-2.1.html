const EN_TERMS = Object.entries(EN_TEXT).sort((a,b)=>b[0].length-a[0].length);
function tr(value){
  if(value === null || value === undefined) return value;
  const raw = String(value);
  if(!game || !game.settings || game.settings.language !== 'en') return raw;
  if(Object.prototype.hasOwnProperty.call(EN_TEXT, raw)) return EN_TEXT[raw];
  let out = raw;
  for(const [zh,en] of EN_TERMS){ if(zh && out.includes(zh)) out = out.split(zh).join(en); }
  return out;
}
function applyLanguage(){
  const en = game.settings && game.settings.language === 'en';
  document.documentElement.lang = en ? 'en' : 'zh-CN';
  document.title = en ? 'FLATLAND' : '平面国 FLATLAND';
  const rotate = document.getElementById('rotate');
  if(rotate) rotate.textContent = en ? 'Please rotate your device to landscape' : '请旋转设备至横屏';
}
const _nativeFillText = CanvasRenderingContext2D.prototype.fillText;
CanvasRenderingContext2D.prototype.fillText = function(text, x, y, maxWidth){
  const localized = tr(text);
  if(arguments.length >= 4) return _nativeFillText.call(this, localized, x, y, maxWidth);
  return _nativeFillText.call(this, localized, x, y);
};

/* ============================================================
   1. 随机数（可复现 Seed）
   ============================================================ */
class RNG {
  constructor(seed){ this.s = (seed>>>0) || 1; }
  next(){
    let t = this.s += 0x6D2B79F5;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  }
  range(a,b){ return a + this.next()*(b-a); }
  int(a,b){ return Math.floor(this.range(a, b+1)); }
  pick(arr){ return arr[Math.floor(this.next()*arr.length)]; }
  shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(this.next()*(i+1));
      const t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }
}

/* ============================================================
   2. 音频系统（Web Audio API 程序化生成）
   ============================================================ */
const AudioSys = {
  ac:null, master:null, sfxGain:null, musicGain:null, ok:false, unlocked:false,
  init(){
    if(this.ac) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      const vol = Number.isFinite(Number(game.settings.volume)) ? clamp(Number(game.settings.volume),0,1) : 0.6;
      game.settings.volume = vol;
      this.master.gain.value = vol;
      this.master.connect(this.ac.destination);
      this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.85;
      this.sfxGain.connect(this.master);
      this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.35;
      this.musicGain.connect(this.master);
      this.ok = true;
    }catch(e){ this.ok = false; this.ac = null; }
  },
  resume(){
    if(!this.ac) return Promise.resolve(false);
    if(this.ac.state === 'running') return Promise.resolve(true);
    try{
      const p = this.ac.resume();
      return p && typeof p.then === 'function' ? p.then(()=>this.ac.state === 'running').catch(()=>false) : Promise.resolve(this.ac.state === 'running');
    }catch(e){ return Promise.resolve(false); }
  },
  unlock(){
    this.init();
    if(!this.ac || !this.ok) return;
    if(this.unlocked && this.ac.state === 'running') return;
    this.unlocked = true;
    this.resume().then(()=>{
      if(this.ac && this.ac.state === 'running' && typeof Music !== 'undefined') Music.onAudioUnlocked();
    });
    // 在一次真实用户手势中创建一个几乎不可闻的短脉冲，兼容 iOS/Safari 的音频解锁策略。
    try{
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      g.gain.setValueAtTime(0.00001, t);
      g.gain.exponentialRampToValueAtTime(0.00001, t + 0.02);
      o.frequency.value = 440;
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.025);
    }catch(e){}
  },
  setVolume(v){
    game.settings.volume = v;
    if(this.master) this.master.gain.value = v;
  },
  blip(freq, dur, type, vol, slide){
    if(!this.ok || !this.ac) return;
    try{
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(Math.max(20,freq), t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t+dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.15), t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(this.sfxGain);
      o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  },
  ui(){ this.blip(720,0.06,'square',0.10,900); },

const Music = {
  track:null, step:0, next:0, timer:null, lastRequested:null,
  play(name, force=false){
    AudioSys.init();
    if(!AudioSys.ok) return;
    this.lastRequested = name;
    if(this.track === name && !force){
      if(AudioSys.ac && AudioSys.ac.state === 'running') this.tick();
      return;
    }
    this.stop();
    const def = TRACKS[name] || TRACKS.area;
    this.track = name; this.def = def;
    this.step = 0; this.next = AudioSys.ac.currentTime + 0.06;
    this.timer = setInterval(()=>this.tick(), 55);
    this.tick();
  },
  onAudioUnlocked(){
    if(this.track){
      this.play(this.track, true);
      return;
    }
    if(game.state === 'MENU' || game.state === 'BOOT') this.play('menu', true);
    else if(game.state === 'BOSS' || game.state === 'BOSS_INTRO') this.play(game.area === AREAS.length-1 ? 'final' : 'boss', true);
    else if(game.state === 'VICTORY' || game.state === 'ENDING') this.play('victory', true);
    else if(game.state === 'DEFEAT' || game.state === 'DEATH') this.play('defeat', true);
    else if(game.state === 'PLAYING') this.play(game.area === AREAS.length-1 ? 'final' : 'area', true);
  },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer = null; } this.track = null; },
  tick(){
    if(!AudioSys.ok || !this.track) return;
    const d = this.def;
    const spb = 60/d.bpm/2;
    let guard = 0;
    while(this.next < AudioSys.ac.currentTime + 0.3 && guard++ < 24){
      const i = this.step % d.pattern.length;
      const semi = d.pattern[i];
      if(semi !== null && semi !== undefined){
        this.note(d.root*Math.pow(2, semi/12), this.next, spb*1.7, 0.055, d.wave);
      }
      if(d.bass && d.bass.length){
        const bi = this.step % d.bass.length;
        const bs = d.bass[bi];
        if(bs !== null && bs !== undefined){
          this.note(d.root*0.5*Math.pow(2, bs/12), this.next, spb*2.4, 0.07, 'triangle');
        }
      }
      this.step++; this.next += spb;
    }
  },
  note(freq, t, dur, vol, wave){
    try{
      const o = AudioSys.ac.createOscillator();
      const g = AudioSys.ac.createGain();
      o.type = wave; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(AudioSys.musicGain);
      o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  }
};

const Input = {
  keys:{},
  mouse:{x:VW/2, y:VH/2, down:false, rdown:false},
  touchMode:false,
  joy:{active:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0},
  btn:{attack:false, skill:false, dodge:false, ui:false, pause:false},
  touchButtons:{},
  weaponScrollTouch:null,
  _clickQueue:[],

  init(){
    const unlockFromGesture = ()=> AudioSys.unlock();
    window.addEventListener('pointerdown', unlockFromGesture, {capture:true, passive:true});
    window.addEventListener('touchstart', unlockFromGesture, {capture:true, passive:true});
    window.addEventListener('mousedown', unlockFromGesture, {capture:true, passive:true});
    window.addEventListener('keydown', e=>{
      this.keys[e.code] = true;
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0) e.preventDefault();
      AudioSys.unlock();
      this.onKey(e.code);
    });
    window.addEventListener('keyup', e=>{ this.keys[e.code] = false; });

    canvas.addEventListener('mousemove', e=>{
      const p = toLogical(e.clientX, e.clientY);
      this.mouse.x = p.x; this.mouse.y = p.y;
    });
    canvas.addEventListener('wheel', e=>{
      if(game.state === 'EQUIPMENT' && e.clientX > window.innerWidth*0.38){
        game.weaponScrollTarget = clamp(game.weaponScrollTarget + e.deltaY*0.75, 0, getWeaponScrollMax());
        e.preventDefault();
      }
    }, {passive:false});
    canvas.addEventListener('mousedown', e=>{
      AudioSys.unlock();
      const p = toLogical(e.clientX, e.clientY);
      this.mouse.x = p.x; this.mouse.y = p.y;
      if(e.button === 0){ this.mouse.down = true; this._clickQueue.push({x:p.x,y:p.y,btn:0}); }
      if(e.button === 2){ this.mouse.rdown = true; }
      e.preventDefault();
    });
    window.addEventListener('mouseup', e=>{
      if(e.button === 0) this.mouse.down = false;
      if(e.button === 2) this.mouse.rdown = false;
    });
    canvas.addEventListener('contextmenu', e=> e.preventDefault());

    // 触摸
    const ts = e=>{
      AudioSys.unlock();
      this.touchMode = true;
      for(const t of e.changedTouches){
        const p = toLogical(t.clientX, t.clientY);
        this.touchStart(t.identifier, p.x, p.y);
      }
      e.preventDefault();
    };
    const tm = e=>{
      for(const t of e.changedTouches){
        const p = toLogical(t.clientX, t.clientY);
        this.touchMove(t.identifier, p.x, p.y);
      }
      e.preventDefault();
    };
    const te = e=>{
      for(const t of e.changedTouches){
        this.touchEnd(t.identifier);
      }
      e.preventDefault();
    };
    canvas.addEventListener('touchstart', ts, {passive:false});
    canvas.addEventListener('touchmove', tm, {passive:false});
    canvas.addEventListener('touchend', te, {passive:false});
    canvas.addEventListener('touchcancel', te, {passive:false});

    window.addEventListener('blur', ()=>{ this.keys = {}; this.mouse.down = false; this.mouse.rdown = false; });
  },

  onKey(code){
    if(code === 'Escape'){ GameActions.togglePause(); }
    if(code === 'KeyE'){ GameActions.toggleEquipment(); }
    if((game.state === 'SETTINGS' || game.state === 'ABOUT') && code === 'Escape'){ Music.play('menu'); setState('MENU'); return; }
    if(game.state === 'MENU'){
      if(code === 'Enter' || code === 'Space'){ GameActions.menuConfirm(); }
      if(code === 'ArrowUp' || code === 'KeyW') game.menuSel = Math.max(0, game.menuSel-1);
      if(code === 'ArrowDown' || code === 'KeyS') game.menuSel = Math.min(3, game.menuSel+1);
    }
    if(game.state === 'DIALOGUE'){
      if(code === 'Enter' || code === 'Space') GameActions.nextDialogue();
    }
  },

  touchStart(id, x, y){
    if(game.state === 'EQUIPMENT' && x >= 500 && y >= 125 && y <= 625){
      this.weaponScrollTouch = {id, x, y, lastY:y, moved:false};
      return;
    }
    // 只有实际游戏/暂停相关状态才把右侧区域识别成游戏按钮。
    const gameplayState = ['PLAYING','BOSS','BOSS_INTRO','DIALOGUE','PAUSE','EQUIPMENT','MAP','SHOP','REWARD'].includes(game.state);
    if(gameplayState && this.hitButton(x, y, id)) return;

    // 菜单、设置、关于、死亡、结局等界面：统一作为普通点击处理。
    if(x < VW*0.5 && (game.state === 'PLAYING' || game.state === 'BOSS')){
      if(!this.joy.active){
        this.joy.active = true; this.joy.id = id;
        this.joy.ox = x; this.joy.oy = y;
        this.joy.x = x; this.joy.y = y;
        this.joy.dx = 0; this.joy.dy = 0;
        return;
      }
    }

    this._clickQueue.push({x, y, btn:0, touchId:id});
  },
  touchMove(id, x, y){
    if(this.weaponScrollTouch && this.weaponScrollTouch.id === id){
      const dy = y - this.weaponScrollTouch.lastY;
      if(Math.abs(y - this.weaponScrollTouch.y) > 8) this.weaponScrollTouch.moved = true;
      game.weaponScrollTarget = clamp(game.weaponScrollTarget - dy, 0, getWeaponScrollMax());
      this.weaponScrollTouch.lastY = y;
      return;
    }
    if(this.joy.active && this.joy.id === id){
      this.joy.x = x; this.joy.y = y;
      let dx = x - this.joy.ox, dy = y - this.joy.oy;
      const d = Math.hypot(dx, dy);
      const max = 70;
      if(d > max){ dx = dx/d*max; dy = dy/d*max; }
      this.joy.dx = dx/max; this.joy.dy = dy/max;
    }
  },
  touchEnd(id){
    if(this.weaponScrollTouch && this.weaponScrollTouch.id === id){
      const q=this.weaponScrollTouch; this.weaponScrollTouch=null;
      if(!q.moved) this._clickQueue.push({x:q.x,y:q.y,btn:0,touchId:id});
      return;
    }
    if(this.joy.active && this.joy.id === id){
      this.joy.active = false; this.joy.id = null;
      this.joy.dx = 0; this.joy.dy = 0;
    }
    const key = this.touchButtons[id];
    if(key){
      this.btn[key] = false;
      delete this.touchButtons[id];
    }
  },

  // 触摸按钮区域（逻辑坐标）
  touchBtns(){
    return [
      {k:'attack', x:1150, y:600, r:48},
      {k:'skill',  x:1040, y:645, r:42},
      {k:'dodge',  x:1155, y:480, r:38},
      {k:'ui',     x:1215, y:40,  r:26},
      {k:'pause',  x:1215, y:100, r:26}
    ];
  },
  hitButton(x, y, id){
    if(!this.touchMode && !('ontouchstart' in window)) return false;
    const combat = game.state === 'PLAYING' || game.state === 'BOSS';
    const btns = this.touchBtns();
    for(const b of btns){
      if(Math.hypot(x-b.x, y-b.y) < b.r + 14){
        if((b.k === 'attack' || b.k === 'skill' || b.k === 'dodge') && !combat) return false;
        if(b.k === 'ui'){
          if(game.state === 'PLAYING' || game.state === 'BOSS' || game.state === 'SHOP' || game.state === 'DIALOGUE' || game.state === 'PAUSE') GameActions.toggleEquipment();
          return true;
        }
        if(b.k === 'pause'){
          if(game.state === 'PLAYING' || game.state === 'BOSS' || game.state === 'PAUSE') GameActions.togglePause();
          return true;
        }
        this.btn[b.k] = true;
        this.touchButtons[id] = b.k;
        return true;
      }
    }
    return false;
  },

  get moveX(){
    let mx = 0;
    if(this.keys['KeyA'] || this.keys['ArrowLeft']) mx -= 1;
    if(this.keys['KeyD'] || this.keys['ArrowRight']) mx += 1;
    if(this.joy.active) mx += this.joy.dx;
    return clamp(mx, -1, 1);
  },
  get moveY(){
    let my = 0;
    if(this.keys['KeyW'] || this.keys['ArrowUp']) my -= 1;
    if(this.keys['KeyS'] || this.keys['ArrowDown']) my += 1;
    if(this.joy.active) my += this.joy.dy;
    return clamp(my, -1, 1);
  },
  get attackDown(){ return this.mouse.down || this.btn.attack; },
  get skillDown(){ return this.mouse.rdown || this.btn.skill; },
  get dodgeDown(){ return !!this.keys['Space'] || this.btn.dodge; },

  consumeClicks(){
    const q = this._clickQueue;
    this._clickQueue = [];
    return q;
  }
};

function toLogical(cx, cy){
  const r = canvas.getBoundingClientRect();
  return { x:(cx - r.left)/r.width * VW, y:(cy - r.top)/r.height * VH };
}

/* ============================================================
   6. UI 按钮系统
   ============================================================ */
const UI = {
  buttons: [],
  add(x,y,w,h,label,action,opts){
    this.buttons.push({x,y,w,h,label,action,opts:opts||{}});
  },
  handleClick(px, py){
    for(let i = this.buttons.length-1; i >= 0; i--){
      const b = this.buttons[i];
      if(px >= b.x && px <= b.x+b.w && py >= b.y && py <= b.y+b.h){
        if(b.opts.disabled) return true;
        AudioSys.ui();
        try{ b.action(); }catch(e){}
        return true;
      }
    }
    return false;
  },
  draw(){
    for(const b of this.buttons){
      const disabled = b.opts.disabled;
      const hover = b.opts.hover;
      ctx.fillStyle = disabled ? 'rgba(40,45,55,0.55)' : (hover ? 'rgba(90,140,200,0.28)' : 'rgba(30,40,55,0.55)');
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = disabled ? 'rgba(90,100,115,0.5)' : 'rgba(130,180,240,0.7)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(b.x+0.5, b.y+0.5, b.w-1, b.h-1);
      ctx.fillStyle = disabled ? 'rgba(140,150,165,0.5)' : '#dceafa';
      ctx.font = '500 ' + (b.opts.font || 20) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2 + 1);
    }
  }
};

/* ============================================================
   7. 几何绘制工具
   ============================================================ */
function polyPath(g, x, y, r, sides, rot){
  g.beginPath();
  if(sides <= 0 || sides > 40){
    g.arc(x, y, r, 0, TAU);
  } else {
    for(let i = 0; i < sides; i++){
      const a = rot - Math.PI/2 + i * TAU / sides;
      const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
      if(i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
  }
}
function drawPoly(g, x, y, r, sides, rot, fill, stroke, lw){
  polyPath(g, x, y, r, sides, rot);
  if(fill){ g.fillStyle = fill; g.fill(); }
  if(stroke){ g.strokeStyle = stroke; g.lineWidth = lw||2; g.stroke(); }
}

function drawBar(x, y, w, h, pct, color, bg){
  ctx.fillStyle = bg || 'rgba(255,255,255,0.10)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * clamp(pct,0,1), h);
}

/* ============================================================
   8. 玩家
   ============================================================ */
function makePlayer(){
  const p = {
    x:0, y:0, vx:0, vy:0,
    level:3, xp:0,
    hp:20, maxhp:20, en:20, maxen:20,
    baseAtk:4, permanentAtkBonus:0, speed:240, atkSpeedMul:1, iframeTime:0.65,
    r:15, sides:3,
    facing:0, invuln:0, hurtFlash:0, dead:false,
    dodgeT:0, dodgeCd:0, dodgeDx:0, dodgeDy:0,
    atkPhase:'none', atkT:0, atkCd:0,
    skillCd:0, skillLock:0,
    animT:0, morphT:0,
    atkBuff:0
  };
  recalcPlayer(p, true);
  p.hp = p.maxhp; p.en = p.maxen;
  return p;
}

function recalcPlayer(p, full){
  const lv = p.level;
  const oldMax = p.maxhp || 20, oldMaxEn = p.maxen || 20;
  p.maxhp = 24 + (lv - 3) * 2;
  p.maxen = 20 + (lv - 3) * 2;
  p.baseAtk = 5 + Math.floor((lv - 3) / 2);
  p.speed = 240 + (lv - 3) * 3;
  p.atkSpeedMul = 1 + Math.floor((lv - 3) / 2) * 0.05;
  p.iframeTime = 0.65 + Math.floor((lv - 3) / 3) * 0.05;
  p.r = 15 + (lv - 3) * 0.85;
  p.sides = lv >= 13 ? 0 : lv;
  if(!full){
    p.hp = Math.min(p.maxhp, p.hp + (p.maxhp - oldMax));
    p.en = Math.min(p.maxen, p.en + (p.maxen - oldMaxEn));
  }
}

function playerAttackDamage(){
  const w = WEAPONS[game.equipped] || WEAPONS.hornblade;
  return game.player.baseAtk + (w.atk||0) + Math.floor(game.player.atkBuff||0);
}

/* ============================================================
   9. 房间系统
   ============================================================ */
function makeRoom(type, areaIdx){
  const isBoss = (type === 'boss');
  const w = isBoss ? 2200 : 1800;
  const h = isBoss ? 1200 : 1000;
  const room = {
    type, w, h,
    walls: [],
    obstacles: [],
    enemies: [],
    cleared: false,
    exit: null,
    exitT: 0,
    doorOpen: false,
    spawnT: 0
  };

  // 内部障碍
  if(!isBoss && (type === 'combat' || type === 'elite')){
    const n = game.rng.int(2, 4);
    for(let i = 0; i < n; i++){
      const bw = game.rng.range(90, 240);
      const bh = game.rng.range(60, 180);
      const bx = game.rng.range(220, w - bw - 220);
      const by = game.rng.range(180, h - bh - 180);
      // 避免阻挡中心
      if(Math.abs(bx + bw/2 - w/2) < 200 && Math.abs(by + bh/2 - h/2) < 160) continue;
      room.obstacles.push({x:bx, y:by, w:bw, h:bh});
    }
  }
  return room;
}

function spawnEnemiesForRoom(room, type, areaIdx){
  const area = AREAS[areaIdx];
  const pool = area.enemies;
  let count, elite = false;
  if(type === 'combat') count = game.rng.int(DIFFICULTY.spawnMin, DIFFICULTY.spawnMax);
  else if(type === 'elite'){ count = game.rng.int(DIFFICULTY.eliteMin, DIFFICULTY.eliteMax); elite = true; }
  else if(type === 'miniboss') count = 0;
  else count = 0;

  const cx = room.w/2, cy = room.h/2;
  for(let i = 0; i < count; i++){
    const key = pool[game.rng.int(0, pool.length-1)];
    const def = ENEMY_TYPES[key];
    if(!def) continue;
    let x, y, tries = 0;
    do{
      const ang = game.rng.range(0, TAU);
      const rad = game.rng.range(280, 620);
      x = cx + Math.cos(ang)*rad;
      y = cy + Math.sin(ang)*rad;
      tries++;
    } while(tries < 20 && (x < 80 || x > room.w-80 || y < 80 || y > room.h-80));

    const e = makeEnemy(def, x, y);
    if(elite){
      e.elite = true;
      e.maxhp = Math.round(e.maxhp * 1.75);
      e.hp = e.maxhp;
      e.dmg = Math.round(e.dmg * 1.20);
      e.r *= 1.25;
      e.xp = Math.round(e.xp * 2.2);
      e.color = '#ff8a5c';
    }
    room.enemies.push(e);
  }
}

function makeEnemy(def, x, y){
  const chosenColor = Array.isArray(def.colors) ? def.colors[Math.floor(Math.random()*def.colors.length)] : def.color;
  return {
    def, name: def.name,
    x, y, vx:0, vy:0,
    hp: Math.max(1, Math.round(def.hp * DIFFICULTY.bossHp)), maxhp: Math.max(1, Math.round(def.hp * DIFFICULTY.bossHp)),
    dmg: def.dmg, speed: def.speed,
    r: def.r, sides: def.sides, color: chosenColor,
    xp: def.xp, ai: def.ai, palette: !!def.palette,
    angle: 0, t: 0, flash: 0, dead: false,
    atkCd: 0, hitCd: 0, windup: 0, charging: 0,
    cvx:0, cvy:0, elite:false,
    wobble: Math.random()*TAU
  };
}

/* ============================================================
   10. 碰撞
   ============================================================ */
function resolveCircleRect(o, r){
  const nx = clamp(o.x, r.x, r.x + r.w);
  const ny = clamp(o.y, r.y, r.y + r.h);
  let dx = o.x - nx, dy = o.y - ny;
  let d2 = dx*dx + dy*dy;
  if(d2 > o.r*o.r) return false;
  if(d2 > 0.0001){
    const d = Math.sqrt(d2);
    const push = o.r - d;
    o.x += dx/d * push; o.y += dy/d * push;
  } else {
    const left = o.x - r.x, right = r.x + r.w - o.x;
    const top = o.y - r.y, bottom = r.y + r.h - o.y;
    const m = Math.min(left, right, top, bottom);
    if(m === left) o.x = r.x - o.r;
    else if(m === right) o.x = r.x + r.w + o.r;
    else if(m === top) o.y = r.y - o.r;
    else o.y = r.y + r.h + o.r;
  }
  return true;
}

function clampToRoom(o){
  const room = game.room;
  if(!room) return;
  o.x = clamp(o.x, o.r, room.w - o.r);
  o.y = clamp(o.y, o.r, room.h - o.r);
}

   11. 特效 / 粒子 / 飘字

function addParticles(x, y, color, n, spread){
  if(game.particles.length > 420) return;
  spread = spread || 200;
  for(let i = 0; i < n; i++){
    const a = Math.random()*TAU, s = Math.random()*spread;
    game.particles.push({
      x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life: 0.4 + Math.random()*0.5, maxLife: 0.9,
      color, size: 2 + Math.random()*3
    });
  }
}

function addText(x, y, txt, color, big){
  game.texts.push({x, y, txt:String(txt), color:color||'#fff', life:0.8, maxLife:0.8, big:!!big});
}

function addEffect(e){
  game.effects.push(e);
  if(game.effects.length > 120) game.effects.shift();
}

function addShockwave(x, y, r, color){
  addEffect({type:'wave', x, y, r:0, target:r, life:0.45, maxLife:0.45, color:color||'#9fd8ff'});
}

/* ============================================================
   13. 玩家更新
   ============================================================ */
function updatePlayer(dt){
  const p = game.player;
  if(!p || p.dead) return;

  p.animT += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  p.atkCd = Math.max(0, p.atkCd - dt);
  p.skillCd = Math.max(0, p.skillCd - dt);
  p.dodgeCd = Math.max(0, p.dodgeCd - dt);
  p.morphT = Math.max(0, p.morphT - dt);
  if(p.atkBuff > 0) p.atkBuff = Math.max(0, p.atkBuff - dt*0.15);

  // 测试者模式：完整解锁、最高等级、生命与能量始终满格。
  if(isTesterMode()){
    if(p.level !== 13) applyTesterMode();
    p.hp = p.maxhp;
    p.en = p.maxen;
  } else {
    // 能量缓慢恢复
    p.en = Math.min(p.maxen, p.en + dt * 0.6);
  }

  // 朝向
  if(Input.touchMode){
    const mx = Input.moveX, my = Input.moveY;
    if(Math.abs(mx) > 0.15 || Math.abs(my) > 0.15){
      p.facing = Math.atan2(my, mx);
    }
  } else {
    const wx = Input.mouse.x + game.camera.x;
    const wy = Input.mouse.y + game.camera.y;
    p.facing = Math.atan2(wy - p.y, wx - p.x);
  }

  // 移动端没有鼠标，因此攻击/技能时自动锁定最近目标，避免只能朝最后一次移动方向攻击。
  if(Input.touchMode && (Input.attackDown || Input.skillDown)){
    let target = null, best = Infinity;
    for(const e of game.enemies){
      if(e.dead) continue;
      const d = Math.hypot(e.x-p.x, e.y-p.y);
      if(d < best){ best = d; target = e; }
    }
    if(game.boss && !game.boss.dead){
      const d = Math.hypot(game.boss.x-p.x, game.boss.y-p.y);
      if(d < best){ best = d; target = game.boss; }
    }
    if(target && best < 760){
      p.facing = Math.atan2(target.y-p.y, target.x-p.x);
    }
  }

  // 闪避
  if(p.dodgeT > 0){
    p.dodgeT -= dt;
    const spd = 105 / 0.18;
    p.x += p.dodgeDx * spd * dt;
    p.y += p.dodgeDy * spd * dt;
    if(Math.random() < 0.7){
      game.particles.push({x:p.x, y:p.y, vx:0, vy:0, life:0.25, maxLife:0.25, color:'#7fd4ff', size:4});
    }
  } else {
    // 移动
    let mx = Input.moveX, my = Input.moveY;
    const m = Math.hypot(mx, my);
    if(m > 1){ mx /= m; my /= m; }
    let spd = p.speed;
    if(p.atkPhase === 'wind' || p.atkPhase === 'act') spd *= 0.35;
    p.x += mx * spd * dt;
    p.y += my * spd * dt;

    // 闪避触发
    if(Input.dodgeDown && p.dodgeCd <= 0 && p.atkPhase === 'none'){
      p.dodgeT = 0.18; p.dodgeCd = 0.65;
      let dx = mx, dy = my;
      if(Math.hypot(dx,dy) < 0.2){ dx = Math.cos(p.facing); dy = Math.sin(p.facing); }
      const dm = Math.hypot(dx,dy)||1;
      p.dodgeDx = dx/dm; p.dodgeDy = dy/dm;
      AudioSys.dodge();
      addShockwave(p.x, p.y, 60, '#7fd4ff');
    }
  }

  // 攻击
  const w = WEAPONS[game.equipped] || WEAPONS.hornblade;
  if(p.atkPhase === 'none'){
    if(Input.attackDown && p.atkCd <= 0 && p.dodgeT <= 0){
      p.atkPhase = 'wind'; p.atkT = 0;
    }
  } else {
    p.atkT += dt;
    const spdMul = p.atkSpeedMul * (w.aspd || 1);
    const wind = 0.08 / spdMul, act = 0.12 / spdMul, rec = 0.13 / spdMul;
    if(p.atkPhase === 'wind' && p.atkT >= wind){
      p.atkPhase = 'act'; p.atkT = 0; doAttackHit(p);
    } else if(p.atkPhase === 'act' && p.atkT >= act){
      p.atkPhase = 'rec'; p.atkT = 0;
    } else if(p.atkPhase === 'rec' && p.atkT >= rec){
      p.atkPhase = 'none'; p.atkT = 0; p.atkCd = 0.04;
    }
  }

  // 技能
  if(Input.skillDown && p.skillCd <= 0 && p.en >= 5 && p.dodgeT <= 0){
    castSkill(p);
  }

  // 房间碰撞
  const room = game.room;
  if(room){
    p.x = clamp(p.x, p.r, room.w - p.r);
    p.y = clamp(p.y, p.r, room.h - p.r);
    for(const o of room.obstacles){
      if(o.damageCd) o.damageCd = Math.max(0, o.damageCd - dt);
      const touched = resolveCircleRect(p, o);
      if(touched && o.damage && o.damageCd <= 0){
        const ox = p.x - (o.x + o.w/2), oy = p.y - (o.y + o.h/2);
        const om = Math.hypot(ox,oy)||1;
        damagePlayer(o.damage, ox/om, oy/om);
        o.damageCd = 0.75;
      }
    }
  }
}

/* ---- 攻击 ---- */
function doAttackHit(p){
  const w = WEAPONS[game.equipped] || WEAPONS.hornblade;
  const dmg = playerAttackDamage();
  AudioSys.attack();

  const ranged = ['crossbow','staff','codex','hyperCore','royalLance','colorBrush'].indexOf(w.id) >= 0;
  const thrown = ['disc','gluttonRing','royalDisc'].indexOf(w.id) >= 0;

  if(ranged && w.id !== 'royalLance'){
    const range = w.range || 300;
    const spd = w.id === 'colorBrush' ? 460 : 620;
    const life = range / spd;
    spawnBullet({
      x:p.x + Math.cos(p.facing)*20, y:p.y + Math.sin(p.facing)*20,
      vx:Math.cos(p.facing)*spd, vy:Math.sin(p.facing)*spd,
      r:w.id === 'colorBrush' ? 8 : 7, dmg, life, maxLife:life, team:'player',
      color:w.color, shape: w.id==='staff' ? 'zig' : (w.id==='colorBrush' ? 'disc' : 'square'), sides:w.id==='colorBrush'?6:4,
      angle:p.facing, pierce: (w.id==='crossbow'||w.id==='codex')
    });
  } else if(thrown){
    spawnBullet({
      x:p.x + Math.cos(p.facing)*20, y:p.y + Math.sin(p.facing)*20,
      vx:Math.cos(p.facing)*520, vy:Math.sin(p.facing)*520,
      r:13, dmg, life:1.4, maxLife:1.4, team:'player',
      color:w.color, shape:'disc', sides:6, angle:p.facing,
      spinSpd: 16, boomerang:true, ownerX:p.x, ownerY:p.y, pierced:false
    });
  } else {
    // 近战
    const range = (w.range||78) + 10;
    const arc = Math.PI * 0.95;
    addEffect({type:'slash', x:p.x, y:p.y, angle:p.facing, range, life:0.18, maxLife:0.18, color:w.color});
    swingDamage(p, range, arc, dmg, w);
    // 稍微前冲
    p.x += Math.cos(p.facing) * 6;
    p.y += Math.sin(p.facing) * 6;
  }
}

function swingDamage(p, range, arc, dmg, w){
  const targets = [];
  for(const e of game.enemies){ if(!e.dead) targets.push(e); }
  if(game.boss && !game.boss.dead) targets.push(game.boss);

  for(const e of targets){
    const dx = e.x - p.x, dy = e.y - p.y;
    const d = Math.hypot(dx, dy);
    if(d > range + e.r) continue;
    let a = Math.atan2(dy, dx) - p.facing;
    a = Math.atan2(Math.sin(a), Math.cos(a));
    if(Math.abs(a) > arc/2) continue;
    const nx = d > 0.001 ? dx/d : 0, ny = d > 0.001 ? dy/d : 0;
    damageTarget(e, dmg, nx, ny);
  }
}

/* ---- 技能 ---- */
function castSkill(p){
  const w = WEAPONS[game.equipped] || WEAPONS.hornblade;
  p.en -= 5;
  p.skillCd = 2.3;
  AudioSys.skill();

  const dmg = 10 + Math.floor(p.baseAtk * 0.85);
  const wx = Input.touchMode ? (p.x + Math.cos(p.facing)*180) : (Input.mouse.x + game.camera.x);
  const wy = Input.touchMode ? (p.y + Math.sin(p.facing)*180) : (Input.mouse.y + game.camera.y);
  const ang = Math.atan2(wy - p.y, wx - p.x);
  const sk = w.skill;

  switch(w.id){
    case 'hornblade': case 'spike': {
      // 前方三角冲击波
      const len = 200;
      const cx = p.x + Math.cos(p.facing) * len/2;
      const cy = p.y + Math.sin(p.facing) * len/2;
      addEffect({type:'triWave', x:cx, y:cy, angle:p.facing, r:70, life:0.35, maxLife:0.35, color:w.color});
      areaDamage(cx, cy, 90, dmg);
      break;
    }
    case 'silentEdge': {
      // 寂静修道者的特性：短距消失后沿直线完成一次精准斩击。
      const oldX=p.x, oldY=p.y;
      p.invuln=Math.max(p.invuln,0.28);
      p.x=clamp(p.x+Math.cos(p.facing)*65,p.r,game.room.w-p.r);
      p.y=clamp(p.y+Math.sin(p.facing)*65,p.r,game.room.h-p.r);
      addEffect({type:'beam',x:p.x,y:p.y,angle:p.facing,len:320,life:0.25,maxLife:0.25,color:w.color,w:12});
      beamDamage(p.x,p.y,Math.cos(p.facing),Math.sin(p.facing),320,18,dmg*1.35);
      addShockwave(oldX,oldY,45,'#ffffff');
      break;
    }
    case 'blackEdge': {
      // 黑王畸刃：不规则折线斩击。
      let cx=p.x,cy=p.y;
      for(let i=0;i<3;i++){
        const a=p.facing+(i-1)*0.42+(game.rng.next()-0.5)*0.5;
        addEffect({type:'beam',x:cx,y:cy,angle:a,len:125,life:0.18,maxLife:0.18,color:w.color,w:14});
        beamDamage(cx,cy,Math.cos(a),Math.sin(a),125,18,dmg*0.9);
        cx+=Math.cos(a)*95; cy+=Math.sin(a)*95;
      }
      break;
    }
    case 'gluttonRing': {
      // 暴食巨环：吸附附近掉落物后释放扩张巨环。
      let absorbed=0;
      for(const it of game.pickups){
        if(Math.hypot(it.x-p.x,it.y-p.y)<220 && (it.type==='feed'||it.type==='hp'||it.type==='en'||it.type==='mark')){
          it.x=p.x; it.y=p.y; absorbed++;
        }
      }
      p.atkBuff=Math.min(5,(p.atkBuff||0)+absorbed*0.75+1.0);
      addEffect({type:'ring',x:p.x,y:p.y,r:20,target:220,life:0.55,maxLife:0.55,color:w.color});
      areaDamage(p.x,p.y,170,dmg*1.35);
      break;
    }
    case 'royalDisc': {
      // 王权圆刃：三重收缩/扩张审判圈。
      for(let i=0;i<3;i++){
        const rr=100+i*52;
        addEffect({type:'ring',x:p.x,y:p.y,r:rr,target:20,life:0.75,maxLife:0.75,color:w.color});
        areaDamage(p.x,p.y,rr+18,dmg*(0.45+i*0.10));
      }
      break;
    }
    case 'colorBrush': {
      // 万彩画笔：短距离彩色泼绘，三处落点先预警再爆炸，并补一条短交错笔触。
      const palette=['#ff4f8b','#6ee7ff','#ffd166'];
      for(let i=0;i<3;i++){
        const a=ang+(i-1)*0.28;

    case 'crossbow': {

    }
    case 'royalLance': {
      addEffect({type:'beam', x:p.x, y:p.y, angle:p.facing, len:520, life:0.3, maxLife:0.3, color:w.color, w:24});
      beamDamage(p.x, p.y, Math.cos(p.facing), Math.sin(p.facing), 520, 34, dmg*1.6);
      p.x += Math.cos(p.facing) * 90;
      p.y += Math.sin(p.facing) * 90;

    }
    case 'codex': {
      addEffect({type:'rectZone', x:wx, y:wy, w:220, h:180, life:0.8, maxLife:0.8, color:w.color});

      break;
    }
    case 'hyperCore': {
      for(let i = 0; i < 8; i++){
        const a = ang + i * TAU/8;
        addEffect({type:'proj', x:wx, y:wy, r:0, target:90, life:0.5, maxLife:0.5, color:w.color, angle:a});
      }
      addEffect({type:'ring',x:wx,y:wy,r:32,target:155,life:0.6,maxLife:0.6,color:w.color});
      areaDamage(wx, wy, 120, dmg*1.6);
      addShockwave(wx, wy, 180, w.color);

    default: {
      areaDamage(p.x + Math.cos(p.facing)*100, p.y + Math.sin(p.facing)*100, 110, dmg);
    }
  }
}

function areaDamage(x, y, r, dmg){
  const targets = [];
  for(const e of game.enemies){ if(!e.dead) targets.push(e); }
  if(game.boss && !game.boss.dead) targets.push(game.boss);
  for(const e of targets){
    const dx = e.x - x, dy = e.y - y;
    const d = Math.hypot(dx, dy);
    if(d < r + e.r){
      const nx = d > 0.001 ? dx/d : 0, ny = d > 0.001 ? dy/d : 0;
      damageTarget(e, dmg, nx, ny);
    }
  }
}

function beamDamage(x, y, dx, dy, len, width, dmg){
  const targets = [];
  for(const e of game.enemies){ if(!e.dead) targets.push(e); }
  if(game.boss && !game.boss.dead) targets.push(game.boss);
  for(const e of targets){
    const rx = e.x - x, ry = e.y - y;
    const t = rx*dx + ry*dy;
    if(t < 0 || t > len) continue;
    const px = x + dx*t, py = y + dy*t;
    const dd = Math.hypot(e.x - px, e.y - py);
    if(dd < width + e.r){
      const n = dd > 0.001 ? 1/dd : 0;
      damageTarget(e, dmg, (e.x-px)*n, (e.y-py)*n);
    }
  }
}

// Boss 专用伤害：只允许伤害玩家，避免 Boss 技能错误命中自身。
function bossAreaDamage(x, y, r, dmg){
  const p = game.player;
  if(!p || p.dead) return;
  const dx = p.x - x, dy = p.y - y;
  const d = Math.hypot(dx, dy) || 1;
  if(d < r + p.r){
    damagePlayer(dmg, dx/d, dy/d);
  }
}

function bossBeamDamage(x, y, dx, dy, len, width, dmg){
  const p = game.player;
  if(!p || p.dead) return;
  const rx = p.x - x, ry = p.y - y;
  const t = rx*dx + ry*dy;
  if(t < 0 || t > len) return;
  const px = x + dx*t, py = y + dy*t;
  const dd = Math.hypot(p.x - px, p.y - py);
  if(dd < width + p.r){
    const n = dd > 0.001 ? 1/dd : 0;
    damagePlayer(dmg, (p.x-px)*n, (p.y-py)*n);
  }
}

function rectDamage(x, y, w, h, dmg){
  const targets = [];
  for(const e of game.enemies){ if(!e.dead) targets.push(e); }
  if(game.boss && !game.boss.dead) targets.push(game.boss);
  for(const e of targets){
    if(e.x > x - e.r && e.x < x + w + e.r && e.y > y - e.r && e.y < y + h + e.r){
      const cx = x + w/2, cy = y + h/2;
      const dx = e.x - cx, dy = e.y - cy;
      const d = Math.hypot(dx, dy) || 1;
      damageTarget(e, dmg, dx/d, dy/d);
    }
  }
}

/* ---- 伤害处理 ---- */
function damageTarget(e, dmg, nx, ny){
  if(e.dead) return;
  if(e.isBoss){ damageBoss(e, dmg, nx, ny); return; }
  damageEnemy(e, dmg, nx, ny);
}

function damageEnemy(e, dmg, nx, ny){
  if(e.dead) return;
  // 盾牌正面减伤
  if(e.ai === 'shield'){
    const p = game.player;
    const angToSrc = Math.atan2(p.y - e.y, p.x - e.x);
    let a = angToSrc - e.angle;
    a = Math.atan2(Math.sin(a), Math.cos(a));
    if(Math.abs(a) < Math.PI * 0.55) dmg = Math.max(1, Math.round(dmg * 0.5));
  }
  dmg = Math.max(1, Math.round(dmg));
  e.hp -= dmg;
  e.flash = 1;
  e.x += (nx||0) * 12;
  e.y += (ny||0) * 12;
  addText(e.x, e.y - e.r - 6, dmg, '#ffe9a8');
  addParticles(e.x, e.y, e.color, 4, 120);
  game.camera.shake = Math.max(game.camera.shake, 3);
  if(e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if(e.dead) return;
  e.dead = true;
  AudioSys.enemyDie();
  addParticles(e.x, e.y, e.color, e.elite ? 24 : 14, 260);
  addEffect({type:'ring', x:e.x, y:e.y, r:0, target:e.r*3, life:0.35, maxLife:0.35, color:e.color});
  // 掉落：经验统一通过拾取获得，避免连续清房导致等级过快
  dropLoot(e.x, e.y, e);
  if(e.elite) game.marks += 2;
}

function dropLoot(x, y, e){
  const r = game.rng;
  const xpValue = Math.max(6, Math.round((e.xp || 12) * (e.elite ? 0.55 : 0.50)));
  game.pickups.push({type:'xp', x, y, vx:r.range(-60,60), vy:r.range(-60,60), r:6, value:xpValue, life:20, color:'#8ff0ff'});
  const hd = getHealingDifficulty();
  const hpChance = e.elite ? hd.eliteDrop : (game.player && game.player.hp / game.player.maxhp < 0.45 ? hd.lowHpDrop : hd.enemyDrop);
  if(r.next() < hpChance){
    game.pickups.push({type:'hp', x:x+10, y, vx:r.range(-40,40), vy:r.range(-40,40), r:8, value:e.elite ? 8 : 6, life:24, color:'#ff6b8a'});
  }
  if(r.next() < 0.14){
    game.pickups.push({type:'en', x:x-10, y, vx:r.range(-40,40), vy:r.range(-40,40), r:8, value:5, life:20, color:'#6bd0ff'});
  }
  if(r.next() < 0.20){
    game.pickups.push({type:'mark', x, y:y-10, vx:r.range(-40,40), vy:r.range(-40,40), r:7, value:1, life:20, color:'#ffd479'});
  }
}

/* ---- 玩家受伤 ---- */
function damagePlayer(dmg, nx, ny){
  const p = game.player;
  if(!p || p.dead) return;
  if(p.invuln > 0 || p.dodgeT > 0) return;
  dmg = Math.max(1, Math.round(dmg * DIFFICULTY.enemyDamage));
  p.hp -= dmg;
  p.invuln = p.iframeTime;
  p.hurtFlash = 0.35;
  p.x += (nx||0) * 26;
  p.y += (ny||0) * 26;
  game.camera.shake = 9;
  AudioSys.hurt();
  addParticles(p.x, p.y, '#ff5577', 12, 240);
  addText(p.x, p.y - p.r - 12, '-' + dmg, '#ff8aa0');
  if(p.hp <= 0){ p.hp = 0; playerDie(); }
}

function playerDie(){
  const p = game.player;
  if(p.dead) return;
  p.dead = true;
  Music.stop();
  Music.play('defeat');
  AudioSys.lose();
  addParticles(p.x, p.y, '#8fd4ff', 40, 320);
  setTimeout(()=>{ if(game.state !== 'MENU') setState('DEATH'); }, 900);
}

/* ---- 经验 ---- */
function gainXP(v){
  const p = game.player;
  if(!p) return;
  p.xp += v;
  let leveled = false;
  while(p.level < 13){
    const need = XP_REQ[p.level];
    if(need === undefined) break;
    if(p.xp >= need){
      p.xp -= need;
      p.level++;
      leveled = true;
    } else break;
  }
  if(p.level >= 13 && p.xp > 0) p.xp = Math.min(p.xp, 999);
  if(leveled){
    const oldSides = p.sides;
    recalcPlayer(p, false);
    p.hp = Math.min(p.maxhp, p.hp + 6);
    p.en = Math.min(p.maxen, p.en + 6);
    p.morphT = 1.2;
    game.morphFrom = oldSides;
    game.morphTo = p.sides;
    game.upgradeFlash = 1.2;
    AudioSys.levelUp();
    addShockwave(p.x, p.y, 220, '#9fe8ff');
    addText(p.x, p.y - 50, 'LV.' + p.level, '#9fe8ff', true);
    if(p.level >= 13){
      addText(p.x, p.y - 80, '你成为了圆', '#ffffff', true);
    }
  }
}

/* ============================================================
   14. 敌人更新
   ============================================================ */
function updateEnemies(dt){
  const p = game.player;
  if(!p) return;
  for(const e of game.enemies){
    if(e.dead) continue;
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt*4);
    e.atkCd = Math.max(0, e.atkCd - dt);
    e.hitCd = Math.max(0, e.hitCd - dt);
    e.wobble += dt * 2;

    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx/d, ny = dy/d;
    e.angle = Math.atan2(dy, dx);

    // 接触伤害
    if(!p.dead && d < e.r + p.r + 6 && e.hitCd <= 0){
      damagePlayer(e.dmg, nx, ny);
      e.hitCd = 0.9;
    }

    switch(e.ai){
      case 'charger': {
        if(e.charging > 0){
          e.charging -= dt;
          e.x += e.cvx * dt; e.y += e.cvy * dt;
        } else if(e.windup > 0){
          e.windup -= dt;
          if(e.windup <= 0){
            e.charging = 0.32;
            e.cvx = nx * 560; e.cvy = ny * 560;
          }
        } else {
          e.x += nx * e.speed * dt;
          e.y += ny * e.speed * dt;
          if(d < 260 && e.atkCd <= 0){ e.windup = 0.30; e.atkCd = 2.0; }
        }
        break;
      }
      case 'shooter': {
        if(d > 320){ e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
        else if(d < 200){ e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
        else { e.x += Math.cos(e.t*1.4) * e.speed * 0.4 * dt; e.y += Math.sin(e.t*1.4) * e.speed * 0.4 * dt; }
        if(e.atkCd <= 0 && d < 460){
          e.atkCd = 1.7;
          const a = Math.atan2(dy, dx);
          spawnBullet({
            x:e.x + Math.cos(a)*e.r, y:e.y + Math.sin(a)*e.r,
            vx:Math.cos(a)*330, vy:Math.sin(a)*330,
            r:7, dmg:e.dmg, life:2.4, maxLife:2.4, team:'enemy',
            color:e.color, shape:'tri', sides:3, angle:a, spinSpd:8
          });
          AudioSys.blip(420,0.08,'triangle',0.06,220);
        }
        break;
      }
      case 'shield': {
        e.x += nx * e.speed * 0.75 * dt;
        e.y += ny * e.speed * 0.75 * dt;
        break;
      }
      case 'erratic': {
        const w = Math.sin(e.wobble) * 1.2;
        const a = Math.atan2(dy, dx) + w;
        e.x += Math.cos(a) * e.speed * dt;
        e.y += Math.sin(a) * e.speed * dt;
        if(d > 500){
          e.x += nx * e.speed * 0.6 * dt;
          e.y += ny * e.speed * 0.6 * dt;
        }
        break;
      }
      default: {
        e.x += nx * e.speed * dt;
        e.y += ny * e.speed * dt;
      }
    }

    // 房间约束
    e.x = clamp(e.x, e.r, game.room.w - e.r);
    e.y = clamp(e.y, e.r, game.room.h - e.r);
    for(const o of game.room.obstacles) resolveCircleRect(e, o);

    // 敌人互相排斥
    for(const o of game.enemies){
      if(o === e || o.dead) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od = Math.hypot(ox, oy);
      const minD = e.r + o.r;
      if(od > 0.001 && od < minD){
        const push = (minD - od) * 0.5;
        e.x += ox/od * push; e.y += oy/od * push;
      }
    }
  }

  // 移除
  game.enemies = game.enemies.filter(e=>!e.dead);
}

/* ============================================================
   15. 弹幕更新
   ============================================================ */
function updateBullets(dt){
  const p = game.player;
  const room = game.room;
  for(let i = game.bullets.length - 1; i >= 0; i--){
    const b = game.bullets[i];
    b.life -= dt;
    if(b.life <= 0){ game.bullets.splice(i,1); continue; }

    // 回旋镖
    if(b.boomerang){
      if(!b.returning){
        b.ownerX = p ? p.x : b.ownerX;
        b.ownerY = p ? p.y : b.ownerY;
        const distTravelled = Math.hypot(b.x - b.ownerX, b.y - b.ownerY);
        if(distTravelled > 300) b.returning = true;
      } else if(p){
        const dx = p.x - b.x, dy = p.y - b.y;
        const d = Math.hypot(dx, dy) || 1;
        const speed = 560;
        b.vx = dx/d * speed; b.vy = dy/d * speed;
        if(d < 26){ game.bullets.splice(i,1); continue; }
      }
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if(b.spinSpd) b.angle = (b.angle || 0) + b.spinSpd * dt;

    // 出界
    if(b.x < -60 || b.x > room.w + 60 || b.y < -60 || b.y > room.h + 60){
      if(!b.boomerang){ game.bullets.splice(i,1); continue; }
    }

    // 墙
    let hitWall = false;
    for(const o of room.obstacles){
      if(b.x > o.x - b.r && b.x < o.x + o.w + b.r && b.y > o.y - b.r && b.y < o.y + o.h + b.r){
        hitWall = true; break;
      }
    }
    if(hitWall && !b.pierce){ game.bullets.splice(i,1); continue; }
    if(hitWall && b.team === 'player'){ /* 穿透穿透墙 */ }

    // 伤害判定
    if(b.team === 'enemy'){
      if(p && !p.dead && p.invuln <= 0 && p.dodgeT <= 0){
        const d = Math.hypot(p.x - b.x, p.y - b.y);
        if(d < p.r + b.r){
          const nx = (p.x - b.x)/(d||1), ny = (p.y - b.y)/(d||1);
          damagePlayer(b.dmg, nx, ny);
          game.bullets.splice(i,1); continue;
        }
      }
    } else if(b.team === 'player'){
      if(!b.hitSet) b.hitSet = new Set();
      let hitSomething = false;
      for(const e of game.enemies){
        if(e.dead || b.hitSet.has(e)) continue;
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if(d < e.r + b.r){
          const nx = (e.x - b.x)/(d||1), ny = (e.y - b.y)/(d||1);
          damageTarget(e, b.dmg, nx, ny);
          b.hitSet.add(e);
          hitSomething = true;
          if(!b.pierce && !b.boomerang){ game.bullets.splice(i,1); break; }
        }
      }
      if(game.bullets[i] !== b) continue;
      if(game.boss && !game.boss.dead && !b.hitSet.has(game.boss)){
        const bs = game.boss;
        const d = Math.hypot(bs.x - b.x, bs.y - b.y);
        if(d < bs.r + b.r){
          const nx = (bs.x - b.x)/(d||1), ny = (bs.y - b.y)/(d||1);
          damageBoss(bs, b.dmg, nx, ny);
          b.hitSet.add(bs);
          if(!b.pierce && !b.boomerang){ game.bullets.splice(i,1); continue; }
        }
      }
    }
  }
}

/* ============================================================
   16. 掉落物
   ============================================================ */
function updatePickups(dt){
  const p = game.player;
  for(let i = game.pickups.length - 1; i >= 0; i--){
    const it = game.pickups[i];
    it.life -= dt;
    if(it.life <= 0){ game.pickups.splice(i,1); continue; }
    if(p && !p.dead){
      const dx = p.x - it.x, dy = p.y - it.y;
      const d = Math.hypot(dx, dy) || 1;
      if(d < 220){
        const pull = 420 * (1 - d/220);
        it.vx += dx/d * pull * dt;
        it.vy += dy/d * pull * dt;
      }
      it.vx *= (1 - 2.2*dt);
      it.vy *= (1 - 2.2*dt);
      if(d < p.r + it.r + 6){
        collectPickup(it);
        game.pickups.splice(i,1);
        continue;
      }
    }
    it.x += it.vx * dt;
    it.y += it.vy * dt;
  }
}

function collectPickup(it){
  const p = game.player;
  AudioSys.pickup();
  switch(it.type){
    case 'xp': gainXP(it.value || 12); break;
    case 'hp': p.hp = Math.min(p.maxhp, p.hp + it.value); addText(p.x, p.y-24, '+'+it.value+' HP', '#ff8aa0'); break;
    case 'en': p.en = Math.min(p.maxen, p.en + it.value); addText(p.x, p.y-24, '+'+it.value+' EN', '#6bd0ff'); break;
    case 'mark': game.marks += it.value; addText(p.x, p.y-24, '+'+it.value+' 印记', '#ffd479'); break;
    case 'bossWeapon':
      if(it.value && WEAPONS[it.value]){
        if(game.unlocked.indexOf(it.value) < 0) game.unlocked.push(it.value);
        if(game.library.indexOf(it.value) < 0) game.library.push(it.value);
        game.equipped = it.value;
        addText(p.x, p.y-30, '装备：'+WEAPONS[it.value].name, '#ffd479', true);
      }
      break;
  }
}

    angle: 0, data: {}, speed: def.speed || 90,

    contactDmg: def.contactDmg || (8 + areaIdx * 2)

}
