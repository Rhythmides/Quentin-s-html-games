function collectTargets(){
  // 只针对玩家（用于 Boss 攻击）
  return [game.player];
}
function damagePlayerOrNothing(e, dmg, nx, ny){
  if(e === game.player) damagePlayer(dmg, nx, ny);
}

function chooseBossAttack(b){
  let list = b.def.attacks.filter(a=> !a.minPhase || b.phase >= a.minPhase);
  if(!list.length) list = b.def.attacks;
  if(list.length > 1 && b.lastAttackName){
    const filtered = list.filter(a => a.name !== b.lastAttackName);
    if(filtered.length) list = filtered;
  }
  // 二阶段优先选择标记为 minPhase:2 的攻击，避免 Boss 只是单纯加血。
  if(b.phase >= 2){
    const phaseMoves = list.filter(a => a.minPhase === 2);
    if(phaseMoves.length && game.rng.next() < 0.68) list = phaseMoves;
  }
  const chosen = list[Math.floor(game.rng.next() * list.length)];
  b.lastAttackName = chosen.name;
  return chosen;
}

function updateBoss(b, dt){
  if(!b || b.dead) return;
  const p = game.player;
  b.t += dt;
  b.flash = Math.max(0, b.flash - dt*4);
  b.contactCd = Math.max(0, b.contactCd - dt);
  if(b.data) b.data.alpha = 1;
  if(b.id === 'god'){
    if(!b.data.trail) b.data.trail=[];
    if(!b.data.trailClock) b.data.trailClock=0;
    b.data.trailClock += dt;
    if(b.data.trailClock >= 0.065){
      b.data.trailClock=0;
      const pulse=0.78+0.22*(0.5+0.5*Math.sin(game.time*3.2));
      b.data.trail.push({x:b.x,y:b.y,r:b.r*pulse});
      if(b.data.trail.length>8) b.data.trail.shift();
    }
  }

  if(b.introT > 0){
    b.introT -= dt;
    return;
  }

  // 阶段转换：二阶段不只是数值增强，而是缩短冷却、提高追击速度并进入专属攻击池。
  if(b.phase === 1 && b.hp <= b.maxhp * b.phase2At){
    b.phase = 2;
    b.introT = 0.9;
    b.mode = 'idle';
    b.cool = 0.35;
    b.cur = null;
    b.data = {};
    b.speed *= 1.16;
    AudioSys.bossPhase();
    addShockwave(b.x, b.y, 320, b.color);
    addParticles(b.x, b.y, b.color, 24, 320);
    addText(b.x, b.y - 70, '第二阶段', '#ffd479', true);
    return;
  }

  b.angle = Math.atan2(p.y - b.y, p.x - b.x);

  // Boss 本体接触伤害：保证即使某个特殊技能没命中，Boss 本体也不是“穿过去就没伤害”。
  if(p && !p.dead && b.contactCd <= 0){
    const d = Math.hypot(p.x - b.x, p.y - b.y);
    if(d < b.r + p.r + 5){
      const nx = (p.x - b.x)/(d || 1), ny = (p.y - b.y)/(d || 1);
      damagePlayer(b.contactDmg, nx, ny);
      b.contactCd = b.phase >= 2 ? 0.72 : 0.9;
    }
  }

  if(b.mode === 'idle'){
    const d = Math.hypot(p.x-b.x, p.y-b.y);
    const a = Math.atan2(p.y-b.y, p.x-b.x);
    // 二阶段会更主动逼近，但不会持续贴脸。
    if(d > (b.phase >= 2 ? 250 : 300)){
      const chase = b.phase >= 2 ? 1.08 : 1.0;
      b.x += Math.cos(a) * b.speed * chase * dt;
      b.y += Math.sin(a) * b.speed * chase * dt;
    } else if(d < 170){
      b.x -= Math.cos(a) * b.speed * 0.75 * dt;
      b.y -= Math.sin(a) * b.speed * 0.75 * dt;
    }
    b.cool -= dt;
    if(b.cool <= 0){
      b.cur = chooseBossAttack(b);
      b.atkT = 0;
      b.mode = 'attack';
      b.data = {};
    }
  } else if(b.mode === 'attack'){
    b.atkT += dt;
    const prog = Math.min(1, b.atkT / b.cur.dur);
    if(b.cur.run){
      try{ b.cur.run(b, prog, dt, p); }
      catch(err){ console.error('Boss attack error:', b.id, b.cur.name, err); }
    }
    if(prog >= 1){
      b.mode = 'idle';
      b.cool = Math.max(0.28, b.cur.cool || 0.8) * (b.phase >= 2 ? 0.82 : 1);
      b.cur = null;
      b.data = {};
    }
  }

  // 限制在房间
  b.x = clamp(b.x, b.r, game.room.w - b.r);
  b.y = clamp(b.y, b.r, game.room.h - b.r);
}

function damageBoss(b, dmg, nx, ny){
  if(b.dead || b.introT > 0) return;
  dmg = Math.max(1, Math.round(dmg));
  b.hp -= dmg;
  b.flash = 1;
  addText(b.x + (Math.random()-0.5)*40, b.y - b.r - 6, dmg, '#ffe9a8');
  addParticles(b.x, b.y, b.color, 5, 160);
  if(b.hp <= 0) killBoss(b);
}

function killBoss(b){
  if(b.dead) return;
  b.dead = true;
  b.hp = 0;
  Music.stop();
  AudioSys.bossDie();
  addParticles(b.x, b.y, b.color, 60, 500);
  addShockwave(b.x, b.y, 600, b.color);
  game.camera.shake = 24;

  // 掉落
  for(let i=0;i<10;i++){
    game.pickups.push({type:'mark', x:b.x + (Math.random()-0.5)*200, y:b.y + (Math.random()-0.5)*200,
      vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200, r:8, value:3, life:30, color:'#ffd479'});
  }
  gainXP(Math.round((XP_REQ[game.player.level] || 300) * 0.35));

  // Boss 专属武器：严格根据实际被击败的 Boss 发放，避免区域/小Boss错配。
  const wKey = b.weaponKey;
  if(wKey && WEAPONS[wKey]){
    if(game.unlocked.indexOf(wKey) < 0) game.unlocked.push(wKey);
    if(game.library.indexOf(wKey) < 0) game.library.push(wKey);
    game.pickups.push({type:'bossWeapon', x:b.x, y:b.y-28, vx:0, vy:-20, r:18, value:wKey, life:30, color:WEAPONS[wKey].color});
    addText(b.x, b.y - 100, '获得：' + WEAPONS[wKey].name, '#ffd479', true);
  }
  // Boss 战后提供一次明确的回血机会。
  if(game.player && game.player.hp < game.player.maxhp){
    if(game.rng.next() < getHealingDifficulty().bossHeal){
      game.pickups.push({type:'hp', x:b.x+48, y:b.y, vx:30, vy:-20, r:10, value:10, life:30, color:'#ff6b8a'});
    }
  }

  setTimeout(()=>{
    if(game.state === 'PLAYING' || game.state === 'BOSS'){
      game.boss = null;
      onRoomCleared();
    }
  }, 1600);
}

/* ============================================================
   18. 房间流程
   ============================================================ */
function loadRoom(){
  const areaIdx = game.area;
  const nodeType = game.nodes[game.nodeIndex];
  const area = AREAS[areaIdx];

  if(!game.player || !area || !nodeType) return;

  game.room = makeRoom(nodeType, areaIdx);
  game.enemies = [];
  game.bullets = [];
  game.pickups = [];
  game.effects = [];
  game.particles = [];
  game.texts = [];
  game.boss = null;
  game.dialogue = null;

  const p = game.player;
  p.x = game.room.w * 0.15;
  p.y = game.room.h * 0.5;
  p.invuln = 1.0;
  p.dead = false;

  if(nodeType === 'start'){
    // 起点不是可战斗房；直接进入第一个实际节点，避免玩家被困在空房间。
    game.room.cleared = true;
    advanceNode();
    return;
  }

  if(nodeType === 'combat' || nodeType === 'elite'){
    spawnEnemiesForRoom(game.room, nodeType, areaIdx);
    game.enemies = game.room.enemies.slice();
    Music.play('area');
    setState('PLAYING');
    return;
  }

  if(nodeType === 'miniboss'){
    game.room.enemies = [];
    game.boss = makeBoss('mutant', areaIdx);
    Music.play('boss');
    setState('BOSS_INTRO');
    game.bossIntroT = 2.2;
    return;
  }

  if(nodeType === 'boss'){
    game.room.enemies = [];
    game.boss = makeBoss(area.boss, areaIdx);
    Music.play(areaIdx === 6 ? 'final' : 'boss');
    setState('BOSS_INTRO');
    game.bossIntroT = 2.6;
    return;
  }

  if(nodeType === 'reward'){
    game.rewardChoices = rollRewards(3);
    Music.play('area');
    setState('REWARD');
    return;
  }

  if(nodeType === 'shop'){
    buildShop();
    Music.play('area');
    setState('SHOP');
    return;
  }

  if(nodeType === 'event'){
    startEvent();
    Music.play('area');
    setState('DIALOGUE');
    return;
  }

  if(nodeType === 'upgrade'){
    const hd = getHealingDifficulty();
    if(game.rng.next() < hd.sanctuary){
      p.hp = Math.min(p.maxhp, p.hp + Math.ceil(p.maxhp*0.3));
      toast('你在几何圣所中恢复了生命');
    } else {
      toast('几何圣所只恢复了你的能量');
    }
    p.en = p.maxen;
    gainXP(40);
    Music.play('area');
    advanceNode();
    return;
  }

  Music.play('area');
  onRoomCleared();
}

function onRoomCleared(){
  const room = game.room;
  if(room.cleared) return;
  room.cleared = true;
  room.exit = {x: room.w - 120, y: room.h/2, r: 40};
  room.exitT = 0;
  game.marks += 3;
  // 血量较低时，房间出口附近有较高概率生成治疗碎片，提供明确的补血路线。
  if(game.player && game.player.hp < game.player.maxhp * 0.72 && (room.type === 'combat' || room.type === 'elite')){
    const hd = getHealingDifficulty();
    if(game.rng.next() < hd.roomHeal){
      game.pickups.push({type:'hp', x:room.w-185, y:room.h/2, vx:0, vy:0, r:10, value:8, life:30, color:'#ff6b8a'});
      addText(room.w-185, room.h/2-28, '恢复 +8', '#ff8aa0');
    }
  }
  saveGame();
  toast('房间已清空 — 前往出口');
}

function updateRoom(dt){
  const room = game.room;
  if(!room) return;
  // 检查清空
  if(!room.cleared && (room.type === 'combat' || room.type === 'elite' || room.type === 'miniboss' || room.type === 'boss')){
    if(game.enemies.length === 0 && (!game.boss || game.boss.dead)){
      if(room.type === 'boss' || room.type === 'miniboss'){
        // 由 killBoss 延时处理
      } else {
        onRoomCleared();
      }
    }
  }
  if(room.cleared && room.exit){
    room.exitT += dt;
    const p = game.player;
    if(Math.hypot(p.x - room.exit.x, p.y - room.exit.y) < room.exit.r + p.r){
      advanceNode();
    }
  }
}

function advanceNode(){
  game.nodeIndex++;
  if(game.nodeIndex >= game.nodes.length){
    game.area++;
    if(game.area >= AREAS.length){
      // 通关
      setState('VICTORY');
      game.victoryT = 0;
      Music.stop();
      Music.play('victory');
      AudioSys.win();
      return;
    }
    game.nodes = AREA_NODES[game.area].slice();
    game.nodeIndex = 0;
    if(game.area === 4) game.areaTransitionT = 1.15;
    toast('进入区域：' + AREAS[game.area].name);
  }
  saveGame();
  setState('MAP');
}

/* ============================================================
   19. 奖励 / 商店 / 事件
   ============================================================ */
function rollRewards(count){
  const pool=Object.keys(WEAPONS).map(k=>WEAPONS[k]).filter(w=>!w.boss);
  const locked=pool.filter(w=>game.unlocked.indexOf(w.id)<0);
  if(locked.length===0){
    const support=[
      {type:'support',id:'rewardHeal',name:'生命恢复',quality:'补给',kind:'恢复',atk:0,aspd:1,range:0,color:'#ff6b8a',skill:'恢复 10 HP',skillDesc:'立即恢复 10 点生命。'},
      {type:'support',id:'rewardEnergy',name:'能量补充',quality:'补给',kind:'恢复',atk:0,aspd:1,range:0,color:'#6bd0ff',skill:'恢复 10 EN',skillDesc:'立即恢复 10 点能量。'},
      {type:'support',id:'rewardStrength',name:'几何强化',quality:'强化',kind:'永久强化',atk:1,aspd:1,range:0,color:'#ffd479',skill:'攻击 +1',skillDesc:'永久提高 1 点基础攻击力。'}
    ];
    game.rng.shuffle(support);
    return support.slice(0,Math.min(count,support.length));
  }
  game.rng.shuffle(locked);
  const picks=locked.slice(0,count);
  if(picks.length<count){
    const all=pool.slice();game.rng.shuffle(all);
    for(const w of all){if(picks.length>=count)break;if(!picks.find(x=>x.id===w.id))picks.push(w);}
  }
  return picks;
}

function buildShop(){
  game.shopItems = [];
  game.shopBought = {};
  const r = game.rng;
  const items = [
    {id:'energy', name:'能量', desc:'恢复全部能量', cost:20, color:'#6bd0ff'},
    {id:'strengthen', name:'强化', desc:'永久 +1 攻击力', cost:60, color:'#ffd479'}
  ];
  // 难度决定商店是否提供治疗。
  if(r.next() < getHealingDifficulty().shopHeal){
    items.unshift({id:'heal', name:'治疗', desc:'恢复 15 点生命', cost:20, color:'#ff6b8a'});
  }
  // 随机普通武器
  const pool = Object.keys(WEAPONS).map(k=>WEAPONS[k]).filter(w=>!w.boss);
  const locked = pool.filter(w => game.unlocked.indexOf(w.id) < 0);
  const wpick = (locked.length ? game.rng.pick(locked) : game.rng.pick(pool));
  if(wpick){
    items.push({id:'weapon', name:wpick.name, desc:wpick.skill + '：' + wpick.skillDesc, cost:40, color:wpick.color, weapon:wpick.id});
  }
  game.shopItems = items;
}

function startEvent(){
  const p = game.player;
  const npcs = Object.keys(NPC_LINES);
  const npc = game.rng.pick(npcs);
  const info = NPC_LINES[npc];
  let tier = 'low';
  if(p.level >= 10) tier = 'high';
  else if(p.level >= 6) tier = 'mid';
  game.dialogueLines = [
    {name:npc, text: info.lines[tier]}
  ];
  game.dialogueIdx = 0;
  game.dialogue = true;
}

function toast(msg){
  game.toast = msg;
  game.toastT = 3.0;
}

/* ============================================================
   20. 存档
   ============================================================ */
const SAVE_KEY = 'flatland_save_v2';
const OLD_SAVE_KEY = 'flatland_save_v1';
const SETTINGS_KEY = 'flatland_settings_v1';

function saveSettingsPreference(){
  try{
    if(!window.localStorage) return;
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({volume:game.settings.volume, difficulty:game.settings.difficulty, language:game.settings.language || 'zh'}));
  }catch(e){ /* 忽略 */ }
}

function loadSettingsPreference(){
  try{
    if(!window.localStorage) return;
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && Number.isFinite(Number(d.volume))) game.settings.volume = clamp(Number(d.volume),0,1);
    if(d && HEALING_DIFFICULTIES[d.difficulty]) game.settings.difficulty = d.difficulty;
    if(d && (d.language === 'en' || d.language === 'zh')) game.settings.language = d.language;
    applyLanguage();
  }catch(e){ /* 忽略 */ }
}

function saveGame(){
  try{
    if(!window.localStorage) return;
    saveSettingsPreference();
    const p = game.player;
    if(!p) return;
    const data = {
      area: game.area,
      nodeIndex: game.nodeIndex,
      nodes: game.nodes,
      level: p.level,
      permanentAtkBonus: p.permanentAtkBonus || 0,
      xp: p.xp,
      hp: p.hp,
      maxhp: p.maxhp,
      en: p.en,
      maxen: p.maxen,
      equipped: game.equipped,
      unlocked: game.unlocked,
      library: game.library,
      marks: game.marks,
      seed: game.seed,
      settings: game.settings
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    game.hasSave = true;
  }catch(e){ /* 忽略 */ }
}

function loadSaveExists(){
  try{
    if(!window.localStorage) return false;
    const s = localStorage.getItem(SAVE_KEY);
    game.hasSave = !!s;
    return game.hasSave;
  }catch(e){ return false; }
}

function loadGame(){
  try{
    if(!window.localStorage) return false;
    let s = localStorage.getItem(SAVE_KEY);
    let migrated = false;
    if(!s){ s = localStorage.getItem(OLD_SAVE_KEY); migrated = !!s; }
    if(!s) return false;
    const d = JSON.parse(s);
    if(migrated && Number.isFinite(d.area) && d.area >= 4) d.area += 1;
    game.seed = d.seed || (Math.floor(Math.random()*900000)+100000);
    game.rng = new RNG(game.seed);
    game.area = Number.isFinite(d.area) ? clamp(d.area,0,AREAS.length-1) : 0;
    game.nodeIndex = Number.isFinite(d.nodeIndex) ? d.nodeIndex : 0;
    game.nodes = Array.isArray(d.nodes) && d.nodes.length ? d.nodes.slice() : AREA_NODES[game.area].slice();
    game.player = makePlayer();
    game.player.level = d.level || 3;
    game.player.permanentAtkBonus = d.permanentAtkBonus || 0;
    recalcPlayer(game.player, false);
    game.player.xp = d.xp || 0;
    game.player.hp = clamp(d.hp || game.player.maxhp, 1, game.player.maxhp);
    game.player.en = clamp(d.en || game.player.maxen, 0, game.player.maxen);
    game.equipped = d.equipped || 'hornblade';
    game.unlocked = d.unlocked || ['hornblade'];
    game.library = d.library || ['hornblade'];
    game.marks = d.marks || 0;
    game.settings = d.settings || {volume:0.6, difficulty:'easy', language:'zh'};
    if(!Number.isFinite(Number(game.settings.volume))) game.settings.volume = 0.6;
    game.settings.volume = clamp(Number(game.settings.volume),0,1);
    if(!HEALING_DIFFICULTIES[game.settings.difficulty]) game.settings.difficulty = 'easy';
    if(game.settings.language !== 'en' && game.settings.language !== 'zh') game.settings.language = 'zh';
    applyLanguage();
    if(isTesterMode()) applyTesterMode();
    saveSettingsPreference();
    if(AudioSys.master) AudioSys.master.gain.value = game.settings.volume;
    if(migrated){ try{ localStorage.removeItem(OLD_SAVE_KEY); saveGame(); }catch(e){} }
    return true;
  }catch(e){ return false; }
}

function deleteSave(){
  try{ if(window.localStorage) localStorage.removeItem(SAVE_KEY); }catch(e){}
  game.hasSave = false;
}

function startNewRun(){
  game.seed = Math.floor(Math.random()*900000) + 100000;
  game.rng = new RNG(game.seed);
  game.area = 0;
  game.nodeIndex = 0;
  game.nodes = AREA_NODES[0].slice();
  game.player = makePlayer();
  game.unlocked = ['hornblade'];
  game.library = ['hornblade'];
  game.equipped = 'hornblade';
  game.marks = 0;
  if(isTesterMode()) applyTesterMode();
  game.boss = null;
  game.enemies = [];
  game.bullets = [];
  game.pickups = [];
  game.effects = [];
  game.particles = [];
  game.texts = [];
  deleteSave();
}

/* ============================================================
   21. 主更新
   ============================================================ */
function update(dt){
  game.time += dt;
  game.stateT += dt;
  updateWeaponScroll(dt);
  if(game.areaTransitionT>0) game.areaTransitionT=Math.max(0,game.areaTransitionT-dt);
  if(game.toastT > 0) game.toastT -= dt;
  if(game.upgradeFlash > 0) game.upgradeFlash -= dt;
  game.camera.shake = Math.max(0, game.camera.shake - dt * 40);

  switch(game.state){
    case 'BOOT':
      if(game.stateT > 0.4){ loadSaveExists(); Music.play('menu'); setState('MENU'); }
      break;
    case 'MENU': break;
    case 'INTRO':
      if(game.stateT > 5.2 || Input.consumeClicks().length > 0){
        setState('LOADING');
        game.loadingT = 0;
        game.loadingTipIdx = Math.floor(Math.random()*LOADING_TIPS.length);
      }
      break;
    case 'LOADING':
      game.loadingT += dt;
      if(game.loadingT > 1.8){
        if(game.pendingContinue && game.hasSave){ loadGame(); game.pendingContinue = false; }
        game.room = null;
        loadRoom();
      }
      break;
    case 'PLAYING': case 'BOSS':
      updatePlaying(dt);
      break;
    case 'BOSS_INTRO':
      game.bossIntroT -= dt;
      if(game.boss) updateBoss(game.boss, dt * 0.0); // 冻结
      if(game.bossIntroT <= 0){
        setState('BOSS');
      }
      break;
    case 'PAUSE': case 'EQUIPMENT': case 'MAP': case 'SHOP': case 'DIALOGUE': case 'SETTINGS': case 'ABOUT':
      break;
    case 'REWARD': break;
    case 'DEATH':
      game.deathT += dt;
      break;
    case 'VICTORY':
      game.victoryT += dt;
      if(game.victoryT > 4.0){ setState('ENDING'); game.endingStage = 0; game.endT = 0; }
      break;
    case 'ENDING':
      game.endT += dt;
      if(game.endT > 5.5 && game.endingStage === 0){ game.endingStage = 1; game.endT = 0; }
      break;
  }
}

function updatePlaying(dt){
  updatePlayer(dt);
  updateEnemies(dt);
  updateBoss(game.boss, dt);
  updateBullets(dt);
  updatePickups(dt);
  updateEffects(dt);
  updateRoom(dt);

  // 相机
  const p = game.player;
  const room = game.room;
  let cx, cy;
  if(room.w <= VW) cx = (room.w - VW)/2;
  else cx = clamp(p.x - VW/2, 0, room.w - VW);
  if(room.h <= VH) cy = (room.h - VH)/2;
  else cy = clamp(p.y - VH/2, 0, room.h - VH);
  game.camera.x = lerp(game.camera.x, cx, 1 - Math.pow(0.001, dt));
  game.camera.y = lerp(game.camera.y, cy, 1 - Math.pow(0.001, dt));

  // 技能冷却恢复
  // 已在 updatePlayer 中处理
}

function updateEffects(dt){
  for(let i = game.effects.length-1; i>=0; i--){
    const e = game.effects[i];
    e.life -= dt;
    if(e.type === 'wave' || e.type === 'squareWave'){
      const t = 1 - e.life/e.maxLife;
      e.r = (e.target||e.r) * t;
    }
    if(e.type === 'proj'){
      const t = 1 - e.life/e.maxLife;
      e.r = (e.target||100) * t;
    }
    if(e.type === 'warnCircle'){
      if(!e.hit && e.damage && e.life <= e.maxLife - (e.delay||0.35)){
        e.hit=true; (e.team==='player' ? areaDamage : bossAreaDamage)(e.x,e.y,e.r,e.damage);
      }
    }
    if(e.life <= 0) game.effects.splice(i,1);
  }
  for(let i = game.particles.length-1; i>=0; i--){
    const p = game.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 3*dt); p.vy *= (1 - 3*dt);
    if(p.life <= 0) game.particles.splice(i,1);
  }
  for(let i = game.texts.length-1; i>=0; i--){
    const t = game.texts[i];
    t.life -= dt;
    t.y -= 40 * dt;
    if(t.life <= 0) game.texts.splice(i,1);
  }
}

/* ============================================================
   22. 渲染
   ============================================================ */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#04050a';
  ctx.fillRect(0,0,VW,VH);
  UI.buttons.length = 0;

  switch(game.state){
    case 'BOOT': break;
    case 'MENU': drawMenu(); break;
    case 'INTRO': drawIntro(); break;
    case 'LOADING': drawLoading(); break;
    case 'PLAYING': case 'BOSS': case 'BOSS_INTRO': case 'DIALOGUE':
      drawWorld(); drawHUD(); drawTouchUI();
      if(game.toastT > 0) drawToast();
      if(game.dialogue) drawDialogue();
      if(game.state === 'BOSS_INTRO') drawBossIntro();
      break;
    case 'SHOP':
      drawShop();
      break;
    case 'PAUSE':
      drawWorld(); drawHUD(); drawPause(); break;
    case 'MAP':
      drawMapScreen(); break;
    case 'EQUIPMENT':
      drawEquipment(); break;
    case 'SETTINGS':
      drawSettings(); break;
    case 'ABOUT':
      drawAbout(); break;
    case 'REWARD':
      drawWorld(); drawHUD(); drawReward(); break;
    case 'DEATH':
      drawWorld(); drawDeath(); break;
    case 'VICTORY':
      drawVictory(); break;
    case 'ENDING':
      drawEnding(); break;
  }

  // 升级闪光
  if(game.upgradeFlash > 0){
    ctx.fillStyle = 'rgba(160,220,255,' + (game.upgradeFlash * 0.25) + ')';
    ctx.fillRect(0,0,VW,VH);
  }

  UI.draw();

  if(game.areaTransitionT > 0){
    const a=clamp(game.areaTransitionT/1.15,0,1);
    ctx.fillStyle='rgba(0,0,0,'+a+')'; ctx.fillRect(0,0,VW,VH);
  }

  // 处理点击
  const clicks = Input.consumeClicks();
  for(const c of clicks){
    if(!UI.handleClick(c.x, c.y)){
      onWorldClick(c.x, c.y);
    }
  }
}

function onWorldClick(x, y){
  if(game.dialogue){ nextDialogueLine(); return; }
  if(game.state === 'INTRO'){ setState('LOADING'); game.loadingT = 0; game.loadingTipIdx = Math.floor(Math.random()*LOADING_TIPS.length); return; }
}

function nextDialogueLine(){
  game.dialogueIdx++;
  if(game.dialogueIdx >= game.dialogueLines.length){
    game.dialogue = null;
    advanceNode();
  }
}

function drawArtAcademyBackdrop(room){
  const palettes=[['#ff4f8b','#ffb84d','#6ee7ff','#8aff8a','#b78cff'],['#ff6ec7','#6ee7ff','#ffd166','#7df58a','#ff8a5c']];
  ctx.save();
  ctx.globalAlpha=0.18;
  for(let i=0;i<18;i++){
    const x=140+(i*233)%Math.max(500,room.w-280); const y=100+((i*137)%Math.max(400,room.h-200)); const r=70+(i%4)*30;
    ctx.fillStyle=palettes[i%2][i%5]; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    ctx.strokeStyle=palettes[(i+1)%2][(i+2)%5]; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(x,y,r+12,-1.1,1.6); ctx.stroke();
  }
  ctx.globalAlpha=0.16;
  for(let i=0;i<9;i++){
    ctx.strokeStyle=palettes[0][i%5]; ctx.lineWidth=10+(i%3)*4; ctx.beginPath(); ctx.moveTo(80+i*230,room.h-120);
    ctx.quadraticCurveTo(room.w*0.5,120+(i%2)*160,room.w-80-i*130,180+i*35); ctx.stroke();
  }
  ctx.globalAlpha=0.9; ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.font='600 28px '+FONT; ctx.textAlign='center'; ctx.fillText('美 术 院',room.w/2,120);
  ctx.font='400 13px '+FONT; ctx.fillStyle='rgba(255,220,245,0.55)'; ctx.fillText('颜色也是一种阶级语言',room.w/2,146);
  ctx.restore();
}

/* ---- 世界渲染 ---- */
function drawWorld(){
  const room = game.room;
  if(!room) return;
  const cam = game.camera;
  let sx = 0, sy = 0;
  if(cam.shake > 0.2){
    sx = (Math.random()-0.5) * cam.shake;
    sy = (Math.random()-0.5) * cam.shake;
  }
  const area = AREAS[game.area];

  ctx.save();
  ctx.translate(-cam.x + sx, -cam.y + sy);

  // 房间背景
  ctx.fillStyle = area.bg;
  ctx.fillRect(0, 0, room.w, room.h);

  // 网格
  ctx.strokeStyle = area.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  const gs = 80;
  for(let x = 0; x <= room.w; x += gs){ ctx.moveTo(x, 0); ctx.lineTo(x, room.h); }
  for(let y = 0; y <= room.h; y += gs){ ctx.moveTo(0, y); ctx.lineTo(room.w, y); }
  ctx.stroke();

  if(area.name === '美术院') drawArtAcademyBackdrop(room);

  // 边框
  ctx.strokeStyle = area.accent;
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, room.w-4, room.h-4);

  // 障碍
  for(const o of room.obstacles){
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = area.accent;
    ctx.lineWidth = 2;
    ctx.strokeRect(o.x, o.y, o.w, o.h);
  }

  // 出口
  if(room.cleared && room.exit){
    const ex = room.exit;
    const pulse = 0.6 + Math.sin(game.time*4)*0.4;
    ctx.save();
    ctx.globalAlpha = pulse;
    drawPoly(ctx, ex.x, ex.y, 30, 6, game.time, 'rgba(120,220,255,0.25)', '#7fd4ff', 3);
    ctx.restore();
    ctx.fillStyle = '#7fd4ff';
    ctx.font = '500 14px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('出口', ex.x, ex.y + 54);
  }

  // 掉落物
  for(const it of game.pickups){
    const alpha = it.life < 3 ? (Math.sin(it.life*12)*0.5+0.5) : 1;
    ctx.globalAlpha = alpha;
    if(it.type === 'mark'){
      drawPoly(ctx, it.x, it.y, it.r, 4, game.time*2, it.color, '#fff', 1);
    } else if(it.type === 'feed'){
      drawPoly(ctx, it.x, it.y, it.r, 6, game.time*3, 'rgba(255,200,100,0.4)', '#ffcc66', 2);
    } else {
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, TAU);
      ctx.fillStyle = it.color; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 效果（底层）
  for(const e of game.effects) drawEffect(e);

  // 敌人
  for(const e of game.enemies) drawEnemy(e);

  // Boss
  if(game.boss) drawBossEntity(game.boss);

  // 弹幕
  for(const b of game.bullets) drawBullet(b);

  // 粒子
  for(const p of game.particles){
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 玩家
  drawPlayerEntity();

  // 飘字
  for(const t of game.texts){
    ctx.globalAlpha = clamp(t.life / t.maxLife, 0, 1);
    ctx.fillStyle = t.color;
    ctx.font = (t.big ? '700 26px ' : '600 16px ') + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawPlayerEntity(){
  const p = game.player;
  if(!p) return;
  const blink = p.invuln > 0 && Math.floor(game.time * 20) % 2 === 0;
  if(blink && !p.dead) return;

  let sides = p.sides;
  let rr = p.r;
  if(p.morphT > 0){
    const t = 1 - p.morphT/1.2;
    sides = game.morphFrom + (game.morphTo - game.morphFrom) * t;
    sides = Math.round(sides);
    if(sides < 2) sides = 2;
    if(sides > 40) sides = 0;
    rr = p.r * (1 + Math.sin(t*Math.PI)*0.25);
  }

  const flash = p.hurtFlash > 0;
  const fill = p.dead ? 'rgba(120,140,170,0.3)' : (flash ? '#ff6688' : 'rgba(120,200,255,0.22)');
  const stroke = p.dead ? '#5a6a80' : (flash ? '#ff8899' : '#8fd4ff');

  // 光晕
  if(!p.dead){
    ctx.save();
    ctx.globalAlpha = 0.25;
    drawPoly(ctx, p.x, p.y, rr + 8 + Math.sin(game.time*3)*3, sides, 0, null, '#7fd4ff', 2);
    ctx.restore();
  }

  drawPoly(ctx, p.x, p.y, rr, sides, p.facing + Math.PI/2, fill, stroke, 2.5);

  // 朝向指示
  if(!p.dead){
    ctx.beginPath();
    ctx.moveTo(p.x + Math.cos(p.facing)*(rr+2), p.y + Math.sin(p.facing)*(rr+2));
    ctx.lineTo(p.x + Math.cos(p.facing)*(rr+12), p.y + Math.sin(p.facing)*(rr+12));
    ctx.strokeStyle = '#cfeaff';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // 攻击挥砍
  if(p.atkPhase === 'act'){
    const w = WEAPONS[game.equipped];
    const col = w ? w.color : '#8fd4ff';
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(p.x, p.y, (w ? (w.range||78) : 78) + 10, p.facing - 0.9, p.facing + 0.9);
    ctx.strokeStyle = col;
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.restore();
  }
}

function drawEnemy(e){
  if(e.dead) return;
  const flash = e.flash > 0;
  const fill = flash ? 'rgba(255,120,120,0.5)' : 'rgba(255,255,255,0.08)';
  if(e.palette){
    ctx.save();
    drawPoly(ctx,e.x,e.y,e.r+5+Math.sin(game.time*4+e.wobble)*2,e.sides,e.angle+Math.PI/2,null,'rgba(255,255,255,0.22)',2);
    const grad=ctx.createLinearGradient(e.x-e.r,e.y-e.r,e.x+e.r,e.y+e.r);
    grad.addColorStop(0,e.color); grad.addColorStop(0.48,'#ffffff'); grad.addColorStop(1,e.color);
    polyPath(ctx,e.x,e.y,e.r,e.sides,e.angle+Math.PI/2); ctx.fillStyle=flash?'rgba(255,120,120,0.5)':grad; ctx.fill();
    ctx.strokeStyle=e.color; ctx.lineWidth=2; ctx.stroke();
    ctx.globalAlpha=0.7; ctx.beginPath(); ctx.arc(e.x,e.y,e.r*0.45,0,TAU); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  } else {
    drawPoly(ctx, e.x, e.y, e.r, e.sides, e.angle + Math.PI/2, fill, e.color, 2);
  }

  // 血条
  if(e.hp < e.maxhp){
    const w = e.r*2.2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(e.x - w/2, e.y - e.r - 12, w, 4);
    ctx.fillStyle = e.elite ? '#ff9b6b' : '#ff6688';
    ctx.fillRect(e.x - w/2, e.y - e.r - 12, w * (e.hp/e.maxhp), 4);
  }
  if(e.elite){
    ctx.strokeStyle = '#ff9b6b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 9, 0, TAU);
    ctx.stroke();
  }
}

function drawIrregularTriangle(g, x, y, r, rot, fill, stroke, lw){
  // 三个顶点角度和半径都不等，保证视觉上是真正的不等边三角形。
  const angs = [rot - Math.PI*0.63, rot + Math.PI*0.08, rot + Math.PI*0.80];
  const scales = [1.16, 0.86, 1.04];
  g.beginPath();
  for(let i=0;i<3;i++){
    const a = angs[i], rr = r * scales[i];
    const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
    if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
  }
  g.closePath();
  if(fill){ g.fillStyle = fill; g.fill(); }
  if(stroke){ g.strokeStyle = stroke; g.lineWidth = lw||2; g.stroke(); }
}

function drawShiftingIrregularPoly(g, x, y, r, sides, rot, time, fill, stroke, lw){
  const wobble=[];
  for(let i=0;i<sides;i++) wobble.push(0.84 + 0.22*Math.sin(time*2.6 + i*1.77) + 0.08*Math.sin(time*5.1 - i*0.9));
  g.beginPath();
  for(let i=0;i<sides;i++){
    const a=rot-Math.PI/2+i*TAU/sides+0.08*Math.sin(time*2+i*2.1);
    const rr=r*wobble[i];
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
  }
  g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}
}

function drawGodEntity(b, alpha){
  const pulse=0.78+0.22*(0.5+0.5*Math.sin(game.time*3.2));
  const r=b.r*pulse*(0.92+0.12*Math.sin(game.time*5.4+0.7));
  const trail=(b.data&&b.data.trail)||[];
  for(let i=trail.length-1;i>=0;i--){
    const tr=trail[i];
    ctx.globalAlpha=alpha*(0.04+0.10*(i+1)/trail.length);
    ctx.beginPath(); ctx.arc(tr.x,tr.y,tr.r*(1-0.035*i),0,TAU);
    ctx.strokeStyle='#c77dff'; ctx.lineWidth=2.5; ctx.stroke();
  }
  ctx.globalAlpha=alpha;
  const grad=ctx.createRadialGradient(b.x-r*0.34,b.y-r*0.38,r*0.10,b.x,b.y,r);
  grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.18,'#ecd7ff'); grad.addColorStop(0.55,'#a95de6'); grad.addColorStop(0.82,'#5c237d'); grad.addColorStop(1,'#24102f');
  ctx.beginPath(); ctx.arc(b.x,b.y,r,0,TAU); ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='#e7c8ff'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(game.time*0.9);
  ctx.globalAlpha=alpha*0.75; ctx.beginPath(); ctx.ellipse(0,0,r*1.02,r*0.34,0,0,TAU); ctx.strokeStyle='#f1dcff'; ctx.lineWidth=2; ctx.stroke();
  ctx.globalAlpha=alpha*0.42; ctx.beginPath(); ctx.ellipse(0,0,r*0.58,r*1.03,0,0,TAU); ctx.strokeStyle='#c77dff'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=alpha*0.7; ctx.beginPath(); ctx.arc(b.x-r*0.18,b.y-r*0.12,r*0.66,-2.5,-1.1); ctx.strokeStyle='#ffffff'; ctx.lineWidth=3; ctx.stroke();
}

function drawArtistBossEntity(b, alpha){
  const r=b.r+Math.sin(game.time*3.2)*3;
  const colors=['#ff4f8b','#ffb84d','#6ee7ff','#8aff8a','#b78cff','#ffe66d'];
  ctx.save(); ctx.globalAlpha=alpha*0.28; drawPoly(ctx,b.x,b.y,r+15,b.sides,game.time*0.5,null,'#ffffff',2);
  ctx.globalAlpha=alpha; drawPoly(ctx,b.x,b.y,r,b.sides,b.angle+Math.PI/2,'rgba(255,255,255,0.10)',b.color,3);
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.arc(b.x,b.y,r*0.78,i*TAU/6,(i+1)*TAU/6); ctx.closePath(); ctx.fillStyle=colors[i]; ctx.globalAlpha=alpha*0.28; ctx.fill(); }
  ctx.globalAlpha=alpha*0.9; ctx.beginPath(); ctx.arc(b.x,b.y,r*0.42,0,TAU); ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}

function drawBossAttackTelegraph(b){
  if(!b || b.id==='prince' || b.mode!=='attack' || !b.cur) return;
  const name=b.cur.name;
  const beamNames=['thrust','tripleThrust','lineSlash','slowCross','paintStroke','polyBeam','crossSection'];
  if(!beamNames.includes(name)) return;
  const prog=clamp(b.atkT/b.cur.dur,0,1);
  if(prog>0.58) return;
  const blink=0.09+0.05*(0.5+0.5*Math.sin(game.time*28));
  ctx.save();
  ctx.globalAlpha=blink;
  ctx.fillStyle='#dff5ff';
  const drawBar=(ang,len,width)=>{
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);ctx.fillRect(12,-width/2,len,width);ctx.restore();
  };
  if(name==='polyBeam'){
    for(let i=0;i<6;i++) drawBar(Math.atan2(game.player.y-b.y,game.player.x-b.x)+i*TAU/6,900,9);
  } else if(name==='crossSection'){
    for(let i=0;i<4;i++) drawBar(i*TAU/4+b.t*0.5,1200,12);
  } else if(name==='paintStroke'){
    const base=b.data.paintBase ?? Math.atan2(game.player.y-b.y,game.player.x-b.x);
    drawBar(base-0.34,760,12); drawBar(base,760,12); drawBar(base+0.34,760,12);
  } else if(name==='slowCross'){
    const base=b.data.base ?? Math.atan2(game.player.y-b.y,game.player.x-b.x)+0.25;
    drawBar(base,760,8); drawBar(base+Math.PI,760,8);
  } else {
    const a=b.data.ang ?? Math.atan2(game.player.y-b.y,game.player.x-b.x);
    const count=name==='tripleThrust'?3:1;
    for(let i=0;i<count;i++){
      const aa=a+(i-Math.floor(count/2))*0.12;
      drawBar(aa, Math.min(900,game.room.w), 12);
    }
  }
  ctx.restore();
}

function drawBossEntity(b){
  if(!b || b.dead) return;
  const flash = b.flash > 0;
  const alpha = b.data && b.data.alpha !== undefined ? b.data.alpha : 1;
  ctx.save();
  ctx.globalAlpha = alpha;

  const fill = flash ? 'rgba(255,120,120,0.5)' : 'rgba(255,255,255,0.06)';
  const outerR = b.r + 14 + Math.sin(game.time*3)*4;

  if(b.id === 'mutant'){
    ctx.globalAlpha = alpha * 0.3; drawIrregularTriangle(ctx,b.x,b.y,outerR,b.t*0.5,null,b.color,2);
    ctx.globalAlpha = alpha; drawIrregularTriangle(ctx,b.x,b.y,b.r,b.angle+Math.PI/2,fill,b.color,3);
    ctx.globalAlpha = alpha * 0.5; drawIrregularTriangle(ctx,b.x,b.y,b.r*0.48,-b.t*0.8,null,b.color,1.5);
  } else if(b.id === 'prince'){
    const visualSides=7+Math.round((Math.sin(b.t*2.8)+1)*1.5);
    ctx.globalAlpha=alpha*0.25; drawShiftingIrregularPoly(ctx,b.x,b.y,outerR,visualSides,b.t*0.35,b.t,null,b.color,2);
    ctx.globalAlpha=alpha; drawShiftingIrregularPoly(ctx,b.x,b.y,b.r,visualSides,b.angle+Math.PI/2,b.t,fill,b.color,3);
    ctx.globalAlpha=alpha*0.55; drawShiftingIrregularPoly(ctx,b.x,b.y,b.r*0.48,visualSides,b.t*1.2,b.t,null,'#e3c8ff',1.5);
  } else if(b.id === 'god'){
    ctx.restore(); drawGodEntity(b,alpha);
    drawBossAttackTelegraph(b);
    if(b.mode === 'attack' && b.cur && b.cur.name){ const prog=b.atkT/b.cur.dur; if(prog<0.5){ ctx.save(); ctx.globalAlpha=0.25+Math.sin(game.time*20)*0.12; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+24,0,TAU*(prog/0.5)); ctx.strokeStyle='#ff6688'; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); } }
    return;
  } else if(b.id === 'artist'){
    ctx.restore(); drawArtistBossEntity(b,alpha);
    drawBossAttackTelegraph(b);
    if(b.mode === 'attack' && b.cur && b.cur.name){ const prog=b.atkT/b.cur.dur; if(prog<0.5){ ctx.save(); ctx.globalAlpha=0.28+Math.sin(game.time*18)*0.12; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+24,0,TAU*(prog/0.5)); ctx.strokeStyle='#ff6688'; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); } }
    return;
  } else {
    ctx.globalAlpha = alpha * 0.3; drawPoly(ctx,b.x,b.y,outerR,b.sides,b.t*0.5,null,b.color,2);
    ctx.globalAlpha = alpha; drawPoly(ctx,b.x,b.y,b.r,b.sides,b.angle+Math.PI/2,fill,b.color,3);
    ctx.globalAlpha = alpha * 0.5; drawPoly(ctx,b.x,b.y,b.r*0.5,b.sides,-b.t*0.8,null,b.color,1.5);
  }
  ctx.restore();
  drawBossAttackTelegraph(b);

  // 蓄力预警
  if(b.mode === 'attack' && b.cur && b.cur.name){
    const prog = b.atkT / b.cur.dur;
    if(prog < 0.5){
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(game.time*20)*0.15;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 24, 0, TAU * (prog/0.5));
      ctx.strokeStyle = '#ff6688';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawBullet(b){
  ctx.save();
  if(b.shape === 'circle' || b.sides === 0){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = b.color; ctx.globalAlpha = 0.85; ctx.fill();
    ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*1.6, 0, TAU);
    ctx.fillStyle = b.color; ctx.fill();
  } else if(b.shape === 'tri'){
    drawPoly(ctx, b.x, b.y, b.r, 3, b.angle||0, b.color, '#fff', 1);
  } else if(b.shape === 'square'){
    drawPoly(ctx, b.x, b.y, b.r, 4, b.angle||0, b.color, '#fff', 1);
  } else if(b.shape === 'hex'){
    drawPoly(ctx, b.x, b.y, b.r, 6, b.angle||0, b.color, '#fff', 1);
  } else if(b.shape === 'disc'){
    drawPoly(ctx, b.x, b.y, b.r, 8, b.angle||0, 'rgba(255,255,255,0.15)', b.color, 3);
  } else if(b.shape === 'zig'){
    drawPoly(ctx, b.x, b.y, b.r, 5, b.angle||0, b.color, '#fff', 1);
  } else {
    drawPoly(ctx, b.x, b.y, b.r, b.sides||5, b.angle||0, b.color, '#fff', 1);
  }
  ctx.restore();
}

function drawEffect(e){
  const t = 1 - e.life / e.maxLife;
  ctx.save();
  ctx.globalAlpha = clamp(e.life / e.maxLife, 0, 1) * 0.9;

  if(e.type === 'slash'){
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.range * 0.85, e.angle - 0.9, e.angle + 0.9);
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 8 * (1-t);
    ctx.stroke();
  } else if(e.type === 'triWave'){
    drawPoly(ctx, e.x, e.y, e.r * (0.6 + t*0.5), 3, e.angle, 'rgba(255,255,255,0.12)', e.color, 3);
  } else if(e.type === 'warnCircle'){
    const pulse=0.72+0.28*Math.sin(game.time*22);
    ctx.globalAlpha*=0.68*pulse;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*(0.72+0.1*Math.sin(game.time*10)),0,TAU);
    ctx.fillStyle=e.color;ctx.fill();ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.stroke();
    ctx.globalAlpha*=0.7;ctx.beginPath();ctx.arc(e.x,e.y,e.r*0.35,0,TAU);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  } else if(e.type === 'wave'){
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.strokeStyle = e.color; ctx.lineWidth = 4 * (1-t); ctx.stroke();
  } else if(e.type === 'ring'){
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.strokeStyle = e.color; ctx.lineWidth = 3 * (1-t); ctx.stroke();
  } else if(e.type === 'squareWave'){
    const s = e.r;
    ctx.strokeStyle = e.color; ctx.lineWidth = 4*(1-t);
    ctx.strokeRect(e.x - s, e.y - s, s*2, s*2);
  } else if(e.type === 'beam'){
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);
    const g = ctx.createLinearGradient(0,0,e.len,0);
    g.addColorStop(0, e.color);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.globalAlpha *= 0.7;
    ctx.fillRect(0, -(e.w||10)/2 * (1-t), e.len, (e.w||10) * (1-t));
  } else if(e.type === 'rectZone'){
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha *= 0.6;
    ctx.strokeRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h);
    ctx.fillStyle = e.color;
    ctx.globalAlpha *= 0.08;
    ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h);
  } else if(e.type === 'zigField'){
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha *= 0.6;
    let s = e.seed;
    const rr = ()=> { s = (s*9301+49297)%233280; return s/233280; };
    for(let i=0;i<6;i++){
      ctx.beginPath();
      let x = e.x + (rr()-0.5)*e.r*2, y = e.y + (rr()-0.5)*e.r*2;
      ctx.moveTo(x, y);
      for(let j=0;j<4;j++){
        x += (rr()-0.5)*e.r; y += (rr()-0.5)*e.r;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  } else if(e.type === 'proj'){
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.globalAlpha *= 0.15;
    ctx.fillStyle = e.color;
    ctx.fill();
  }
  ctx.restore();
}

/* ---- HUD ---- */
function drawHUD(){
  const p = game.player;
  if(!p) return;
  const area = AREAS[game.area];

  // 左上：形状 + 等级 + HP/EN
  drawPoly(ctx, 44, 46, 17, p.sides, 0, 'rgba(120,200,255,0.2)', '#8fd4ff', 2);
  ctx.fillStyle = '#9fc4e8';
  ctx.font = '600 14px ' + FONT;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('LV.' + p.level, 70, 42);

  drawBar(70, 50, 170, 9, p.hp/p.maxhp, '#e04b6a');
  drawBar(70, 64, 170, 9, p.en/p.maxen, '#4bc0e0');
  ctx.fillStyle = 'rgba(220,235,255,0.75)';
  ctx.font = '500 11px ' + FONT;
  ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxhp, 246, 59);
  ctx.fillText(Math.ceil(p.en) + ' / ' + p.maxen, 246, 73);

  // 经验条
  const need = XP_REQ[p.level];
  if(need){
    drawBar(70, 78, 170, 5, p.xp/need, '#8ff0ff');
  } else {
    drawBar(70, 78, 170, 5, 1, '#ffffff');
  }

  // 右上：区域
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(180,205,235,0.7)';
  ctx.font = '500 13px ' + FONT;
  ctx.fillText('区域', VW - 34, 34);
  ctx.fillStyle = '#dceafa';
  ctx.font = '600 20px ' + FONT;
  ctx.fillText(area.name, VW - 34, 60);
  ctx.fillStyle = 'rgba(160,185,215,0.5)';
  ctx.font = '500 12px ' + FONT;
  ctx.fillText('Seed: ' + game.seed + '   印记: ' + game.marks, VW - 34, 80);

  // 右下：武器 / 技能 / 闪避
  const w = WEAPONS[game.equipped];
  if(w){
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(200,220,245,0.85)';
    ctx.font = '600 15px ' + FONT;
    ctx.fillText(w.name, VW - 34, VH - 78);

    ctx.fillStyle = 'rgba(160,185,215,0.6)';
    ctx.font = '500 12px ' + FONT;
    ctx.fillText(w.skill + '  [右键]', VW - 34, VH - 58);
    ctx.fillText('闪避 [空格]', VW - 34, VH - 38);

    // 冷却圆
    const cdx = VW - 30, cdy = VH - 108;
    ctx.beginPath(); ctx.arc(cdx, cdy, 22, 0, TAU);
    ctx.strokeStyle = 'rgba(140,190,240,0.35)'; ctx.lineWidth = 3; ctx.stroke();
    const skillPct = 1 - (p.skillCd / 2.5);
    ctx.beginPath(); ctx.arc(cdx, cdy, 22, -Math.PI/2, -Math.PI/2 + TAU*clamp(skillPct,0,1));
    ctx.strokeStyle = w.color; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#cfe6ff';
    ctx.font = '600 12px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(p.en >= 6 ? '技' : 'EN', cdx, cdy + 4);

    // 闪避冷却
    const ddx = VW - 84, ddy = VH - 108;
    ctx.beginPath(); ctx.arc(ddx, ddy, 18, 0, TAU);
    ctx.strokeStyle = 'rgba(140,190,240,0.25)'; ctx.lineWidth = 2.5; ctx.stroke();
    const dpct = 1 - (p.dodgeCd / 0.65);
    ctx.beginPath(); ctx.arc(ddx, ddy, 18, -Math.PI/2, -Math.PI/2 + TAU*clamp(dpct,0,1));
    ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#cfe6ff';
    ctx.font = '600 11px ' + FONT;
    ctx.fillText('闪', ddx, ddy + 4);
  }

  // Boss 血条
  if(game.boss && !game.boss.dead && (game.state === 'BOSS' || game.state === 'BOSS_INTRO')){
    const b = game.boss;
    const bw = 620, bx = (VW - bw)/2, by = 84;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx-4, by-4, bw+8, 22);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = b.color;
    ctx.fillRect(bx, by, bw * clamp(b.hp/b.maxhp,0,1), 14);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx+0.5, by+0.5, bw-1, 13);
    // 阶段分隔
    ctx.beginPath();

function wrapText(text, cx, cy, maxW, lineH){
  text = tr(text);
  const chars = text.split('');
  let line = '';
  let y = cy;
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxW && line.length > 0){
      ctx.fillText(line, cx, y);
      line = chars[i];
      y += lineH;
    } else {
      line = test;
    }
  }
  if(line) ctx.fillText(line, cx, y);
}

function drawLoading(){
  ctx.fillStyle = '#04050a';

  const idx = Math.floor(t) % shapes.length;

  let a = shapes[idx], b = shapes[nextIdx];

    ctx.fillStyle = w.color;

function wrapTextCentered(text, cx, cy, maxW, lineH){
  text = tr(text);
  const chars = text.split('');
  let line = '';
  let y = cy;
  for(let i=0;i<chars.length;i++){

      ctx.fillText(line, cx, y);
      line = chars[i];
      y += lineH;
    } else line = test;
  }
  if(line) ctx.fillText(line, cx, y);
}

function drawMapScreen(){
  ctx.fillStyle = '#04070e';
  ctx.fillRect(0,0,VW,VH);

  const area = AREAS[game.area];
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8f2ff';
  ctx.font = '700 32px ' + FONT;
  ctx.fillText(area.name, VW/2, 80);
  ctx.fillStyle = 'rgba(160,195,230,0.6)';
  ctx.font = '400 15px ' + FONT;
  ctx.fillText('区域 ' + (game.area+1) + ' / ' + AREAS.length + '  ·  ' + area.theme, VW/2, 110);

  // 节点
  const nodes = game.nodes;
  const n = nodes.length;
  const padX = 140, padY = 200;
  const availW = VW - padX*2;
  const availH = 320;
  const cols = Math.min(4, n);
  const rows = Math.ceil(n/cols);

  const pos = [];
  for(let i=0;i<n;i++){
    const r = Math.floor(i/cols), c = i%cols;
    const px = padX + (cols>1 ? (availW/(cols-1))*c : availW/2);
    const py = padY + (rows>1 ? (availH/(rows-1))*r : availH/2);
    pos.push({x:px, y:py});
  }

  // 连线
  ctx.strokeStyle = 'rgba(90,130,180,0.4)';
  ctx.lineWidth = 2;
  for(let i=0;i<n-1;i++){
    ctx.beginPath();
    ctx.moveTo(pos[i].x, pos[i].y);
    ctx.lineTo(pos[i+1].x, pos[i+1].y);
    ctx.stroke();
  }

  const typeName = {start:'起点', combat:'战斗', elite:'精英', reward:'奖励', shop:'商店',
                    event:'事件', upgrade:'圣所', miniboss:'小Boss', boss:'BOSS'};

  for(let i=0;i<n;i++){
    const p = pos[i];
    const done = i < game.nodeIndex;
    const cur = i === game.nodeIndex;
    const isBoss = nodes[i] === 'boss' || nodes[i] === 'miniboss';

    ctx.beginPath();
    if(isBoss){
      const r = cur ? 30 : 26;
      drawPoly(ctx, p.x, p.y, r, 6, game.time*0.6, done ? 'rgba(80,110,140,0.3)' : (cur ? 'rgba(255,120,150,0.3)' : 'rgba(20,30,45,0.6)'),
        done ? '#4a5f78' : (cur ? '#ff6688' : '#7fd4ff'), 2.5);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, cur ? 24 : 20, 0, TAU);
      ctx.fillStyle = done ? 'rgba(80,110,140,0.25)' : (cur ? 'rgba(120,200,255,0.3)' : 'rgba(20,30,45,0.6)');
      ctx.fill();
      ctx.strokeStyle = done ? '#4a5f78' : (cur ? '#8fd4ff' : '#4a6b90');
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    ctx.fillStyle = done ? '#5a7089' : (cur ? '#e8f2ff' : '#8fa8c0');
    ctx.font = (cur ? '700 14px ' : '500 13px ') + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(typeName[nodes[i]] || nodes[i], p.x, p.y + 44);

    if(cur){
      ctx.fillStyle = '#ffd479';
      ctx.font = '600 12px ' + FONT;
      ctx.fillText('▲ 当前位置', p.x, p.y - 38);
    }
  }

  UI.add(VW/2 - 130, VH - 110, 260, 54, '进入房间', ()=>{
    if(game.nodeIndex < game.nodes.length) loadRoom();
  }, {font:22, disabled:game.nodeIndex >= game.nodes.length});
  UI.add(40, 30, 120, 44, '玩家界面', ()=>{ setState('EQUIPMENT'); }, {font:16});
}

function drawShop(){
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0,0,VW,VH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8f2ff';
  ctx.font = '700 38px ' + FONT;
  ctx.fillText('几何商店', VW/2, 78);
  ctx.fillStyle = 'rgba(160,195,230,0.65)';
  ctx.font = '400 15px ' + FONT;
  ctx.fillText('几何印记：' + game.marks, VW/2, 108);

  const items = game.shopItems || [];
  const cw = 250, ch = 330, gap = 24;
  const total = items.length * cw + (items.length - 1) * gap;
  const start = (VW - total) / 2;

  items.forEach((it, i)=>{
    const x = start + i * (cw + gap);
    const y = 170;
    const bought = !!game.shopBought[it.id];
    const affordable = game.marks >= it.cost;
    const color = it.color || '#8fd4ff';

    ctx.fillStyle = bought ? 'rgba(20,26,34,0.65)' : 'rgba(14,22,36,0.96)';
    ctx.fillRect(x,y,cw,ch);
    ctx.strokeStyle = bought ? 'rgba(90,105,120,0.5)' : color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x+0.5,y+0.5,cw-1,ch-1);

    drawPoly(ctx, x+cw/2, y+68, 40, 4 + (i%5), game.time*0.4+i,
      'rgba(255,255,255,0.04)', bought ? 'rgba(120,135,150,0.5)' : color, 2.5);

    ctx.fillStyle = bought ? 'rgba(170,185,200,0.55)' : '#e8f2ff';
    ctx.font = '700 22px ' + FONT;
    ctx.fillText(it.name, x+cw/2, y+138);

    ctx.fillStyle = 'rgba(180,205,230,0.72)';
    ctx.font = '400 14px ' + FONT;
    wrapTextCentered(it.desc, x+cw/2, y+175, cw-36, 22);

    ctx.fillStyle = bought ? 'rgba(140,155,170,0.55)' : '#ffd479';
    ctx.font = '600 17px ' + FONT;
    ctx.fillText(bought ? '已购买' : ('价格：' + it.cost + ' 印记'), x+cw/2, y+250);

    if(!bought){
      UI.add(x+18, y+268, cw-36, 42, affordable ? '购买' : '印记不足', ()=>{
        if(game.marks < it.cost) return;
        game.marks -= it.cost;
        game.shopBought[it.id] = true;
        if(it.id === 'heal'){
          game.player.hp = Math.min(game.player.maxhp, game.player.hp + 15);
        }else if(it.id === 'energy'){
          game.player.en = game.player.maxen;
        }else if(it.id === 'strengthen'){
          game.player.permanentAtkBonus=(game.player.permanentAtkBonus||0)+1;
          recalcPlayer(game.player,false);
        }else if(it.id === 'weapon' && it.weapon){
          if(!game.library.includes(it.weapon)) game.library.push(it.weapon);
          if(!game.unlocked.includes(it.weapon)) game.unlocked.push(it.weapon);
          game.equipped = it.weapon;
        }
        AudioSys.buy();
        saveGame();
        toast('购买成功：' + it.name);
      }, {font:17, disabled:!affordable});
    }
  });

  UI.add(VW/2-110, VH-72, 220, 48, '离开商店', ()=>{
    advanceNode();
  }, {font:19});

  UI.add(36, VH-72, 140, 48, '玩家界面', ()=>{
    setState('EQUIPMENT');
  }, {font:16});
}

function getWeaponScrollMax(){
  return Math.max(0, Math.ceil(Object.keys(WEAPONS).length / 2) * 96 - 480);

function updateWeaponScroll(dt){
  game.weaponScrollTarget=clamp(game.weaponScrollTarget,0,getWeaponScrollMax());
  game.weaponScroll += (game.weaponScrollTarget-game.weaponScroll)*(1-Math.pow(0.001,dt));
}

function drawVictory(){
  const t = game.victoryT;
  const a = clamp(t/2.5, 0, 1);
  ctx.fillStyle = 'rgb(' + Math.round(4 + a*240) + ',' + Math.round(5 + a*245) + ',' + Math.round(10 + a*245) + ')';
  ctx.fillRect(0,0,VW,VH);

  const dark = 1 - a;
  if(dark > 0.05){
    ctx.globalAlpha = dark;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8f2ff';
    ctx.font = '700 48px ' + FONT;
    ctx.fillText('你终于成为了圆。', VW/2, VH/2);
    ctx.globalAlpha = 1;
  }

  if(t > 2.0){
    ctx.globalAlpha = clamp((t-2.0)/1.5, 0, 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1a2438';
    ctx.font = '700 52px ' + FONT;
    ctx.fillText('你终于成为了圆。', VW/2, VH/2 - 30);
    ctx.fillStyle = 'rgba(40,60,90,0.85)';
    ctx.font = '400 22px ' + FONT;
    ctx.fillText('但圆真的是终点吗？', VW/2, VH/2 + 40);
    ctx.globalAlpha = 1;
  }
}

function drawEnding(){
  const t = game.endT;
  ctx.fillStyle = '#f0f4fa';
  ctx.fillRect(0,0,VW,VH);

  ctx.textAlign = 'center';

  if(game.endingStage === 0){
    const a = clamp(t/1.2, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#1a2438';
    ctx.font = '700 48px ' + FONT;
    ctx.fillText('你终于成为了圆。', VW/2, VH/2 - 40);
    ctx.fillStyle = 'rgba(40,60,90,0.85)';
    ctx.font = '400 22px ' + FONT;
    ctx.fillText('但圆真的是终点吗？', VW/2, VH/2 + 30);
    ctx.globalAlpha = 1;

    if(t > 3.0){
      // 屏幕外的球体投影
      const p = clamp((t-3.0)/2.5, 0, 1);
      ctx.save();
      ctx.globalAlpha = p;
      const r = 40 + p*180;
      const g = ctx.createRadialGradient(VW/2 - r*0.3, VH/2 + 40 - r*0.3, r*0.1, VW/2, VH/2 + 40, r);
      g.addColorStop(0, 'rgba(120,160,220,0.9)');
      g.addColorStop(0.6, 'rgba(80,110,170,0.5)');
      g.addColorStop(1, 'rgba(60,90,150,0)');
      ctx.beginPath();
      ctx.arc(VW/2, VH/2 + 40, r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }
  } else {
    const a = clamp(t/1.5, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#1a2438';
    ctx.font = '500 26px ' + FONT;
    ctx.fillText('“你终于看见了边界之外。”', VW/2, VH/2 - 60);

    ctx.font = '700 64px ' + FONT;
    ctx.fillText('E N D', VW/2, VH/2 + 50);
    ctx.globalAlpha = 1;

    if(t > 1.5){
      UI.add(VW/2 - 140, VH - 140, 280, 56, '返回主菜单', ()=>{
        deleteSave(); Music.stop(); Music.play('menu'); setState('MENU');
      }, {font:20});
    }
  }
}

/* ============================================================
   24. 交互动作
   ============================================================ */
const GameActions = {
  togglePause(){
    if(game.state === 'PLAYING' || game.state === 'BOSS'){ setState('PAUSE'); }
    else if(game.state === 'PAUSE'){ setState('PLAYING'); }
  },
  toggleEquipment(){
    if(game.state === 'PLAYING' || game.state === 'BOSS'){ saveGame(); game.equipmentReturnState = game.state; setState('EQUIPMENT'); }
    else if(game.state === 'SHOP'){ game.equipmentReturnState = 'SHOP'; setState('EQUIPMENT'); }
    else if(game.state === 'DIALOGUE'){ game.equipmentReturnState = 'DIALOGUE'; setState('EQUIPMENT'); }
    else if(game.state === 'EQUIPMENT'){ setState(game.equipmentReturnState || 'PLAYING'); }
    else if(game.state === 'PAUSE'){ game.equipmentReturnState='PAUSE'; setState('EQUIPMENT'); }
    else if(game.state === 'SHOP' || game.state === 'DIALOGUE'){ return; }
    else if(game.state === 'MENU'){ /* 无 */ }
  },
  menuConfirm(){
    const items = ['new','continue','settings','about'];
    const k = items[game.menuSel];
    if(k === 'new'){ startNewRun(); setState('INTRO'); game.introT = 0; }
    else if(k === 'continue' && game.hasSave){ if(loadGame()){ setState('LOADING'); game.loadingT = 0; game.loadingTipIdx = Math.floor(Math.random()*LOADING_TIPS.length); } }
    else if(k === 'settings'){ setState('SETTINGS'); }
    else if(k === 'about'){ setState('ABOUT'); }
  },
  nextDialogue(){ nextDialogueLine(); }
};

/* ============================================================
   25. 启动
   ============================================================ */
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const s = Math.min(w/VW, h/VH);
  canvas.style.width = (VW*s) + 'px';
  canvas.style.height = (VH*s) + 'px';
  game.scale = s;
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 200));

let lastT = performance.now()/1000;
function loop(ts){
  requestAnimationFrame(loop);
  const now = ts/1000;
  let dt = now - lastT;
  lastT = now;
  if(!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 1/30);

  try{
    update(dt);
    render();
  }catch(err){
    // 保证不崩溃
    console.error(err);
  }
}

// 初始化
Input.init();
resize();
game.seed = Math.floor(Math.random()*900000) + 100000;
game.rng = new RNG(game.seed);
loadSettingsPreference();
loadSaveExists();
requestAnimationFrame(loop);

})();
